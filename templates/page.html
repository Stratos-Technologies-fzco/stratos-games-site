</svg><span class="sn-w1">tratos</span></span><span class="sn-w2">GAMES</span></span></a><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap"><style>.sn-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.sn-mark{overflow:visible;flex:none;transform-origin:50% 60%}
.sn-mark *{transform-box:fill-box}
.sn-word{display:flex;flex-direction:column;align-items:center;line-height:.86;font-family:Fredoka,sans-serif;font-weight:700}
.sn-row{display:flex;align-items:flex-end;font-size:34px}
.sn-row .sn-mark{width:.95em;height:.95em;margin:0 .02em .14em 0}
.sn-w1{font-size:1em;line-height:1;color:#fff;letter-spacing:-.5px}
.sn-w2{font-size:14px;color:#B6FF3B;letter-spacing:.3em;padding-left:.3em;margin-top:1px}
.sn-box{flex-direction:column;gap:1px}
.sn-box .sn-word{align-items:center}
.sn-box .sn-row{font-size:21px}
.sn-box .sn-w1{color:#14151F}
.sn-box .sn-w2{color:#8B5CF6;font-size:8.5px}
.sn-eye{transform-origin:center}
.sn-blink .sn-eye{animation:snBlink .18s ease-in-out}
@keyframes snBlink{50%{transform:scaleY(.1)}}
.sn-tongue{transform-origin:top center;transform:scaleY(0)}
.sn-on .sn-tongue{animation:snTongue .5s ease-out}
@keyframes snTongue{30%,70%{transform:scaleY(1)}}
.sn-on .sn-mark{animation:snWiggle .7s ease-in-out}
@keyframes snWiggle{15%{transform:rotate(-9deg) scale(1.08,.94)}35%{transform:rotate(8deg) scale(.96,1.06)}55%{transform:rotate(-5deg)}75%{transform:rotate(3deg)}}
.cg-logo.sn-logo .sn-word{display:flex!important}
@media (max-width:1200px){.cg-logo.sn-logo .sn-row{font-size:28px}.cg-logo.sn-logo .sn-w2{font-size:11.5px}}
@media (max-width:600px){.cg-logo.sn-logo .sn-row{font-size:23px}.cg-logo.sn-logo .sn-w2{font-size:9.5px}}
@media (prefers-reduced-motion:reduce){.sn-on .sn-mark,.sn-on .sn-tongue,.sn-blink .sn-eye{animation:none}}</style><script>(function(){
  // silent on purpose (#80): no sound on hover; the snake still wiggles, blinks and its eyes follow the pointer
  function play(el,c,ms){el.classList.remove(c);void el.offsetWidth;el.classList.add(c);setTimeout(function(){el.classList.remove(c);},ms);}
  document.querySelectorAll('.sn-logo').forEach(function(el){
    var last=0;
    el.addEventListener('pointerenter',function(){var n=Date.now();if(n-last<600)return;last=n;play(el,'sn-on',750);play(el,'sn-blink',200);});
    (function loop(){setTimeout(function(){play(el,'sn-blink',200);loop();},2500+Math.random()*3000);})();
  });
  var pupils=document.querySelectorAll('.sn-pupil');
  window.addEventListener('pointermove',function(e){
    pupils.forEach(function(p){
      var r=p.ownerSVGElement.getBoundingClientRect();if(!r.width)return;var k=r.width/200,bx=+p.dataset.x,by=+p.dataset.y;
      var dx=e.clientX-(r.left+bx*k),dy=e.clientY-(r.top+by*k),len=Math.hypot(dx,dy)||1,m=Math.min(5,len/20);
      p.setAttribute('cx',(bx-1+dx/len*m).toFixed(1));p.setAttribute('cy',(by-1+dy/len*m).toFixed(1));
    });
  });
})();</script></header>
