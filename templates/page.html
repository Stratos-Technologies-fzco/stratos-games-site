<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | Stratos Games</title>
<meta name="description" content="{{DESCRIPTION}}">
<link rel="canonical" href="{{SITE_URL}}/{{SLUG}}/">
<style>
:root{--bg:#0b0d12;--panel:#141824;--line:#232a3b;--text:#e9edf5;--muted:#9aa4b8;--accent:#7c5cff;--accent2:#22d3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
a{color:var(--accent2)}
header{position:sticky;top:0;z-index:5;background:rgba(11,13,18,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.bar{display:flex;align-items:center;justify-content:space-between;height:60px;gap:16px}
.logo{font-weight:800;letter-spacing:.12em;font-size:15px;color:var(--text);text-decoration:none}.logo span{color:var(--accent2)}
nav a{margin-left:18px;font-size:14px;color:var(--muted);text-decoration:none}nav a:hover{color:var(--text)}
article{padding:40px 0 60px}
article h1{font-size:clamp(26px,4.5vw,40px);line-height:1.15;letter-spacing:-.02em;margin:0 0 18px}
article h2{font-size:22px;margin:34px 0 10px}article h3{font-size:18px;margin:26px 0 8px}
article p,article li{color:#d5dbe8;font-size:16px}
article table{border-collapse:collapse;width:100%;margin:14px 0;font-size:15px}
article td,article th{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
article img{max-width:100%;height:auto;border-radius:10px}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13px}
footer a{color:var(--muted);text-decoration:none;margin-right:18px}
</style>
</head>
<body>
<header><div class="wrap bar"><a class="logo" href="../">STRATOS <span>GAMES</span></a><nav><a href="../#play">Play</a><a href="../about/">About</a><a href="../for-publishers/">For publishers</a><a href="../press/">Press</a></nav></div></header>
<main class="wrap"><article>
{{CONTENT}}
</article></main>
<footer><div class="wrap"><a href="../terms-of-use/">Terms of use</a><a href="../privacy-policy/">Privacy Policy</a><a href="mailto:admin@stratos.games">Contact us</a><div style="margin-top:10px">© {{YEAR}} Stratos Games · admin@stratos.games</div></div></footer>
</body>
</html>
