name: build the front page
on:
  push:
    branches: [main]
    paths: ["games/**", "tools/**", "templates/**", "site.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/build.py
      - name: commit the generated page
        run: |
          git config user.name "stratos-games-bot"
          git config user.email "bot@stratos.games"
          git add index.html games.json
          git diff --cached --quiet || git commit -m "build: front page [skip ci]"
          git push
