<style>
:root{--bg:#0A1411;--panel:#12201B;--line:#22372E;--gold:#E9C46A;--ink:#EEF2EE;--mute:#A9BBB2;--a:#5AA9E6;--b:#F29E4C;--hf:"Space Grotesk","Trebuchet MS","Segoe UI",system-ui,sans-serif;--bf:Inter,"Segoe UI",system-ui,Roboto,sans-serif;

button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.abs{position:absolute}.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}

.card .br{position:absolute;bottom:8px;right:10px;transform:rotate(180deg);text-align:center;line-height:1;display:flex;flex-direction:column;gap:2px}
.card .br i{font-style:normal;font:700 22px var(--hf)}.card .br u{text-decoration:none;font-size:19px}
[data-face=large] .card .tl i,[data-face=large] .card .br i{font-size:30px}[data-face=large] .card .mid{font-size:40px;opacity:.9}
.card.sm{width:58px;height:84px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.35)}.card.sm .tl{top:4px;left:6px;gap:0}.card.sm .tl i{font-size:15px}.card.sm .tl u{font-size:12px}.card.sm .mid{font-size:28px}.card.sm .br{display:none}

.hand.sel{border:3px solid var(--gold);transform:translateY(-28px)}
.hand.dis{opacity:.42;cursor:not-allowed}
.hand.hint{box-shadow:0 0 0 4px var(--gold),0 10px 24px rgba(0,0,0,.45)}
.hand:not(.dis):not(.sel):hover{transform:translateY(-10px)}
.tcard{position:absolute;width:92px;height:132px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tcard .tl{top:7px;left:9px}.tcard .tl i{font-size:20px}.tcard .tl u{font-size:17px}.tcard .mid{font-size:46px}.tcard .br{bottom:7px;right:9px}.tcard .br i{font-size:20px}.tcard .br u{font-size:17px}
.tcard.win{box-shadow:0 0 0 4px var(--gold),0 8px 20px rgba(0,0,0,.4)}
.bk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;box-sizing:border-box;border-radius:6px;flex:none}
.bk.h{margin-left:-26px}.bk.h:first-child{margin-left:0}
.bk.v{flex-direction:row;gap:3px;margin-top:-26px}.bk.v:first-child{margin-top:0}

.felt::after{content:"29";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 220px var(--hf);color:rgba(255,255,255,.04);pointer-events:none}

.pill .nm{font:600 15px var(--bf)}.pill .sub{font-size:12px}
.chip{padding:8px 14px;border-radius:12px;background:#24342E;color:#CFDAD4;font:600 15px var(--bf);white-space:nowrap}

.info{border-radius:12px;background:rgba(8,18,14,.82);border:1px solid var(--line);padding:10px 14px;font-size:13px}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.status{padding:8px 14px;border-radius:999px;background:rgba(8,18,14,.78);font-size:13px;font-weight:600;white-space:nowrap}
.seg{display:flex;gap:6px;padding:4px;border-radius:12px;background:rgba(0,0,0,.28)}

.bidbtn{height:52px;border-radius:12px;border:1px solid #2E4A3E;background:#13231E;font:700 19px var(--hf)}
.bidbtn:disabled{background:#0E1714;color:#4F625A;border-color:#18241F;cursor:not-allowed}
.bidbtn[aria-pressed=true]{background:var(--gold);color:#1B1608;border:2px solid var(--gold)}

.m .coach{max-width:350px;font-size:12.5px;padding:10px 12px}
.coach button{border:0;background:transparent;color:var(--gold);font:700 13px var(--bf);padding:0;white-space:nowrap}

.tab{padding:10px 16px;border-radius:10px;border:0;background:transparent;color:#CFDAD4;font:600 15px var(--bf)}

.tile{border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:14px 16px}

.stat span{font-size:12px;color:var(--mute)}.stat b{font:700 24px var(--hf)}
.sw3{width:64px;height:44px;border-radius:10px;border:1px solid #2E4A3E;padding:0}
.sel3[aria-pressed=true]{outline:3px solid var(--gold);outline-offset:2px}
.fan{position:absolute;width:120px;height:172px;border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.4)}
.fan .tl{top:9px;left:11px}.fan .tl i{font-size:24px}.fan .tl u{font-size:20px}.fan .mid{font-size:64px}.fan .br{bottom:9px;right:11px}.fan .br i{font-size:24px}.fan .br u{font-size:20px}
.cf{position:absolute;top:-20px;width:10px;height:16px;opacity:0;animation:fall 2.8s linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(960px) rotate(540deg);opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fly{from{translate:var(--dx) var(--dy);opacity:0}to{translate:0 0;opacity:1}}
@keyframes dealin{from{translate:0 -260px;opacity:0;scale:.6}to{translate:0 0;opacity:1;scale:1}}
@keyframes ann{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{transform:translate(-50%,-50%) scale(1.05);opacity:1}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.fresh{animation:fly .35s ease-out}.dealt{animation:dealin .45s ease-out backwards}
.sweep{transition:translate .45s ease-in,opacity .45s;translate:var(--dx) var(--dy);opacity:0}
.ann{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:20;padding:16px 32px;border-radius:18px;background:rgba(8,18,14,.92);border:2px solid var(--gold);font:700 34px var(--hf);animation:ann 1.6s ease-out forwards;pointer-events:none;text-align:center}
.m .ann{font-size:24px;padding:12px 20px}
#stage[data-anim=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#stage *{animation:none!important;transition:none!important}}
/* mobile overrides */
.m .brand{font-size:16px}
.m .hand{width:66px;height:98px;border-radius:9px;margin-left:-26px;box-shadow:-4px 6px 14px rgba(0,0,0,.4)}
.m .hand:first-child{margin-left:0}
.m .hand .tl{top:5px;left:7px;gap:1px}.m .hand .tl i{font-size:17px}.m .hand .tl u{font-size:14px}
.m .hand .mid{inset:auto;right:6px;bottom:6px;font-size:26px}.m .hand .br{display:none}
.m .hand.sel{transform:translateY(-22px)}
.m .tcard{width:70px;height:100px;border-radius:8px}.m .tcard .tl{top:5px;left:7px}.m .tcard .tl i{font-size:16px}.m .tcard .tl u{font-size:13px}.m .tcard .mid{font-size:34px}.m .tcard .br{display:none}
.m .felt{box-shadow:inset 0 0 0 8px var(--rim),inset 0 0 0 10px var(--rail)}.m .felt::after{font-size:120px}
.m .av{width:40px;height:40px}
.m .btn{height:52px}
</style>
