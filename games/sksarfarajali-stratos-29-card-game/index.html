<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0A1411">
<title>STRATOS 29</title>
<style>
:root{--bg:#0A1411;--panel:#12201B;--line:#22372E;--gold:#E9C46A;--ink:#EEF2EE;--mute:#A9BBB2;--a:#5AA9E6;--b:#F29E4C;--hf:"Space Grotesk","Trebuchet MS","Segoe UI",system-ui,sans-serif;--bf:Inter,"Segoe UI",system-ui,Roboto,sans-serif;
 --felt:radial-gradient(ellipse at 50% 45%,#1D6E4C 0%,#134F35 55%,#0D3A27 100%);--rim:#0F2C20;--rail:#8C6B2E;
 --back:repeating-linear-gradient(45deg,#0E3B28 0 6px,#134A33 6px 12px);--backedge:#C9A24E;
 --red:#C0392B;--blk:#16161A;--dia:#C0392B;--clb:#16161A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--bf);user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
#stage.d{width:1440px;height:900px}#stage.m{width:390px;height:844px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.abs{position:absolute}.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.hf{font-family:var(--hf)}.gold{color:var(--gold)}.mute{color:var(--mute)}
.brand{font:700 20px var(--hf);letter-spacing:.06em}.brand b{color:var(--gold)}
.ibtn{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:0}
.ibtn svg{width:20px;height:20px}
.btn{height:48px;padding:0 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font:600 15px var(--bf)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--gold);color:#1B1608;border:0;font:700 16px var(--hf)}
.btn.pri:disabled{background:#2A3A33;color:#7F938A;opacity:1}
.btn.ghost{background:transparent;border-color:#4A5F56}
/* cards */
.card{position:relative;background:#FBF8F1;color:var(--blk);border:1px solid #E4DCC8;border-radius:12px;font-family:var(--hf);padding:0;flex:none}
.card.r{color:var(--red)}.card.dd{color:var(--dia)}.card.cc{color:var(--clb)}
.card .tl{position:absolute;top:8px;left:10px;text-align:center;line-height:1;display:flex;flex-direction:column;gap:2px}
.card .tl i{font-style:normal;font:700 22px var(--hf)}.card .tl u{text-decoration:none;font-size:19px;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif}
.card .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-family:"Segoe UI Symbol","Apple Symbols",sans-serif}
.card .br{position:absolute;bottom:8px;right:10px;transform:rotate(180deg);text-align:center;line-height:1;display:flex;flex-direction:column;gap:2px}
.card .br i{font-style:normal;font:700 22px var(--hf)}.card .br u{text-decoration:none;font-size:19px}
[data-face=large] .card .tl i,[data-face=large] .card .br i{font-size:30px}[data-face=large] .card .mid{font-size:40px;opacity:.9}
.card.sm{width:58px;height:84px;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.35)}.card.sm .tl{top:4px;left:6px;gap:0}.card.sm .tl i{font-size:15px}.card.sm .tl u{font-size:12px}.card.sm .mid{font-size:28px}.card.sm .br{display:none}
.hand{width:104px;height:150px;box-shadow:0 10px 24px rgba(0,0,0,.45);transition:transform .18s ease,opacity .2s}
.hand.sel{border:3px solid var(--gold);transform:translateY(-28px)}
.hand.dis{opacity:.42;cursor:not-allowed}
.hand.hint{box-shadow:0 0 0 4px var(--gold),0 10px 24px rgba(0,0,0,.45)}
.hand:not(.dis):not(.sel):hover{transform:translateY(-10px)}
.tcard{position:absolute;width:92px;height:132px;border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tcard .tl{top:7px;left:9px}.tcard .tl i{font-size:20px}.tcard .tl u{font-size:17px}.tcard .mid{font-size:46px}.tcard .br{bottom:7px;right:9px}.tcard .br i{font-size:20px}.tcard .br u{font-size:17px}
.tcard.win{box-shadow:0 0 0 4px var(--gold),0 8px 20px rgba(0,0,0,.4)}
.bk{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden;box-sizing:border-box;border-radius:6px;flex:none}
.bk.h{margin-left:-26px}.bk.h:first-child{margin-left:0}
.bk.v{flex-direction:row;gap:3px;margin-top:-26px}.bk.v:first-child{margin-top:0}
.felt{position:absolute;background:var(--felt);box-shadow:inset 0 0 0 14px var(--rim),inset 0 0 0 16px var(--rail),0 30px 80px rgba(0,0,0,.55)}
.felt::after{content:"29";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 220px var(--hf);color:rgba(255,255,255,.04);pointer-events:none}
.pill{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;background:rgba(8,18,14,.85);border:1px solid #3A3022;white-space:nowrap;transition:box-shadow .2s}
.pill.A{border-color:#1F3A4E}.pill.turn{box-shadow:0 0 0 3px rgba(233,196,106,.55)}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 15px var(--hf);flex:none;background:#8A4E1C;border:2px solid var(--b)}
.av.A{background:#23597E;border-color:var(--a)}.av.me{background:#2C6E8F;border-color:var(--gold)}
.pill .nm{font:600 15px var(--bf)}.pill .sub{font-size:12px}
.chip{padding:8px 14px;border-radius:12px;background:#24342E;color:#CFDAD4;font:600 15px var(--bf);white-space:nowrap}
.chip.bid{background:var(--b);color:#1E1205;font:700 16px var(--hf)}.chip.bidA{background:var(--a);color:#06121c;font:700 16px var(--hf)}
.panel{background:rgba(10,22,18,.97);border:1px solid var(--rail);border-radius:22px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.info{border-radius:12px;background:rgba(8,18,14,.82);border:1px solid var(--line);padding:10px 14px;font-size:13px}
.lbl{font-size:11px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.status{padding:8px 14px;border-radius:999px;background:rgba(8,18,14,.78);font-size:13px;font-weight:600;white-space:nowrap}
.seg{display:flex;gap:6px;padding:4px;border-radius:12px;background:rgba(0,0,0,.28)}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;border:0;background:transparent;color:#D3E3DA;font:600 14px var(--bf)}
.seg button[aria-pressed=true]{background:var(--gold);color:#1B1608}
.sw{width:56px;height:32px;border-radius:16px;border:0;background:#3A4A44;position:relative;flex:none}
.sw[aria-checked=true]{background:var(--gold)}.sw i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.sw[aria-checked=true] i{left:28px}
.bidbtn{height:52px;border-radius:12px;border:1px solid #2E4A3E;background:#13231E;font:700 19px var(--hf)}
.bidbtn:disabled{background:#0E1714;color:#4F625A;border-color:#18241F;cursor:not-allowed}
.bidbtn[aria-pressed=true]{background:var(--gold);color:#1B1608;border:2px solid var(--gold)}
#stage button,#stage a,#stage input,#stage label,#stage select{pointer-events:auto}
.toast{position:absolute;left:50%;transform:translateX(-50%);padding:10px 18px;border-radius:999px;background:rgba(8,18,14,.94);border:1px solid var(--rail);font:600 14px var(--bf);z-index:30;white-space:nowrap;animation:pop .25s}
.coach{position:absolute;left:50%;transform:translateX(-50%);max-width:620px;padding:12px 16px;border-radius:14px;background:#1B3A2E;border:1px solid var(--gold);z-index:25;font-size:14px;line-height:1.4;display:flex;gap:12px;align-items:flex-start}
.m .coach{max-width:350px;font-size:12.5px;padding:10px 12px}
.coach button{border:0;background:transparent;color:var(--gold);font:700 13px var(--bf);padding:0;white-space:nowrap}
.modal{position:absolute;inset:0;background:rgba(5,10,8,.72);z-index:40;display:flex;align-items:center;justify-content:center}
.modal .panel{max-width:96%;}
.tab{padding:10px 16px;border-radius:10px;border:0;background:transparent;color:#CFDAD4;font:600 15px var(--bf)}
.tab[aria-selected=true]{background:#1B3A2E;color:var(--gold)}
.tile{border-radius:16px;background:var(--panel);border:1px solid var(--line);padding:14px 16px}
.stat{background:#0D1915;border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stat span{font-size:12px;color:var(--mute)}.stat b{font:700 24px var(--hf)}
.sw3{width:64px;height:44px;border-radius:10px;border:1px solid #2E4A3E;padding:0}
.sel3[aria-pressed=true]{outline:3px solid var(--gold);outline-offset:2px}
.fan{position:absolute;width:120px;height:172px;border-radius:12px;box-shadow:0 14px 30px rgba(0,0,0,.4)}
.fan .tl{top:9px;left:11px}.fan .tl i{font-size:24px}.fan .tl u{font-size:20px}.fan .mid{font-size:64px}.fan .br{bottom:9px;right:11px}.fan .br i{font-size:24px}.fan .br u{font-size:20px}
.cf{position:absolute;top:-20px;width:10px;height:16px;opacity:0;animation:fall 2.8s linear infinite}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(960px) rotate(540deg);opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fly{from{translate:var(--dx) var(--dy);opacity:0}to{translate:0 0;opacity:1}}
@keyframes dealin{from{translate:0 -260px;opacity:0;scale:.6}to{translate:0 0;opacity:1;scale:1}}
@keyframes ann{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}20%{transform:translate(-50%,-50%) scale(1.05);opacity:1}85%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.fresh{animation:fly .35s ease-out}.dealt{animation:dealin .45s ease-out backwards}
.sweep{transition:translate .45s ease-in,opacity .45s;translate:var(--dx) var(--dy);opacity:0}
.ann{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:20;padding:16px 32px;border-radius:18px;background:rgba(8,18,14,.92);border:2px solid var(--gold);font:700 34px var(--hf);animation:ann 1.6s ease-out forwards;pointer-events:none;text-align:center}
.m .ann{font-size:24px;padding:12px 20px}
#stage[data-anim=off] *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){#stage *{animation:none!important;transition:none!important}}
/* mobile overrides */
.m .brand{font-size:16px}
.m .hand{width:66px;height:98px;border-radius:9px;margin-left:-26px;box-shadow:-4px 6px 14px rgba(0,0,0,.4)}
.m .hand:first-child{margin-left:0}
.m .hand .tl{top:5px;left:7px;gap:1px}.m .hand .tl i{font-size:17px}.m .hand .tl u{font-size:14px}
.m .hand .mid{inset:auto;right:6px;bottom:6px;font-size:26px}.m .hand .br{display:none}
.m .hand.sel{transform:translateY(-22px)}
.m .tcard{width:70px;height:100px;border-radius:8px}.m .tcard .tl{top:5px;left:7px}.m .tcard .tl i{font-size:16px}.m .tcard .tl u{font-size:13px}.m .tcard .mid{font-size:34px}.m .tcard .br{display:none}
.m .felt{box-shadow:inset 0 0 0 8px var(--rim),inset 0 0 0 10px var(--rail)}.m .felt::after{font-size:120px}
.m .av{width:40px;height:40px}
.m .btn{height:52px}
</style>
</head>
<body>

<script src="engine.js"></script>
<script>
(function () {
'use strict';
var E = window.S29;
var $stage = document.getElementById('stage'), $main = document.getElementById('main');

/* ---------- analytics (Stratos) + rewarded hook ---------- */
function track(name, details) { try { var S = window.Stratos || parent.Stratos; if (S) S.track(name, details); } catch (e) {} }

/* ---------- storage ---------- */
function load(k, d) { try { var v = JSON.parse(localStorage.getItem('s29_' + k)); return v == null ? d : v; } catch (e) { return d; } }

var DEF = { name: 'Player', sound: true, music: false, anim: 'Normal', speed: 'Normal', level: 'Medium', table: 'emerald', back: 'emerald', face: 'classic',

var S = Object.assign({}, DEF, load('settings', {}));
var ST = Object.assign({ played: 0, wins: 0, losses: 0, bidN: 0, bidSum: 0, bestMade: 0, points: 0, byMode: { play: { w: 0, l: 0 }, daily: { w: 0, l: 0 } }, history: [] }, load('stats', {}));
var SEEN = load('seen', {});
var DAILY = Object.assign({ last: '', streak: 0, best: 0, done: {} }, load('daily', {}));
function saveS() { save('settings', S); }

/* ---------- constants ---------- */
var TABLES = {
  emerald: ['Emerald Felt', 'radial-gradient(ellipse at 50% 45%,#1D6E4C 0%,#134F35 55%,#0D3A27 100%)', '#0F2C20', '#8C6B2E'],
  royal: ['Royal Blue', 'radial-gradient(ellipse at 50% 45%,#2B5C9A 0%,#1B4277 55%,#102B4F 100%)', '#0C1D35', '#AEB8C8'],
  burgundy: ['Burgundy Velvet', 'radial-gradient(ellipse at 50% 45%,#84283A 0%,#5E1626 55%,#3A0D17 100%)', '#2A0910', '#C9A24E'],
  carbon: ['Midnight Carbon', 'repeating-linear-gradient(45deg,#1C1F24 0 3px,#22262C 3px 6px)', '#0E1013', '#5A616C'],
  teak: ['Teak Wood', 'repeating-linear-gradient(100deg,#6E4524 0 14px,#64401F 14px 22px,#77502C 22px 34px)', '#3A2412', '#D7B46A'],
  rangoli: ['Rangoli Festive', 'radial-gradient(circle,rgba(255,214,140,.22) 2px,transparent 3px) 0 0/22px 22px,radial-gradient(ellipse at 50% 45%,#13706C 0%,#0D5552 60%,#083B39 100%)', '#062A28', '#E07A2E']
};
var UNLOCK = { teak: 10, rangoli: 15 };
var BACKS = {
  emerald: ['Emerald', '#0E3B28', '#123F2C', '#C9A24E', '#E9C46A', '#FFFFFF'],
  purple: ['Purple', '#0D0F16', '#141724', '#8B7CF6', '#A78BFA', '#FFFFFF'],
  ocean: ['Ocean', '#14254A', '#182B55', '#AEB8C8', '#5EEAD4', '#FFFFFF'],
  ember: ['Ember', '#4A1414', '#541818', '#E3A36B', '#FFB86B', '#FFF3E6'],
  ivory: ['Ivory', '#F4EBD6', '#EFE4CB', '#8C6B2E', '#7C3AED', '#1A1A1A']
};
// Stratos logo card back: an "S" with two eyes and the word Stratos (from the design files)
function backFace(id, cls, w, h, fs) {
  var b = BACKS[id] || BACKS.emerald;
  var dot = function (top, left) { return '<span style="position:absolute;top:' + top + 'em;left:' + left + 'em;width:.17em;height:.17em;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center"><span style="width:.08em;height:.08em;border-radius:50%;background:#111"></span></span>'; };
  return '<span class="' + cls + '" style="width:' + w + 'px;height:' + h + 'px;font-size:' + fs + 'px;background:repeating-linear-gradient(45deg,' + b[1] + ' 0 6px,' + b[2] + ' 6px 12px);border:2px solid ' + b[3] + ';box-shadow:inset 0 0 0 ' + (w > 60 ? 3 : 2) + 'px ' + b[1] + ',inset 0 0 0 ' + (w > 60 ? 4 : 3) + 'px ' + b[3] + ',0 3px 8px rgba(0,0,0,.4)">' +
    '<span style="position:relative;display:block;font:700 .62em/.92 Fredoka,Arial Rounded MT Bold,Trebuchet MS,sans-serif;color:' + b[4] + '">S' + dot(0.04, 0.19) + dot(0.01, 0.35) + '</span>' +
    '<span style="font:700 .17em/1 Fredoka,Arial Rounded MT Bold,Trebuchet MS,sans-serif;color:' + b[5] + '">Stratos</span></span>';
}
var FACES = { classic: ['Classic', 'Red and black suits'], four: ['Four colour', 'Each suit its own colour'], large: ['Large print', 'Bigger rank letters'] };
var SPEED = { Relaxed: 1.5, Normal: 1, Quick: 0.55 };
var SEAT = [
  { name: 'You', ini: 'P', pos: 'bottom' },
  { name: 'Kabir', ini: 'K', pos: 'left' },
  { name: 'Meera', ini: 'M', pos: 'top' },
  { name: 'Arjun', ini: 'A', pos: 'right' }];
var TIPS = {
  bid: 'Bidding: your bid is the number of the 29 points your team promises to win. Jack = 3, Nine = 2, Ace = 1, Ten = 1. Strong Jacks and Nines in one suit mean you can bid higher.',
  trump: 'Trump: the suit you pick beats every other suit. Choose the suit where you hold the most strength. Hidden trump stays secret until someone who cannot follow suit asks.',
  follow: 'Follow the suit that was led if you can. The highest card of that suit wins the trick, unless a trump is played. Dimmed cards cannot be played.',
  ask: 'You have no card of the led suit. You may play anything, or ask for the trump suit first. If you ask, you must play a trump if you have one.',
  pair: 'Pair: you hold the King and Queen of trump. Once your team has won a trick you can declare it. For the bidding team it lowers the target by 4, for the other team it raises it by 4.',
  dbl: 'Double: the opposing team can double the stakes after seeing all 8 cards. The bidders may re-double. A made bid then scores 2 or 4 game points, and so does a failed one.',
  last: 'The team that wins the last trick gets 1 bonus point, so all 29 points are in play.'
};

/* ---------- app state ---------- */
var A = { pend: 0, screen: 'lobby', mode: 'play', G: null, M: null, ui: {}, token: 0, level: 'Medium', layout: 'd', sTab: 'sound', rulePage: 0, cache: {} };
A.level = S.level;
S.back = { classic: 'emerald', royal: 'ocean', stratos: 'purple' }[S.back] || S.back;
var timers = [];
function later(fn, ms) { var tok = A.token; var id = setTimeout(function () { if (tok === A.token) fn(); }, ms * (SPEED[S.speed] || 1) * (S.anim === 'Off' ? 0.6 : 1)); timers.push(id); return id; }
function clearTimers() { timers.forEach(clearTimeout); timers = []; A.token++; }

/* ---------- audio (synth only, soft) ---------- */
var AC = null, musicNodes = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, t0, dur, type, vol) {
  var c = ac(); if (!c) return;
  var o = c.createOscillator(), g = c.createGain(); o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, c.currentTime + t0); g.gain.exponentialRampToValueAtTime(vol || 0.05, c.currentTime + t0 + 0.02);

  o.connect(g); g.connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.05);
}
function sfx(n) {
  if (!S.sound) return;
  try {
    if (n === 'deal') { for (var i = 0; i < 4; i++) tone(520 + i * 30, i * 0.07, 0.08, 'triangle', 0.025); }
    else if (n === 'play') tone(190, 0, 0.12, 'triangle', 0.05);
    else if (n === 'bid') { tone(392, 0, 0.18, 'sine', 0.05); tone(523, 0.1, 0.22, 'sine', 0.04); }
    else if (n === 'trump') { tone(523, 0, 0.3, 'sine', 0.05); tone(659, 0.12, 0.3, 'sine', 0.045); tone(784, 0.24, 0.45, 'sine', 0.04); }
    else if (n === 'trick') { tone(330, 0, 0.14, 'sine', 0.04); tone(440, 0.08, 0.18, 'sine', 0.04); }
    else if (n === 'win') { [523, 659, 784, 1047].forEach(function (f, i) { tone(f, i * 0.14, 0.5, 'sine', 0.05); }); }
    else if (n === 'lose') { [330, 262, 196].forEach(function (f, i) { tone(f, i * 0.2, 0.55, 'sine', 0.045); }); }
  } catch (e) {}
}
function musicOn(on) {
  var c = ac(); if (!c) return;
  if (!on) { if (musicNodes) { musicNodes.g.gain.linearRampToValueAtTime(0.0001, c.currentTime + 0.5); var m = musicNodes; setTimeout(function () { m.os.forEach(function (o) { try { o.stop(); } catch (e) {} }); }, 700); musicNodes = null; } return; }
  if (musicNodes) return;
  var g = c.createGain(); g.gain.value = 0.0001; g.connect(c.destination); g.gain.linearRampToValueAtTime(0.025, c.currentTime + 2);
  var os = [196, 247, 294, 392].map(function (f, i) { var o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; var l = c.createOscillator(); var lg = c.createGain(); l.frequency.value = 0.07 + i * 0.03; lg.gain.value = 1.5; l.connect(lg); lg.connect(o.frequency); l.start(); o.connect(g); o.start(); os.push; return o; });
  musicNodes = { g: g, os: os };
}

/* ---------- helpers ---------- */
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function sym(s) { return E.SUIT_SYM[s] + '︎'; }
