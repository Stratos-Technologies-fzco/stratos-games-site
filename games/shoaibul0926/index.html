function makeAsteroids(){
  asteroids=[];
  for(var i=0;i<7;i++){
    var pts=[];
    var segs=6+Math.floor(Math.random()*2);
    var baseR=14+Math.random()*16;
    for(var s=0;s<segs;s++){
      var a=(Math.PI*2*s)/segs;
      var rr=baseR*(0.7+Math.random()*0.5);
      pts.push([Math.cos(a)*rr,Math.sin(a)*rr]);

    asteroids.push({x:Math.random()*W,y:Math.random()*H,rot:Math.random()*Math.PI*2,pts:pts,c:'rgba('+(90+Math.floor(Math.random()*30))+','+(80+Math.floor(Math.random()*28))+','+(70+Math.floor(Math.random()*24))+',0.9)'});
  }
}

var actx=null;
function ensureAudio(){
  if(actx) return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
}
function resumeAudio(){ if(actx&&actx.state==='suspended'){ try{actx.resume();}catch(e){} } }
function beep(freq,dur,type,vol){
  if(!actx) return;
  try{
    var t0=actx.currentTime;
    var osc=actx.createOscillator();
    var gain=actx.createGain();
    osc.type=type||'square';
    osc.frequency.setValueAtTime(freq,t0);
    gain.gain.setValueAtTime(0,t0);
    gain.gain.linearRampToValueAtTime(vol||0.05,t0+0.006);
    gain.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    osc.connect(gain).connect(actx.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }catch(e){}
}

}

var shake={time:0,duration:0,intensity:0};
function shakeCamera(intensity,duration){ shake.time=duration; shake.duration=duration; shake.intensity=intensity; }
function updateShake(dt){ if(shake.time>0) shake.time=Math.max(shake.time-dt,0); }
function shakeOffset(){ if(shake.time<=0) return {x:0,y:0}; var k=shake.time/shake.duration; return {x:(Math.random()*2-1)*shake.intensity*k,y:(Math.random()*2-1)*shake.intensity*k}; }

function spawnBurst(x,y,color,radius,duration){ particles.push({x:x,y:y,color:color,radius:radius,duration:duration,age:0}); }
function updateParticles(dt){ for(var i=particles.length-1;i>=0;i--){ particles[i].age+=dt; if(particles[i].age>=particles[i].duration) particles.splice(i,1); } }
function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    var t=p.age/p.duration;
    var r=p.radius*(1+1.2*t);
    ctx.globalAlpha=Math.max(1-t,0);
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function randomEdgePosition(){
  var m=40;
  var edge=Math.floor(Math.random()*4);
  if(edge===0) return {x:Math.random()*W,y:-m};
  if(edge===1) return {x:Math.random()*W,y:H+m};
  if(edge===2) return {x:-m,y:Math.random()*H};
  return {x:W+m,y:Math.random()*H};
}
function collisionRadius(e){
  var def=e.def;
  if(def.kind==='image') return (def.dispW+def.dispH)/4;
  var maxr=0;
  for(var i=0;i<def.poly.length;i++){ maxr=Math.max(maxr,Math.hypot(def.poly[i][0],def.poly[i][1])); }
  return maxr*(def.scale||1);
}
function spawnEnemy(type,mult){
  var def=ENEMY_TYPES[type];
  var pos=randomEdgePosition();
  var hp=Math.round(def.health*(mult.health||1));
  enemies.push({
    type:type,def:def,x:pos.x,y:pos.y,vx:0,vy:0,rot:0,
    hp:hp,maxHp:hp,
    speed:def.speed*(mult.speed||1),
    fireRate:def.fireRate*(mult.fireRate||1),
    cooldown:0.3+Math.random()*0.5,
    flash:0,wanderDir:{x:1,y:0},wanderTimer:0,
    flankAngle:Math.random()*Math.PI*2,flankDir:Math.random()>0.5?1:-1,
    isBoss:!!def.isBoss,burstToggle:false,
    shield:(def.shield||0),shieldMax:(def.shield||0)
  });
}
function spawnNextInWave(){
  if(enemiesToSpawn<=0) return;
  enemiesToSpawn--;
  var type=waveTypePool[Math.floor(Math.random()*waveTypePool.length)];
  spawnEnemy(type,waveMult);
}
function startWave(n){
  waveNumber=n;
  if(n>=5){
    currentWaveIsBoss=true;
    enemiesToSpawn=0;
    spawnEnemy('boss',{});
    return;
  }
  currentWaveIsBoss=false;
  var wd=WAVES[n-1];
  enemiesToSpawn=wd.count;
  waveTypePool=wd.pool;
  waveMult=wd.mult;
  spawnNextInWave();
}

function spawnBullet(x,y,dirx,diry,speed,damage,fromPlayer,weaponType,forceHoming,forceTurnRate){
  var len=Math.hypot(dirx,diry)||1;
  var wdef=weaponType?WEAPON_DEFS[weaponType]:null;
  bullets.push({
    x:x,y:y,vx:dirx/len*speed,vy:diry/len*speed,damage:damage,fromPlayer:fromPlayer,
    life:wdef?wdef.life:2,age:0,weaponType:weaponType||null,
    pierce:wdef?wdef.pierce:0,homing:!!(wdef&&wdef.homing)||!!forceHoming,turnRate:wdef?wdef.turnRate:(forceTurnRate||0),
    hitList:[],target:null
  });
  spawnBurst(x,y,wdef?wdef.color:(fromPlayer?'#ffe666':'#ff4d4d'),7,0.08);
}

function damagePlayer(amount){
  if(player.hp<=0) return;
  var remaining=amount;
  if(player.shield>0){ var absorbed=Math.min(player.shield,remaining); player.shield-=absorbed; remaining-=absorbed; }
  if(remaining<=0) return;
  var before=player.hp;
  player.hp=Math.max(player.hp-Math.ceil(remaining),0);
  if(player.hp<before){ shakeCamera(5,0.2); player.flash=0.15; sfxHit(); }
  if(player.hp<=0) killPlayer();
}
function killPlayer(){
  spawnBurst(player.x,player.y,'#ffb266',42,0.5);
  shakeCamera(10,0.35);
  sfxExplosion(true);
  enemies.length=0;
  bullets.length=0;
  state=STATE_DEATHDELAY; deathTimer=0.6;
}

function damageEnemy(e,amount){
  if(e.hp<=0) return;
  if(e.shield>0){
    var absorbed=Math.min(e.shield,amount);
    e.shield-=absorbed; amount-=absorbed;
  }
  if(amount<=0){ e.flash=0.15; sfxHit(); return; }
  var before=e.hp;
  e.hp=Math.max(e.hp-Math.ceil(amount),0);
  if(e.hp<before) e.flash=0.15;
  sfxHit();
  if(e.hp<=0) killEnemy(e);
}
function killEnemy(e){
  var idx=enemies.indexOf(e);
  if(idx>=0) enemies.splice(idx,1);
  var sizeScale = e.def.kind==='image'? Math.max(e.def.dispW,e.def.dispH)/60 : (e.def.scale||1);
  spawnBurst(e.x,e.y,'#ffb266',32*Math.max(sizeScale,0.6),0.5);
  shakeCamera(e.isBoss?18:6*Math.max(sizeScale,0.6), e.isBoss?0.5:0.25);
  sfxExplosion(!!e.isBoss);
  if(e.isBoss){
    score+=SCORE_PER_KILL*10;
    bossTimer=0.8; state=STATE_BOSSDEADDELAY;
    return;
  }
  score+=SCORE_PER_KILL;
  if(enemiesToSpawn>0){ spawnNextInWave(); return; }
  if(enemies.length===0){ bannerText='Wave '+waveNumber+' Cleared'; bannerTimer=1.6; state=STATE_WAVEBANNER; }
}

function findNearestEnemy(x,y){
  var best=null,bestDist=Infinity;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.hp<=0) continue;
    var d=Math.hypot(e.x-x,e.y-y);
    if(d<bestDist){ bestDist=d; best=e; }
  }
  return best;
}
function updateBullets(dt){
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i];
    if(b.homing){
      var tgtX=null,tgtY=null;
      if(b.fromPlayer){
        if(!b.target||b.target.hp<=0||enemies.indexOf(b.target)===-1){ b.target=findNearestEnemy(b.x,b.y); }
        if(b.target){ tgtX=b.target.x; tgtY=b.target.y; }
      } else if(player.hp>0){
        tgtX=player.x; tgtY=player.y;
      }
      if(tgtX!==null){
        var speed=Math.hypot(b.vx,b.vy);
        var curAngle=Math.atan2(b.vy,b.vx);
        var targetAngle=Math.atan2(tgtY-b.y,tgtX-b.x);
        var diff=clamp(normAngle(targetAngle-curAngle),-b.turnRate*dt,b.turnRate*dt);
        var newAngle=curAngle+diff;
        b.vx=Math.cos(newAngle)*speed; b.vy=Math.sin(newAngle)*speed;
      }
    }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.age+=dt;
    if(b.age>b.life||b.x<-24||b.x>W+24||b.y<-24||b.y>H+24){ bullets.splice(i,1); continue; }
    if(b.fromPlayer){
      for(var j=enemies.length-1;j>=0;j--){
        var e=enemies[j];
        if(b.hitList.indexOf(e)!==-1) continue;
        var r=collisionRadius(e);
        if(Math.hypot(b.x-e.x,b.y-e.y)<=r+4){
          damageEnemy(e,b.damage);
          spawnBurst(b.x,b.y,'#ffffff',9,0.14);
          if(b.pierce===0){
            bullets.splice(i,1);
          } else {
            b.hitList.push(e);
            if(b.pierce>0){ b.pierce--; if(b.pierce<=0){ bullets.splice(i,1); } }
          }
          break;
        }
      }
    } else {
      if(player.hp>0 && Math.hypot(b.x-player.x,b.y-player.y)<=34){
        damagePlayer(b.damage);
        spawnBurst(b.x,b.y,'#ffffff',9,0.14);
        bullets.splice(i,1);
      }
    }
  }
}

function updateEnemies(dt){
  var kamikazeHits=[];
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.flash>0) e.flash=Math.max(e.flash-dt,0);
    if(e.shieldMax>0 && e.shield<e.shieldMax){ e.shield=Math.min(e.shieldMax,e.shield+(e.def.shieldRegen||0)*dt); }
    var dxp=player.x-e.x, dyp=player.y-e.y;
    var dist=Math.hypot(dxp,dyp);
    if(e.def.isKamikaze){
      if(dist>0.001){
        var kdx=dxp/dist, kdy=dyp/dist;
        var ak=Math.min(8*dt,1);
        e.vx+=(kdx*e.speed-e.vx)*ak; e.vy+=(kdy*e.speed-e.vy)*ak;
        e.x+=e.vx*dt; e.y+=e.vy*dt;
        e.rot=lerpAngle(e.rot,Math.atan2(dyp,dxp)+Math.PI/2,Math.min(6*dt,1));
      }
      if(dist<=e.def.contactRange){ kamikazeHits.push(e); }
      continue;
    }
    if(e.isBoss){
      e.wanderTimer-=dt;
      if(e.wanderTimer<=0){
        e.wanderTimer=2.5;
        var ang=Math.random()*Math.PI*2;
        e.wanderDir={x:Math.cos(ang),y:Math.sin(ang)};
      }
      var tvx=e.wanderDir.x*e.speed, tvy=e.wanderDir.y*e.speed;
      var a=Math.min(8*dt,1);
      e.vx+=(tvx-e.vx)*a; e.vy+=(tvy-e.vy)*a;
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      var m=40;
      if(e.x<=m) e.wanderDir.x=Math.abs(e.wanderDir.x);
      else if(e.x>=W-m) e.wanderDir.x=-Math.abs(e.wanderDir.x);
      if(e.y<=m) e.wanderDir.y=Math.abs(e.wanderDir.y);
      else if(e.y>=H-m) e.wanderDir.y=-Math.abs(e.wanderDir.y);
      e.x=clamp(e.x,m,W-m); e.y=clamp(e.y,m,H-m);
      var ta=Math.atan2(dyp,dxp)+Math.PI/2;
      e.rot=lerpAngle(e.rot,ta,Math.min(6*dt,1));
    } else {
      var dvx=0,dvy=0;
      var ar=e.def.attackRange;
      var mode=e.def.mode||'direct';
      if(mode==='flank'){
        e.flankAngle+=e.flankDir*(e.speed/Math.max(ar,1))*dt;
        var opx=player.x+Math.cos(e.flankAngle)*ar, opy=player.y+Math.sin(e.flankAngle)*ar;
        var ox=opx-e.x, oy=opy-e.y, ol=Math.hypot(ox,oy)||1;
        dvx=ox/ol*e.speed; dvy=oy/ol*e.speed;
      } else if(mode==='kite'){
        if(dist<ar*0.6){ dvx=-dxp/(dist||1)*e.speed; dvy=-dyp/(dist||1)*e.speed; }
        else if(dist>ar){ dvx=dxp/(dist||1)*e.speed; dvy=dyp/(dist||1)*e.speed; }
      } else if(mode==='push'){
        if(dist>ar*0.35){ dvx=dxp/(dist||1)*e.speed; dvy=dyp/(dist||1)*e.speed; }
      } else {
        if(dist>ar){ dvx=dxp/(dist||1)*e.speed; dvy=dyp/(dist||1)*e.speed; }
      }
      var a2=Math.min(8*dt,1);
      e.vx+=(dvx-e.vx)*a2; e.vy+=(dvy-e.vy)*a2;
      e.x+=e.vx*dt; e.y+=e.vy*dt;
      var ta2=Math.atan2(dyp,dxp)+Math.PI/2;
      e.rot=lerpAngle(e.rot,ta2,Math.min(6*dt,1));
    }
    e.cooldown-=dt;
    var forward={x:Math.sin(e.rot),y:-Math.cos(e.rot)};
    var facingOk=true;
    if(!e.isBoss && dist>0.001){
      var dot=(forward.x*dxp+forward.y*dyp)/dist;
      var angleDiff=Math.acos(clamp(dot,-1,1));
      facingOk = angleDiff<=(30*Math.PI/180);
    }
    if(dist<=e.def.attackRange && e.cooldown<=0 && facingOk){
      e.cooldown=e.fireRate;
      var dirx=dxp/(dist||1), diry=dyp/(dist||1);
      if(e.isBoss){
        e.burstToggle=!e.burstToggle;
        if(e.burstToggle){
          var offs=[-15,0,15];
          for(var k=0;k<offs.length;k++){
            var rad=offs[k]*Math.PI/180;
            var rx=dirx*Math.cos(rad)-diry*Math.sin(rad);
            var ry=dirx*Math.sin(rad)+diry*Math.cos(rad);
            spawnBullet(e.x,e.y,rx,ry,e.def.bulletSpeed,e.def.damage,false);
          }
        } else {
          spawnBullet(e.x,e.y,dirx,diry,e.def.bulletSpeed,e.def.damage,false);
        }
      } else if(e.def.spreadShots){
        var half=(e.def.spreadShots-1)/2;
        for(var ks=0;ks<e.def.spreadShots;ks++){
          var rad2=(ks-half)*(e.def.spreadAngle||15)*Math.PI/180;
          var rx2=dirx*Math.cos(rad2)-diry*Math.sin(rad2);
          var ry2=dirx*Math.sin(rad2)+diry*Math.cos(rad2);
          spawnBullet(e.x,e.y,rx2,ry2,e.def.bulletSpeed,e.def.damage,false);
        }
      } else if(e.def.homing){
        spawnBullet(e.x,e.y,dirx,diry,e.def.bulletSpeed,e.def.damage,false,null,true,e.def.turnRate||2.5);
      } else {
        spawnBullet(e.x,e.y,dirx,diry,e.def.bulletSpeed,e.def.damage,false);
      }
      sfxShoot(false);
    }
  }
  for(var ki=0;ki<kamikazeHits.length;ki++){
    var ke=kamikazeHits[ki];
    if(ke.hp<=0) continue;
    damagePlayer(ke.def.explosionDamage);
    shakeCamera(6,0.2);
    damageEnemy(ke,ke.hp);
  }
}

var controls={
  move:{active:false,id:null,cx:0,cy:0,r:0,kx:0,ky:0,dx:0,dy:0},
  aim:{active:false,id:null,cx:0,cy:0,r:0,kx:0,ky:0,dx:0,dy:0},
  fire:{active:false,id:null,cx:0,cy:0,r:0,down:false}
};
function layoutControls(){
  var r=Math.min(70,W*0.12,H*0.16);
  controls.move.r=r; controls.move.cx=r+46; controls.move.cy=H-r-46;
  controls.aim.r=r; controls.aim.cx=W-r-46; controls.aim.cy=H-r-46;
  controls.fire.r=Math.min(54,r*0.82); controls.fire.cx=controls.aim.cx; controls.fire.cy=controls.aim.cy-r-controls.fire.r-36;
}
function updateJoystick(c,p){
  var ox=p.x-c.cx, oy=p.y-c.cy;
  var len=Math.hypot(ox,oy);
  if(len>c.r){ ox=ox/len*c.r; oy=oy/len*c.r; }
  c.kx=ox; c.ky=oy;
  c.dx=ox/c.r; c.dy=oy/c.r;
  if(c===controls.aim){
    var mag=Math.hypot(c.dx,c.dy);
    if(mag>0.15){ aimDir.x=c.dx/mag; aimDir.y=c.dy/mag; }
  }
}
function resetJoystick(c){ c.kx=0;c.ky=0;c.dx=0;c.dy=0;c.active=false;c.id=null; }

var keys={};
var keyFireDown=false;
var mouse={x:0,y:0};
var mouseFireDown=false;

function getPos(e){ var r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
function hitRect(p,rect){ return rect && p.x>=rect.x && p.x<=rect.x+rect.w && p.y>=rect.y && p.y<=rect.y+rect.h; }
function hitCircle(p,c){ return c && Math.hypot(p.x-c.x,p.y-c.y)<=c.r; }

var startBtnRect=null, restartBtnRect=null, pauseBtnRect=null, uiButtons=[], weaponButtons=[];

function onPointerDown(e){
  if(e.pointerType!=='mouse') e.preventDefault();
  var p=getPos(e);
  ensureAudio(); resumeAudio();
  if(state===STATE_START){ if(hitRect(p,startBtnRect)) beginGame(); return; }
  if(state===STATE_UPGRADE){
    for(var i=0;i<uiButtons.length;i++){ if(hitRect(p,uiButtons[i])){ uiButtons[i].action(); break; } }
    return;
  }
  if(state===STATE_GAMEOVER||state===STATE_VICTORY){ if(hitRect(p,restartBtnRect)) beginGame(); return; }
  if(state!==STATE_PLAYING) return;
  if(hitCircle(p,pauseBtnRect)){ togglePause(); return; }
  for(var wi=0;wi<weaponButtons.length;wi++){ if(hitRect(p,weaponButtons[wi])){ player.weapon=weaponButtons[wi].key; return; } }
  if(paused) return;
  if(isTouch){
    if(!controls.move.active && Math.hypot(p.x-controls.move.cx,p.y-controls.move.cy)<=controls.move.r*1.7){
      controls.move.active=true; controls.move.id=e.pointerId; updateJoystick(controls.move,p);
    } else if(!controls.aim.active && Math.hypot(p.x-controls.aim.cx,p.y-controls.aim.cy)<=controls.aim.r*1.7){
      controls.aim.active=true; controls.aim.id=e.pointerId; updateJoystick(controls.aim,p);
    } else if(!controls.fire.active && Math.hypot(p.x-controls.fire.cx,p.y-controls.fire.cy)<=controls.fire.r*1.3){
      controls.fire.active=true; controls.fire.id=e.pointerId; controls.fire.down=true;
    }
  }
}
function onPointerMove(e){
  if(state!==STATE_PLAYING||paused) return;
  var p=getPos(e);
  if(controls.move.id===e.pointerId){ e.preventDefault(); updateJoystick(controls.move,p); }
  if(controls.aim.id===e.pointerId){ e.preventDefault(); updateJoystick(controls.aim,p); }
}
function onPointerUp(e){
  if(controls.move.id===e.pointerId) resetJoystick(controls.move);
  if(controls.aim.id===e.pointerId) resetJoystick(controls.aim);
  if(controls.fire.id===e.pointerId){ controls.fire.active=false; controls.fire.id=null; controls.fire.down=false; }
}
canvas.addEventListener('pointerdown',onPointerDown,{passive:false});
canvas.addEventListener('pointermove',onPointerMove,{passive:false});
canvas.addEventListener('pointerup',onPointerUp,{passive:false});
canvas.addEventListener('pointercancel',onPointerUp,{passive:false});
canvas.addEventListener('contextmenu',function(e){ e.preventDefault(); });
canvas.addEventListener('mousemove',function(e){ mouse.x=e.clientX; mouse.y=e.clientY; });
canvas.addEventListener('mousedown',function(e){ if(e.button===0){ mouseFireDown=true; ensureAudio(); resumeAudio(); } });
window.addEventListener('mouseup',function(e){ if(e.button===0) mouseFireDown=false; });
window.addEventListener('keydown',function(e){
  if(e.code==='ArrowUp'||e.code==='ArrowDown'||e.code==='ArrowLeft'||e.code==='ArrowRight'||e.code==='Space') e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space'){ keyFireDown=true; ensureAudio(); resumeAudio(); }
  if(e.code==='KeyP'||e.code==='Escape'){ togglePause(); }
  if(e.code==='Digit1') player.weapon=WEAPON_ORDER[0];
  if(e.code==='Digit2') player.weapon=WEAPON_ORDER[1];
  if(e.code==='Digit3') player.weapon=WEAPON_ORDER[2];
  if(e.code==='Digit4') player.weapon=WEAPON_ORDER[3];
});
window.addEventListener('keyup',function(e){ keys[e.code]=false; if(e.code==='Space') keyFireDown=false; });
document.addEventListener('visibilitychange',function(){ if(document.hidden && state===STATE_PLAYING && !paused) paused=true; });
window.addEventListener('resize',resize);

function togglePause(){ if(state!==STATE_PLAYING) return; paused=!paused; }

function pickRandomUpgrades(n){
  var keysArr=Object.keys(UPGRADES);
  for(var i=keysArr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=keysArr[i]; keysArr[i]=keysArr[j]; keysArr[j]=tmp; }
  return keysArr.slice(0,n);
}
function applyUpgradeEffects(){
  var newMax=Math.round(100*upMult('max_health'));
  var delta=newMax-player.maxHp;
  player.maxHp=newMax;
  if(delta>0) player.hp=Math.min(player.hp+delta,player.maxHp); else player.hp=Math.min(player.hp,player.maxHp);
  player.shieldMax=50*upMult('shield');
  player.shield=Math.min(player.shield,player.shieldMax);
}
function chooseUpgrade(key){
  levels[key]=(levels[key]||0)+1;
  applyUpgradeEffects();
  startWave(waveNumber+1);
  state=STATE_PLAYING;
}

function beginGame(){
  player.x=W/2; player.y=H*0.78; player.vx=0; player.vy=0; player.rot=0; player.flash=0; player.mountToggle=false; player.weapon='laser';
  levels={damage:0,fire_rate:0,max_health:0,shield:0,speed:0,projectile_speed:0};
  player.maxHp=100; player.hp=100; player.shieldMax=50; player.shield=50; player.cooldown=0;
  enemies.length=0; bullets.length=0; particles.length=0;
  score=0; aimDir={x:0,y:-1};
  paused=false;
  startWave(1);
  state=STATE_PLAYING;
}

function updateGameplay(dt){
  var mv={x:0,y:0};
  if(isTouch){
    mv.x=controls.move.dx; mv.y=controls.move.dy;
  } else {
    var dx=0,dy=0;
    if(keys['KeyW']||keys['ArrowUp']) dy-=1;
    if(keys['KeyS']||keys['ArrowDown']) dy+=1;
    if(keys['KeyA']||keys['ArrowLeft']) dx-=1;
    if(keys['KeyD']||keys['ArrowRight']) dx+=1;
    var len=Math.hypot(dx,dy);
    if(len>0){ mv.x=dx/len; mv.y=dy/len; }
  }
  var firing;
  if(isTouch){
    firing=controls.fire.down;
  } else {
    firing=mouseFireDown||keyFireDown;
    var ddx=mouse.x-player.x, ddy=mouse.y-player.y;
    var dlen=Math.hypot(ddx,ddy);
    if(dlen>1){ aimDir.x=ddx/dlen; aimDir.y=ddy/dlen; }
  }

  var speedMult=upMult('speed');
  var desiredX=mv.x*PLAYER_SPEED*speedMult, desiredY=mv.y*PLAYER_SPEED*speedMult;
  var accel=Math.min(9*dt,1);
  player.vx+=(desiredX-player.vx)*accel;
  player.vy+=(desiredY-player.vy)*accel;
  player.x+=player.vx*dt;
  player.y+=player.vy*dt;
  player.x=clamp(player.x,0,W);
  player.y=clamp(player.y,0,H);

  var targetAngle=Math.atan2(aimDir.y,aimDir.x)+Math.PI/2;
  player.rot=lerpAngle(player.rot,targetAngle,Math.min(12*dt,1));

  if(player.shield<player.shieldMax) player.shield=Math.min(player.shield+5*dt,player.shieldMax);
  if(player.flash>0) player.flash=Math.max(player.flash-dt,0);

  player.cooldown-=dt;
  if(firing && player.cooldown<=0 && player.hp>0){
    var wdef=WEAPON_DEFS[player.weapon]||WEAPON_DEFS.laser;
    var fireRate=wdef.fireRate/upMult('fire_rate');
    player.cooldown=fireRate;
    var dmg=Math.floor(wdef.damage*upMult('damage'));
    var bspeed=wdef.bulletSpeed*upMult('projectile_speed');
    var mlx=player.mountToggle?-16:16, mly=-14;
    player.mountToggle=!player.mountToggle;
    var cos=Math.cos(player.rot), sin=Math.sin(player.rot);
    var wx=player.x+mlx*cos-mly*sin;
    var wy=player.y+mlx*sin+mly*cos;
    spawnBullet(wx,wy,aimDir.x,aimDir.y,bspeed,dmg,true,player.weapon);
    sfxShoot(true);
  }

  updateEnemies(dt);
}

function update(dt){
  if(state===STATE_PLAYING && !paused) updateGameplay(dt);
  if(state===STATE_WAVEBANNER){ bannerTimer-=dt; if(bannerTimer<=0){ upgradeChoices=pickRandomUpgrades(3); state=STATE_UPGRADE; } }
  if(state===STATE_DEATHDELAY){ deathTimer-=dt; if(deathTimer<=0) state=STATE_GAMEOVER; }
  if(state===STATE_BOSSDEADDELAY){ bossTimer-=dt; if(bossTimer<=0) state=STATE_VICTORY; }
  if((state===STATE_PLAYING||state===STATE_WAVEBANNER||state===STATE_DEATHDELAY||state===STATE_BOSSDEADDELAY) && !paused){
    updateBullets(dt);
    updateParticles(dt);
  }
  updateShake(dt);
}

function drawBackground(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a0a1c');
  g.addColorStop(1,'#050510');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);
  for(var i=0;i<nebulae.length;i++){
    var n=nebulae[i];
    var cx=n.fx*W, cy=n.fy*H, rad=n.r*Math.max(W,H);
    var rg=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    rg.addColorStop(0,n.c);
    rg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=rg;
    ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2); ctx.fill();
  }
  for(i=0;i<stars.length;i++){
    var s=stars[i];
    ctx.globalAlpha=s.b;
    ctx.fillStyle='#ffffff';
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  for(i=0;i<asteroids.length;i++){
    var ast=asteroids[i];
    ctx.save();
    ctx.translate(ast.x,ast.y);
    ctx.rotate(ast.rot);
    ctx.fillStyle=ast.c;
    ctx.beginPath();
    for(var k=0;k<ast.pts.length;k++){ var pp=ast.pts[k]; if(k===0) ctx.moveTo(pp[0],pp[1]); else ctx.lineTo(pp[0],pp[1]); }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawPlayer(){
  if(player.hp<=0) return;
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.rot);
  if(player.flash>0) ctx.filter='brightness(260%)';
  if(imgReady('player')) ctx.drawImage(images.player,-44,-54.5,88,109);
  ctx.filter='none';
  ctx.restore();
}
function drawEnemy(e){
  var def=e.def;
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.rotate(e.rot+(def.rotOffset||0));
  if(e.flash>0) ctx.filter='brightness(260%)';
  if(def.kind==='image'){
    if(imgReady(def.img)) ctx.drawImage(images[def.img],-def.dispW/2,-def.dispH/2,def.dispW,def.dispH);
  } else {
    ctx.fillStyle=def.color;
    ctx.strokeStyle='rgba(0,0,0,0.55)';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    var s=def.scale||1;
    for(var i=0;i<def.poly.length;i++){ var p=def.poly[i]; var x=p[0]*s,y=p[1]*s; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.filter='none';
  ctx.restore();
  var halfH = def.kind==='image'? def.dispH/2 : (def.scale||1)*22;
  var barW = def.kind==='image'? Math.max(def.dispW*0.8,26) : Math.max((def.scale||1)*26,20);
  var frac=Math.max(e.hp/e.maxHp,0);
  var bx=e.x-barW/2, by=e.y-halfH-14;
  ctx.fillStyle='rgba(10,10,18,0.85)'; ctx.fillRect(bx,by,barW,5);
  ctx.fillStyle= frac>0.5?'#4ee04e':frac>0.25?'#e0cc33':'#e04040';
  ctx.fillRect(bx,by,barW*frac,5);
  if(e.shieldMax>0){
    var sfrac=Math.max(e.shield/e.shieldMax,0);
    ctx.fillStyle='rgba(10,10,18,0.85)'; ctx.fillRect(bx,by-6,barW,4);
    ctx.fillStyle='#4fa4ff'; ctx.fillRect(bx,by-6,barW*sfrac,4);
  }
}
function drawBullets(){
  for(var i=0;i<bullets.length;i++){
    var b=bullets[i];
    var wdef=b.weaponType?WEAPON_DEFS[b.weaponType]:null;
    ctx.save();
    ctx.translate(b.x,b.y);
    var ang=Math.atan2(b.vy,b.vx)+Math.PI/2;
    ctx.rotate(ang);
    if(wdef){
      if(wdef.trail){
        ctx.strokeStyle=wdef.glow; ctx.lineWidth=wdef.wid*0.7;
        ctx.beginPath(); ctx.moveTo(0,wdef.len*0.6); ctx.lineTo(0,wdef.len*2.2); ctx.stroke();
      }
      ctx.fillStyle=wdef.glow;
      ctx.beginPath(); ctx.ellipse(0,0,wdef.wid*1.8,wdef.len*1.35,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle=wdef.color;
      ctx.beginPath(); ctx.ellipse(0,0,wdef.wid,wdef.len,0,0,Math.PI*2); ctx.fill();
    } else {
      ctx.fillStyle= b.fromPlayer? 'rgba(255,230,102,0.35)':'rgba(255,77,77,0.35)';
      ctx.beginPath(); ctx.ellipse(0,0,5,11,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle= b.fromPlayer? '#ffe666':'#ff4d4d';
      ctx.beginPath(); ctx.ellipse(0,0,2.5,7,0,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

function drawBar(x,y,w,h,frac,color){
  ctx.fillStyle='rgba(10,10,18,0.7)'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=color; ctx.fillRect(x,y,w*clamp(frac,0,1),h);
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
}
function drawHUD(){
  ctx.textBaseline='top';
  ctx.font='700 18px system-ui, -apple-system, Segoe UI, Arial';
  ctx.textAlign='left';
  ctx.fillStyle='#ffffff';
  ctx.fillText('HP '+Math.ceil(player.hp)+'/'+player.maxHp,18,14);
  drawBar(18,36,130,7,player.hp/player.maxHp,'#4ee04e');
  ctx.fillStyle='#8ec4ff';
  ctx.font='600 15px system-ui, Segoe UI, Arial';
  ctx.fillText('Shield '+Math.round(player.shield)+'/'+Math.round(player.shieldMax),18,50);

  ctx.textAlign='center';
  ctx.fillStyle='#ffffff';
  ctx.font='700 19px system-ui, Segoe UI, Arial';
  ctx.fillText('Wave '+waveNumber,W/2,14);
  ctx.font='600 15px system-ui, Segoe UI, Arial';
  ctx.fillStyle='#c7d0f0';
  var remaining= currentWaveIsBoss? enemies.length : (enemiesToSpawn+enemies.length);
  ctx.fillText('Remaining '+remaining,W/2,38);

  ctx.textAlign='right';
  ctx.fillStyle='#ffffff';
  ctx.font='700 19px system-ui, Segoe UI, Arial';
  ctx.fillText('Score '+score,W-56,14);

  pauseBtnRect={x:W-32,y:32,r:22};
  ctx.beginPath(); ctx.arc(pauseBtnRect.x,pauseBtnRect.y,pauseBtnRect.r,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.14)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.4)'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.fillStyle='#fff';
  if(paused){
    ctx.beginPath();
    ctx.moveTo(pauseBtnRect.x-6,pauseBtnRect.y-9);
    ctx.lineTo(pauseBtnRect.x-6,pauseBtnRect.y+9);
    ctx.lineTo(pauseBtnRect.x+9,pauseBtnRect.y);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.fillRect(pauseBtnRect.x-8,pauseBtnRect.y-9,5,18);
    ctx.fillRect(pauseBtnRect.x+3,pauseBtnRect.y-9,5,18);
  }
  if(state===STATE_PLAYING) drawWeaponBar();
}

function drawWeaponIcon(cx,cy,size,key,color){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.fillStyle=color;
  ctx.strokeStyle=color;
  ctx.lineCap='round';
  if(key==='laser'){
    ctx.globalAlpha=0.3; ctx.lineWidth=size*0.42;
    ctx.beginPath(); ctx.moveTo(0,-size*0.55); ctx.lineTo(0,size*0.55); ctx.stroke();
    ctx.globalAlpha=1; ctx.lineWidth=size*0.14;
    ctx.beginPath(); ctx.moveTo(0,-size*0.55); ctx.lineTo(0,size*0.55); ctx.stroke();
  } else if(key==='plasma'){
    ctx.globalAlpha=0.3;
    ctx.beginPath(); ctx.arc(0,0,size*0.58,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
    ctx.beginPath(); ctx.arc(0,0,size*0.34,0,Math.PI*2); ctx.fill();
  } else if(key==='missile'){
    ctx.beginPath();
    ctx.moveTo(0,-size*0.58); ctx.lineTo(size*0.22,size*0.18); ctx.lineTo(size*0.09,size*0.18); ctx.lineTo(size*0.09,size*0.42);
    ctx.lineTo(-size*0.09,size*0.42); ctx.lineTo(-size*0.09,size*0.18); ctx.lineTo(-size*0.22,size*0.18);
    ctx.closePath(); ctx.fill();
  } else if(key==='railgun'){
    ctx.globalAlpha=0.3; ctx.lineWidth=size*0.36;
    ctx.beginPath(); ctx.moveTo(-size*0.52,size*0.32); ctx.lineTo(size*0.52,-size*0.32); ctx.stroke();
    ctx.globalAlpha=1; ctx.lineWidth=size*0.12;
    ctx.beginPath(); ctx.moveTo(-size*0.52,size*0.32); ctx.lineTo(size*0.52,-size*0.32); ctx.stroke();
  }
  ctx.restore();
}
function drawWeaponBar(){
  var n=WEAPON_ORDER.length;
  var bw=Math.min(84,(W-56)/n-10), bh=58, gap=8;
  var totalW=n*bw+(n-1)*gap;
  var startX=28;
  var y=H-bh-18;
  weaponButtons=[];

  roundRect(startX-14,y-10,totalW+28,bh+20,16);
  ctx.fillStyle='rgba(6,8,16,0.55)'; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1; ctx.stroke();

  for(var i=0;i<n;i++){
    var key=WEAPON_ORDER[i];
    var wdef=WEAPON_DEFS[key];
    var x=startX+i*(bw+gap);
    var active=player.weapon===key;
    weaponButtons.push({x:x,y:y,w:bw,h:bh,key:key});

    if(active){
      ctx.save();
      ctx.shadowColor=wdef.color; ctx.shadowBlur=18;
      roundRect(x,y,bw,bh,10);
      ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fill();
      ctx.restore();
      roundRect(x,y,bw,bh,10);
      ctx.strokeStyle=wdef.color; ctx.lineWidth=2; ctx.stroke();
    } else {
      roundRect(x,y,bw,bh,10);
      ctx.fillStyle='rgba(12,14,24,0.55)'; ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.stroke();
    }

    drawWeaponIcon(x+bw/2,y+bh*0.36,bh*0.42,key,active?wdef.color:'rgba(220,225,240,0.55)');

    ctx.fillStyle= active? wdef.color:'rgba(199,208,240,0.75)';
    ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    ctx.font='700 11px system-ui, Segoe UI, Arial';
    ctx.fillText(wdef.short,x+bw/2,y+bh-8);

    ctx.beginPath(); ctx.arc(x+13,y+13,9,0,Math.PI*2);
    ctx.fillStyle= active? wdef.color:'rgba(255,255,255,0.18)';
    ctx.fill();
    ctx.fillStyle= active? '#0b0c14':'rgba(230,235,250,0.85)';
    ctx.font='800 10px system-ui, Segoe UI, Arial';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(''+(i+1),x+13,y+14);
  }
  ctx.textBaseline='top';
}

function drawStick(c){
  ctx.beginPath(); ctx.arc(c.cx,c.cy,c.r,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.12)'; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.28)'; ctx.stroke();
  ctx.beginPath(); ctx.arc(c.cx+c.kx,c.cy+c.ky,c.r*0.42,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,0.38)'; ctx.fill();
}
function drawControls(){
  if(!isTouch) return;
  drawStick(controls.move);
  drawStick(controls.aim);
  var f=controls.fire;
  ctx.beginPath(); ctx.arc(f.cx,f.cy,f.r,0,Math.PI*2);
  ctx.fillStyle= f.down? 'rgba(255,90,90,0.55)':'rgba(255,90,90,0.28)';
  ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font='800 15px system-ui, Segoe UI, Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('FIRE',f.cx,f.cy);
  ctx.textBaseline='top';
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawButton(rect,label,sub,accent){
  roundRect(rect.x,rect.y,rect.w,rect.h,14);
  ctx.fillStyle=accent||'rgba(255,180,60,0.9)';
  ctx.fill();
  ctx.fillStyle='#1a1206';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  var maxW=rect.w*0.86;
  var fontSize=Math.round(rect.h*0.30);
  ctx.font='700 '+fontSize+'px system-ui, Segoe UI, Arial';
  var textW=ctx.measureText(label).width;
  if(textW>maxW){
    fontSize=Math.max(10,Math.floor(fontSize*maxW/textW));
    ctx.font='700 '+fontSize+'px system-ui, Segoe UI, Arial';
  }
  ctx.fillText(label,rect.x+rect.w/2,rect.y+rect.h/2-(sub?rect.h*0.14:0));
  if(sub){
    ctx.font='600 '+Math.round(rect.h*0.17)+'px system-ui, Segoe UI, Arial';
    ctx.fillText(sub,rect.x+rect.w/2,rect.y+rect.h/2+rect.h*0.22);
  }
  ctx.textBaseline='top';
}

function drawUpgradeIcon(cx,cy,size,type,color){
  ctx.save();
  ctx.translate(cx,cy);
  ctx.strokeStyle=color; ctx.fillStyle=color;
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(type==='damage'){
    ctx.lineWidth=size*0.16;
    ctx.beginPath();
    ctx.moveTo(-size*0.42,-size*0.42); ctx.lineTo(size*0.42,size*0.42);
    ctx.moveTo(size*0.42,-size*0.42); ctx.lineTo(-size*0.42,size*0.42);
    ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,size*0.14,0,Math.PI*2); ctx.fill();
  } else if(type==='fire_rate'){
    ctx.beginPath();
    ctx.moveTo(size*0.08,-size*0.55); ctx.lineTo(-size*0.32,size*0.08); ctx.lineTo(-size*0.02,size*0.08);
    ctx.lineTo(-size*0.12,size*0.55); ctx.lineTo(size*0.36,-size*0.06); ctx.lineTo(size*0.05,-size*0.06);
    ctx.closePath(); ctx.fill();
  } else if(type==='max_health'){
    ctx.lineWidth=size*0.2;
    ctx.beginPath();
    ctx.moveTo(0,-size*0.45); ctx.lineTo(0,size*0.45);
    ctx.moveTo(-size*0.45,0); ctx.lineTo(size*0.45,0);
    ctx.stroke();
  } else if(type==='shield'){
    ctx.lineWidth=size*0.13;
    ctx.beginPath();
    ctx.moveTo(0,-size*0.5);
    ctx.lineTo(size*0.42,-size*0.24);
    ctx.lineTo(size*0.42,size*0.18);
    ctx.quadraticCurveTo(size*0.3,size*0.42,0,size*0.55);
    ctx.quadraticCurveTo(-size*0.3,size*0.42,-size*0.42,size*0.18);
    ctx.lineTo(-size*0.42,-size*0.24);
    ctx.closePath();
    ctx.stroke();
  } else if(type==='speed'){
    ctx.lineWidth=size*0.15;
    ctx.beginPath();
    ctx.moveTo(-size*0.3,-size*0.4); ctx.lineTo(size*0.1,0); ctx.lineTo(-size*0.3,size*0.4);
    ctx.stroke();
    ctx.globalAlpha=0.55;
    ctx.beginPath();
    ctx.moveTo(size*0.05,-size*0.4); ctx.lineTo(size*0.45,0); ctx.lineTo(size*0.05,size*0.4);
    ctx.stroke();
  } else if(type==='projectile_speed'){
    ctx.lineWidth=size*0.14;
    ctx.beginPath(); ctx.moveTo(-size*0.45,0); ctx.lineTo(size*0.3,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(size*0.08,-size*0.3); ctx.lineTo(size*0.45,0); ctx.lineTo(size*0.08,size*0.3); ctx.stroke();
  }
  ctx.restore();
}
function fitText(text,maxW,fontSize,weight){
  ctx.font=weight+' '+fontSize+'px system-ui, Segoe UI, Arial';
  var w=ctx.measureText(text).width;
  if(w>maxW){
    fontSize=Math.max(9,Math.floor(fontSize*maxW/w));
    ctx.font=weight+' '+fontSize+'px system-ui, Segoe UI, Arial';
  }
  return fontSize;
}
function drawUpgradeCard(rect,key){
  var style=UPGRADE_STYLE[key]||{color:'#ffb43c',icon:'damage'};
  var label=(UPGRADES[key]||'').replace('+10% ','');
  var r=rect;

  ctx.save();
  ctx.shadowColor=style.color; ctx.shadowBlur=16;
  roundRect(r.x,r.y,r.w,r.h,16);
  var grad=ctx.createLinearGradient(r.x,r.y,r.x,r.y+r.h);
  grad.addColorStop(0,'rgba(24,26,42,0.94)');
  grad.addColorStop(1,'rgba(9,10,18,0.94)');
  ctx.fillStyle=grad;
  ctx.fill();
  ctx.restore();

  roundRect(r.x,r.y,r.w,r.h,16);
  ctx.strokeStyle=style.color; ctx.lineWidth=1.6; ctx.globalAlpha=0.85; ctx.stroke(); ctx.globalAlpha=1;

  roundRect(r.x+2,r.y+2,r.w-4,r.h*0.38,12);
  ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fill();

  drawUpgradeIcon(r.x+r.w/2,r.y+r.h*0.3,Math.min(r.h*0.32,r.w*0.28),style.icon,style.color);

  ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  var pctSize=fitText('+10%',r.w*0.7,Math.round(r.h*0.2),'800');
  ctx.fillStyle=style.color;
  ctx.font='800 '+pctSize+'px system-ui, Segoe UI, Arial';
  ctx.fillText('+10%',r.x+r.w/2,r.y+r.h*0.72);

  var labelSize=fitText(label,r.w*0.84,Math.round(r.h*0.135),'600');
  ctx.fillStyle='rgba(220,225,240,0.85)';
  ctx.font='600 '+labelSize+'px system-ui, Segoe UI, Arial';
  ctx.fillText(label,r.x+r.w/2,r.y+r.h*0.9);

  ctx.textBaseline='top';
}

function drawStart(){
  ctx.fillStyle='rgba(3,3,10,0.35)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ffffff';
  var titleSize=Math.min(W*0.11,64);
  ctx.font='800 '+titleSize+'px system-ui, Segoe UI, Arial';
  ctx.shadowColor='rgba(120,170,255,0.5)'; ctx.shadowBlur=24;
  ctx.fillText('SKYFALL ARMADA',W/2,H*0.28);
  ctx.shadowBlur=0;
  ctx.fillStyle='#9aa4c7';
  ctx.font='500 '+Math.min(W*0.032,20)+'px system-ui, Segoe UI, Arial';
  ctx.fillText('by Shoaibul Hoque',W/2,H*0.28+titleSize*0.85);

  var btnW=Math.min(280,W*0.6), btnH=64;
  startBtnRect={x:W/2-btnW/2,y:H*0.52,w:btnW,h:btnH};
  drawButton(startBtnRect,'TAP TO START');

  ctx.fillStyle='#8f9ac2';
  ctx.font='500 '+Math.min(W*0.028,16)+'px system-ui, Segoe UI, Arial';
  var instr = isTouch? 'Left stick: move   ·   Right stick: aim   ·   FIRE: shoot' : 'WASD: move   ·   Mouse: aim   ·   Click or Space: fire';
  ctx.fillText(instr,W/2,H*0.52+btnH+34);
  ctx.font='500 '+Math.min(W*0.025,14)+'px system-ui, Segoe UI, Arial';
  ctx.fillStyle='#6c7bb8';
  ctx.fillText('5 waves · upgrades between waves · boss finale',W/2,H*0.52+btnH+58);
}

function drawWaveBanner(){
  var t=1-clamp(bannerTimer/1.6,0,1);
  var alpha = t<0.15? t/0.15 : (bannerTimer<0.3? bannerTimer/0.3 : 1);
  ctx.globalAlpha=clamp(alpha,0,1);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffffff';
  ctx.font='800 '+Math.min(W*0.07,42)+'px system-ui, Segoe UI, Arial';
  ctx.shadowColor='rgba(120,170,255,0.6)'; ctx.shadowBlur=18;
  ctx.fillText(bannerText,W/2,H/2);
  ctx.shadowBlur=0;
  ctx.globalAlpha=1;
  ctx.textBaseline='top';
}

function drawUpgrade(){
  ctx.fillStyle='rgba(3,3,10,0.68)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle='#ffffff';
  ctx.font='800 '+Math.min(W*0.055,32)+'px system-ui, Segoe UI, Arial';
  ctx.fillText('Wave '+waveNumber+' Complete',W/2,H*0.18);
  ctx.fillStyle='#9aa4c7';
  ctx.font='500 '+Math.min(W*0.03,16)+'px system-ui, Segoe UI, Arial';
  ctx.fillText('Choose an upgrade',W/2,H*0.18+42);

  uiButtons=[];
  var landscape=W>H;
  var n=upgradeChoices.length;
  if(landscape){
    var bw=Math.min(240,W*0.26), bh=110, gap=24;
    var totalW=n*bw+(n-1)*gap;
    var startX=W/2-totalW/2, y=H*0.42;
    for(var i=0;i<n;i++){
      var rect={x:startX+i*(bw+gap),y:y,w:bw,h:bh,action:(function(k){ return function(){ chooseUpgrade(k); }; })(upgradeChoices[i])};
      drawUpgradeCard(rect,upgradeChoices[i]);
      uiButtons.push(rect);
    }
  } else {
    var bw2=Math.min(320,W*0.8), bh2=84, gap2=18;
    var totalH=n*bh2+(n-1)*gap2;
    var y2=H/2-totalH/2, x2=W/2-bw2/2;
    for(var j=0;j<n;j++){
      var rect2={x:x2,y:y2+j*(bh2+gap2),w:bw2,h:bh2,action:(function(k){ return function(){ chooseUpgrade(k); }; })(upgradeChoices[j])};
      drawUpgradeCard(rect2,upgradeChoices[j]);
      uiButtons.push(rect2);
    }
  }
}

function drawEnd(isVictory){
  ctx.fillStyle='rgba(3,3,10,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.fillStyle= isVictory? '#ffe15a':'#ff6a6a';
  ctx.font='800 '+Math.min(W*0.08,46)+'px system-ui, Segoe UI, Arial';
  ctx.shadowColor= isVictory? 'rgba(255,220,100,0.5)':'rgba(255,80,80,0.5)'; ctx.shadowBlur=20;
  ctx.fillText(isVictory? 'ARMADA DEFEATED':'SHIP LOST',W/2,H*0.3);
  ctx.shadowBlur=0;
  ctx.fillStyle='#ffffff';
  ctx.font='600 '+Math.min(W*0.04,22)+'px system-ui, Segoe UI, Arial';
  ctx.fillText('Final Score: '+score,W/2,H*0.3+64);

  var btnW=Math.min(240,W*0.55), btnH=60;
  restartBtnRect={x:W/2-btnW/2,y:H*0.52,w:btnW,h:btnH};
  drawButton(restartBtnRect,'RESTART',null,isVictory?'rgba(255,225,90,0.92)':'rgba(255,120,120,0.9)');
}

function drawPausedOverlay(){
  ctx.fillStyle='rgba(3,3,10,0.5)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffffff';
  ctx.font='800 '+Math.min(W*0.08,40)+'px system-ui, Segoe UI, Arial';
  ctx.fillText('PAUSED',W/2,H/2);
  ctx.textBaseline='top';
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawBackground();
  var offset=shakeOffset();
  ctx.save();
  ctx.translate(offset.x,offset.y);
  if(state!==STATE_START){
    for(var i=0;i<enemies.length;i++) drawEnemy(enemies[i]);
    drawPlayer();
    drawBullets();
  }
  drawParticles();
  ctx.restore();

  if(state===STATE_START){
    drawStart();
  } else {
    drawHUD();
    if(isTouch && (state===STATE_PLAYING) && !paused) drawControls();
    if(state===STATE_WAVEBANNER) drawWaveBanner();
    if(state===STATE_UPGRADE) drawUpgrade();
    if(state===STATE_GAMEOVER) drawEnd(false);
    if(state===STATE_VICTORY) drawEnd(true);
    if(state===STATE_PLAYING && paused) drawPausedOverlay();
  }
}

var lastT=null;
function frame(t){
  if(lastT===null) lastT=t;
  var dt=(t-lastT)/1000; lastT=t;
  dt=Math.min(dt,0.05);
  update(dt);
  render();
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
