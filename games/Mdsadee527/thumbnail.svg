<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fa542"/>
      <stop offset="1" stop-color="#1f7a2f"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#565660"/>
      <stop offset="1" stop-color="#38383f"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".38"/>
    </radialGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0f" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0a0a0f" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- grass -->
  <rect width="800" height="500" fill="url(#grass)"/>

  <!-- speed streaks on the grass -->
  <g stroke="#ffffff" stroke-opacity=".18" stroke-width="10" stroke-linecap="round">
    <line x1="110" y1="60" x2="90" y2="160"/>
    <line x1="160" y1="230" x2="145" y2="320"/>
    <line x1="690" y1="90" x2="672" y2="190"/>
    <line x1="650" y1="330" x2="638" y2="410"/>
  </g>

  <!-- road -->
  <rect x="250" y="0" width="300" height="500" fill="url(#asphalt)"/>
  <rect x="250" y="0" width="6" height="500" fill="#eeeeee"/>
  <rect x="544" y="0" width="6" height="500" fill="#eeeeee"/>

  <!-- lane dashes -->
  <g stroke="#ffffff" stroke-width="6">
    <line x1="350" y1="-10" x2="350" y2="500" stroke-dasharray="34 30"/>
    <line x1="450" y1="8" x2="450" y2="500" stroke-dasharray="34 30"/>
  </g>

  <!-- traffic car: yellow, left lane -->
  <g>
    <rect x="286" y="176" width="58" height="90" rx="10" fill="rgba(0,0,0,.35)" transform="translate(4,7)"/>
    <rect x="286" y="176" width="58" height="90" rx="10" fill="#f4c430"/>
    <rect x="293" y="185" width="44" height="18" rx="5" fill="#80deea"/>
    <rect x="293" y="213" width="44" height="15" rx="5" fill="#80deea"/>
    <rect x="279" y="187" width="7" height="17" fill="#111"/>
    <rect x="344" y="187" width="7" height="17" fill="#111"/>
    <rect x="279" y="222" width="7" height="17" fill="#111"/>
    <rect x="344" y="222" width="7" height="17" fill="#111"/>
  </g>

  <!-- traffic car: blue, right lane -->
  <g>
    <rect x="456" y="96" width="58" height="90" rx="10" fill="rgba(0,0,0,.35)" transform="translate(4,7)"/>
    <rect x="456" y="96" width="58" height="90" rx="10" fill="#3d7ef0"/>
    <rect x="463" y="105" width="44" height="18" rx="5" fill="#80deea"/>
    <rect x="463" y="133" width="44" height="15" rx="5" fill="#80deea"/>
    <rect x="449" y="107" width="7" height="17" fill="#111"/>
    <rect x="514" y="107" width="7" height="17" fill="#111"/>
    <rect x="449" y="142" width="7" height="17" fill="#111"/>
    <rect x="514" y="142" width="7" height="17" fill="#111"/>
  </g>

  <!-- player car: red, bottom lane -->
  <g>
    <rect x="366" y="342" width="68" height="106" rx="11" fill="rgba(0,0,0,.35)" transform="translate(5,8)"/>
    <rect x="366" y="342" width="68" height="106" rx="11" fill="#e53935"/>
    <rect x="374" y="353" width="52" height="22" rx="6" fill="#80deea"/>
    <rect x="374" y="386" width="52" height="18" rx="6" fill="#80deea"/>
    <rect x="358" y="355" width="8" height="22" fill="#111"/>
    <rect x="434" y="355" width="8" height="22" fill="#111"/>
    <rect x="358" y="398" width="8" height="22" fill="#111"/>
    <rect x="434" y="398" width="8" height="22" fill="#111"/>
    <rect x="374" y="346" width="11" height="6" fill="#ffeb3b"/>
    <rect x="415" y="346" width="11" height="6" fill="#ffeb3b"/>
  </g>

  <rect width="800" height="500" fill="url(#vignette)"/>

  <!-- title banner -->
  <rect x="0" y="0" width="800" height="150" fill="url(#banner)"/>
  <text x="50%" y="68" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900"
        fill="#ffffff" style="paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:8px">RACING MANIA</text>
  <text x="50%" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800"
        fill="rgba(255,255,255,.9)" style="paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:5px">Dodge traffic. Beat your best.</text>
</svg>
