<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Racing Mania</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#111;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    overflow:hidden;
}

.game-container{
    width:100%;
    max-width:450px;
    height:100vh;
    max-height:800px;
    position:relative;
    background:#8fd3f4;
    overflow:hidden;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

#crashFlash{
    position:absolute;
    inset:0;
    z-index:15;
    background:#fff;
    opacity:0;
    pointer-events:none;
}

/* HUD */

.hud{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    z-index:20;
    display:flex;
    justify-content:space-between;
    padding:12px;
    color:white;
    font-size:18px;
    font-weight:bold;
    pointer-events:none;
}

.hud-box{
    background:rgba(0,0,0,.65);
    padding:8px 12px;
    border-radius:10px;
}

/* Start / Game Over */

.screen{
    position:absolute;
    inset:0;
    z-index:30;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:white;
    background:rgba(0,0,0,.72);
}

.screen h1{
    font-size:42px;
    margin-bottom:10px;
    text-shadow:0 4px 10px #000;
}

.screen p{
    margin-bottom:25px;
    color:#ddd;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 28px;
    margin:6px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    background:#e53935;
    box-shadow:0 5px 0 #9b1c19;
}

button:active{
    transform:translateY(4px);
    box-shadow:0 1px 0 #9b1c19;
}

.pause-btn{
    position:absolute;
    top:55px;
    right:10px;
    z-index:25;
    padding:8px 12px;
    font-size:14px;
    background:#333;
    box-shadow:0 3px 0 #111;
}

/* Mobile controls */

.controls{
    position:absolute;
    bottom:20px;
    left:0;
    width:100%;
    z-index:20;
    display:flex;
    justify-content:space-between;
    padding:0 25px;
    pointer-events:none;
}

.control-btn{
    width:75px;
    height:75px;
    border-radius:50%;
    background:rgba(255,255,255,.25);
    border:2px solid rgba(255,255,255,.5);
    color:white;
    font-size:32px;
    display:flex;
    justify-content:center;
    align-items:center;
    user-select:none;
    pointer-events:auto;
}

.hidden{
    display:none;
}

.final-score{
    font-size:24px;
    margin-bottom:20px;
    color:#ffd740;
}

.small{
    font-size:14px;
    color:#bbb;
    margin-top:15px;
}

.best-score{
    font-size:16px;
    color:#ffd740;
    margin-bottom:6px;
    font-weight:bold;
}

.new-best{
    color:#4caf50;
    font-weight:bold;
    margin-bottom:12px;
}

.car-picker{
    margin:14px 0 6px;
}

.car-picker-label{
    font-size:13px;
    color:#bbb;
    margin-bottom:8px;
}

.car-row{
    display:flex;
    gap:10px;
    justify-content:center;
}

.car-swatch{
    width:46px;
    height:46px;
    border-radius:10px;
    border:3px solid rgba(255,255,255,.2);
    cursor:pointer;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    color:rgba(0,0,0,.6);
    font-weight:bold;
}

.car-swatch.selected{
    border-color:#fff;
    box-shadow:0 0 10px rgba(255,255,255,.6);
}

.car-swatch.locked{
    opacity:.35;
    cursor:default;
    filter:grayscale(1);
}
</style>
</head>

<body>

<div class="game-container">

    <canvas id="gameCanvas"></canvas>

    <div id="crashFlash"></div>

    <div class="hud">
        <div class="hud-box">
            🏆 Score: <span id="score">0</span>
        </div>

        <div class="hud-box">
            ⚡ Speed: <span id="speed">1</span>
        </div>
    </div>

    <button id="pauseBtn" class="pause-btn hidden">
        ⏸️ Pause
    </button>

    <button id="muteBtn" class="pause-btn hidden" style="right:110px;">
        🔊 Sound
    </button>

    <!-- START SCREEN -->

    <div id="startScreen" class="screen">

        <h1>🏎️ CAR RACE</h1>

        <p>
            Dodge the traffic and survive as long as possible!
        </p>

        <div class="best-score" id="startBest">
            🏆 Best: 0
        </div>

        <div class="car-picker">
            <div class="car-picker-label">Pick your car (unlock more by beating your best)</div>
            <div class="car-row" id="carRow"></div>
        </div>

        <button id="startBtn">
            ▶️ START GAME
        </button>

        <div class="small">
            Keyboard: ← →<br>
            Mobile: Use the buttons below
        </div>

    </div>

    <!-- GAME OVER -->

    <div id="gameOverScreen" class="screen hidden">

        <h1>💥 GAME OVER</h1>

        <div class="final-score">
            Score: <span id="finalScore">0</span>
        </div>

        <div id="newBestMsg" class="new-best hidden">
            🎉 New Best Score!
        </div>

        <div class="best-score" id="overBest">
            🏆 Best: 0
        </div>

        <button id="restartBtn">
            🔄 PLAY AGAIN
        </button>

    </div>

    <!-- MOBILE CONTROLS -->

    <div id="controls" class="controls hidden">

        <div id="leftBtn" class="control-btn">
            ◀️
        </div>

        <div id="rightBtn" class="control-btn">
            ▶️
        </div>

    </div>

</div>

<script src="vendor/three.min.js"></script>
<script>

/* =========================
   CANVAS / RENDERER SETUP
========================= */

const canvas = document.getElementById("gameCanvas");
const container = document.querySelector(".game-container");
const crashFlashEl = document.getElementById("crashFlash");

let W, H;
let scene, camera, renderer, roadTexture;

function resizeCanvas(){

    W = container.clientWidth;
    H = container.clientHeight;

    if(renderer && camera){

        renderer.setSize(W, H, false);
        camera.aspect = W / H;
        camera.updateProjectionMatrix();

    }

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


/* =========================
   STRATOS ANALYTICS
========================= */

function track(name, details) { try { var S = window.Stratos || parent.Stratos; if (S) S.track(name, details); } catch (e) {} }


/* =========================
   BEST SCORE + UNLOCKABLE CARS
========================= */

const BEST_KEY = "racingMania_bestScore";
const CAR_KEY = "racingMania_selectedCar";

const CARS = [
    { id:"red",    color:"#e53935", name:"Red",    unlockAt:0 },
    { id:"blue",   color:"#2196f3", name:"Blue",   unlockAt:20 },
    { id:"yellow", color:"#ffeb3b", name:"Yellow", unlockAt:50 },
    { id:"purple", color:"#9c27b0", name:"Purple", unlockAt:100 },
    { id:"green",  color:"#00c853", name:"Green",  unlockAt:200 }
];

function getBest(){ return parseInt(localStorage.getItem(BEST_KEY) || "0", 10); }
function setBest(v){ localStorage.setItem(BEST_KEY, String(v)); }

function getCar(id){ return CARS.find(c => c.id === id) || CARS[0]; }
function isUnlocked(car, best){ return best >= car.unlockAt; }

function getSelectedCarId(){ return localStorage.getItem(CAR_KEY) || CARS[0].id; }
function setSelectedCarId(id){ localStorage.setItem(CAR_KEY, id); }

function applyPlayerCar(){
    player.color = getCar(getSelectedCarId()).color;
    if(player.mesh && player.mesh.userData.bodyMaterial){
        player.mesh.userData.bodyMaterial.color.set(player.color);
    }
}

function updateBestDisplays(){
    const best = getBest();
    document.getElementById("startBest").textContent = "🏆 Best: " + best;
    document.getElementById("overBest").textContent = "🏆 Best: " + best;
}

function renderCarPicker(){
    const best = getBest();
    let selectedId = getSelectedCarId();
    if (!isUnlocked(getCar(selectedId), best)) {
        selectedId = CARS[0].id;
        setSelectedCarId(selectedId);
    }
    const row = document.getElementById("carRow");
    row.innerHTML = "";
    CARS.forEach(car => {
        const unlocked = isUnlocked(car, best);
        const sw = document.createElement("div");
        sw.className = "car-swatch" + (unlocked ? "" : " locked") + (selectedId === car.id ? " selected" : "");
        sw.style.background = car.color;
        sw.title = unlocked ? car.name : ("Unlock at best " + car.unlockAt);
        sw.textContent = unlocked ? "" : "🔒";
        if (unlocked) {
            sw.addEventListener("click", () => {
                setSelectedCarId(car.id);
                applyPlayerCar();
                renderCarPicker();
            });
        }
        row.appendChild(sw);
    });
}


/* =========================
   AUDIO ENGINE (Web Audio API - no external files needed)
========================= */

let audioCtx = null;

let engineOsc1, engineOsc2, engineGain, engineFilter;

let engineStarted = false;

let soundMuted = false;


function initAudio(){

    if(audioCtx) return;

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

}


function startEngineSound(){

    if(!audioCtx) return;

    if(engineStarted) return;

    engineStarted = true;

    /* Two detuned oscillators for a richer engine growl */

    engineOsc1 = audioCtx.createOscillator();
    engineOsc2 = audioCtx.createOscillator();

    engineOsc1.type = "sawtooth";
    engineOsc2.type = "square";

    engineOsc1.frequency.value = 60;
    engineOsc2.frequency.value = 61.5;

    engineFilter = audioCtx.createBiquadFilter();
    engineFilter.type = "lowpass";
    engineFilter.frequency.value = 400;

    engineGain = audioCtx.createGain();
    engineGain.gain.value = 0.05;

    engineOsc1.connect(engineFilter);
    engineOsc2.connect(engineFilter);

    engineFilter.connect(engineGain);
    engineGain.connect(audioCtx.destination);

    engineOsc1.start();
    engineOsc2.start();

}


function stopEngineSound(){

    if(!engineStarted) return;

    engineStarted = false;

    const now = audioCtx.currentTime;

    engineGain.gain.cancelScheduledValues(now);
    engineGain.gain.setValueAtTime(engineGain.gain.value, now);
    engineGain.gain.linearRampToValueAtTime(0, now + 0.15);

    engineOsc1.stop(now + 0.2);
    engineOsc2.stop(now + 0.2);

}


function updateEngineSound(currentSpeed){

    if(!engineStarted || !audioCtx || soundMuted) return;

    const now = audioCtx.currentTime;

    /* Pitch and volume rise with speed */

    const baseFreq = 55 + currentSpeed * 9;

    engineOsc1.frequency.setTargetAtTime(baseFreq, now, 0.08);
    engineOsc2.frequency.setTargetAtTime(baseFreq * 1.025, now, 0.08);

    engineFilter.frequency.setTargetAtTime(300 + currentSpeed * 60, now, 0.1);

    engineGain.gain.setTargetAtTime(0.045 + currentSpeed * 0.003, now, 0.1);

}


function setEngineMuted(muted){

    if(!engineStarted || !audioCtx) return;

    const now = audioCtx.currentTime;

    engineGain.gain.setTargetAtTime(muted ? 0 : 0.05, now, 0.05);

}


function playCrashSound(){

    if(!audioCtx || soundMuted) return;

    const now = audioCtx.currentTime;

    /* Noise burst for the impact */

    const bufferSize = audioCtx.sampleRate * 0.5;

    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);

    const data = noiseBuffer.getChannelData(0);

    for(let i = 0; i < bufferSize; i++){

        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);

    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer;

    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = "lowpass";
    noiseFilter.frequency.setValueAtTime(2500, now);
    noiseFilter.frequency.exponentialRampToValueAtTime(200, now + 0.4);

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.7, now);
    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

    noise.connect(noiseFilter);
    noiseFilter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 0.5);

    /* Low thud/impact tone */

    const thud = audioCtx.createOscillator();
    thud.type = "triangle";
    thud.frequency.setValueAtTime(150, now);
    thud.frequency.exponentialRampToValueAtTime(30, now + 0.35);

    const thudGain = audioCtx.createGain();
    thudGain.gain.setValueAtTime(0.6, now);
    thudGain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

    thud.connect(thudGain);
    thudGain.connect(audioCtx.destination);

    thud.start(now);
    thud.stop(now + 0.4);

}


/* =========================
   GAME VARIABLES
========================= */

let gameRunning = false;
let gamePaused = false;

let score = 0;
let speed = 5;

let trafficCars = [];
let particles = [];
let treePool = [];

let spawnTimer = 0;

let animationId;

let crashing = false;
let crashTimer = 0;
const CRASH_DURATION = 26;

let shakeMag = 0;


/* =========================
   WORLD CONSTANTS
========================= */

const ROAD_WIDTH = 9;
const LANE_COUNT = 3;
const LANE_WIDTH = ROAD_WIDTH / LANE_COUNT;
const ROAD_LEFT = -ROAD_WIDTH / 2;

const SPAWN_Z = -140;
const REMOVE_Z = 14;
const Z_PER_SPEED = 0.19;
const ROAD_PLANE_LENGTH = 2000;

const TREE_COUNT = 18;
const TREE_SPACING = 14;

const PLAYER_ACCEL = 0.032;
const PLAYER_MAX_VX = 0.22;
const PLAYER_FRICTION = 0.85;


/* =========================
   PLAYER CAR
========================= */

const player = {

    x: 0,
    vx: 0,

    halfW: 0.9,
    halfD: 1.8,

    mesh: null,

    color: "#e53935"

};


/* =========================
   THREE.JS SCENE SETUP
========================= */

function initThree(){

    scene = new THREE.Scene();

    const skyColor = 0x8fd3f4;
    scene.background = new THREE.Color(skyColor);
    scene.fog = new THREE.Fog(skyColor, 40, 130);

    camera = new THREE.PerspectiveCamera(62, W / H, 0.1, 400);

    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(W, H, false);
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const ambient = new THREE.AmbientLight(0xffffff, 0.68);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 0.95);
    sun.position.set(-15, 25, 10);
    scene.add(sun);

    buildGround();
    buildRoad();
    buildTreePool();

}


function buildGround(){

    const groundMat = new THREE.MeshStandardMaterial({ color: 0x2f9e45 });
    const groundGeo = new THREE.PlaneGeometry(200, ROAD_PLANE_LENGTH);
    const ground = new THREE.Mesh(groundGeo, groundMat);

    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, -0.02, -ROAD_PLANE_LENGTH / 2 + 100);

    scene.add(ground);

}


function buildRoadTexture(){

    const w = 256, h = 512;

    const c = document.createElement("canvas");
    c.width = w;
    c.height = h;

    const tctx = c.getContext("2d");

    tctx.fillStyle = "#454550";
    tctx.fillRect(0, 0, w, h);

    for(let i = 0; i < 260; i++){

        const gx = Math.random() * w;
        const gy = Math.random() * h;
        const speckleColor = Math.random() < 0.5 ? "rgba(0,0,0,.12)" : "rgba(255,255,255,.06)";

        tctx.fillStyle = speckleColor;
        tctx.fillRect(gx, gy, 1 + Math.random() * 2, 1 + Math.random() * 2);

    }

    const edgeW = 10;

    tctx.fillStyle = "#e53935";
    tctx.fillRect(0, 0, edgeW, h / 2);
    tctx.fillRect(w - edgeW, h / 2, edgeW, h / 2);

    tctx.fillStyle = "#ffffff";
    tctx.fillRect(0, h / 2, edgeW, h / 2);
    tctx.fillRect(w - edgeW, 0, edgeW, h / 2);

    const laneX1 = w / 3, laneX2 = (w * 2) / 3, laneLineW = 6;

    tctx.fillStyle = "#ffffff";
    tctx.fillRect(laneX1 - laneLineW / 2, 0, laneLineW, h * 0.45);
    tctx.fillRect(laneX2 - laneLineW / 2, 0, laneLineW, h * 0.45);

    return new THREE.CanvasTexture(c);

}


function buildRoad(){

    roadTexture = buildRoadTexture();
    roadTexture.wrapS = THREE.RepeatWrapping;
    roadTexture.wrapT = THREE.RepeatWrapping;
    roadTexture.repeat.set(1, 200);

    const roadGeo = new THREE.PlaneGeometry(ROAD_WIDTH, ROAD_PLANE_LENGTH);
    const roadMat = new THREE.MeshStandardMaterial({ map: roadTexture, roughness: 1 });
    const roadMesh = new THREE.Mesh(roadGeo, roadMat);

    roadMesh.rotation.x = -Math.PI / 2;
    roadMesh.position.set(0, 0, -ROAD_PLANE_LENGTH / 2 + 100);

    scene.add(roadMesh);

}


/* =========================
   SHARED CAR MESH BUILDER
========================= */

function disposeMesh(group){

    group.traverse(obj => {
        if(obj.geometry) obj.geometry.dispose();
        if(obj.material) obj.material.dispose();
    });

}


function buildCarMesh(colorValue, dims){

    const w = dims.w, len = dims.len, h = dims.h;

    const group = new THREE.Group();

    const bodyMat = new THREE.MeshStandardMaterial({ color: colorValue, metalness: 0.25, roughness: 0.55 });
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h * 0.55, len), bodyMat);
    body.position.y = h * 0.275;
    group.add(body);
    group.userData.bodyMaterial = bodyMat;

    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x9fd8e8, metalness: 0.1, roughness: 0.15, transparent: true, opacity: 0.88 });
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(w * 0.76, h * 0.42, len * 0.48), cabinMat);
    cabin.position.set(0, h * 0.55 + h * 0.21, -len * 0.02);
    group.add(cabin);

    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.9 });
    const wheelGeo = new THREE.CylinderGeometry(h * 0.26, h * 0.26, w * 0.2, 10);

    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx, sz]) => {
        const wheel = new THREE.Mesh(wheelGeo, wheelMat);
        wheel.rotation.z = Math.PI / 2;
        wheel.position.set(sx * (w / 2), h * 0.26, sz * (len * 0.32));
        group.add(wheel);
    });

    const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff59d, emissive: 0xffe066, emissiveIntensity: 0.9 });
    const lightGeo = new THREE.BoxGeometry(w * 0.2, h * 0.09, 0.06);

    [-1,1].forEach(sx => {
        const lamp = new THREE.Mesh(lightGeo, lightMat);
        lamp.position.set(sx * w * 0.28, h * 0.32, -len / 2 - 0.02);
        group.add(lamp);
    });

    const mirrorMat = new THREE.MeshStandardMaterial({ color: colorValue, metalness: 0.3, roughness: 0.5 });

    [-1,1].forEach(sx => {
        const mirror = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 0.2), mirrorMat);
        mirror.position.set(sx * (w / 2 + 0.06), h * 0.42, -len * 0.12);
        group.add(mirror);
    });

    return group;

}


function buildPlayerMesh(){

    player.mesh = buildCarMesh(player.color, { w: 1.8, len: 3.6, h: 1.3 });
    player.mesh.position.set(0, 0, 0);
    scene.add(player.mesh);

}


/* =========================
   ROADSIDE TREES
========================= */

function buildTreeMesh(){

    const group = new THREE.Group();

    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5d4037 });
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 1.2, 6), trunkMat);
    trunk.position.y = 0.6;
    group.add(trunk);

    const leafColors = [0x1b5e20, 0x2e7d32, 0x33691e];
    const leafMat = new THREE.MeshStandardMaterial({ color: leafColors[Math.floor(Math.random() * 3)] });
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(1.1, 2.2, 8), leafMat);
    leaf.position.y = 2.1;
    group.add(leaf);

    return group;

}


function randomTreeX(){

    return (Math.random() < 0.5 ? -1 : 1) * (ROAD_WIDTH / 2 + 2.5 + Math.random() * 2);

}


function buildTreePool(){

    for(let i = 0; i < TREE_COUNT; i++){

        const group = buildTreeMesh();
        const z = -(Math.floor(i / 2) * TREE_SPACING) - 10;

        group.position.set(randomTreeX(), 0, z);
        scene.add(group);
        treePool.push(group);

    }

}


function updateTrees(delta){

    treePool.forEach(tree => {

        tree.position.z += delta;

        if(tree.position.z > 12){

            tree.position.z -= (TREE_SPACING * TREE_COUNT) / 2;
            tree.position.x = randomTreeX();

        }

    });

}


/* =========================
   TRAFFIC
========================= */

const TRAFFIC_CLASSES = [
    { w:1.8, len:3.6, h:1.3 },
    { w:1.8, len:3.6, h:1.3 },
    { w:1.6, len:3.0, h:1.15 },
    { w:2.1, len:4.6, h:1.9 }
];

const TRAFFIC_COLORS = [0x2196f3, 0xff9800, 0x9c27b0, 0x00bcd4, 0xffeb3b, 0x757575];


function createTrafficCar(){

    const lane = Math.floor(Math.random() * LANE_COUNT);
    const x = ROAD_LEFT + LANE_WIDTH * (lane + 0.5);

    const cls = TRAFFIC_CLASSES[Math.floor(Math.random() * TRAFFIC_CLASSES.length)];
    const color = TRAFFIC_COLORS[Math.floor(Math.random() * TRAFFIC_COLORS.length)];

    const mesh = buildCarMesh(color, cls);
    mesh.position.set(x, 0, SPAWN_Z);
    scene.add(mesh);

    trafficCars.push({ mesh: mesh, halfW: cls.w / 2, halfD: cls.len / 2 });

}


function updateTraffic(delta){

    trafficCars.forEach(car => {
        car.mesh.position.z += delta;
    });

    trafficCars = trafficCars.filter(car => {

        if(car.mesh.position.z > REMOVE_Z){
            scene.remove(car.mesh);
            disposeMesh(car.mesh);
            return false;
        }

        return true;

    });

}


function clearTraffic(){

    trafficCars.forEach(car => {
        scene.remove(car.mesh);
        disposeMesh(car.mesh);
    });

    trafficCars = [];

}


function spawnTraffic(){

    spawnTimer++;

    const spawnRate =
        Math.max(
            35,
            85 - Math.floor(score / 200)
        );

    if(spawnTimer >= spawnRate){

        createTrafficCar();
        spawnTimer = 0;

    }

}


/* =========================
   COLLISION
========================= */

function checkCollision(){

    for(const car of trafficCars){

        const dx = car.mesh.position.x - player.x;
        const dz = car.mesh.position.z - 0;

        const padding = 0.12;

        if(
            Math.abs(dx) < (player.halfW + car.halfW - padding) &&
            Math.abs(dz) < (player.halfD + car.halfD - padding)
        ){

            triggerCrash();
            return;

        }

    }

}


/* =========================
   CRASH IMPACT (shake + sparks + flash)
========================= */

function shakeScreen(mag){

    shakeMag = Math.max(shakeMag, mag);

}


function spawnCrashParticles(x, y, z){

    for(let i = 0; i < 16; i++){

        const geo = new THREE.BoxGeometry(0.12, 0.12, 0.12);
        const mat = new THREE.MeshStandardMaterial({
            color: Math.random() < 0.5 ? 0xffd740 : 0xff7043,
            transparent: true
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        scene.add(mesh);

        const angle = Math.random() * Math.PI * 2;
        const spd = 0.08 + Math.random() * 0.18;

        particles.push({
            mesh: mesh,
            vx: Math.cos(angle) * spd,
            vy: 0.12 + Math.random() * 0.14,
            vz: Math.sin(angle) * spd,
            life: 1
        });

    }

}


function updateParticles(){

    particles.forEach(p => {

        p.mesh.position.x += p.vx;
        p.mesh.position.y += p.vy;
        p.mesh.position.z += p.vz;

        p.vy -= 0.01;
        p.life -= 0.035;

        p.mesh.material.opacity = Math.max(0, p.life);
        p.mesh.rotation.x += 0.2;
        p.mesh.rotation.y += 0.15;

    });

    particles = particles.filter(p => {

        if(p.life <= 0){
            scene.remove(p.mesh);
            disposeMesh(p.mesh);
            return false;
        }

        return true;

    });

}


function clearParticles(){

    particles.forEach(p => {
        scene.remove(p.mesh);
        disposeMesh(p.mesh);
    });

    particles = [];

}


function triggerCrash(){

    if(crashing) return;

    crashing = true;
    crashTimer = 0;

    shakeScreen(16);
    spawnCrashParticles(player.x, 0.7, 0);

    playCrashSound();
    stopEngineSound();

}


/* =========================
   PLAYER MOVEMENT (momentum + lean)
========================= */

let moveLeft = false;
let moveRight = false;


function movePlayer(){

    if(moveLeft) player.vx -= PLAYER_ACCEL;
    if(moveRight) player.vx += PLAYER_ACCEL;

    if(!moveLeft && !moveRight) player.vx *= PLAYER_FRICTION;

    player.vx = Math.max(-PLAYER_MAX_VX, Math.min(PLAYER_MAX_VX, player.vx));

    player.x += player.vx;

    const minX = ROAD_LEFT + player.halfW + 0.15;
    const maxX = ROAD_LEFT + ROAD_WIDTH - player.halfW - 0.15;

    if(player.x < minX){
        player.x = minX;
        if(player.vx < 0) player.vx = 0;
    }

    if(player.x > maxX){
        player.x = maxX;
        if(player.vx > 0) player.vx = 0;
    }

    const lean = Math.max(-1, Math.min(1, player.vx / PLAYER_MAX_VX));

    player.mesh.position.x = player.x;
    player.mesh.rotation.z = -lean * 0.18;
    player.mesh.rotation.y = lean * 0.06;

}


function resetPlayer(){

    player.x = 0;
    player.vx = 0;

    if(player.mesh){
        player.mesh.position.set(0, 0, 0);
        player.mesh.rotation.set(0, 0, 0);
    }

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    const lean = Math.max(-1, Math.min(1, player.vx / PLAYER_MAX_VX));

    let jx = 0, jy = 0;

    if(shakeMag > 0.3){

        jx = (Math.random() - 0.5) * shakeMag * 0.05;
        jy = (Math.random() - 0.5) * shakeMag * 0.05;
        shakeMag *= 0.88;

    } else {

        shakeMag = 0;

    }

    camera.position.set(player.x + jx, 5.0 + jy, 8.5);
    camera.rotation.z = -lean * 0.03 + jx * 0.02;
    camera.lookAt(player.x, 1.1, -20);

}


/* =========================
   SCORE
========================= */

function updateScore(){

    score++;

    document.getElementById(
        "score"
    ).textContent =
        Math.floor(score / 10);

}


/* =========================
   SPEED
========================= */

function updateSpeed(){

    speed =
        5 +
        Math.floor(score / 500);

    document.getElementById(
        "speed"
    ).textContent =
        speed - 4;

}


/* =========================
   GAME LOOP
========================= */

function gameLoop(){

    if(
        !gameRunning ||
        gamePaused
    ){

        return;

    }

    const worldDelta = crashing ? 0 : speed * Z_PER_SPEED;

    if(!crashing){

        movePlayer();
        updateTraffic(worldDelta);
        updateTrees(worldDelta);
        spawnTraffic();

        roadTexture.offset.y -= worldDelta / ROAD_PLANE_LENGTH;

    }

    updateParticles();
    updateCamera();

    renderer.render(scene, camera);

    if(crashing){

        crashTimer++;

        const flashAlpha = Math.max(0, 0.55 - crashTimer * 0.07);
        crashFlashEl.style.opacity = flashAlpha;

        if(crashTimer >= CRASH_DURATION){

            crashing = false;
            gameOver();

        }

    } else {

        checkCollision();
        updateScore();
        updateSpeed();
        updateEngineSound(speed);

    }

    if(gameRunning){

        animationId =
            requestAnimationFrame(
                gameLoop
            );

    }

}


/* =========================
   START GAME
========================= */

function startGame(){

    initAudio();

    if(audioCtx.state === "suspended"){

        audioCtx.resume();

    }

    startEngineSound();

    gameRunning = true;

    gamePaused = false;

    score = 0;

    speed = 5;

    clearTraffic();

    clearParticles();

    spawnTimer = 0;

    crashing = false;

    crashTimer = 0;

    shakeMag = 0;

    crashFlashEl.style.opacity = 0;

    resetPlayer();

    applyPlayerCar();

    track("level_start", { mode: "endless", car: getSelectedCarId() });

    document.getElementById(
        "score"
    ).textContent = "0";

    document.getElementById(
        "speed"
    ).textContent = "1";

    document.getElementById(
        "startScreen"
    ).classList.add("hidden");

    document.getElementById(
        "gameOverScreen"
    ).classList.add("hidden");

    document.getElementById(
        "pauseBtn"
    ).classList.remove("hidden");

    document.getElementById(
        "muteBtn"
    ).classList.remove("hidden");

    document.getElementById(
        "controls"
    ).classList.remove("hidden");

    cancelAnimationFrame(
        animationId
    );

    gameLoop();

}


/* =========================
   GAME OVER
========================= */

function gameOver(){

    gameRunning = false;

    cancelAnimationFrame(
        animationId
    );

    crashFlashEl.style.opacity = 0;

    const finalScoreValue = Math.floor(score / 10);

    document.getElementById(
        "finalScore"
    ).textContent = finalScoreValue;

    const newBestMsgEl = document.getElementById("newBestMsg");

    if (finalScoreValue > getBest()) {

        setBest(finalScoreValue);

        newBestMsgEl.classList.remove("hidden");

    } else {

        newBestMsgEl.classList.add("hidden");

    }

    updateBestDisplays();

    renderCarPicker();

    track("game_over", { score: finalScoreValue, best: getBest(), car: getSelectedCarId() });

    document.getElementById(
        "gameOverScreen"
    ).classList.remove("hidden");

    document.getElementById(
        "pauseBtn"
    ).classList.add("hidden");

    document.getElementById(
        "muteBtn"
    ).classList.add("hidden");

    document.getElementById(
        "controls"
    ).classList.add("hidden");

    renderer.render(scene, camera);

}


/* =========================
   PAUSE
========================= */

function togglePause(){

    if(!gameRunning)
        return;

    gamePaused =
        !gamePaused;

    const btn =
        document.getElementById(
            "pauseBtn"
        );

    if(gamePaused){

        btn.textContent =
            "▶️ Resume";

        setEngineMuted(true);

    }else{

        btn.textContent =
            "⏸️ Pause";

        setEngineMuted(false);

        gameLoop();

    }

}


/* =========================
   MUTE TOGGLE
========================= */

function toggleMute(){

    soundMuted = !soundMuted;

    const btn = document.getElementById("muteBtn");

    if(soundMuted){

        btn.textContent = "🔇 Muted";

        if(engineStarted && audioCtx){

            engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);

        }

    }else{

        btn.textContent = "🔊 Sound";

        if(engineStarted && audioCtx && !gamePaused){

            engineGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.05);

        }

    }

}


document.getElementById(
    "muteBtn"
).addEventListener(
    "click",
    toggleMute
);


/* =========================
   KEYBOARD CONTROL
========================= */

document.addEventListener(
    "keydown",
    e => {

        if(e.key === "ArrowLeft"){

            moveLeft = true;

        }

        if(e.key === "ArrowRight"){

            moveRight = true;

        }

        if(e.key === " "){

            e.preventDefault();

            togglePause();

        }

    }
);


document.addEventListener(
    "keyup",
    e => {

        if(e.key === "ArrowLeft"){

            moveLeft = false;

        }

        if(e.key === "ArrowRight"){

            moveRight = false;

        }

    }
);


/* =========================
   MOBILE CONTROL
========================= */

function buttonControl(
    button,
    direction
){

    button.addEventListener(
        "touchstart",
        e => {

            e.preventDefault();

            if(direction === "left")
                moveLeft = true;

            if(direction === "right")
                moveRight = true;

        }
    );

    button.addEventListener(
        "touchend",
        e => {

            e.preventDefault();

            if(direction === "left")
                moveLeft = false;

            if(direction === "right")
                moveRight = false;

        }
    );

    /* Also supports mouse */

    button.addEventListener(
        "mousedown",
        () => {

            if(direction === "left")
                moveLeft = true;

            if(direction === "right")
                moveRight = true;

        }
    );

    button.addEventListener(
        "mouseup",
        () => {

            if(direction === "left")
                moveLeft = false;

            if(direction === "right")
                moveRight = false;

        }
    );

}


buttonControl(
    document.getElementById(
        "leftBtn"
    ),
    "left"
);


buttonControl(
    document.getElementById(
        "rightBtn"
    ),
    "right"
);


/* =========================
   BUTTONS
========================= */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "restartBtn"
).addEventListener(
    "click",
    startGame
);


document.getElementById(
    "pauseBtn"
).addEventListener(
    "click",
    togglePause
);


/* =========================
   INITIAL SCENE + DRAW
========================= */

initThree();

buildPlayerMesh();

updateBestDisplays();

renderCarPicker();

applyPlayerCar();

resetPlayer();

updateCamera();

renderer.render(scene, camera);

</script>
