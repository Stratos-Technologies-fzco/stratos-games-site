<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind Match</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0f;
    color: #f5f5f5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 100%;
    padding: 1.25rem;
    gap: 1rem;
  }
  h1 {
    font-size: clamp(1.8rem, 7vw, 2.6rem);
    margin: 0;
    letter-spacing: 0.02em;
  }
  .by {
    font-size: 0.95rem;
    color: #a0a0b0;
    margin: 0 0 0.25rem;
  }
  .hud {
    display: flex;
    gap: 1.5rem;
    font-size: 0.95rem;
    color: #c8c8d6;
  }
  .hud b { color: #fff; font-size: 1.1rem; }
  .board {
    display: grid;
    grid-template-columns: repeat(3, minmax(64px, 22vw));
    grid-template-rows: repeat(3, minmax(64px, 22vw));
    gap: 10px;
    margin: 0.5rem 0;
  }
  .tile {
    width: 100%;
    height: 100%;
    max-width: 110px;
    max-height: 110px;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    background: hsl(calc(var(--i) * 40), 55%, 22%);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.06);
    transition: transform 0.08s ease, filter 0.12s ease, box-shadow 0.12s ease;
    outline: none;
  }
  .tile:active { transform: scale(0.95); }
  .tile.lit {
    filter: brightness(1.9) saturate(1.3);
    box-shadow: 0 0 24px hsl(calc(var(--i) * 40), 85%, 60%), inset 0 0 0 2px rgba(255,255,255,0.25);
    transform: scale(1.04);
  }
  .tile.wrong {
    filter: brightness(1.6);
    background: #c0304a !important;
    box-shadow: 0 0 24px #ff4d6d;
  }
  .tile:disabled { cursor: default; }
  .panel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
  }
  .overlay {
    position: absolute;
    inset: -12px;
    background: rgba(10,10,15,0.88);
    backdrop-filter: blur(2px);
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    padding: 1.5rem;
    text-align: center;
  }
  .overlay h2 { margin: 0; font-size: 1.4rem; }
  .overlay p { margin: 0; color: #b8b8c4; font-size: 0.92rem; max-width: 260px; }
  .btn {
    background: #6c4df0;
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 0.7rem 1.6rem;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.08s ease;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.97); }
  .hint { font-size: 0.8rem; color: #6a6a7a; margin-top: 0.25rem; }
</style>
</head>
<body>
  <p class="by">by Mohammad Sadee</p>
  <h1>Mind Match</h1>
  <div class="hud">
    <div>Level <b id="level">0</b></div>
    <div>Best <b id="best">0</b></div>
  </div>
  <div class="panel">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay">
      <h2>Watch, then repeat</h2>
      <p>The tiles will flash a pattern. Tap them back in the same order. Each round adds one more step.</p>
      <button class="btn" id="startBtn">Play</button>
    </div>
  </div>
  <p class="hint">Tap the tiles, or use keys 1-9</p>

<script>
(function () {
  "use strict";
  var N = 9;
  var board = document.getElementById("board");
  var overlay = document.getElementById("overlay");
  var startBtn = document.getElementById("startBtn");
  var levelEl = document.getElementById("level");
  var bestEl = document.getElementById("best");

  var tiles = [];
  for (var i = 0; i < N; i++) {
    var t = document.createElement("button");
    t.className = "tile";
    t.style.setProperty("--i", i);
    t.dataset.i = i;
    t.setAttribute("aria-label", "Tile " + (i + 1));
    board.appendChild(t);
    tiles.push(t);
  }

  var BEST_KEY = "mindmatch_best";
  var best = parseInt(localStorage.getItem(BEST_KEY) || "0", 10) || 0;
  bestEl.textContent = best;

  var sequence = [];
  var playerStep = 0;
  var state = "idle"; // idle | showing | input | gameover
  var audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function beep(index, ok) {
    if (!audioCtx) return;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    var freq = ok === false ? 110 : 220 + index * 45;
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.value = 0.001;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    var now = audioCtx.currentTime;
    gain.gain.exponentialRampToValueAtTime(0.18, now + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, now + (ok === false ? 0.35 : 0.18));
    osc.start(now);
    osc.stop(now + (ok === false ? 0.36 : 0.2));
  }

  function randomTile() {
    return Math.floor(Math.random() * N);
  }

  function setTilesEnabled(enabled) {
    for (var i = 0; i < tiles.length; i++) tiles[i].disabled = !enabled;
  }

  function lightTile(i, dur, cb) {
    tiles[i].classList.add("lit");
    beep(i);
    setTimeout(function () {
      tiles[i].classList.remove("lit");
      if (cb) setTimeout(cb, Math.max(90, dur * 0.35));
    }, dur);
  }

  function flashWrong(i, cb) {
    tiles[i].classList.add("wrong");
    beep(i, false);
    setTimeout(function () {
      tiles[i].classList.remove("wrong");
      if (cb) cb();
    }, 420);
  }

  function stepDuration() {
    return Math.max(260, 620 - sequence.length * 18);
  }

  function playSequence() {
    state = "showing";
    setTilesEnabled(false);
    var idx = 0;
    var dur = stepDuration();
    function step() {
      if (idx >= sequence.length) {
        state = "input";
        playerStep = 0;
        setTilesEnabled(true);
        return;
      }
      lightTile(sequence[idx], dur, function () {
        idx++;
        step();
      });
    }
    setTimeout(step, 400);
  }

  function nextRound() {
    sequence.push(randomTile());
    levelEl.textContent = sequence.length;
    playSequence();
  }

  function startGame() {
    ensureAudio();
    sequence = [];
    playerStep = 0;
    overlay.style.display = "none";
    nextRound();
  }

  function gameOver() {
    state = "gameover";
    setTilesEnabled(false);
    var score = sequence.length - 1;
    if (score > best) {
      best = score;
      localStorage.setItem(BEST_KEY, String(best));
    }
    bestEl.textContent = best;
    overlay.innerHTML =
      "<h2>Round over</h2>" +
      "<p>You reached level " + score + ". Best: " + best + ".</p>" +
      '<button class="btn" id="startBtn">Play again</button>';
    overlay.style.display = "flex";
    document.getElementById("startBtn").addEventListener("click", startGame);
  }

  function handleTap(i) {
    if (state !== "input") return;
    ensureAudio();
    var expected = sequence[playerStep];
    if (i === expected) {
      tiles[i].classList.add("lit");
      beep(i);
      setTimeout(function () { tiles[i].classList.remove("lit"); }, 160);
      playerStep++;
      if (playerStep >= sequence.length) {
        state = "showing";
        setTilesEnabled(false);
        setTimeout(nextRound, 600);
      }
    } else {
      setTilesEnabled(false);
      flashWrong(i, gameOver);
    }
  }

  tiles.forEach(function (t) {
    t.addEventListener("click", function () {
      handleTap(parseInt(t.dataset.i, 10));
    });
  });

  document.addEventListener("keydown", function (e) {
    var n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) handleTap(n - 1);
  });

  startBtn.addEventListener("click", startGame);
})();
</script>
</body>
</html>
