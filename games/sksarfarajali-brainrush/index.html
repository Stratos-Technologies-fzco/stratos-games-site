  <script id="sg-stratos-analytics">
  /* Stratos analytics (added Nov 2026 on Sahariar's OK so the game can stay live on stratos.games; the game code is untouched).
     level_start: a puzzle run opens (the game's "screen play" appears).
     level_complete: the game saves a finished run (a new daily result in "sessions", or one more practice round). */
  (function () {
    function track(name, details) { try { var S = window.Stratos || parent.Stratos; if (S) S.track(name, details); } catch (e) {} }
    var KEY = 'brainrush:v1';
    function tally(json) {
      var d = {}; try { d = JSON.parse(json || '{}') || {}; } catch (e) {}
      var s = d.sessions || {}, p = d.practice || {}, daily = 0, practice = 0, last = null;
      Object.keys(s).forEach(function (k) { var x = s[k]; if (x && x.completedAt) { daily++; if (!last || x.completedAt > last.completedAt) last = x; } });
      Object.keys(p).forEach(function (k) { practice += (p[k] && p[k].rounds) || 0; });
      return { daily: daily, practice: practice, last: last };
    }
    var seen; try { seen = tally(localStorage.getItem(KEY)); } catch (e) { seen = tally(null); }
    try {
      var setItem = Storage.prototype.setItem;
      Storage.prototype.setItem = function (k, v) {
        var out = setItem.apply(this, arguments);   // the game's own save happens first, exactly as before
        try {
          if (k === KEY && this === window.localStorage) {
            var now = tally(v);
            if (now.daily > seen.daily) track('level_complete', { mode: 'daily', score: now.last && now.last.score, accuracy: now.last && now.last.accuracy });
            if (now.practice > seen.practice) track('level_complete', { mode: 'practice' });
            seen = now;
          }
        } catch (e) {}
        return out;
      };
    } catch (e) {}
    function watch() {
      new MutationObserver(function (ms) {
        ms.forEach(function (m) { [].forEach.call(m.addedNodes, function (n) {
          if (n.nodeType === 1 && (n.matches('.screen.play') || n.querySelector('.screen.play'))) track('level_start');
        }); });
      }).observe(document.body, { childList: true, subtree: true });
    }
    if (document.body) watch(); else document.addEventListener('DOMContentLoaded', watch);
  })();
  </script>

<script type="application/json" id="sx-about-data">{"title":"BrainRush Daily","maker":"Sk Sarfaraj Ali","description":"BrainRush Daily gives you three short brain puzzles every day: a Pattern, a Sudoku and a Logic puzzle. Everyone gets the same ones on the same day, so you can compare with friends. There is no sign-up, and the game remembers where you stopped.\n\nWhen you want more, open the Play tab. There you will find endless quick rounds: count the shapes, tap numbers from smallest to biggest or biggest to smallest, and find the one that does not belong. You will also find Gem Match, a 30-level puzzle where you swap neighbouring gems to line up three or more before your moves run out. Match four to make a blaster, and match five to make a bomb.\n\nEach puzzle takes only a minute or two, so it fits into a break, a bus ride or a quiet evening. It is made for anyone who likes to keep their mind sharp, from school kids to grown-ups. If you fail a level, nothing is lost, and the next board is a little different.","controls":["Tap to answer the daily Pattern, Sudoku and Logic puzzles.","Gem Match: swap two neighbouring gems to match three or more.","Number rounds: tap the numbers in order, as the question asks.","Count and odd-one-out rounds: tap your answer."],"tips":["Do the three daily puzzles first. They change every day.","In Gem Match, watch your moves left and plan ahead. A match of four makes a blaster, and five makes a bomb.","Lost a level? Just try again. Every board is a little different."],"story":""}</script>
<script>(function(){
var btn=document.getElementById('sx-about-btn'),ov=document.getElementById('sx-about'),card=ov.querySelector('.sx-card'),x=ov.querySelector('.sx-x');
var d=JSON.parse(document.getElementById('sx-about-data').textContent);
function el(t,txt){var e=document.createElement(t);if(txt)e.textContent=txt;return e;}
function list(h,a){if(!a||!a.length)return;card.appendChild(el('h3',h));var u=el('ul');a.forEach(function(s){u.appendChild(el('li',s));});card.appendChild(u);}
var h=el('h2','About '+d.title);h.id='sx-about-t';card.appendChild(h);
String(d.description||'').split(/\n\s*\n/).forEach(function(p){if(p.trim())card.appendChild(el('p',p.trim()));});
list('Controls',d.controls);list('Tips',d.tips);
if(d.story){card.appendChild(el('h3','From the maker'));String(d.story).split(/\n\s*\n/).forEach(function(p){if(p.trim())card.appendChild(el('p',p.trim()));});}
card.appendChild(el('p','Made by '+d.maker+'.')).style.marginTop='12px';
var last=null;
function open(){last=document.activeElement;ov.hidden=false;card.scrollTop=0;x.focus();}
function close(){ov.hidden=true;if(btn)btn.blur();try{if(last&&last.focus&&last!==btn)last.focus();}catch(e){}}
btn.addEventListener('click',function(e){e.stopPropagation();open();});
['pointerdown','mousedown','touchstart','keydown','keyup'].forEach(function(n){btn.addEventListener(n,function(e){e.stopPropagation();});});
x.addEventListener('click',close);
ov.addEventListener('click',function(e){if(e.target===ov)close();});
['keydown','keyup','keypress'].forEach(function(n){window.addEventListener(n,function(e){if(ov.hidden)return;if(n==='keydown'&&e.key==='Escape')close();if(e.key==='Tab'){return;}e.stopPropagation();},true);});
['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','wheel'].forEach(function(n){ov.addEventListener(n,function(e){e.stopPropagation();},{passive:true});});
})();</script>
