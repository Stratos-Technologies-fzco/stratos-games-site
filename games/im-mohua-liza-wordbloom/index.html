<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wordbloom: Word Journey</title>
<meta name="theme-color" content="#2a1440">
<style>
@font-face{font-family:Bungee;src:url(fonts/bungee.woff2) format('woff2');font-display:swap}
@font-face{font-family:Outfit;src:url(fonts/outfit.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--acc:#ff5d8f;--acc2:#ff9a5c;--deep:#7a2350;--ws:300px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#2a1440;font-family:Outfit,system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;display:block}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;display:block}
.screen{position:fixed;inset:0;display:none;z-index:2;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex}
.coin{display:inline-block;width:1.05em;height:1.05em;border-radius:50%;vertical-align:-.16em;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffd23f 40%,#e59a00 75%,#b86e00);box-shadow:inset 0 0 0 .08em #c98200}
.pill{display:flex;align-items:center;gap:7px;background:rgba(20,8,40,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.28);border-radius:99px;padding:6px 14px 6px 8px;font-weight:800;font-size:17px;min-height:40px}
.pill .coin{width:24px;height:24px}
.rbtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(20,8,40,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.28);transition:transform .12s}
.rbtn:active{transform:scale(.9)}
.big{font-family:Bungee,Outfit,sans-serif;font-size:24px;letter-spacing:.5px;padding:16px 40px 18px;border-radius:22px;background:linear-gradient(180deg,var(--acc2),var(--acc));box-shadow:0 7px 0 var(--deep),0 12px 26px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(0,0,0,.18);transition:transform .1s,box-shadow .1s;position:relative}
.big:active{transform:translateY(5px);box-shadow:0 2px 0 var(--deep),0 6px 14px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.45)}
.big small{display:block;font-family:Outfit;font-size:14px;font-weight:700;opacity:.92;letter-spacing:0}
.ghost{font-weight:800;font-size:17px;padding:13px 22px;border-radius:16px;background:rgba(255,255,255,.18);border:1.5px solid rgba(255,255,255,.4)}
.ghost:active{transform:scale(.96)}

/* ---------- home ---------- */
#home{flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
#home .tl{position:absolute;top:calc(14px + env(safe-area-inset-top));left:14px;display:flex;gap:10px}
#home .tr{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px}
#logo{display:flex;gap:min(1vw,8px);justify-content:center;flex-wrap:nowrap;margin-bottom:4px}
#logo span{font-family:Bungee;font-size:min(8.2vw,64px);width:1.12em;height:1.18em;display:grid;place-items:center;border-radius:.2em;color:#fff;background:linear-gradient(180deg,var(--acc2),var(--acc));box-shadow:0 .09em 0 var(--deep),0 .2em .4em rgba(0,0,0,.3),inset 0 .05em 0 rgba(255,255,255,.5);animation:bob 2.6s ease-in-out infinite;text-shadow:0 .04em 0 rgba(0,0,0,.2)}
#logo span:nth-child(even){background:#fff;color:var(--acc);box-shadow:0 .09em 0 rgba(0,0,0,.18),0 .2em .4em rgba(0,0,0,.3)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.12em) rotate(2deg)}}
#tag{font-weight:700;font-size:17px;opacity:.95;text-shadow:0 2px 8px rgba(0,0,0,.45);margin-bottom:6px}
#homeWorld{font-weight:800;font-size:15px;letter-spacing:2px;text-transform:uppercase;background:rgba(20,8,40,.35);border-radius:99px;padding:6px 16px;backdrop-filter:blur(6px)}
#homeRow{display:flex;gap:14px;margin-top:6px}
.hb{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.5);position:relative}
.hb .rbtn{width:62px;height:62px}
.hb .rbtn svg{width:28px;height:28px}
.badge{position:absolute;top:-4px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3d5a;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 6px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.badge.ok{background:#2fc77a}
#homeStats{font-size:14px;font-weight:600;opacity:.9;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* ---------- map ---------- */
#map{flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:68px}
.bar h2{flex:1;font-family:Bungee;font-size:20px;text-shadow:0 2px 8px rgba(0,0,0,.4);text-align:center}
#worlds{flex:1;overflow-y:auto;padding:4px 16px 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;align-content:start;touch-action:pan-y}
.wc{border-radius:20px;padding:16px;text-align:left;position:relative;overflow:hidden;min-height:118px;box-shadow:0 8px 22px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.35)}
.wc h3{font-family:Bungee;font-size:19px;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.wc p{font-weight:700;font-size:14px;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.wc .bar2{height:8px;border-radius:4px;background:rgba(0,0,0,.25);margin-top:12px;overflow:hidden}
.wc .bar2 i{display:block;height:100%;background:#fff;border-radius:4px}
.wc.lock{filter:grayscale(.85) brightness(.7)}
.wc.lock::after{content:'🔒';position:absolute;right:14px;top:12px;font-size:24px}
#lvls{flex:1;overflow-y:auto;padding:6px 18px 24px;display:none;grid-template-columns:repeat(5,1fr);gap:12px;align-content:start;max-width:520px;margin:0 auto;width:100%;touch-action:pan-y}
.lv{aspect-ratio:1;border-radius:18px;font-family:Bungee;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.9);color:var(--acc);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.lv small{font-family:Outfit;font-size:11px;color:#ffb400;letter-spacing:-1px}
.lv.cur{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;box-shadow:0 5px 0 var(--deep);animation:pulse 1.4s infinite}
.lv.lock{background:rgba(20,8,40,.4);color:rgba(255,255,255,.45);box-shadow:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

/* ---------- game ---------- */
#game{display:none;grid-template-rows:auto 1fr auto auto;grid-template-columns:1fr;grid-template-areas:'top' 'board' 'word' 'ctl'}
#game.on{display:grid}
#top{grid-area:top;display:flex;align-items:center;gap:10px;padding:10px 12px 4px}
#lvlInfo{flex:1;text-align:center;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.5)}
#lvlInfo b{font-family:Bungee;font-size:18px;display:block}
#lvlInfo span{font-size:13px;font-weight:700;opacity:.95}
#boardWrap{grid-area:board;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding:6px 10px}
#board{position:relative;padding:0}
#boardPanel{position:absolute;border-radius:22px;background:rgba(20,8,40,.22);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);border:1.5px solid rgba(255,255,255,.18)}
.cell{position:absolute;border-radius:22%;background:rgba(255,255,255,.92);box-shadow:0 3px 0 rgba(0,0,0,.14),inset 0 -2px 0 rgba(0,0,0,.05);display:grid;place-items:center;font-family:Bungee;color:#fff;transition:background .25s}
.cell.on{background:linear-gradient(180deg,var(--acc2),var(--acc));box-shadow:0 3px 0 var(--deep);text-shadow:0 2px 0 rgba(0,0,0,.18)}
.cell.hint{background:linear-gradient(180deg,#fff,#ffe9a8);color:var(--acc);box-shadow:0 3px 0 #e2b84a}
.cell.pop{animation:pop .42s cubic-bezier(.3,1.6,.5,1)}
.cell.glow{animation:glow .6s ease 2}
.cell.aim{animation:aim 1s ease-in-out infinite;cursor:pointer}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
@keyframes glow{50%{transform:scale(1.15);filter:brightness(1.3)}}
@keyframes aim{50%{box-shadow:0 0 0 4px #fff,0 0 18px 6px #ffe066}}
.fly{position:fixed;left:0;top:0;z-index:55;display:grid;place-items:center;font-family:Bungee;color:#fff;border-radius:22%;background:linear-gradient(180deg,var(--acc2),var(--acc));pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3)}
#wordRow{grid-area:word;height:52px;display:flex;align-items:center;justify-content:center;position:relative}
#word{display:flex;gap:4px;padding:6px 12px;border-radius:16px;min-height:44px;align-items:center;transition:background .2s}
#word.has{background:linear-gradient(180deg,var(--acc2),var(--acc));box-shadow:0 4px 0 var(--deep),0 6px 18px rgba(0,0,0,.25)}
#word span{font-family:Bungee;font-size:26px;width:26px;text-align:center;animation:pop .2s}
#word.bad{background:#ff4b5c;box-shadow:0 4px 0 #a3162a;animation:shake .4s}
#word.dup{background:#7d8bff;box-shadow:0 4px 0 #3a43a8}
#word.bonus{background:linear-gradient(180deg,#ffe36b,#ffb400);box-shadow:0 4px 0 #b06d00}
#word.ok{background:linear-gradient(180deg,#5fe3a1,#20b56b);box-shadow:0 4px 0 #0e7a43}
#word.short{background:rgba(20,8,40,.5);box-shadow:none}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#ctl{grid-area:ctl;display:flex;align-items:center;justify-content:center;gap:clamp(6px,3vw,26px);padding:0 10px calc(14px + env(safe-area-inset-bottom))}
.side{display:flex;flex-direction:column;gap:14px}
.tool{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.92);color:var(--acc);box-shadow:0 4px 0 rgba(0,0,0,.2),0 8px 16px rgba(0,0,0,.2);transition:transform .1s}
.tool:active{transform:scale(.9)}
.tool svg{width:28px;height:28px}
.tool small{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:#2a1440;color:#ffd23f;border-radius:99px;font-weight:900;font-size:12px;padding:1px 7px;white-space:nowrap;display:flex;align-items:center;gap:3px;border:1.5px solid rgba(255,255,255,.3)}
.tool small .coin{width:11px;height:11px}
.tool.armed{background:linear-gradient(180deg,#ffe36b,#ffb400);color:#fff;animation:pulse 1s infinite}
.tool.nudge{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg) scale(1.08)}40%{transform:rotate(12deg) scale(1.08)}60%{transform:rotate(0)}}
#jarFill{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 29px 29px;background:linear-gradient(180deg,#ffe36b,#ffb400);opacity:.55;transition:height .4s}
#bJar{overflow:visible}
#bJar .jw{position:absolute;inset:0;border-radius:50%;overflow:hidden}
#bJar svg{position:relative}
#wheel{width:var(--ws);height:var(--ws);border-radius:50%;position:relative;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,.95),rgba(255,255,255,.78));box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 -6px 0 rgba(0,0,0,.06);touch-action:none;flex:none}
#wl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.lt{position:absolute;border-radius:50%;display:grid;place-items:center;font-family:Bungee;color:var(--acc);transition:left .35s cubic-bezier(.5,0,.3,1.3),top .35s cubic-bezier(.5,0,.3,1.3),transform .12s,background .12s;transform:translate(-50%,-50%);pointer-events:none}
.lt.sel{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 3px 0 var(--deep)}
#bShuf{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22%;height:22%;border-radius:50%;display:grid;place-items:center;color:var(--acc);opacity:.75}
#bShuf:active{transform:translate(-50%,-50%) rotate(-120deg)}
#bShuf svg{width:60%;height:60%}
.praise{position:fixed;z-index:58;font-family:Bungee;font-size:clamp(28px,8vw,52px);color:#fff;pointer-events:none;text-shadow:0 4px 0 var(--deep),0 8px 24px rgba(0,0,0,.4);white-space:nowrap;transform:translate(-50%,-50%)}
#tut{position:absolute;inset:0;pointer-events:none;z-index:5}
#tutTxt{position:fixed;left:50%;transform:translateX(-50%);z-index:57;background:rgba(20,8,40,.75);padding:10px 18px;border-radius:14px;font-weight:800;font-size:16px;white-space:nowrap;pointer-events:none}
#hand{position:absolute;width:44px;height:44px;margin:-6px 0 0 -14px;font-size:40px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}

/* landscape */
@media (orientation:landscape) and (min-aspect-ratio:6/5){
 #game{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto 1fr auto;grid-template-areas:'top top' 'board word' 'board ctl'}
 #wordRow{align-self:end}
 #ctl{padding-bottom:calc(18px + env(safe-area-inset-bottom));padding-right:22px;align-self:start}
}

/* ---------- modals ---------- */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(15,5,30,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:20px}
.ov.on{display:flex}
.card{background:linear-gradient(180deg,#fff,#fff3f7);color:#3a1f4d;border-radius:28px;padding:26px 22px 24px;width:min(380px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45);animation:cardIn .4s cubic-bezier(.3,1.5,.5,1);max-height:calc(100vh - 40px);overflow-y:auto;touch-action:pan-y}
@keyframes cardIn{from{transform:scale(.6) translateY(40px);opacity:0}}
.card h2{font-family:Bungee;font-size:26px;color:var(--acc);margin-bottom:6px}
.card p{font-weight:600;font-size:16px;line-height:1.4;margin:8px 0}
.card .row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.card .big{color:#fff}
.card .ghost{background:#f3e7f6;border-color:#e2cbe9;color:#5a3470}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.stars i{font-style:normal;font-size:52px;color:#e6d8ee;transition:transform .3s;display:inline-block}
.stars i.on{color:#ffc21a;text-shadow:0 3px 0 #d58a00;animation:starIn .5s cubic-bezier(.3,1.8,.5,1) both}
.stars i:nth-child(2){font-size:64px;transform:translateY(-8px)}
.stars i.on:nth-child(2){animation-name:starIn2}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
@keyframes starIn2{from{transform:translateY(-8px) scale(0) rotate(-90deg)}to{transform:translateY(-8px)}}
.gain{font-family:Bungee;font-size:30px;color:#e08a00;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.gain .coin{width:30px;height:30px}
.sub{font-size:14px;color:#8a6a99;font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1.5px solid #f0e2f3;font-weight:800;font-size:17px}
.sw{width:56px;height:32px;border-radius:16px;background:#d8c8de;position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s}
.sw.on{background:var(--acc)}
.sw.on::after{left:27px}
.statg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.statg div{background:#f6edf8;border-radius:14px;padding:10px 6px;font-size:13px;font-weight:700;color:#8a6a99}
.statg b{display:block;font-family:Bungee;font-size:22px;color:var(--acc)}
.howl{text-align:left;font-weight:600;font-size:15px;line-height:1.45}
.howl li{margin:8px 0 8px 18px}
.bwl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0;max-height:150px;overflow-y:auto}
.bwl span{background:#fff1c2;color:#a86400;border-radius:8px;padding:4px 9px;font-weight:800;text-transform:uppercase;font-size:14px}
#worldIntro{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
#worldIntro.on{display:flex}
#worldIntro small{font-weight:800;letter-spacing:4px;font-size:15px;text-transform:uppercase;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#worldIntro h1{font-family:Bungee;font-size:clamp(34px,10vw,72px);text-shadow:0 5px 0 var(--deep),0 10px 40px rgba(0,0,0,.5);animation:wi 2.8s ease both}
@keyframes wi{0%{opacity:0;transform:scale(.7);letter-spacing:20px}20%{opacity:1;transform:scale(1);letter-spacing:2px}80%{opacity:1}100%{opacity:0;transform:scale(1.08)}}
#toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);z-index:70;background:rgba(20,8,40,.85);padding:10px 18px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<!-- HOME -->
<section class="screen" id="home">
  <div class="tl"><button class="rbtn" id="hSet" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-1.8-.3 1.6 1.6 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.6 1.6 0 00-1-1.5 1.6 1.6 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00.3-1.8 1.6 1.6 0 00-1.5-1H3a2 2 0 110-4h.1a1.6 1.6 0 001.5-1 1.6 1.6 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 001.8.3H9a1.6 1.6 0 001-1.5V3a2 2 0 114 0v.1a1.6 1.6 0 001 1.5 1.6 1.6 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 00-.3 1.8V9a1.6 1.6 0 001.5 1H21a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/></svg></button></div>
  <div class="tr"><div class="pill"><i class="coin"></i><span class="coins">0</span></div></div>
  <div id="logo"></div>
  <div id="tag">Swipe letters. Fill the grid. Travel the world.</div>
  <div id="homeWorld">Blossom Valley</div>
  <button class="big" id="bPlay">PLAY<small id="playSub">Level 1</small></button>
  <div id="homeRow">
    <button class="hb" id="hDaily"><span class="rbtn"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg></span>Daily<span class="badge" id="dBadge">!</span></button>
    <button class="hb" id="hMap"><span class="rbtn"><svg class="i" viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg></span>Worlds</button>
    <button class="hb" id="hHow"><span class="rbtn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 114 2c-1 .6-1.5 1.2-1.5 2.2M12 17h.01"/></svg></span>How to</button>
  </div>
  <div id="homeStats"></div>
</section>

<!-- MAP -->
<section class="screen" id="map">
  <div class="bar"><button class="rbtn" id="mBack" aria-label="Back"><svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="mTitle">Worlds</h2><div class="pill"><i class="coin"></i><span class="coins">0</span></div></div>
  <div id="worlds"></div>
  <div id="lvls"></div>
</section>

<!-- GAME -->
<section class="screen" id="game">
  <div id="top">
    <button class="rbtn" id="gHome" aria-label="Home"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg></button>
    <div id="lvlInfo"><b id="gTitle">Level 1</b><span id="gSub">0 / 3 words</span></div>
    <div class="pill"><i class="coin"></i><span class="coins">0</span></div>
  </div>
  <div id="boardWrap"><div id="boardPanel"></div><div id="board"></div></div>

$('#wNext').onclick = () => {
  $('#ovWin').classList.remove('on'); audio();
  if (mode === 'daily') { renderHome(); return; }
  if (curIdx + 1 >= LEVELS.length) { modal('You did it!', '<p>You finished all 200 levels in all 8 worlds. Amazing!</p><p class="sub">Replay any level for more stars, and keep your Daily streak going. New worlds are coming.</p>', [['Home', renderHome, 'big']]); return; }
  startLevel(curIdx + 1);
};
function worldIntro(wi) { $('#wiN').textContent = 'World ' + (wi + 1); $('#wiT').textContent = WORLDS[wi].name; const o = $('#worldIntro'); o.classList.remove('on'); void o.offsetWidth; o.classList.add('on'); setTimeout(() => o.classList.remove('on'), 2900); }

// ======================= SETTINGS / HOW TO =======================
function renderSettings() {
  $('#tSound').classList.toggle('on', S.sound); $('#tMusic').classList.toggle('on', S.music); $('#tVib').classList.toggle('on', S.vib);
  const st = S.stars.reduce((a, b) => a + (b || 0), 0);
  $('#statg').innerHTML = `<div><b>${S.stats.levels}</b>levels</div><div><b>${st}</b>stars</div><div><b>${S.stats.words}</b>words</div><div><b>${S.stats.bonus}</b>bonus words</div><div><b>${S.stats.combo}</b>best combo</div><div><b>${S.daily.best}</b>best streak</div>`;
  resetArm = false; $('#sReset').textContent = 'Reset progress';
  $('#ovSet').classList.add('on');
}
function toggleSound() { S.sound = !S.sound; audio(); if (sfxBus) sfxBus.gain.value = S.sound ? 1 : 0; save(); renderSettings(); } // mute / unmute effects
$('#tSound').onclick = toggleSound;
$('#tMusic').onclick = () => { S.music = !S.music; audio(); if (musicBus) musicBus.gain.value = S.music ? .55 : 0; save(); renderSettings(); };
$('#tVib').onclick = () => { S.vib = !S.vib; save(); renderSettings(); vib(30); };
let resetArm = false;
$('#sReset').onclick = () => { if (!resetArm) { resetArm = true; $('#sReset').textContent = 'Tap again to erase all'; return; } try { localStorage.removeItem(SAVE_KEY); } catch (e) { } location.reload(); };
$('#sClose').onclick = () => $('#ovSet').classList.remove('on');
function howTo() {
  modal('How to play', `<ol class="howl">
  <li><b>Swipe</b> across the letters in the circle to spell a word, then let go. On a keyboard, just type it and press Enter.</li>
  <li>Words that fit the <b>crossword grid</b> fly into place. Fill every square to clear the level.</li>
  <li>Real words that are not in the grid are <b>bonus words</b>. Ten of them fill the jar for 30 coins.</li>
  <li>Find words quickly one after another for a <b>combo</b> and extra coins.</li>
  <li>Stuck? <b>Shuffle</b> (centre, free), <b>Hint</b> shows a letter, <b>Spark</b> shows the square you tap, <b>Bloom</b> shows 5 letters.</li>
  <li>No hints = <b>3 stars</b>. Play the <b>Daily Puzzle</b> every day to build your streak.</li></ol>`, [['Got it', null, 'big']]);
}

// ======================= WIRING =======================
$('#bPlay').onclick = () => { audio(); startLevel(Math.min(S.lvl, LEVELS.length - 1)); };
$('#hDaily').onclick = () => { audio(); startDaily(); };
$('#hMap').onclick = () => { audio(); renderMap(); };
$('#hHow').onclick = () => { audio(); howTo(); };
$('#hSet').onclick = () => { audio(); renderSettings(); };
$('#mBack').onclick = () => { if (mapWorld >= 0) renderMap(); else renderHome(); };
$('#gHome').onclick = () => { setArmed(false); clearTimeout(idleT); renderHome(); };
document.addEventListener('visibilitychange', () => { if (AC) document.hidden ? AC.suspend() : AC.resume(); });
document.addEventListener('contextmenu', e => e.preventDefault());

bgResize(); setWorld(worldOf(Math.min(S.lvl, LEVELS.length - 1)), true); statics = {}; requestAnimationFrame(bgLoop);
renderHome();
if (!S.lvl && !S.stats.words) track('game_open', { first: true });
// test hook
window.__wb = { S, get P() { return P; }, submitWord(w) { sel = []; for (const ch of w) { const L = letters.find(L => L.ch === ch && !sel.includes(L.i)); if (!L) return false; sel.push(L.i); } submit(); return true; }, startLevel, startDaily, setWorld, renderMap, win: () => win() };
</script>
</body>
</html>
