<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missing Minutes — A Detective Puzzle Game</title>
<meta name="description" content="A beginner-friendly detective puzzle game. Investigate, rebuild the timeline, and catch the culprit across 3 cases.">
<style>
  /* ============================================================
     COLOR THEME
     All colors live here as CSS variables, so the whole look can
     be changed by editing just this block.
  ============================================================ */
  :root{
    --bg-0:#0f1117;
    --bg-1:#171a24;
    --bg-2:#1e2230;
    --panel:#20242f;
    --line:#343a4a;
    --ink:#e6e2d6;
    --ink-dim:#a7a6ad;
    --amber:#e0b256;
    --amber-dim:#8a6f3a;
    --red:#c0564f;
    --green:#6f9e6a;
    --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top, rgba(224,178,86,0.07), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, var(--bg-0));
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    display:flex;
    justify-content:center;
    padding: 24px 14px 60px;
  }

  #app{ width:100%; max-width:900px; }

  header.top{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    border-bottom:1px solid var(--line);
    padding-bottom:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .brand h1{
    font-family: 'Courier New', Courier, monospace;
    letter-spacing:2px;
    font-size:1.7rem;
    margin:0 0 4px;
    color:var(--amber);
    text-transform:uppercase;
  }
  .brand p{ margin:0; color:var(--ink-dim); font-size:0.85rem; font-style:italic; }

  .topbtns{ display:flex; gap:8px; flex-wrap:wrap; }

  button{
    font-family: 'Courier New', Courier, monospace;
    background:var(--panel);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 14px;
    cursor:pointer;
    font-size:0.85rem;
    letter-spacing:0.5px;
  }
  button:hover{ border-color:var(--amber-dim); color:var(--amber); }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  button.primary{
    background:linear-gradient(180deg, #2a2f3d, #20242f);
    border-color:var(--amber-dim);
    color:var(--amber);
  }
  button.primary:hover{ background:linear-gradient(180deg,#333952,#262b39); }
  button:disabled{ opacity:0.4; cursor:not-allowed; }
  button.small{ padding:4px 9px; font-size:0.75rem; }

  #screen{
    background:var(--bg-2);
    border:1px solid var(--line);
    border-radius:8px;
    padding:26px;
    box-shadow: var(--shadow);
    min-height:340px;
  }

  h2{
    font-family:'Courier New', monospace;
    color:var(--amber);
    letter-spacing:1px;
    margin-top:0;
    text-transform:uppercase;
    font-size:1.2rem;
    border-bottom:1px dashed var(--line);
    padding-bottom:10px;
  }
  h3{ font-family:'Courier New', monospace; color:var(--amber); margin-top:0; }
  p{ line-height:1.55; }
  .lede{ color:var(--ink-dim); font-style:italic; }

  /* ---------- Main menu / level select ---------- */
  .levelgrid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:16px;
    margin:18px 0;
  }
  .levelcard{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:18px;
    text-align:left;
    cursor:pointer;
  }
  .levelcard:hover:not(.locked){ border-color:var(--amber-dim); }
  .levelcard.locked{ opacity:0.5; cursor:not-allowed; }
  .levelcard .lvnum{ font-family:'Courier New',monospace; color:var(--amber-dim); font-size:0.75rem; }
  .levelcard h4{ margin:4px 0 8px; color:var(--ink); font-family:'Courier New',monospace; }
  .levelcard p{ font-size:0.85rem; color:var(--ink-dim); margin:0; }
  .levelcard .best{ margin-top:10px; font-size:0.78rem; color:var(--green); font-family:'Courier New',monospace; }

  .scorebar{
    font-family:'Courier New',monospace;
    font-size:0.85rem;
    color:var(--amber);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:8px 12px;
    display:inline-block;
    margin-bottom:14px;
  }

  /* ---------- Locations (the investigation hub) ---------- */
  .loclist{ list-style:none; margin:16px 0 0; padding:0; display:grid; gap:10px; }
  .locitem{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:12px 14px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .locitem:hover, .locitem.focused{ border-color:var(--amber-dim); }
  .locitem.visited{ opacity:0.6; }
  .locitem .name{ font-weight:bold; color:var(--ink); }
  .locitem .tag{ font-size:0.75rem; color:var(--ink-dim); font-family:'Courier New',monospace; }
  .badge{
    font-family:'Courier New',monospace;
    font-size:0.7rem;
    padding:2px 7px;
    border-radius:10px;
    border:1px solid var(--line);
    color:var(--ink-dim);
  }
  .badge.done{ color:var(--green); border-color:var(--green); }

  .clue-box{
    background:var(--panel);
    border-left:3px solid var(--amber-dim);
    padding:14px 16px;
    border-radius:4px;
    margin:14px 0;
  }
  .clue-box .who{
    font-family:'Courier New',monospace;
    color:var(--amber);
    font-size:0.8rem;
    margin-bottom:8px;
    letter-spacing:0.5px;
  }

  /* ---------- Popup / modal windows ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(6,7,10,0.72);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    z-index:50;
  }
  .overlay .box{
    background:var(--bg-2);
    border:1px solid var(--amber-dim);
    border-radius:8px;
    max-width:560px;
    width:100%;
    max-height:80vh;
    overflow-y:auto;
    padding:22px;
    box-shadow:var(--shadow);
  }
  .overlay .box h3{ margin-top:0; color:var(--amber); font-family:'Courier New',monospace; }
  .overlay .close-row{ display:flex; justify-content:flex-end; margin-top:16px; }

  /* ---------- Timeline puzzle ---------- */
  ul.timeline{ list-style:none; margin:16px 0; padding:0; display:grid; gap:8px; }
  .tl-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    display:flex;
    gap:10px;
    align-items:center;
  }
  .tl-card.correct{ border-color:var(--green); }
  .tl-card.incorrect{ border-color:var(--red); }
  .tl-card .slot{
    font-family:'Courier New',monospace;
    color:var(--amber-dim);
    min-width:22px;
    font-weight:bold;
  }
  .tl-card .body{ flex:1; }
  .tl-card .body .txt{ font-size:0.92rem; }
  .tl-card .movebtns{ display:flex; flex-direction:column; gap:3px; }

  .result-line{ font-family:'Courier New',monospace; font-size:0.85rem; margin-top:4px; }

  ul.deductions{ padding-left:20px; line-height:1.6; }
  ul.deductions li{ margin-bottom:10px; }

  /* ---------- Suspects / accusation ---------- */
  .suspects{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin:16px 0; }
  .suspect{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    padding:16px;
    text-align:center;
    cursor:pointer;
  }
  .suspect .icon{ font-size:2rem; margin-bottom:8px; }
  .suspect.selected{ border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset; }
  .suspect .sname{ font-weight:bold; margin-bottom:4px; }
  .suspect .srole{ font-size:0.78rem; color:var(--ink-dim); }

  /* ---------- Ending / score screen ---------- */
  .ending-title{
    font-family:'Courier New',monospace;
    color:var(--amber);
    font-size:1.3rem;
    letter-spacing:1px;
    margin-bottom:6px;
  }
  .scorecard{
    margin-top:18px;
    padding:14px 16px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'Courier New',monospace;
    font-size:0.85rem;
    color:var(--ink-dim);
    display:grid;
    gap:6px;
  }
  .scorecard .row{ display:flex; justify-content:space-between; }
  .scorecard .total{ color:var(--amber); font-weight:bold; border-top:1px dashed var(--line); padding-top:6px; margin-top:4px; }

  footer.hint{
    margin-top:14px;
    text-align:center;
    color:var(--ink-dim);
    font-family:'Courier New',monospace;
    font-size:0.75rem;
    letter-spacing:0.3px;
  }
  .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <h1>Missing Minutes</h1>
      <p>A detective puzzle — piece the timeline back together</p>
    </div>
    <div class="topbtns">
      <button id="btnNotebook" type="button">Notebook</button>
      <button id="btnHelp" type="button">How to Play</button>
      <button id="btnMenu" type="button">Main Menu</button>
    </div>
  </header>
  <div id="screen"></div>
  <footer class="hint" id="hint"></footer>
</div>

<div id="modalRoot"></div>

<script>
/* ==================================================================
   MISSING MINUTES — a beginner-friendly detective puzzle game
   ==================================================================
   This whole game is one JavaScript file with no build tools and
   no outside libraries. It is written to be easy to read, so if
   you're new to JavaScript you can follow along top to bottom:

     1. GAME DATA     - the text/content for all 3 cases (levels)
     2. GAME STATE     - the few variables that track "what is
                          happening right now"
     3. SCORING        - the small functions that turn your choices
                          into points
     4. SCREEN DRAWING - functions that build the HTML for each
                          screen (menu, investigation, timeline,
                          accusation, results)
     5. STARTUP        - the code that kicks everything off

   There is no framework here — every screen is just a string of
   HTML that gets dropped into the page, and then we attach click
   listeners to the buttons inside it. That pattern repeats a lot,
   so once you understand it once you understand the whole file.
================================================================== */


/* ==================================================================
   1. GAME DATA
   Each entry in LEVELS is one complete case: a short intro, a list
   of places to investigate, the true order of events (the timeline
   puzzle), a few "deductions" that summarize the clues, and a list
   of suspects with the correct culprit.
================================================================== */

var LEVELS = [

  /* ---------------- LEVEL 1 : easier, shorter case ---------------- */
  {
    id: 1,
    title: "The Office Blackout",
    place: "TechNova Labs · after-hours",
    intro: "The power at TechNova Labs cut out for eleven minutes last night. " +
      "When it came back on, the prototype smart-lock sitting in the server " +
      "room was gone. Three people were still in the building. Talk to all " +
      "of them, work out what really happened minute by minute, and name " +
      "the thief.",

    locations: [
      {
        id: "frontdesk", name: "Front Desk", icon: "🛎️",
        suspect: "Marco, the security guard",
        text: "“Lights went out at 8:02, sharp. I grabbed my flashlight and did a walk of the ground floor, like always. Didn't see or hear anything odd. Power was back by 8:13, I logged it in the visitor book same as every night.”"
      },
      {
        id: "breakroom", name: "Break Room", icon: "☕",
        suspect: "Priya, the intern",
        text: "“I was finishing a report and the screen just died. I stayed put — I didn't want to trip over anything in the dark. Around 8:06 I heard the server room door open and close, quick, like someone in a hurry. I just assumed it was IT doing their usual checks.”"
      },
      {
        id: "serverroom", name: "Server Room", icon: "🖥️",
        suspect: "Dave, the IT manager",
        text: "“The second the power died I ran down here to manually reboot the backup servers — you have to do it by hand, no way around it. Took about ten minutes. Wasn't for that, we'd have lost a full day of builds.”",
        extra: "The server room door uses an electronic keycard log that runs on its own battery, separate from the building power. Checking it: the log shows zero entries between 8:00 and 8:20 PM. Nobody swiped in during the blackout — not officially, anyway."
      },
      {
        id: "lobby", name: "Lobby Cameras", icon: "🎥",
        suspect: null,
        text: "The lobby camera runs on battery backup and kept recording through the blackout. At 8:07 PM it shows a shadow crossing quickly from the server room hallway toward the loading dock, carrying something small and rectangular."
      }
    ],

    timelineEvents: [
      { id: "e1", time: "8:02 PM", text: "The building loses power. Total blackout across every floor." },
      { id: "e2", time: "8:04 PM", text: "Marco grabs his flashlight and begins a walk of the ground floor." },
      { id: "e3", time: "8:06 PM", text: "Priya, in the break room, hears the server room door open and close." },
      { id: "e4", time: "8:07 PM", text: "The battery-powered lobby camera catches a shadow slipping toward the loading dock with something small in hand." },
      { id: "e5", time: "8:13 PM", text: "Power is restored. Dave is found in the server room; the prototype smart-lock is gone." }
    ],

    deductions: [
      "Dave claims he spent the blackout physically rebooting the servers by hand — but the server room's own battery-powered keycard log shows nobody swiped in at all during those eleven minutes.",
      "Priya heard the server room door at 8:06, a minute before the camera caught someone slipping toward the loading dock at 8:07 — the timing lines up with a hasty exit, not a calm equipment reboot.",
      "Marco was doing a flashlight walk of the ground floor the whole time and never went near the server room.",
      "Priya never left the break room — she only heard the door, she didn't touch anything."
    ],

    suspects: [
      { id: "marco", name: "Marco", role: "The Guard", icon: "🛎️" },
      { id: "priya", name: "Priya", role: "The Intern", icon: "☕" },
      { id: "dave", name: "Dave", role: "The IT Manager", icon: "🖥️" }
    ],
    correctSuspectId: "dave",

    endings: {
      correct: {
        title: "★ Case Closed ★",
        body: "Confronted with the keycard log, Dave's story falls apart fast. He admits he used the blackout as cover to slip the prototype out the loading dock, planning to sell the design to a rival startup. Security recovers the smart-lock from his car before he leaves the parking lot."
      },
      wrong: {
        title: "Wrong Call",
        body: "You point the finger at the wrong person, and they're rightly furious. Meanwhile Dave quietly finishes wiping his tracks — the server logs, conveniently, get 'corrected' the next morning. The prototype stays missing."
      }
    }
  },

  /* ---------------- LEVEL 2 : the original manor mystery ---------------- */
  {
    id: 2,
    title: "Blackwood Manor",
    place: "Blackwood Manor · storm night",
    intro: "For twelve minutes, the power was out across the whole house. When " +
      "the lights came back, Edmund Blackwood lay slumped over his desk, and " +
      "the safe holding the Blackwood Star stood open and empty. Three " +
      "people were in the house that night, each with an account of where " +
      "they were during the blackout. One of them is lying. Talk to " +
      "everyone, examine the scene, and reconstruct exactly what happened, " +
      "minute by minute.",

    locations: [
      {
        id: "kitchen", name: "Kitchen", icon: "🕯️",
        suspect: "Mr. Pierce, the butler",
        text: "“I was lighting candles when I heard glass shatter, somewhere close by. Must've been about 9:48. Gave me such a fright I nearly dropped the candelabra. Turned out to be that wretched cat, Whiskers, knocking my good vase off the shelf. Nothing more to it, I'm quite sure.”"
      },
      {
        id: "library", name: "Library", icon: "📚",
        suspect: "Miss Vivian Blackwood, the niece",
        text: "“I was curled up with a book the whole blackout, I swear it. Well — I did step out once, around 9:50, just for a glass of water from the hall table. The floorboard creaked something awful. I didn't see a soul. Went straight back to my chair.”"
      },
      {
        id: "hallway", name: "Hallway", icon: "🎩",
        suspect: "Colonel Rutherford, business partner",
        text: "“Lights die, I go straight for the fuse box, like any sensible man would. Checked it myself, around 9:52. Nothing wrong with it — figured the storm tripped something further up the line. Didn't touch a thing besides.”",
        extra: "A close look at the fuse box handle: a fine, undisturbed film of dust coats it evenly. No one has opened this panel tonight — not at 9:52, not ever this evening."
      },
      {
        id: "garden", name: "Garden Terrace", icon: "🌧️",
        suspect: null,
        text: "Rain-softened earth runs along the terrace up to the balcony steps. A single line of boot prints — deep tread, heavy heel, about a size eleven — leads up to the study and back down again. The mud is still dark and wet."
      },
      {
        id: "study", name: "Study (Crime Scene)", icon: "🔒",
        suspect: null,
        text: "Edmund Blackwood slumps over his desk, breathing but senseless. The wall safe hangs open and empty. Its little battery-powered alarm log — untouched by the blackout — blinks a single entry: OPENED, 9:56 PM. Muddy boot prints track in from the balcony door and back out again.",
        extra: "Examining the balcony latch more closely: a scrap of fine linen has snagged on the bent hinge — a monogrammed handkerchief, the initials stitched in the corner: A.R."
      }
    ],

    timelineEvents: [
      { id: "t1", time: "9:47 PM", text: "A crash of thunder, then darkness. The storm has knocked out the manor's power. Total blackout." },
      { id: "t2", time: "9:48 PM", text: "Pierce, lighting candles in the kitchen, hears glass shatter nearby. (Later found: only Whiskers the cat, knocking over a vase.)" },
      { id: "t3", time: "9:50 PM", text: "A floorboard creaks in the hallway outside the library. Vivian steps out briefly for water, then returns to her chair." },
      { id: "t4", time: "9:52 PM", text: "Colonel Rutherford claims he checked the fuse box in the hallway closet and found nothing wrong." },
      { id: "t5", time: "9:54 PM", text: "Fresh, deep boot prints — size eleven — appear in the rain-softened earth leading up to the study's balcony." },
      { id: "t6", time: "9:56 PM", text: "The wall safe's battery-powered alarm silently logs one event: OPENED." },
      { id: "t7", time: "9:59 PM", text: "The lights roar back on. Vivian screams — Edmund Blackwood is slumped over his desk, and the safe stands empty." }
    ],

    deductions: [
      "The fuse box was coated in a fine, undisturbed layer of dust. Nobody opened that panel all evening — the Colonel's story doesn't hold.",
      "The boot prints on the terrace are deep-tread, size eleven — a match for the heavy hunting boots the Colonel wore in from the garden earlier that night.",
      "Vivian's account places her in the library and hallway only, and only briefly — nowhere near the balcony.",
      "Pierce never left the kitchen; the 'break-in' sound he heard was only the cat."
    ],

    suspects: [
      { id: "pierce", name: "Mr. Pierce", role: "The Butler", icon: "🕯️" },
      { id: "vivian", name: "Vivian Blackwood", role: "The Niece", icon: "📚" },
      { id: "colonel", name: "Colonel Rutherford", role: "The Business Partner", icon: "🎩" }
    ],
    correctSuspectId: "colonel",

    endings: {
      correct: {
        title: "★ An Airtight Case ★",
        body: "When you lay it all out — the undisturbed dust on the fuse box, the size-eleven boot prints, the safe's timestamped log, and finally the monogrammed handkerchief snagged on the balcony latch, initials A.R. — Colonel Ashton Rutherford's face goes the colour of old parchment. He doesn't even attempt a denial. Within the week the Blackwood Star is recovered from a safety-deposit box under an assumed name."
      },
      wrong: {
        title: "A Miscarriage of Justice",
        body: "You accuse the wrong person, and the room goes silent with the wrong kind of shock. Colonel Rutherford offers to 'help however he can' — already halfway out the door, already halfway to wherever he's hidden the Blackwood Star."
      }
    }
  },

  /* ---------------- LEVEL 3 : harder, longer case ---------------- */
  {
    id: 3,
    title: "The Midnight Train",
    place: "The Aurora Express · overnight run",
    intro: "Deep in the Kestrel Tunnel, the sleeper train's lights failed for " +
      "nine minutes. When they came back, Lady Whitmore's diamond necklace " +
      "was gone from her locked compartment. Four passengers claim to have " +
      "been elsewhere. Visit every carriage, weigh every alibi against the " +
      "clock, and name the thief.",

    locations: [
      {
        id: "dining", name: "Dining Car", icon: "🍷",
        suspect: "Mr. Feld, the traveling salesman",
        text: "“I was finishing a late supper when the lights cut. Waited it out right there with my wine, didn't move an inch — well, except to steady the bottle when the train jolted through the tunnel bend around minute four. Ask the waiter, he'll vouch for me.”"
      },
      {
        id: "compartment3", name: "Compartment 3 (Victim)", icon: "💎",
        suspect: null,
        text: "Lady Whitmore's door lock shows no sign of forcing — whoever opened it used a key or a very good copy. Her jewelry case sits open on the vanity, empty but for a folded silk cloth. The window is sealed shut from the inside."
      },
      {
        id: "conductor", name: "Conductor's Cabin", icon: "🚂",
        suspect: "Conductor Reyes",
        text: "“The instant the lights failed I headed straight for the brake lever, standard procedure in a tunnel. I was there the whole nine minutes, hand on that lever, in case we needed to stop. I never left this cabin.”",
        extra: "The brake lever has a mechanical counter that clicks once whenever it's gripped and released. Checking it against the maintenance log from this afternoon: the counter hasn't moved since the last inspection. Nobody gripped that lever tonight."
      },
      {
        id: "observation", name: "Observation Deck", icon: "🌙",
        suspect: "Mrs. Ashcombe, the widow",
        text: "“I like to watch the tunnel lights blur past, blackout or not — there's nothing to see, but old habits. I stayed right here at the rear window the entire time. I did hear footsteps somewhere up the corridor around the seventh minute, hurried ones.”"
      },
      {
        id: "luggage", name: "Luggage Car", icon: "🧳",
        suspect: "Ines, Lady Whitmore's assistant",
        text: "“I was sorting the morning's post in here, same as every night before the tunnel. The lights failing barely slowed me down, I know this car blind. I never went near my lady's compartment — why would I need to?”",
        extra: "Tucked behind a trunk, a small tin holds a fresh wax impression of a compartment-door key, and beside it, a locksmith's receipt dated three days ago for 'one duplicate, rush order.' The name on the receipt: E. Feld."
      },
      {
        id: "corridor", name: "Sleeper Corridor", icon: "🕯️",
        suspect: null,
        text: "The corridor runner is a pale carpet, easy to mark. A faint trail of wine-dark droplets — the same vintage as tonight's dining car reserve — leads from the dining car doorway to Compartment 3's threshold, and back again."
      }
    ],

    timelineEvents: [
      { id: "m1", time: "11:02 PM", text: "The train enters Kestrel Tunnel and the cabin lights fail. Total blackout for the length of the tunnel." },
      { id: "m2", time: "11:03 PM", text: "Conductor Reyes is supposed to head for the brake lever, per standard tunnel procedure." },
      { id: "m3", time: "11:04 PM", text: "Mr. Feld claims to steady his wine bottle at the dining table as the train jolts through a bend." },
      { id: "m4", time: "11:05 PM", text: "A trail of wine-dark droplets later found leading from the dining car toward Compartment 3 suggests someone left the dining car around now, glass still in hand." },
      { id: "m5", time: "11:06 PM", text: "Ines is sorting post in the luggage car, several carriages away from the victim's compartment." },
      { id: "m6", time: "11:07 PM", text: "Mrs. Ashcombe, at the rear observation window, hears hurried footsteps somewhere up the corridor." },

/* ==================================================================
   2. GAME STATE
   "state" holds everything about what is happening right now: which
   screen is showing, which level we're on, which clues have been
   found, how the timeline cards are currently ordered, and so on.
   Every time something changes, we update this object and then call
   render() to redraw the screen from scratch based on it.
================================================================== */

var state = null;

function newLevelState(levelIndex){
  var level = LEVELS[levelIndex];
  return {
    screen: "intro",           // which screen we're showing
    levelIndex: levelIndex,
    visited: {},                // locationId -> true once examined
    extrasFound: {},            // locationId -> true once bonus clue found
    hubIndex: 0,                // which location row is keyboard-focused
    order: shuffleTimeline(level.timelineEvents),
    checkResult: null,          // set after "Check Timeline" is pressed
    checkAttempts: 0,           // how many times the player pressed Check
    accusationIndex: 0,
    accusation: null,
    confirmArmed: false,
    finalScore: null            // filled in once the case ends
  };
}

// Shuffle the timeline into a random (wrong) starting order.
function shuffleTimeline(events){
  var ids = events.map(function(e){ return e.id; });
  var shuffled = ids.slice();
  for (var i = shuffled.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var temp = shuffled[i];
    shuffled[i] = shuffled[j];
    shuffled[j] = temp;
  }
  // If we got lucky and shuffled into the correct order, try again.
  var alreadyCorrect = shuffled.every(function(id, i){ return id === ids[i]; });
  if (alreadyCorrect) return shuffleTimeline(events);
  return shuffled;
}

function currentLevel(){ return LEVELS[state.levelIndex]; }

function allLocationsVisited(){
  return currentLevel().locations.every(function(loc){ return state.visited[loc.id]; });
}

function findTimelineEvent(id){
  var events = currentLevel().timelineEvents;
  for (var i = 0; i < events.length; i++){
    if (events[i].id === id) return events[i];
  }
  return null;
}


/* ==================================================================
   3. SCORING
   Points are simple and transparent on purpose:
     +20  for every timeline event placed in its correct spot
     +100 bonus if the WHOLE timeline was correct on your first try
     +30  for every hidden bonus clue you found along the way
     +150 for accusing the right person, -50 for accusing the wrong one
   The level score never goes below 0. Progress (which levels are
   unlocked) and your best total score are saved in localStorage,
   the browser's small built-in storage, so they survive a refresh.
================================================================== */

var POINTS = {
  perCorrectSlot: 20,
  perfectFirstTry: 100,
  perClue: 30,
  correctAccusation: 150,
  wrongAccusation: -50
};

var SAVE_KEY_UNLOCKED = "missingMinutes_unlockedLevel";
var SAVE_KEY_BEST = "missingMinutes_bestTotalScore";

function getUnlockedLevel(){
  try {
    var v = parseInt(localStorage.getItem(SAVE_KEY_UNLOCKED), 10);
    return isNaN(v) ? 0 : v;
  } catch (err){ return 0; }
}
function setUnlockedLevel(levelIndex){
  try { localStorage.setItem(SAVE_KEY_UNLOCKED, String(levelIndex)); } catch (err){ /* storage not available, ignore */ }
}
function getBestScore(){
  try {
    var v = parseInt(localStorage.getItem(SAVE_KEY_BEST), 10);
    return isNaN(v) ? 0 : v;
  } catch (err){ return 0; }
}
function saveBestScoreIfHigher(total){
  var best = getBestScore();
  if (total > best){
    try { localStorage.setItem(SAVE_KEY_BEST, String(total)); } catch (err){ /* ignore */ }
    return total;
  }
  return best;
}

// Running total across every level played in this browser tab.
var runningTotalScore = 0;

function computeLevelScore(){
  var level = currentLevel();
  var totalEvents = level.timelineEvents.length;
  var correctCount = state.checkResult ? state.checkResult.correctCount : 0;

  var timelinePoints = correctCount * POINTS.perCorrectSlot;
  var perfectBonus = (correctCount === totalEvents && state.checkAttempts === 1) ? POINTS.perfectFirstTry : 0;

  var clueCount = Object.keys(state.extrasFound).length;
  var cluePoints = clueCount * POINTS.perClue;

  var accusedCorrectly = state.accusation === level.correctSuspectId;
  var accusationPoints = accusedCorrectly ? POINTS.correctAccusation : POINTS.wrongAccusation;

  var total = timelinePoints + perfectBonus + cluePoints + accusationPoints;
  if (total < 0) total = 0;

  return {
    timelinePoints: timelinePoints,
    perfectBonus: perfectBonus,
    cluePoints: cluePoints,
    accusationPoints: accusationPoints,
    accusedCorrectly: accusedCorrectly,
    total: total,
    correctCount: correctCount,
    totalEvents: totalEvents,
    clueCount: clueCount
  };
}

function rankForScore(total){
  if (total >= 900) return "Master Detective";
  if (total >= 600) return "Sharp Detective";
  if (total >= 300) return "Rookie Detective";
  return "Trainee Detective";
}


/* ==================================================================
   4. SCREEN DRAWING
   Every renderX() function below builds one screen as an HTML
   string, drops it into #screen, and then wires up click/keyboard
   listeners on the elements it just created. render() looks at
   state.screen and calls the right one.
================================================================== */

var screenEl = document.getElementById("screen");
var hintEl = document.getElementById("hint");
var modalRoot = document.getElementById("modalRoot");

function setHint(text){ hintEl.textContent = text; }
function closeModal(){ modalRoot.innerHTML = ""; }

function showModal(html, onRender){
  modalRoot.innerHTML =
    '<div class="overlay" id="overlayEl">' +
      '<div class="box" role="dialog" aria-modal="true">' + html + "</div>" +
    "</div>";
  var overlay = document.getElementById("overlayEl");
  overlay.addEventListener("mousedown", function(e){
    if (e.target.id === "overlayEl") closeModal();
  });
  if (onRender) onRender();
}

function render(){
  if (state === null) return renderMainMenu();
  if (state.screen === "intro") return renderIntro();
  if (state.screen === "hub") return renderHub();
  if (state.screen === "timeline") return renderTimeline();
  if (state.screen === "deductions") return renderDeductions();
  if (state.screen === "accuse") return renderAccuse();
  if (state.screen === "ending") return renderEnding();
}

/* ---------------- Main menu ---------------- */

function renderMainMenu(){
  var unlocked = getUnlockedLevel();
  var best = getBestScore();

  var html = "<h2>Choose a Case</h2>";
  html += '<div class="scorebar">Best total score: ' + best + " (" + rankForScore(best) + ")</div>";
  html += '<p class="lede">Three cases, each a little harder than the last. Finish one to unlock the next.</p>';
  html += '<div class="levelgrid">';

  LEVELS.forEach(function(level, i){
    var locked = i > unlocked;
    html += '<div class="levelcard' + (locked ? " locked" : "") + '" data-idx="' + i + '" tabindex="0">' +
      '<div class="lvnum">CASE ' + (i + 1) + "</div>" +
      "<h4>" + level.title + "</h4>" +
      "<p>" + level.place + "</p>" +
      (locked ? '<p class="best">🔒 Finish the previous case to unlock</p>' : '<p class="best">Tap to play</p>') +
      "</div>";
  });
  html += "</div>";

  html += '<div class="actions"><button class="primary" id="playFromStart">Restart From Case 1</button></div>';

  screenEl.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll(".levelcard"), function(el){
    var idx = parseInt(el.getAttribute("data-idx"), 10);
    if (idx > unlocked) return; // locked, do nothing
    el.addEventListener("click", function(){ startLevel(idx); });
    el.addEventListener("keydown", function(e){
      if (e.key === "Enter" || e.key === " "){ e.preventDefault(); startLevel(idx); }
    });
  });

  document.getElementById("playFromStart").addEventListener("click", function(){
    startLevel(0);
  });

  setHint("Click a case to begin · your progress and best score are saved on this device");
}

function startLevel(levelIndex){
  state = newLevelState(levelIndex);
  render();
}

function goToMainMenu(){
  state = null;
  render();
}

/* ---------------- Case intro ---------------- */

function renderIntro(){
  var level = currentLevel();
  screenEl.innerHTML =
    "<h2>" + level.title + "</h2>" +
    '<p class="lede">' + level.place.toUpperCase() + "</p>" +
    "<p>" + level.intro + "</p>" +
    '<p class="lede">Use the "How to Play" button any time you need a reminder of the rules.</p>' +
    '<div class="actions"><button class="primary" id="startBtn" type="button">Begin Investigation</button>' +
    '<button id="backMenuBtn" type="button">Main Menu</button></div>';

  document.getElementById("startBtn").addEventListener("click", function(){
    state.screen = "hub";
    render();
  });
  document.getElementById("backMenuBtn").addEventListener("click", goToMainMenu);

  setHint("Press Begin Investigation to start this case");
}

/* ---------------- Investigation hub (list of locations) ---------------- */

function renderHub(){
  var level = currentLevel();
  var doneCount = level.locations.filter(function(l){ return state.visited[l.id]; }).length;

  var html = "<h2>Investigate " + level.title + "</h2>" +
    '<p class="lede">' + doneCount + " of " + level.locations.length + ' locations examined.</p>' +
    '<ul class="loclist" id="locList">';

  level.locations.forEach(function(loc, i){
    var visited = !!state.visited[loc.id];
    html += '<li class="locitem' + (visited ? " visited" : "") + (i === state.hubIndex ? " focused" : "") +
      '" data-idx="' + i + '" tabindex="-1">' +
      '<span class="name">' + loc.icon + " " + (i + 1) + ". " + loc.name + "</span>" +
      '<span class="badge' + (visited ? " done" : "") + '">' + (visited ? "Examined" : "Unexamined") + "</span>" +
      "</li>";
  });
  html += "</ul>";

  html += '<div class="actions">' +
    '<button class="primary" id="toTimeline" type="button"' + (allLocationsVisited() ? "" : " disabled") + '>Reconstruct the Timeline</button>' +
    '</div>';

  if (!allLocationsVisited()){
    html += '<p class="lede" style="margin-top:10px;">Examine every location before reconstructing the timeline.</p>';
  }

  screenEl.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll(".locitem"), function(el){
    el.addEventListener("click", function(){
      state.hubIndex = parseInt(el.getAttribute("data-idx"), 10);
      visitLocation(state.hubIndex);
    });
  });

  document.getElementById("toTimeline").addEventListener("click", function(){
    if (allLocationsVisited()){ state.screen = "timeline"; render(); }
  });

  setHint("Click a location to examine it · " + doneCount + "/" + level.locations.length + " done");
}

function visitLocation(idx){
  var level = currentLevel();
  var loc = level.locations[idx];
  state.visited[loc.id] = true;

  var html = "<h3>" + loc.icon + " " + loc.name + "</h3>" +
    '<div class="clue-box">' +
    (loc.suspect ? '<div class="who">' + loc.suspect + "</div>" : "") +
    "<div>" + loc.text + "</div>" +
    "</div>";

  var showExtraBtn = !!loc.extra && !state.extrasFound[loc.id];

  if (state.extrasFound[loc.id]){
    html += '<div class="clue-box" style="border-color:#e0b256;">' + loc.extra + "</div>";
  }
  if (showExtraBtn){
    html += '<div class="actions"><button class="primary" id="extraBtn" type="button">Look Closer (+' + POINTS.perClue + ' pts)</button></div>';
  }
  html += '<div class="actions"><button id="closeLoc" type="button">Close</button></div>';

  showModal(html, function(){
    var extraBtn = document.getElementById("extraBtn");
    if (extraBtn){
      extraBtn.addEventListener("click", function(){
        state.extrasFound[loc.id] = true;
        closeModal();
        visitLocation(idx);
      });
    }
    var closeBtn = document.getElementById("closeLoc");
    closeBtn.addEventListener("click", function(){ closeModal(); render(); });
    closeBtn.focus();
  });
  render();
}

/* ---------------- Timeline puzzle ---------------- */

function renderTimeline(){
  var level = currentLevel();

  var html = "<h2>Reconstruct the Timeline</h2>" +
    '<p class="lede">Use the ▲ ▼ buttons to put the ' + level.timelineEvents.length + " events in the order they truly happened.</p>" +
    '<ul class="timeline" id="tlList">';

  state.order.forEach(function(id, i){
    var ev = findTimelineEvent(id);
    var cls = "tl-card";
    if (state.checkResult) cls += state.checkResult.correctFlags[i] ? " correct" : " incorrect";

    html += '<li class="' + cls + '" data-idx="' + i + '">' +
      '<span class="slot">' + (i + 1) + "</span>" +
      '<span class="body"><span class="txt">' + ev.text + "</span></span>" +
      '<span class="movebtns">' +
        '<button class="small" data-move="up" data-idx="' + i + '" type="button"' + (i === 0 ? " disabled" : "") + '>▲</button>' +
        '<button class="small" data-move="down" data-idx="' + i + '" type="button"' + (i === state.order.length - 1 ? " disabled" : "") + '>▼</button>' +
      "</span>" +
      "</li>";
  });
  html += "</ul>";

  if (state.checkResult){
    var n = state.checkResult.correctCount;
    var total = level.timelineEvents.length;
    html += '<p class="result-line">' + n + " of " + total + " events correctly placed. " +
      (n === total ? "The timeline is exact." : "Something still feels out of order.") + "</p>";
  }

  html += '<div class="actions">' +
    '<button class="primary" id="checkBtn" type="button">Check Timeline</button>' +
    '<button id="toDeductions" type="button"' + (state.checkResult ? "" : " disabled") + ">Continue to Deductions</button>" +
    '<button id="backHub" type="button">Back to Locations</button>' +
    "</div>";

  screenEl.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll("[data-move]"), function(btn){
    btn.addEventListener("click", function(){
      var idx = parseInt(btn.getAttribute("data-idx"), 10);
      var dir = btn.getAttribute("data-move");
      moveTimelineCard(idx, dir === "up" ? idx - 1 : idx + 1);
    });
  });

  document.getElementById("checkBtn").addEventListener("click", checkTimeline);
  document.getElementById("toDeductions").addEventListener("click", function(){
    if (state.checkResult){ state.screen = "deductions"; render(); }
  });
  document.getElementById("backHub").addEventListener("click", function(){ state.screen = "hub"; render(); });

  setHint("▲ ▼ move a card · Check Timeline when you think the order is right");
}

function moveTimelineCard(from, to){
  if (to < 0 || to >= state.order.length) return;
  var item = state.order.splice(from, 1)[0];
  state.order.splice(to, 0, item);
  state.checkResult = null; // moving cards invalidates the last check
  render();
}

function checkTimeline(){
  var level = currentLevel();
  var correctIds = level.timelineEvents.map(function(e){ return e.id; });
  var flags = state.order.map(function(id, i){ return id === correctIds[i]; });
  var count = flags.filter(Boolean).length;
  state.checkAttempts += 1;
  state.checkResult = { correctFlags: flags, correctCount: count };
  render();
}

/* ---------------- Deductions summary ---------------- */

function renderDeductions(){
  var level = currentLevel();
  var html = "<h2>Deductions</h2>" +
    '<p class="lede">What the notebook, laid side by side, actually tells you:</p>' +
    '<ul class="deductions">';
  level.deductions.forEach(function(d){ html += "<li>" + d + "</li>"; });
  html += "</ul>";
  html += "<p>Someone in this story is lying about where they were during the missing minutes.</p>";
  html += '<div class="actions">' +
    '<button class="primary" id="toAccuse" type="button">Make Your Accusation</button>' +
    '<button id="backTl" type="button">Back to Timeline</button>' +
    "</div>";
  screenEl.innerHTML = html;

  document.getElementById("toAccuse").addEventListener("click", function(){ state.screen = "accuse"; render(); });
  document.getElementById("backTl").addEventListener("click", function(){ state.screen = "timeline"; render(); });

  setHint("Read the deductions, then make your accusation when ready");
}

/* ---------------- Accusation ---------------- */

function renderAccuse(){
  var level = currentLevel();
  var html = "<h2>Who Is Responsible?</h2>" +
    '<p class="lede">Choose carefully — there is no undoing an accusation.</p>' +
    '<div class="suspects" id="suspectGrid">';

  level.suspects.forEach(function(s, i){
    html += '<div class="suspect' + (i === state.accusationIndex ? " selected" : "") + '" data-idx="' + i + '" tabindex="0">' +
      '<div class="icon">' + s.icon + "</div>" +
      '<div class="sname">' + s.name + "</div>" +
      '<div class="srole">' + s.role + "</div>" +
      "</div>";
  });
  html += "</div>";

  var chosen = level.suspects[state.accusationIndex];
  html += '<div class="actions">' +
    '<button class="primary" id="accuseBtn" type="button">' +
      (state.confirmArmed ? "Confirm — Accuse " + chosen.name + "?" : "Accuse Selected Suspect") +
    "</button>" +
    '<button id="backDeduce" type="button">Back to Deductions</button>' +
    "</div>";

  screenEl.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll("#suspectGrid .suspect"), function(el){
    el.addEventListener("click", function(){
      state.accusationIndex = parseInt(el.getAttribute("data-idx"), 10);
      state.confirmArmed = false;
      render();
    });
  });

  document.getElementById("accuseBtn").addEventListener("click", doAccuse);
  document.getElementById("backDeduce").addEventListener("click", function(){ state.screen = "deductions"; render(); });

  setHint("Click a suspect, then click Accuse twice to confirm");
}

function doAccuse(){
  if (!state.confirmArmed){
    state.confirmArmed = true;
    render();
    return;
  }
  var level = currentLevel();
  state.accusation = level.suspects[state.accusationIndex].id;
  state.finalScore = computeLevelScore();
  state.screen = "ending";
  render();

  // Unlock the next level and keep a running total for the best-score save.
  var unlocked = getUnlockedLevel();
  if (state.levelIndex >= unlocked && state.levelIndex + 1 < LEVELS.length){
    setUnlockedLevel(state.levelIndex + 1);
  } else if (state.levelIndex >= unlocked){
    setUnlockedLevel(state.levelIndex); // last level, nothing further to unlock
  }
  runningTotalScore += state.finalScore.total;
  saveBestScoreIfHigher(runningTotalScore);
}

/* ---------------- Ending / score screen ---------------- */

function renderEnding(){
  var level = currentLevel();
  var score = state.finalScore;
  var ending = score.accusedCorrectly ? level.endings.correct : level.endings.wrong;
  var isLastLevel = state.levelIndex === LEVELS.length - 1;

  var html = '<div class="ending-title">' + ending.title + "</div>" +
    "<p>" + ending.body + "</p>" +
    '<div class="scorecard">' +
      '<div class="row"><span>Timeline: ' + score.correctCount + "/" + score.totalEvents + ' correct</span><span>+' + score.timelinePoints + "</span></div>" +
      '<div class="row"><span>Perfect-timeline bonus</span><span>+' + score.perfectBonus + "</span></div>" +
      '<div class="row"><span>Bonus clues found: ' + score.clueCount + '</span><span>+' + score.cluePoints + "</span></div>" +
      '<div class="row"><span>Accusation (' + (score.accusedCorrectly ? "correct" : "incorrect") + ')</span><span>' + (score.accusationPoints >= 0 ? "+" : "") + score.accusationPoints + "</span></div>" +
      '<div class="row total"><span>Case score</span><span>' + score.total + "</span></div>" +
    "</div>" +
    '<div class="scorebar" style="margin-top:14px;">Running total this session: ' + runningTotalScore + "</div>";

  html += '<div class="actions">';
  html += '<button class="primary" id="retryBtn" type="button">Play This Case Again</button>';
  if (!isLastLevel){
    html += '<button class="primary" id="nextBtn" type="button">Next Case</button>';
  } else {
    html += '<button class="primary" id="finishBtn" type="button">See Final Rank</button>';
  }
  html += '<button id="menuBtn" type="button">Main Menu</button>';
  html += "</div>";

  screenEl.innerHTML = html;

  document.getElementById("retryBtn").addEventListener("click", function(){
    startLevel(state.levelIndex);
  });
  var nextBtn = document.getElementById("nextBtn");
  if (nextBtn){
    nextBtn.addEventListener("click", function(){ startLevel(state.levelIndex + 1); });
  }
  var finishBtn = document.getElementById("finishBtn");
  if (finishBtn){
    finishBtn.addEventListener("click", renderFinalRank);
  }
  document.getElementById("menuBtn").addEventListener("click", goToMainMenu);

  setHint("Case closed · " + score.total + " points earned this case");
}

function renderFinalRank(){
  var best = getBestScore();
  var rank = rankForScore(best);
  screenEl.innerHTML =
    "<h2>All Three Cases Closed</h2>" +
    '<p class="lede">Your best total score on this device:</p>' +
    '<div class="scorecard"><div class="row total"><span>Best total score</span><span>' + best + "</span></div>" +
    '<div class="row"><span>Rank</span><span>' + rank + "</span></div></div>" +
    "<p>Trainee Detective (under 300) · Rookie Detective (300+) · Sharp Detective (600+) · Master Detective (900+)</p>" +
    '<div class="actions"><button class="primary" id="menuBtn2" type="button">Main Menu</button></div>';
  document.getElementById("menuBtn2").addEventListener("click", goToMainMenu);
  setHint("Thanks for playing Missing Minutes!");
}

function openNotebook(){

    showModal(
      "<h3>Notebook</h3><p class=\"lede\">Start a case from the main menu to begin collecting clues.</p>" +
      '<div class="close-row"><button class="primary" id="closeNb" type="button">Close</button></div>',
      function(){ document.getElementById("closeNb").addEventListener("click", closeModal); }
    );
    return;
  }
  var level = currentLevel();
  var entries = level.locations.filter(function(l){ return state.visited[l.id]; });
  var html = "<h3>Notebook — " + level.title + "</h3>";
  if (entries.length === 0){
    html += '<p class="lede">No clues gathered yet. Go investigate.</p>';
  } else {
    entries.forEach(function(l){
      html += '<div class="clue-box">' +
        '<div class="who">' + l.icon + " " + l.name + (l.suspect ? " — " + l.suspect : "") + "</div>" +
        "<div>" + l.text + "</div>" +
        (state.extrasFound[l.id] ? '<div style="margin-top:8px; color:#e0b256; font-size:0.85rem;">' + l.extra + "</div>" : "") +
        "</div>";
    });
  }
  html += '<div class="close-row"><button class="primary" id="closeNb" type="button">Close</button></div>';
  showModal(html, function(){
    document.getElementById("closeNb").addEventListener("click", closeModal);
    document.getElementById("closeNb").focus();
  });
}


/* ==================================================================
   5. STARTUP
   Wire up the always-visible top buttons and draw the first screen.
================================================================== */

document.getElementById("btnHelp").addEventListener("click", openHelp);
document.getElementById("btnNotebook").addEventListener("click", openNotebook);
document.getElementById("btnMenu").addEventListener("click", goToMainMenu);

document.addEventListener("keydown", function(e){
  if (modalRoot.children.length > 0){
    if (e.key === "Escape"){ closeModal(); }
    return;
  }
  if (e.key === "Escape" && state && state.screen !== "intro"){
    // no-op placeholder for future use; Escape only closes modals for now
  }
});

render();
</script>
