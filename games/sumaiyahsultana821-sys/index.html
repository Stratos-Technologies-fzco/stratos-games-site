<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Missing Minute</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    display:flex;align-items:center;justify-content:center;
    background:#0b0d14;color:#e8e6f0;
    font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
    text-align:center;padding:24px;
  }
  h1{font-size:clamp(36px,9vw,84px);margin:0 0 12px;letter-spacing:-.02em;line-height:1.05}
  .by{font-size:clamp(16px,3.5vw,22px);opacity:.75;margin:0 0 28px}
  .soon{
    display:inline-block;font-size:clamp(14px,3vw,18px);font-weight:700;
    letter-spacing:.2em;text-transform:uppercase;color:#f5c26b;
    border:1px solid #f5c26b66;border-radius:999px;padding:8px 20px;
  }
</style>
</head>
<body>
  <main>
    <h1>The Missing Minute</h1>
    <p class="by">by Sumaiyah Sultana</p>
    <span class="soon">Coming soon</span>
  </main>
</body>
</html>
