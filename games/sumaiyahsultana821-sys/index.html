<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Match Quest</title>
<style>
  :root{
    --sand:#f6e3b4; --sand-deep:#e8c788; --sea:#0e7490; --sea-deep:#075166;
    --ink:#0b2730; --card-back:#0f766e; --card-back-2:#115e59;
    --good:#16a34a; --accent:#f97316; --white:#fffdf7;
    --card:72px;
  }
  *{box-sizing:border-box}
  html,body{margin:0; padding:0; height:100%; overflow:hidden}
  body{
    height:100vh; height:100dvh;
    font-family:"Segoe UI",Nunito,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #0ea5c7 0%, #0b7a9b 40%, #075166 100%);
    color:var(--white);
    -webkit-user-select:none; user-select:none;
  }

  /* Two screens: the cover and the game. Each fills the window exactly, no scrolling. */
  .screen{
    position:absolute; top:0; bottom:0; left:0; right:0;
    max-width:900px; margin:0 auto;
    display:flex; flex-direction:column;
    padding:max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  .screen[hidden]{display:none}

  .btn{
    border:none; border-radius:999px; padding:12px 24px; font-size:15px; font-weight:800;
    cursor:pointer; transition:transform .12s ease, filter .12s ease; font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn:active{transform:scale(.97)}
  .btn-primary{background:var(--accent); color:#1a0f00}
  .btn-secondary{background:rgba(255,255,255,.15); color:var(--white); border:1px solid rgba(255,255,255,.3)}
  .btn:focus-visible{outline:3px solid #ffe9b3; outline-offset:2px}

  /* ---------- Cover ---------- */
  .cover-inner{
    flex:1; min-height:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center;
    gap:clamp(8px, 2.2vh, 18px);
  }
  .cover-art{display:flex; gap:clamp(10px, 4vw, 22px)}
  .art-btn{
    font-size:clamp(28px, 6vh, 52px); line-height:1;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    border-radius:20px; padding:10px; cursor:pointer;
    animation:bob 3s ease-in-out infinite; -webkit-tap-highlight-color:transparent;
  }
  .art-btn:nth-child(2){animation-delay:.4s}
  .art-btn:nth-child(3){animation-delay:.8s}
  .art-btn.ping{animation:ping .5s ease}
  @keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
  @keyframes ping{0%{transform:scale(1)} 40%{transform:scale(1.18)} 100%{transform:scale(1)}}
  .cover h1{margin:0; font-size:clamp(28px, 5.5vh, 44px); text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .cover .tag{margin:0; opacity:.9; font-size:clamp(13px, 2vh, 16px); max-width:420px}
  .btn-big{font-size:clamp(18px, 3vh, 22px); padding:clamp(12px, 2vh, 16px) 48px; box-shadow:0 6px 0 #b4530a}
  .btn-big:active{box-shadow:0 2px 0 #b4530a; transform:translateY(4px)}
  .cover-best{margin:0; font-size:14px; opacity:.85}
  .cover-best b{color:#ffe9b3}
  .goal{
    margin:0; padding:8px 16px; border-radius:999px; max-width:440px;
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
    font-size:clamp(13px, 2vh, 15px); font-weight:700;
  }

  /* First-island tutorial: one short hint at a time, above the board */
  .hint{
    align-self:center; margin:0 0 8px; padding:7px 16px; border-radius:14px; max-width:420px;
    background:#fff3cf; color:var(--ink); text-align:center;
    font-size:clamp(13px, 3.6vw, 15px); font-weight:700; line-height:1.35;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
  }
  .hint[hidden]{display:none}
  .hint.show{animation:hintIn .45s ease}
  @keyframes hintIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
  .credit{text-align:center; font-size:11px; opacity:.6; margin-top:6px}

  /* ---------- Game ---------- */
  .topbar{display:flex; align-items:center; gap:8px; padding-right:52px; margin-bottom:8px}
  .topbar h1{flex:1; margin:0; font-size:clamp(16px, 4.5vw, 22px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .icon-btn{
    width:44px; height:44px; border-radius:50%; flex:none;
    border:1px solid rgba(255,255,255,.3); background:rgba(11,39,48,.6);
    color:var(--white); font-size:20px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .icon-btn:focus-visible{outline:3px solid #ffe9b3; outline-offset:2px}
  .btn-sm{padding:10px 16px; font-size:14px}

  .hud{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:8px}
  .hud-item{
    background:rgba(11,39,48,.55); border:1px solid rgba(255,255,255,.18);
    border-radius:12px; padding:6px 4px; text-align:center;
  }
  .hud-label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; opacity:.75}
  .hud-value{display:block; font-size:clamp(14px, 4vw, 18px); font-weight:800; margin-top:1px; white-space:nowrap}

  .island-label{
    align-self:center; margin-bottom:8px; padding:5px 14px; border-radius:999px;
    font-size:clamp(12px, 3.4vw, 14px); font-weight:800; white-space:nowrap;
    background:var(--accent); color:#1a0f00;
  }

  /* Island map on the cover: unlocked islands can be replayed, locked ones show a lock */
  .map{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:8px; width:100%; max-width:440px}
  .map-tile{
    background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); border-radius:14px;
    padding:6px 4px; min-width:0; color:var(--white); font-family:inherit; cursor:pointer; min-height:clamp(50px, 8vh, 64px);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    -webkit-tap-highlight-color:transparent;
  }
  .map-tile:focus-visible{outline:3px solid #ffe9b3; outline-offset:2px}
  .mt-icon{font-size:clamp(18px, 3.2vh, 24px); line-height:1.1}
  .mt-name{font-size:10px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
  .mt-stars{font-size:11px; letter-spacing:1px; color:#ffe9b3}
  .map-tile.locked{opacity:.45}
  .map-tile.next{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
  .map-tile.shake{animation:shake .4s}
  @keyframes shake{25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}}

  .board-wrap{flex:1; min-height:0; display:flex; align-items:center; justify-content:center}
  .board{display:grid; gap:8px; justify-content:center}
  .card{
    width:var(--card); height:var(--card);
    perspective:700px; background:none; border:none; padding:0; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .card-inner{
    position:relative; width:100%; height:100%; border-radius:12px;
    transition:transform .35s ease; transform-style:preserve-3d;
    box-shadow:0 4px 10px rgba(0,0,0,.25);
  }
  .card.flipped .card-inner, .card.matched .card-inner{transform:rotateY(180deg)}
  .card-face{
    position:absolute; inset:0; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    font-size:calc(var(--card) * .45);
  }
  /* Card back: a tiny island scene (sky, sun, sea, sandy island, palm tree) */
  .card-back{
    overflow:hidden;
    background:
      radial-gradient(ellipse 62% 22% at 50% 86%, #f6e3b4 0 62%, #e8c788 66%, transparent 70%),
      linear-gradient(180deg, #7dd3fc 0%, #38bdf8 46%, #0e7490 47%, #075166 100%);
    border:2px solid rgba(255,255,255,.55);
  }
  .card-back::before{
    content:""; position:absolute; top:12%; right:14%; width:18%; height:18%;
    border-radius:50%; background:#fde68a; box-shadow:0 0 8px 2px rgba(253,230,138,.7);
  }
  .card-back::after{
    content:"🌴"; font-size:calc(var(--card) * .42);
    transform:translate(4%, 2%); filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));
  }
  .card-front{
    background:var(--sand); color:var(--ink);
    border:2px solid var(--sand-deep);
    transform:rotateY(180deg);
  }
  .card.matched .card-front{background:#fff3cf; border-color:var(--good)}
  .card:focus-visible .card-inner{outline:3px solid #ffe9b3; outline-offset:2px}

  .mute-btn{position:fixed; top:max(12px, env(safe-area-inset-top)); right:12px; z-index:20}

  /* match celebration: matched pair pops on a ~half-second beat */
  .card.pop .card-inner{animation:pop .5s ease}
  @keyframes pop{
    0%{transform:rotateY(180deg) scale(1)}
    40%{transform:rotateY(180deg) scale(1.15)}
    100%{transform:rotateY(180deg) scale(1)}
  }
  .burst{
    position:fixed; pointer-events:none; z-index:15; font-size:22px;
    animation:burst .9s ease-out forwards;
  }
  @keyframes burst{
    from{opacity:1; transform:translate(0,0) scale(.6)}
    to{opacity:0; transform:translate(var(--dx),var(--dy)) scale(1.1)}
  }

  .overlay{
    position:fixed; inset:0; background:rgba(5,20,25,.72);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:10;
  }
  .overlay[hidden]{display:none}
  .modal{
    background:var(--white); color:var(--ink); border-radius:18px;
    padding:24px 26px; max-width:360px; width:100%; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
  }
  .modal h2{margin:0 0 10px; font-size:22px}
  .modal p{margin:0 0 18px; font-size:14px; line-height:1.6; white-space:pre-line}
  .modal-actions{display:flex; flex-direction:column; gap:10px; align-items:center}
  .modal .btn-secondary{color:var(--ink); background:rgba(11,39,48,.06); border-color:rgba(11,39,48,.25)}
  .modal .btn[hidden]{display:none}

  /* Very short windows (phone held sideways): hide the extras so it still fits */
  /* Shorter windows: drop the extras so the cover still fits with no scrolling */
  @media (max-height:740px){ .cover .tag{display:none} }
  @media (max-height:620px){ .cover-art, .credit{display:none} }
  @media (max-height:600px){
    .cover-inner{gap:8px}
  }
  @media (max-height:520px){
    .cover-best{display:none}
    .map{grid-template-columns:repeat(7, minmax(0, 1fr)); max-width:640px}
    .mt-name{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    .card.pop .card-inner, .art-btn, .art-btn.ping{animation:none}
  }
</style>
</head>
<body>

<button id="muteBtn" class="icon-btn mute-btn" type="button" aria-label="Mute sound" aria-pressed="false">🔊</button>

<!-- ===== Cover screen ===== -->
<section id="cover" class="screen cover">
  <div class="cover-inner">
    <div class="cover-art">
      <button class="art-btn" type="button" data-note="523" aria-label="Play a shell note">🐚</button>
      <button class="art-btn" type="button" data-note="659" aria-label="Play a fruit note">🍍</button>
      <button class="art-btn" type="button" data-note="784" aria-label="Play a gem note">💎</button>
    </div>
    <h1>🏝️ Island Match Quest</h1>
    <p class="tag">Flip, match, and unlock seven islands of shells, fruits, gems and more.</p>
    <button id="playBtn" class="btn btn-primary btn-big" type="button">▶ Play</button>
    <p class="cover-best">Best score: <b id="coverBest">0</b> · Stars: <b id="coverStars">0</b></p>
    <div id="map" class="map" aria-label="Island map"></div>
    <p class="goal">🎯 Match every pair to unlock the next island</p>
  </div>
  <footer class="credit">Island Match Quest · by Sumaiyah Sultana</footer>
</section>

<!-- ===== Game screen ===== -->
<section id="game" class="screen" hidden>
  <div class="topbar">
    <button id="homeBtn" class="icon-btn" type="button" aria-label="Back to cover">🏠</button>
    <h1>🏝️ Island Match Quest</h1>
    <button id="restartBtn" class="btn btn-secondary btn-sm" type="button">Restart</button>
  </div>
  <div class="hud">
    <div class="hud-item"><span class="hud-label">Score</span><span id="score" class="hud-value">0</span></div>
    <div class="hud-item"><span class="hud-label">Moves</span><span id="moves" class="hud-value">0</span></div>
    <div class="hud-item"><span class="hud-label">Time</span><span id="time" class="hud-value">0:00</span></div>
    <div class="hud-item"><span class="hud-label">Best</span><span id="best" class="hud-value">0</span></div>
  </div>
  <div id="islandLabel" class="island-label"></div>
  <div id="hint" class="hint" role="status" aria-live="polite" hidden></div>
  <div id="boardWrap" class="board-wrap">
    <main id="board" class="board" aria-label="Memory match board"></main>
  </div>
</section>

<div id="overlay" class="overlay" hidden>
  <div class="modal">
    <h2 id="overlayTitle">Island cleared!</h2>
    <p id="overlayBody"></p>
    <div class="modal-actions">
      <button id="overlayBtn" class="btn btn-primary" type="button">Next island</button>
      <button id="overlayBtn2" class="btn btn-secondary" type="button" hidden>End quest</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  // Each island is a level. Boards grow as you go: 6, 8, 10, 10, 12, 12, 14 pairs.
  var ISLANDS = [
    { name: "Shell Shore",   icons: ["🐚","🦀","🐟","🐙","🦐","🐢"] },
    { name: "Fruit Grove",   icons: ["🍍","🥥","🍌","🍉","🍇","🍓","🥭","🍒"] },
    { name: "Gem Cavern",    icons: ["💎","🔶","🔷","⭐","👑","🏆","🔺","🔮","🟢","🟣"] },
    { name: "Coral Reef",    icons: ["🐠","🐡","🦈","🐳","🐬","🦑","🦞","🐋","⚓","🌊"] },
    { name: "Jungle Trail",  icons: ["🐒","🦜","🐍","🦋","🐸","🌺","🍄","🦎","🐆","🌿","🐘","🐯"] },
    { name: "Volcano Peak",  icons: ["🌋","🔥","💥","☄️","🐉","🦖","🦕","🧨","⚡","🌑","🏮","🦂"] },
    { name: "Starry Lagoon", icons: ["🌙","🌟","🪐","🚀","🛸","🌈","☀️","🌠","🌛","🌌","🔭","👽","🌍","💫"] }
  ];
  var BEST_KEY = "islandMatchQuest.bestScore";
  var PROGRESS_KEY = "islandMatchQuest.progress"; // { unlocked: how many islands are open, stars: [per island] }
  var MOVES_PER_PAIR = 3;      // move limit = pairs x 3 (18, 24, 30)
  var SECOND_CHANCE_MOVES = 6; // extra moves from a second chance (one per island)
  var CARD_GAP = 8;

  /* ---------- Stratos hooks ---------- */
  // Analytics: sends a moment to Stratos analytics (does nothing if it is not there).
  function track(name, details) { try { var S = window.Stratos || parent.Stratos; if (S) S.track(name, details); } catch (e) {} }
  // Rewards: ads are not live yet, so the player gets the reward free for now.
  // Later Stratos will show a rewarded ad here first, then call onDone().
  function offerReward(onDone) { onDone(); }

  var coverEl = document.getElementById("cover");
  var gameEl = document.getElementById("game");
  var playBtn = document.getElementById("playBtn");
  var homeBtn = document.getElementById("homeBtn");
  var coverBestEl = document.getElementById("coverBest");
  var coverStarsEl = document.getElementById("coverStars");
  var mapEl = document.getElementById("map");
  var islandLabelEl = document.getElementById("islandLabel");
  var boardWrap = document.getElementById("boardWrap");
  var boardEl = document.getElementById("board");
  var scoreEl = document.getElementById("score");
  var movesEl = document.getElementById("moves");
  var timeEl = document.getElementById("time");
  var bestEl = document.getElementById("best");
  var overlay = document.getElementById("overlay");
  var overlayTitle = document.getElementById("overlayTitle");
  var overlayBody = document.getElementById("overlayBody");
  var overlayBtn = document.getElementById("overlayBtn");
  var overlayBtn2 = document.getElementById("overlayBtn2");
  var restartBtn = document.getElementById("restartBtn");
  var muteBtn = document.getElementById("muteBtn");
  var hintEl = document.getElementById("hint");

  /* ---------- First-island tutorial: teach by playing, one short hint at a time ---------- */
  var TUT_KEY = "islandMatchQuest.tutorialDone";
  var tutDone = false;
  try { tutDone = localStorage.getItem(TUT_KEY) === "1"; } catch (e) {}
  var tut = { active: false, step: 0 };

  function showHint(text){
    hintEl.textContent = text;
    hintEl.hidden = false;
    hintEl.classList.remove("show"); void hintEl.offsetWidth; hintEl.classList.add("show");
    fitBoard();
  }
  function hideHint(){
    if (hintEl.hidden) return;
    hintEl.hidden = true;
    fitBoard();
  }
  function startTutorial(){
    tut.active = true; tut.step = 0;
    showHint("👆 Tap any card to flip it");
  }
  function finishTutorial(){
    tut.active = false;
    tutDone = true;
    try { localStorage.setItem(TUT_KEY, "1"); } catch (e) {}
    track("tutorial_complete", {});
    hideHint();
  }
  // Called after the first card of a pair is flipped.
  function tutOnFirstFlip(){
    if (tut.active && tut.step === 0){ tut.step = 1; showHint("Now tap a second card to find its twin"); }
  }
  // Called after a pair is checked (matched or not).
  function tutOnPair(matched){
    if (!tut.active) return;
    if (tut.step <= 1){
      tut.step = 2;
      showHint(matched ? "✨ A match! Matched cards stay face up. Clear them all to win." : "No match, so they flip back. Remember where they were!");
    } else if (tut.step === 2){
      tut.step = 3;
      showHint("⭐ Fewer moves earn more stars. You have " + state.moveLimit + " moves here.");
    } else {
      finishTutorial();
    }
  }

  /* ---------- Sound: soft, code-made tones and gentle waves, with a mute button ---------- */
  var MUTE_KEY = "islandMatchQuest.muted";
  var muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) {}
  var audioCtx = null, master = null, waves = null, soundStarted = false;
  var reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

  // iPhone: let game sound play even when the ring/silent switch is on silent.
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (e) {}

  function getAudio(){
    if (!audioCtx){
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
      master = audioCtx.createGain();
      master.gain.value = muted ? 0 : 1;
      master.connect(audioCtx.destination);
    }
    if (audioCtx.state !== "running") { try { audioCtx.resume(); } catch (e) {} }
    return audioCtx;
  }

  // A tiny silent sound file, played on the first touch. On older iPhones this
  // switches audio to "media" mode so the silent switch does not mute the game.
  var silentEl = null;
  function silentWavUrl(){
    var n = 2205, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
    function str(o, s){ for (var i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt ");
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, 22050, true); v.setUint32(28, 44100, true); v.setUint16(32, 2, true);
    v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
    return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
  }

  // Wake up audio on the very first touch or click anywhere (phones need a tap first).
  function unlockAudio(){
    var ctx = getAudio();
    if (ctx){
      try { var s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0); } catch (e) {}
    }
    if (!silentEl){
      try {
        silentEl = new Audio(silentWavUrl());
        silentEl.loop = true;
        silentEl.setAttribute("playsinline", "");
        var p = silentEl.play();
        if (p && p.catch) p.catch(function(){});
      } catch (e) {}
    }
  }
  ["pointerdown", "touchend", "click", "keydown"].forEach(function(ev){
    document.addEventListener(ev, unlockAudio, true);
  });

  // One gentle note: quick fade in, slow fade out, low volume.
  function tone(freq, delay, dur, vol, type, endFreq){
    if (muted) return;
    var ctx = getAudio();
    if (!ctx) return;
    var t = ctx.currentTime + delay;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t + dur);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain); gain.connect(master);
    osc.start(t); osc.stop(t + dur + 0.05);
  }

  // Quiet ocean waves in the background: soft filtered noise that slowly swells and fades.
  function startWaves(){
    if (waves || muted || !soundStarted) return;
    var ctx = getAudio();
    if (!ctx) return;
    var len = ctx.sampleRate * 4;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var d = buf.getChannelData(0), last = 0, i;
    for (i = 0; i < len; i++){ last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    var drift = d[len - 1] - d[0];                         // make the loop seamless
    for (i = 0; i < len; i++) d[i] -= drift * i / (len - 1);
    var src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
    var lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; // phone speakers can't play very low sounds
    var g = ctx.createGain(); g.gain.value = 0.1;
    var lfo = ctx.createOscillator(); lfo.frequency.value = 0.12;
    var lfoAmt = ctx.createGain(); lfoAmt.gain.value = 0.06;
    lfo.connect(lfoAmt); lfoAmt.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(master);
    src.start(); lfo.start();
    waves = { src: src, lfo: lfo };
  }

  // Volumes are set so they are clearly heard on a phone speaker, but stay soft.
  function soundFlip(){ tone(660, 0, 0.14, 0.16, "triangle", 480); }
  function soundMatch(){ [523, 659, 784].forEach(function(f, i){ tone(f, i * 0.07, 0.45, 0.18); }); }
  function soundCelebrate(){ [523, 659, 784, 1047].forEach(function(f, i){ tone(f, i * 0.12, 0.8, 0.18); }); }
  function soundStart(){ [392, 523, 659].forEach(function(f, i){ tone(f, i * 0.09, 0.55, 0.18); }); }
  function soundTap(){ tone(560, 0, 0.12, 0.13, "triangle"); }

  function renderMute(){
    muteBtn.textContent = muted ? "🔇" : "🔊";
    muteBtn.setAttribute("aria-label", muted ? "Turn sound on" : "Mute sound");
    muteBtn.setAttribute("aria-pressed", muted ? "true" : "false");
  }
  muteBtn.addEventListener("click", function(){
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (e) {}
    if (master && audioCtx) master.gain.setTargetAtTime(muted ? 0 : 1, audioCtx.currentTime, 0.05);
    if (!muted){ soundStarted = true; startWaves(); soundTap(); }
    renderMute();
  });
  renderMute();

  // Pause sound when the player switches tab or app.
  document.addEventListener("visibilitychange", function(){
    if (!audioCtx) return;
    if (document.hidden) audioCtx.suspend();
    else if (!muted) audioCtx.resume();
  });

  // Little sparkles that fly out from an element and fade.
  function burst(el, glyphs, count, spread){
    if (reduceMotion) return;
    var r = el.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (var i = 0; i < count; i++){
      var s = document.createElement("span");
      s.className = "burst";
      s.textContent = glyphs[i % glyphs.length];
      var ang = Math.random() * Math.PI * 2;
      var d = spread * (0.6 + Math.random() * 0.6);
      s.style.left = (cx - 11) + "px";
      s.style.top = (cy - 14) + "px";
      s.style.setProperty("--dx", Math.round(Math.cos(ang) * d) + "px");
      s.style.setProperty("--dy", Math.round(Math.sin(ang) * d) + "px");
      document.body.appendChild(s);
      setTimeout(function(n){ return function(){ n.remove(); }; }(s), 950);
    }
  }

  /* ---------- Game ---------- */
  var state = {
    islandIndex: 0,
    totalScore: 0,
    scoreAtStart: 0,
    moves: 0,
    seconds: 0,
    matchedPairs: 0,
    totalPairs: 0,
    moveLimit: 0,
    usedSecondChance: false,
    flipped: [],
    busy: false,
    timer: null
  };

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  function formatTime(s){
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function loadBest(){
    var v = 0;
    try { v = parseInt(localStorage.getItem(BEST_KEY) || "0", 10); } catch (e) {}
    return isNaN(v) ? 0 : v;
  }

  function saveBestIfHigher(score){
    var best = loadBest();
    if (score > best){
      try { localStorage.setItem(BEST_KEY, String(score)); } catch (e) {}
      best = score;
    }
    return best;
  }

  /* ---------- Saved progress: unlocked islands and stars ---------- */
  function loadProgress(){
    var p = null;
    try { p = JSON.parse(localStorage.getItem(PROGRESS_KEY)); } catch (e) {}
    if (!p || typeof p !== "object") p = {};
    var unlocked = parseInt(p.unlocked, 10);
    if (isNaN(unlocked) || unlocked < 1) unlocked = 1;
    unlocked = Math.min(unlocked, ISLANDS.length);
    var stars = ISLANDS.map(function(_, i){
      var s = p.stars && parseInt(p.stars[i], 10);
      return (s >= 1 && s <= 3) ? s : 0;
    });
    return { unlocked: unlocked, stars: stars };
  }
  var progress = loadProgress();
  function saveProgress(){
    try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
  }
  function totalStars(){ return progress.stars.reduce(function(a, b){ return a + b; }, 0); }
  function starText(n){ return "★★★".slice(0, n) + "☆☆☆".slice(0, 3 - n); }

  // 3 stars: near-perfect memory. 2 stars: good. 1 star: cleared.
  function starsFor(pairs, moves){
    if (moves <= Math.ceil(pairs * 1.6)) return 3;
    if (moves <= Math.ceil(pairs * 2.2)) return 2;
    return 1;
  }

  function renderIslandLabel(){
    islandLabelEl.textContent = "Island " + (state.islandIndex + 1) + "/" + ISLANDS.length + " · " + ISLANDS[state.islandIndex].name;
  }

  function renderMap(){
    mapEl.innerHTML = "";
    ISLANDS.forEach(function(isl, i){
      var open = i < progress.unlocked;
      var tile = document.createElement("button");
      tile.type = "button";
      tile.className = "map-tile" + (open ? "" : " locked") + (open && i === progress.unlocked - 1 && !progress.stars[i] ? " next" : "");
      tile.setAttribute("aria-label", (i + 1) + ". " + isl.name + (open ? (progress.stars[i] ? ", " + progress.stars[i] + " stars" : ", ready to play") : ", locked"));
      tile.innerHTML =
        '<span class="mt-icon">' + (open ? isl.icons[0] : "🔒") + '</span>' +
        '<span class="mt-name">' + (i + 1) + '. ' + isl.name + '</span>' +
        '<span class="mt-stars">' + (open ? starText(progress.stars[i]) : "&nbsp;") + '</span>';
      tile.addEventListener("click", function(){
        if (!open){
          tone(220, 0, 0.18, 0.1, "triangle");
          tile.classList.remove("shake"); void tile.offsetWidth; tile.classList.add("shake");
          return;
        }
        beginPlay(i);
      });
      mapEl.appendChild(tile);
    });
    var next = Math.min(progress.unlocked, ISLANDS.length) - 1;
    playBtn.textContent = next === 0 && !progress.stars[0] ? "▶ Play" : "▶ Play · Island " + (next + 1);
    coverStarsEl.textContent = totalStars() + "/" + (ISLANDS.length * 3);
  }

  function renderMoves(){
    movesEl.textContent = state.moves + " / " + state.moveLimit;
  }

  function updateHud(){
    scoreEl.textContent = state.totalScore;
    renderMoves();
    timeEl.textContent = formatTime(state.seconds);
    bestEl.textContent = loadBest();
  }

  function stopTimer(){
    if (state.timer){ clearInterval(state.timer); state.timer = null; }
  }

  function startTimer(){
    stopTimer();
    state.timer = setInterval(function(){
      state.seconds++;
      timeEl.textContent = formatTime(state.seconds);
    }, 1000);
  }

  // Size the cards so the whole board fits the space left on screen (no scrolling).
  // Picks the number of columns that gives the biggest cards for this window
  // (tall phone: fewer columns, wide laptop: more columns).
  function fitBoard(){
    var n = ISLANDS[state.islandIndex].icons.length * 2;
    var w = boardWrap.clientWidth, h = boardWrap.clientHeight;
    if (!w || !h) return;
    var cols = 4, size = 0, bestScore = -1;
    for (var c = 3; c <= 8; c++){
      var r = Math.ceil(n / c);
      var s = Math.min((w - CARD_GAP * (c - 1)) / c, (h - CARD_GAP * (r - 1)) / r, 100);
      var score = s - (r * c - n) * 2; // small preference for boards with no empty gaps
      if (score > bestScore){ bestScore = score; cols = c; size = s; }
    }
    size = Math.max(Math.floor(size), 28);
    boardEl.style.setProperty("--card", size + "px");
    boardEl.style.gridTemplateColumns = "repeat(" + cols + ", " + size + "px)";
  }
  window.addEventListener("resize", fitBoard);

  function buildDeck(island){
    return shuffle(island.icons.concat(island.icons));
  }

  function startIsland(index){
    state.islandIndex = index;
    state.scoreAtStart = state.totalScore;
    state.moves = 0;
    state.seconds = 0;
    state.matchedPairs = 0;
    state.flipped = [];
    state.busy = false;

    var island = ISLANDS[index];
    state.totalPairs = island.icons.length;
    state.moveLimit = state.totalPairs * MOVES_PER_PAIR;
    state.usedSecondChance = false;

    var deck = buildDeck(island);
    boardEl.innerHTML = "";

    deck.forEach(function(icon, i){
      var card = document.createElement("button");
      card.type = "button";
      card.className = "card";
      card.setAttribute("aria-label", "Hidden card");
      card.dataset.icon = icon;
      card.dataset.index = String(i);
      card.innerHTML =
        '<div class="card-inner">' +
          '<div class="card-face card-back"></div>' +
          '<div class="card-face card-front">' + icon + '</div>' +
        '</div>';
      card.addEventListener("click", onCardClick);
      boardEl.appendChild(card);
    });

    renderIslandLabel();
    updateHud();
    tut.active = false;
    hintEl.hidden = true;
    if (index === 0 && !tutDone && !progress.stars[0]) startTutorial();
    fitBoard();
    startTimer();
    track("level_start", { level: index + 1, island: island.name });
  }

  function onCardClick(e){
    var card = e.currentTarget;
    if (state.busy || card.classList.contains("flipped") || card.classList.contains("matched")) return;

    card.classList.add("flipped");
    state.flipped.push(card);
    soundFlip();
    if (state.flipped.length === 1) tutOnFirstFlip();

    if (state.flipped.length === 2){
      state.moves++;
      renderMoves();
      state.busy = true;

      var a = state.flipped[0], b = state.flipped[1];
      var island = state.islandIndex;
      if (a.dataset.icon === b.dataset.icon){
        setTimeout(function(){
          if (island !== state.islandIndex || !a.isConnected) return; // board was restarted
          a.classList.add("matched");
          b.classList.add("matched");
          a.setAttribute("aria-label", "Matched " + a.dataset.icon);
          b.setAttribute("aria-label", "Matched " + b.dataset.icon);
          a.classList.add("pop"); b.classList.add("pop");
          setTimeout(function(){ a.classList.remove("pop"); b.classList.remove("pop"); }, 520);
          soundMatch();
          burst(a, ["✨"], 4, 40);
          burst(b, ["✨"], 4, 40);
          state.matchedPairs++;
          state.totalScore += 50;
          updateHud();
          state.flipped = [];
          state.busy = false;
          tutOnPair(true);
          if (state.matchedPairs === state.totalPairs) onIslandComplete();
          else checkOutOfMoves();
        }, 350);
      } else {
        setTimeout(function(){
          if (island !== state.islandIndex || !a.isConnected) return; // board was restarted
          a.classList.remove("flipped");
          b.classList.remove("flipped");
          state.flipped = [];
          state.busy = false;
          tutOnPair(false);
          checkOutOfMoves();
        }, 800);
      }
    }
  }

  function checkOutOfMoves(){
    if (state.moves < state.moveLimit) return;
    stopTimer();
    var level = state.islandIndex + 1;
    var left = state.totalPairs - state.matchedPairs;

    if (state.usedSecondChance){ gameOver(); return; }

    // Second chance: the rewarded moment (one per island).
    track("reward_offered", { type: "second_chance", level: level });
    showModal(
      "Out of moves!",
      "Only " + left + (left === 1 ? " pair" : " pairs") + " left on " + ISLANDS[state.islandIndex].name + ".\n" +
      "Take a second chance for " + SECOND_CHANCE_MOVES + " more moves?",
      "Second chance (+" + SECOND_CHANCE_MOVES + " moves)",
      function(){
        offerReward(function(){
          track("reward_taken", { type: "second_chance", level: level });
          state.usedSecondChance = true;
          state.moveLimit += SECOND_CHANCE_MOVES;
          renderMoves();
          hideOverlay();
          startTimer();
        });
      },
      "End quest",
      gameOver
    );
  }

  function gameOver(){
    stopTimer();
    var best = saveBestIfHigher(state.totalScore);
    bestEl.textContent = best;
    track("game_over", { level: state.islandIndex + 1, score: state.totalScore, pairs_left: state.totalPairs - state.matchedPairs });
    showModal(
      "Game over",
      "You reached " + ISLANDS[state.islandIndex].name + ".\n" +
      "Final score: " + state.totalScore + "\n" +
      "Best score: " + best,
      "Try again",
      function(){ hideOverlay(); startQuestAt(state.islandIndex); },
      "Island map",
      function(){ hideOverlay(); showCover(); }
    );
  }

  // Bigger islands are worth a bigger bonus.
  function islandBonus(pairs, moves, seconds){
    var extraMoves = Math.max(0, moves - pairs);
    var raw = Math.max(300, pairs * 40) - extraMoves * 8 - seconds;
    return Math.max(0, Math.round(raw));
  }

  function onIslandComplete(){
    stopTimer();
    var bonus = islandBonus(state.totalPairs, state.moves, state.seconds);
    state.totalScore += bonus;
    updateHud();

    var idx = state.islandIndex;
    var isLast = idx === ISLANDS.length - 1;
    var island = ISLANDS[idx];
    var stars = starsFor(state.totalPairs, state.moves);
    var newBestStars = stars > progress.stars[idx];
    if (newBestStars) progress.stars[idx] = stars;
    var unlockedNew = !isLast && progress.unlocked < idx + 2;
    if (unlockedNew) progress.unlocked = idx + 2;
    saveProgress();
    var best = saveBestIfHigher(state.totalScore);
    bestEl.textContent = best;

    track("level_complete", { level: idx + 1, moves: state.moves, seconds: state.seconds, bonus: bonus, score: state.totalScore, stars: stars });
    if (unlockedNew) track("island_unlocked", { level: idx + 2 });

    var lines =
      starText(stars) + (newBestStars && stars > 1 ? "  new best!" : "") + "\n" +
      "Moves: " + state.moves + "  ·  Time: " + formatTime(state.seconds) + "\n" +
      "Speed bonus: +" + bonus + "\n" +
      "Score: " + state.totalScore;

    if (isLast){
      showModal(
        "All 7 islands cleared! 🎉",
        lines + "\nBest score: " + best + "\n" +
        "Stars collected: " + totalStars() + "/" + (ISLANDS.length * 3),
        "Island map",
        function(){ hideOverlay(); showCover(); }
      );
    } else {
      var next = ISLANDS[idx + 1];
      showModal(
        island.name + " cleared!",
        lines + (unlockedNew ? "\n🔓 New island unlocked: " + next.name + "!" : ""),
        "Next island: " + next.name,
        function(){ hideOverlay(); startIsland(idx + 1); },
        "Island map",
        function(){ hideOverlay(); showCover(); }
      );
    }
    soundCelebrate();
    burst(overlayTitle, ["🎉", "✨", "⭐"].concat(island.icons.slice(0, 3)), 18, 170);
  }

  function showModal(title, body, label, onClick, label2, onClick2){
    overlayTitle.textContent = title;
    overlayBody.textContent = body;
    overlayBtn.textContent = label;
    overlayBtn.onclick = onClick;
    overlayBtn2.hidden = !label2;
    if (label2){ overlayBtn2.textContent = label2; overlayBtn2.onclick = onClick2; }
    showOverlay();
  }

  function showOverlay(){ overlay.hidden = false; overlayBtn.focus(); }
  function hideOverlay(){ overlay.hidden = true; }

  // A fresh run starting at any unlocked island; score counts from 0.
  function startQuestAt(index){
    stopTimer();
    state.totalScore = 0;
    startIsland(index);
  }

  // Restart button: replay this island, giving back the score you had when it began.
  function restartIsland(){
    stopTimer();
    state.totalScore = state.scoreAtStart;
    startIsland(state.islandIndex);
  }

  /* ---------- Screens ---------- */
  function showCover(){
    stopTimer();
    hideOverlay();
    gameEl.hidden = true;
    coverEl.hidden = false;
    coverBestEl.textContent = loadBest();
    renderMap();
    playBtn.focus();
  }

  function beginPlay(index){
    soundStarted = true;
    soundStart();
    startWaves();
    coverEl.hidden = true;
    gameEl.hidden = false;
    startQuestAt(index);
  }

  playBtn.addEventListener("click", function(){
    beginPlay(Math.min(progress.unlocked, ISLANDS.length) - 1);
  });

  // Cover emojis: tap for a soft note and a little bounce.
  [].forEach.call(document.querySelectorAll(".art-btn"), function(btn){
    btn.addEventListener("click", function(){
      soundStarted = true;
      tone(parseFloat(btn.dataset.note), 0, 0.6, 0.18);
      tone(parseFloat(btn.dataset.note) * 2, 0.05, 0.4, 0.05);
      btn.classList.remove("ping"); void btn.offsetWidth; btn.classList.add("ping");
      setTimeout(function(){ btn.classList.remove("ping"); }, 520);
      startWaves();
    });
  });

  homeBtn.addEventListener("click", function(){ soundTap(); showCover(); });
  restartBtn.addEventListener("click", function(){ soundTap(); hideOverlay(); restartIsland(); });

  showCover();
})();
</script>
</body>
</html>
