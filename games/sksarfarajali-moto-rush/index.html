<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MOTO RUSH</title>
<style>
:root{--bg:#0b0b12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:system-ui,"Segoe UI",Roboto,sans-serif;color:#fff}
#game,#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
.layer{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center;background:rgba(8,8,18,.5)}
.layer.on{display:flex}
h1{margin:0;font-size:clamp(44px,15vw,92px);font-style:italic;font-weight:900;letter-spacing:.04em;line-height:.95;text-shadow:0 4px 0 #a3200f,0 0 30px rgba(255,90,54,.5)}
h2{margin:0;font-size:clamp(34px,10vw,60px);font-style:italic;font-weight:900;color:#ff5a36;text-shadow:0 3px 0 #5b130a}
.tag{margin:0;color:#c9cbe0;font-size:15px;letter-spacing:.08em}
.btn{border:0;border-radius:16px;padding:14px 26px;font:800 20px system-ui,sans-serif;color:#fff;cursor:pointer;min-width:230px;background:linear-gradient(#ff7a4a,#ff3d2e);box-shadow:0 6px 0 #a3200f,0 10px 24px rgba(255,60,40,.35);touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #a3200f}
.btn.alt{background:linear-gradient(#5c6cff,#2a35c8);box-shadow:0 6px 0 #161d7a,0 10px 24px rgba(60,80,255,.3)}
.btn.alt:active{box-shadow:0 3px 0 #161d7a}
.btn.ghost{background:#2a2c3e;box-shadow:0 5px 0 #14151f;font-size:17px;padding:11px 22px}
.btn small{display:block;font-size:12px;font-weight:600;opacity:.85;margin-top:2px}
.stats{color:#e3e5f5;font-size:14px;line-height:1.5}
.stats b{color:#ffd23a}
.sw{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sw button{width:46px;height:46px;border-radius:50%;border:3px solid #444;position:relative;cursor:pointer;touch-action:manipulation;padding:0}
.sw button.sel{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.sw button .lock{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.62);font:700 11px system-ui;display:flex;align-items:center;justify-content:center;color:#ffd23a}
.hint{max-width:340px;color:#9ea2c2;font-size:13px;line-height:1.4}
.big{font-size:clamp(46px,16vw,84px);font-weight:900;font-style:italic;line-height:1}
#ctl{position:fixed;left:0;right:0;bottom:0;display:none;pointer-events:none;z-index:5}
#ctl.on{display:block}
.cbtn{position:fixed;bottom:calc(26px + env(safe-area-inset-bottom));width:92px;height:92px;border-radius:50%;border:0;color:#fff;font:900 14px system-ui;letter-spacing:.05em;pointer-events:auto;touch-action:none;opacity:.92}
#nitro{right:18px;background:radial-gradient(circle at 35% 30%,#7fe4ff,#1b7dff 70%);box-shadow:0 0 0 4px rgba(255,255,255,.25),0 0 24px rgba(40,140,255,.7)}
#nitro.down{transform:scale(.94);filter:brightness(1.2)}
#brake{left:18px;width:74px;height:74px;background:radial-gradient(circle at 35% 30%,#ff9a8a,#d4281c 70%);box-shadow:0 0 0 3px rgba(255,255,255,.2)}
#brake.down{transform:scale(.94);filter:brightness(1.2)}
#snd{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:6;border:0;border-radius:12px;background:rgba(20,20,34,.7);color:#fff;font:700 13px system-ui;padding:8px 12px;cursor:pointer;touch-action:manipulation}

/* ---- pro menu ---- */
#menu{justify-content:space-between;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(4,5,14,.8) 0%,rgba(4,5,14,.15) 30%,rgba(4,5,14,0) 48%,rgba(4,5,14,.55) 62%,rgba(4,5,14,.92) 100%)}
.top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:center}
.chip{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:rgba(14,16,34,.7);border:1px solid rgba(255,255,255,.14);font-weight:800;font-size:15px}
.chip svg{width:18px;height:18px}
.brand{margin-top:-4px}
.logo{font-size:clamp(50px,16vw,88px);font-style:italic;font-weight:900;line-height:.88;letter-spacing:.02em;background:linear-gradient(180deg,#fff 10%,#ffc9b8 55%,#ff6a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(140,30,10,.55)) drop-shadow(0 0 22px rgba(255,90,54,.45))}
.logo span{display:block;letter-spacing:.18em;font-size:.62em;margin-top:2px}
.brand .tag{margin-top:8px;font-weight:700;font-size:12px;letter-spacing:.32em;color:#ffd1c2}
.brand .tag:before,.brand .tag:after{content:"";display:inline-block;width:34px;height:2px;background:linear-gradient(90deg,transparent,#ff5a36);vertical-align:middle;margin:0 10px}
.brand .tag:after{background:linear-gradient(90deg,#ff5a36,transparent)}
.spacer{flex:1}
.panel{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;align-items:stretch;padding:14px;border-radius:22px;background:rgba(12,14,30,.74);border:1px solid rgba(255,255,255,.13);box-shadow:0 18px 50px rgba(0,0,0,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip2{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 4px}
.chip2 small,.tiles small{display:block;font-size:10px;letter-spacing:.16em;color:#9ea2c2;font-weight:700}
.chip2 b,.tiles b{font-size:20px;font-weight:900;font-style:italic}
.reward{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#c9cbe0;text-align:left}
.rbar{height:8px;border-radius:6px;background:rgba(255,255,255,.1);overflow:hidden}
.rbar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#ffb32e,#ffe27a);transition:width .6s}
.panel .btn{min-width:0;width:100%}
.btnrow{display:grid;grid-template-columns:1fr;gap:10px}
.garage{display:flex;flex-direction:column;gap:6px;align-items:center}
.garage #bname{font-size:12px;letter-spacing:.2em;color:#9ea2c2;font-weight:700;text-transform:uppercase}
.hint{align-self:center}
#over{background:radial-gradient(ellipse at center,rgba(8,8,20,.7),rgba(4,4,12,.92))}
#over .panel{text-align:center}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tiles>div{background:rgba(255,255,255,.07);border-radius:12px;padding:8px 4px}
.tiles b{color:#ffd23a}
#snd{top:calc(12px + env(safe-area-inset-top))}

/* ---- 30 second demo ---- */
#demoUI{position:fixed;inset:0;display:none;pointer-events:none;z-index:4}
#demoUI.on{display:block}
.dz{position:absolute;top:0;bottom:0;width:50%;opacity:0;transition:opacity .15s;display:flex;align-items:center;justify-content:center;font:900 54px system-ui;color:#fff}
.dz.dl{left:0;background:linear-gradient(90deg,rgba(80,150,255,.45),transparent)}
.dz.dr{right:0;background:linear-gradient(270deg,rgba(80,150,255,.45),transparent)}
.dz.on{opacity:1}
.dcap{position:absolute;left:50%;transform:translateX(-50%);top:calc(190px + env(safe-area-inset-top));width:calc(100% - 28px);max-width:400px;text-align:center;padding:12px 14px;border-radius:16px;background:rgba(10,12,28,.8);border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 30px rgba(0,0,0,.45)}
.dtag{display:inline-block;font-size:10px;letter-spacing:.25em;font-weight:800;background:#ff5a36;border-radius:6px;padding:2px 8px;margin-bottom:6px}
#dtitle{display:block;font-size:24px;font-style:italic;font-weight:900;letter-spacing:.04em}
#dsub2{display:block;font-size:14px;color:#cfd2ea;margin-top:3px;line-height:1.35}
.dkeys{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:calc(100% - 24px);max-width:400px}
.dk{background:rgba(14,16,34,.78);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 2px;text-align:center;transition:all .12s}
.dk b{display:block;font-size:22px;line-height:1.1}
.dk small{display:block;font-size:11px;font-weight:800;letter-spacing:.1em}
.dk i{display:block;font-style:normal;font-size:10px;color:#9ea2c2;margin-top:2px}
.dk.on{background:linear-gradient(#ffd23a,#ff8a1f);border-color:#fff;color:#1a1200;transform:translateY(-6px) scale(1.05);box-shadow:0 0 24px rgba(255,170,40,.8)}
.dk.on i{color:#4a2c00}
.dbar{position:absolute;left:14px;right:14px;bottom:calc(112px + env(safe-area-inset-bottom));max-width:400px;margin:0 auto;height:5px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.dbar i{display:block;height:100%;width:0;background:#ff5a36}
#dskip{position:fixed;pointer-events:auto;bottom:calc(126px + env(safe-area-inset-bottom));right:14px;border:0;border-radius:12px;background:rgba(20,20,34,.85);color:#fff;font:800 13px system-ui;padding:9px 14px;cursor:pointer;touch-action:manipulation}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="game"></canvas>

<div id="menu" class="layer on">
  <div class="top"><div class="chip" title="Coins"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc83a"/><circle cx="12" cy="12" r="7" fill="none" stroke="#c98a00" stroke-width="2"/><path d="M12 8v8M9.5 10.2c.4-.8 1.4-1.2 2.5-1.2s2.1.4 2.5 1.2" stroke="#c98a00" stroke-width="1.6" fill="none"/></svg><b id="mcoins">0</b></div></div>
  <div class="brand"><div class="logo">MOTO<span>RUSH</span></div><div class="tag">RIDE BEYOND LIMITS</div></div>
  <div class="spacer"></div>
  <div class="panel">
    <div class="chips">
      <div class="chip2"><small>BEST</small><b id="mbest">0</b></div>
      <div class="chip2"><small>STREAK</small><b id="mstreak">0</b></div>
      <div class="chip2"><small>TODAY</small><b id="mtoday">-</b></div>
    </div>
    <div class="reward"><div class="rbar"><i id="rfill"></i></div><span id="rtxt"></span></div>
    <div class="btnrow">
      <button class="btn" id="ride">RIDE<small>endless traffic run</small></button>
      <button class="btn alt" id="daily">DAILY RUN<small id="dsub">same road for everyone today</small></button>
    </div>
    <button class="btn ghost" id="demo">&#9654; WATCH DEMO (30 s)</button>
    <div class="garage"><span id="bname">Flame</span><div class="sw" id="sw"></div></div>
  </div>
</div>

<div id="over" class="layer">
  <div class="panel">
    <h2 id="otitle">CRASHED</h2>
    <div class="big" id="oscore">0</div>
    <div class="tiles"><div><small>DISTANCE</small><b id="odist">0</b></div><div><small>BEST</small><b id="obest">0</b></div><div><small>COINS</small><b id="ocoin">0</b></div></div>
    <div class="stats" id="ostats"></div>
    <button class="btn alt" id="revive">SECOND CHANCE<small>keep your run going (once)</small></button>
    <button class="btn" id="again">RIDE AGAIN</button>
    <button class="btn ghost" id="home">MENU</button>
  </div>
</div>

<div id="demoUI">
  <div class="dz dl" id="dzL">&#9664;</div><div class="dz dr" id="dzR">&#9654;</div>
  <div class="dcap"><span class="dtag">DEMO &middot; <span id="dtime">30</span>s</span><b id="dtitle"></b><span id="dsub2"></span></div>
  <div class="dbar"><i id="dprog"></i></div>
  <div class="dkeys">
    <div class="dk" id="dkL"><b>&#9664;</b><small>LEFT</small><i>&larr; / A</i></div>
    <div class="dk" id="dkR"><b>&#9654;</b><small>RIGHT</small><i>&rarr; / D</i></div>
    <div class="dk" id="dkB"><b>&#9632;</b><small>BRAKE</small><i>&darr; / S</i></div>
    <div class="dk" id="dkN"><b>&#9889;</b><small>NITRO</small><i>Space / Shift</i></div>
  </div>
  <button id="dskip">SKIP</button>
</div>
<div id="ctl"><button class="cbtn" id="brake">BRAKE</button><button class="cbtn" id="nitro">NITRO</button></div>
<button id="snd">Sound: off</button>

<script src="vendor/three.min.js"></script>
<script>
(function(){
'use strict';

/* ---- Stratos hooks ---- */
function track(name, details) { try { var S = window.Stratos || parent.Stratos; if (S) S.track(name, details); } catch (e) {} }
function offerReward(onDone) { onDone(); } /* later: show a rewarded ad first */

/* ---- storage (safe) ---- */
var store = {
  get: function (k, d) { try { var v = localStorage.getItem('moto.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('moto.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---- constants ---- */
var SEG = 200, ROAD = 750, CAMH = 1500, PZ = 700, DEPTH = 0.84;
var MAXS = 11000, ACCEL = MAXS / 5, NITRO_MAX = MAXS * 1.45;
var CENTRI = 0.4, HITLEN = 250;
var LANES = [-0.75, -0.25, 0.25, 0.75];
var LANESPEED = [0.30, 0.38, 0.46, 0.54];
var MAXCARS = 44;
var quality = 1;          /* 1 = full, 0 = lite (auto) */
var DRAW = 140;

/* ---- utils ---- */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return (n >>> 0) / 4294967296; }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function ease(a, b, p) { return a + (b - a) * (-Math.cos(p * Math.PI) / 2 + 0.5); }
function rgb(c, a) { return a == null ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')' : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')'; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function dayNum(s) { var p = s.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function strSeed(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r); ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h); ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r); ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath(); }

/* ---- canvas ---- */
var cv = document.getElementById('game'), ctx = cv.getContext('2d');
var W = 300, H = 500, S = 300, HY = 200, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, quality > 0 ? 1.5 : 1);
  W = cv.width = Math.max(100, Math.floor(innerWidth * dpr));
  H = cv.height = Math.max(100, Math.floor(innerHeight * dpr));
  S = Math.min(W, H * 0.78); HY = H * 0.38;
  if (typeof renderer !== 'undefined' && renderer) { renderer.setPixelRatio(1); renderer.setSize(W, H, false); }
}
window.addEventListener('resize', resize);

/* ---- themes ---- */
var THEMES = [
  { name: 'Sunset Coast', top: [60, 40, 110], bot: [255, 150, 90], grass: [[30, 140, 120], [26, 128, 110]], road: [[70, 70, 82], [64, 64, 76]], rum: [[235, 235, 235], [215, 45, 45]], lane: [240, 240, 240], fog: [255, 150, 90], sun: [255, 225, 150], sil: [70, 45, 110], deco: 'palm', night: 0 },
  { name: 'Neon Night', top: [5, 5, 28], bot: [96, 30, 124], grass: [[14, 16, 36], [12, 14, 32]], road: [[40, 40, 58], [36, 36, 52]], rum: [[255, 60, 180], [60, 220, 255]], lane: [255, 240, 120], fog: [70, 22, 100], sun: [205, 222, 255], sil: [22, 22, 54], deco: 'city', night: 1 },
  { name: 'Desert Storm', top: [90, 160, 235], bot: [250, 222, 172], grass: [[226, 190, 120], [218, 182, 112]], road: [[88, 84, 84], [82, 78, 78]], rum: [[240, 240, 240], [240, 120, 40]], lane: [250, 250, 250], fog: [250, 222, 172], sun: [255, 250, 220], sil: [215, 160, 100], deco: 'cactus', night: 0 },
  { name: 'Alpine Pass', top: [60, 120, 200], bot: [200, 225, 245], grass: [[236, 242, 248], [224, 232, 242]], road: [[78, 80, 90], [72, 74, 84]], rum: [[240, 240, 240], [50, 100, 200]], lane: [250, 250, 250], fog: [200, 225, 245], sun: [255, 255, 240], sil: [140, 165, 200], deco: 'pine', night: 0 }
];
function copyTheme(t) { return { top: t.top.slice(), bot: t.bot.slice(), g0: t.grass[0].slice(), g1: t.grass[1].slice(), r0: t.road[0].slice(), r1: t.road[1].slice(), u0: t.rum[0].slice(), u1: t.rum[1].slice(), lane: t.lane.slice(), fog: t.fog.slice(), sun: t.sun.slice(), sil: t.sil.slice() }; }
function lerpArr(a, b, k) { for (var i = 0; i < 3; i++) a[i] += (b[i] - a[i]) * k; }
var cur = copyTheme(THEMES[0]);
function mixTheme(t, k) {
  lerpArr(cur.top, t.top, k); lerpArr(cur.bot, t.bot, k); lerpArr(cur.g0, t.grass[0], k); lerpArr(cur.g1, t.grass[1], k);
  lerpArr(cur.r0, t.road[0], k); lerpArr(cur.r1, t.road[1], k); lerpArr(cur.u0, t.rum[0], k); lerpArr(cur.u1, t.rum[1], k);
  lerpArr(cur.lane, t.lane, k); lerpArr(cur.fog, t.fog, k); lerpArr(cur.sun, t.sun, k); lerpArr(cur.sil, t.sil, k);
}

/* ---- bikes (colours) ---- */
var BIKES = [
  { n: 'Flame', c: '#ff5a36', cost: 0 }, { n: 'Ice', c: '#36c3ff', cost: 100 }, { n: 'Toxic', c: '#8aff3a', cost: 250 },
  { n: 'Gold', c: '#ffd23a', cost: 500 }, { n: 'Violet', c: '#b46bff', cost: 900 }
];
var CARCOLS = [['#c9c9d4', '#8e8e9c'], ['#2f6bff', '#1b3e9a'], ['#e8d13a', '#a8951c'], ['#ffffff', '#b9b9c4'], ['#2bc27a', '#188552'], ['#e84a6f', '#a52a49'], ['#3a3a48', '#23232e']];

/* ---- save data ---- */
var save = {
  coins: store.get('coins', 0), best: store.get('best', 0), owned: store.get('owned', [0]), sel: store.get('sel', 0),
  streak: store.get('streak', 0), last: store.get('last', ''), grace: store.get('grace', false), dailyBest: store.get('dailyBest', {})
};
function persist() { store.set('coins', save.coins); store.set('best', save.best); store.set('owned', save.owned); store.set('sel', save.sel); store.set('streak', save.streak); store.set('last', save.last); store.set('grace', save.grace); store.set('dailyBest', save.dailyBest); }

/* ---- track ---- */
var segs = [], N = 0, L = 0, startTheme = 0;
function buildTrack(seed) {
  var r = rng(seed); segs = [];
  function add(c) { segs.push({ i: segs.length, curve: c, deco: null }); }
  function sect(e, h, l, c) { var i; for (i = 0; i < e; i++) add(ease(0, c, i / e)); for (i = 0; i < h; i++) add(c); for (i = 0; i < l; i++) add(ease(c, 0, i / l)); }
  for (var i = 0; i < 90; i++) add(0);
  while (segs.length < 1500) {
    var t = r();
    if (t < 0.28) { sect(12, 20 + (r() * 50 | 0), 12, 0); }
    else { var c = (0.7 + r() * 1.6) * (r() < 0.5 ? -1 : 1); sect(18 + (r() * 14 | 0), 18 + (r() * 60 | 0), 18 + (r() * 14 | 0), c); }
  }
  for (i = 0; i < 60; i++) add(0);
  N = segs.length; L = N * SEG;
  for (i = 0; i < N; i++) {
    if (i % 4 === 0) segs[i].deco = { side: (i / 4 | 0) % 2 ? 1 : -1, off: 1.35 + r() * 0.9, v: r() };
    else if (i % 4 === 2 && r() < 0.35) segs[i].deco = { side: (i / 4 | 0) % 2 ? -1 : 1, off: 1.6 + r() * 1.4, v: r() };
  }
  startTheme = seed % 4;
}
function segIdx(z) { return ((Math.floor(z / SEG) % N) + N) % N; }
function wrapS(d) { d = ((d % L) + L) % L; if (d > L / 2) d -= L; return d; }

/* ---- game state ---- */

/* ---- simulation ---- */
function stepSim(dt) {

    playerX += dt * steerV * (0.6 + 1.6 * Math.min(sp, 1.45));
    playerX -= dt * 2 * sp * sp * seg.curve * CENTRI * (demo ? 0.3 : 1);
    var wantN = wantNitro();
    nitroOn = !!(wantN && nitro > 0 && speed > 2500);
    if (nitroOn) nitro = Math.max(0, nitro - 30 * dt);
    var cap = nitroOn ? NITRO_MAX : MAXS;
    if (Math.abs(playerX) > 1.05) cap = Math.min(cap, MAXS * 0.28);
    var acc = nitroOn ? ACCEL * 2.6 : ACCEL;
    if (wantBrake()) speed = Math.max(2200, speed - MAXS * 1.3 * dt);

}

      quadAt(k, -R * 1.14, -R, 0.012); colQ(band ? cur.u1 : cur.u0);

      quadAt(k, -R, R, 0); colQ(band ? cur.r1 : cur.r0);
      var on = sg.i % 6 < 3, lw = on ? 0.09 : 0;
      for (q = -0.5; q <= 0.51; q += 0.5) { quadAt(k, q * R - lw, q * R + lw, 0.02); colQ(cur.lane); }
    }
    roadGeo.attributes.position.needsUpdate = true; roadGeo.attributes.color.needsUpdate = true; roadGeo.setDrawRange(0, nseg * Q * 6);

    /* colours */
    var fc = cur.bot; scene.fog.color.setRGB(fc[0] / 255, fc[1] / 255, fc[2] / 255); renderer.setClearColor(scene.fog.color, 1);
    groundMesh.material.color.setRGB(cur.g0[0] / 255, cur.g0[1] / 255, cur.g0[2] / 255);
    var sc = skyGeo.attributes.color, sp = skyGeo.attributes.position, yy;
    for (k = 0; k < sp.count; k++) {
      yy = sp.getY(k) / 405; var t2 = yy <= 0 ? 0 : Math.pow(yy, 0.55);
      sc.setXYZ(k, (cur.bot[0] + (cur.top[0] - cur.bot[0]) * t2) / 255, (cur.bot[1] + (cur.top[1] - cur.bot[1]) * t2) / 255, (cur.bot[2] + (cur.top[2] - cur.bot[2]) * t2) / 255);
    }
    sc.needsUpdate = true;
    sunMesh.material.color.setRGB(cur.sun[0] / 255, cur.sun[1] / 255, cur.sun[2] / 255);
    hillsMesh.material.color.setRGB(cur.sil[0] / 255, cur.sil[1] / 255, cur.sil[2] / 255); cityMesh.material.color.setRGB(cur.sil[0] / 255, cur.sil[1] / 255, cur.sil[2] / 255);
    hillsMesh.visible = th.deco !== 'city'; cityMesh.visible = th.deco === 'city'; starsPts.visible = !!th.night && quality > 0;
    horizon.rotation.y = bgAng;
    var li = th.night ? 0.62 : 0.95; hemi.intensity += (li - hemi.intensity) * Math.min(1, dt * 2); sun.intensity = th.night ? 0.6 : 1.05;
    hemi.color.setRGB(Math.min(1, cur.top[0] / 255 + 0.45), Math.min(1, cur.top[1] / 255 + 0.45), Math.min(1, cur.top[2] / 255 + 0.45));
    sun.color.setRGB(Math.min(1, cur.sun[0] / 255), Math.min(1, cur.sun[1] / 255), Math.min(1, cur.sun[2] / 255));

    /* scenery */
    var kinds = ['palm', 'cactus', 'pine', 'city'], cnt = { palm: 0, cactus: 0, pine: 0, city: 0 }, dk = th.deco, im = decoMeshes[dk];
    if (im) {
      for (k = 0; k < nseg; k++) {
        sg = segs[(((base + k - 4) % N) + N) % N]; if (!sg.deco || cnt[dk] >= 70) continue;
        var dd = sg.deco, c2 = Math.cos(Th[k]), s2 = Math.sin(Th[k]), lat = dd.side * dd.off * ROADM;
        dummy.position.set(Px[k] + lat * c2, 0, -(Pz[k] - lat * s2)); dummy.rotation.set(0, -Th[k], 0);
        if (dk === 'city') dummy.scale.set(4 + dd.v * 5, 9 + dd.v * 26, 4 + dd.v * 5); else { var ss = 0.8 + dd.v * 0.6; dummy.scale.set(ss, ss, ss); }
        dummy.updateMatrix(); im.setMatrixAt(cnt[dk]++, dummy.matrix);
      }
    }
    kinds.forEach(function (kn) { var m = decoMeshes[kn]; m.count = kn === dk ? cnt[kn] : 0; if (kn === dk) m.instanceMatrix.needsUpdate = true; });
    decoMeshes.city.material.color.setRGB(1, 1, 1);

    /* traffic */
    for (var i = 0; i < carObjs.length; i++) {
      var co2 = carObjs[i], c = cars[i], vis = false;
      if (c && c.active) {
        var d = wrapS(c.z - pos) * M, kf = (d + frac) / SEGM + 4;
        if (kf >= 0 && kf < nseg - 1) {
          var k0 = Math.floor(kf), fr = kf - k0, cx = lerp(Px[k0], Px[k0 + 1], fr), cz = lerp(Pz[k0], Pz[k0 + 1], fr), th0 = lerp(Th[k0], Th[k0 + 1], fr), lt = c.off * ROADM;
          co2.g.position.set(cx + lt * Math.cos(th0), 0, -(cz - lt * Math.sin(th0))); co2.g.rotation.y = -th0; vis = true;
          if (co2.truck !== c.truck || co2.col !== c.colI) {
            co2.truck = c.truck; co2.col = c.colI; co2.body.visible = co2.det.visible = !c.truck; co2.tb.visible = co2.td.visible = !!c.truck;
            co2.body.material = co2.tb.material = carMats[c.colI];

      co2.g.visible = vis && state !== 'menu';
    }

    /* bike */
    var tl = tilt, crashing = state === 'crash';
    var bx0 = crashing ? bikeDX * 6 : 0, by0 = crashing ? bikeLift * 3 : 0;
    bikeRoot.position.set(bx0, by0, 0);
    bikeRoot.rotation.set(crashing ? bikeRot * 0.5 : 0, -tl * 0.08, crashing ? -bikeRot : -tl * 0.5);
    wheelieG.rotation.x = wheelAmt * 0.28 + (state === 'play' ? Math.sin(time * 14) * 0.004 * (speed / MAXS) : 0);
    wheelSpin += Math.max(speed, state === 'menu' ? 600 : 0) * dt * M / 0.33; rearWheel.rotation.x = -wheelSpin; frontWheel.rotation.x = -wheelSpin;
    frontG.rotation.y = -tl * 0.22;
    riderG.position.x = tl * 0.06; riderG.rotation.z = -tl * 0.08; riderG.position.y = -wheelAmt * 0.02;
    paintMat.color.set(BIKES[save.sel].c);
    helmetStripe.material = paintMat;
    var braking = state === 'play' && wantBrake(); tailMat.color.setHex(braking ? 0xff2a2a : 0xb01c1c);
    for (i = 0; i < flames.length; i++) { flames[i].visible = nitroOn; if (nitroOn) { flames[i].scale.set(0.8 + Math.random() * 0.3, 0.8 + Math.random() * 0.3, 0.5 + Math.random() * 0.5); } }
    flameGlow.visible = nitroOn; if (nitroOn) { var gs = 1.0 + Math.random() * 0.4; flameGlow.scale.set(gs, gs, 1); }
    shadowBlob.position.x = bx0; shadowBlob.visible = by0 < 1.5; shadowBlob.scale.set(1 - by0 * 0.15, 1, 1);
    bikeRoot.visible = state !== 'over' || true;

    /* camera */
    var sp2 = speed / MAXS, asp = W / H;
    camera.aspect = asp; camera.fov = (asp > 1.1 ? 58 : 74) + sp2 * 4 + (nitroOn ? 8 : 0); camera.updateProjectionMatrix();
    var sx2 = (Math.random() - 0.5) * shake * 0.5, sy2 = (Math.random() - 0.5) * shake * 0.35;
    if (state === 'menu') {

      camera.position.set(Math.sin(oa) * 7.8, 2.6 + Math.sin(time * 0.5) * 0.2, Math.cos(oa) * 7.8);
      camera.lookAt(0, 0.1, -0.5);

      camera.position.set(-steerV * 0.5 + sx2, 3.7 + sy2 - (nitroOn ? 0.3 : 0), 9.4 - (nitroOn ? 0.9 : 0));
      camera.lookAt(-steerV * 0.2, 4.6, -14);

  /* 2D layer: speed lines, sparks, HUD */
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  if (nitroOn && quality && glOK) {
    ctx.strokeStyle = 'rgba(200,235,255,.45)'; ctx.lineWidth = 2 * dpr; ctx.beginPath();
    for (var li2 = 0; li2 < 14; li2++) { var an = Math.random() * 6.283, r1 = S * (0.45 + Math.random() * 0.25), r2 = r1 + S * (0.15 + Math.random() * 0.3); ctx.moveTo(W / 2 + Math.cos(an) * r1, H * 0.5 + Math.sin(an) * r1 * 1.4); ctx.lineTo(W / 2 + Math.cos(an) * r2, H * 0.5 + Math.sin(an) * r2 * 1.4); }
    ctx.stroke();

  if (state === 'crash' && glOK) {
    var pv = new THREE.Vector3(bikeRoot.position.x, 1.4, 0).project(camera), px = (pv.x * 0.5 + 0.5) * W, py = (-pv.y * 0.5 + 0.5) * H;
    ctx.fillStyle = '#ffb347'; for (var s3 = 0; s3 < sparks.length; s3++) { var spk = sparks[s3]; ctx.fillRect(px + spk.x * dpr, py + spk.y * dpr, 3 * dpr, 3 * dpr); }
  }

}

function drawHUD() {
  var fs = Math.max(14 * dpr, S / 20), pad = 14 * dpr, top = pad + (window.visualViewport ? 0 : 0);
  ctx.textBaseline = 'top';
  ctx.font = 'italic 800 ' + fs * 0.6 + 'px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.textAlign = 'left';
  ctx.fillText('SCORE', pad, top);
  ctx.font = 'italic 900 ' + fs * 1.6 + 'px system-ui,sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText(curScore(), pad, top + fs * 0.6);
  ctx.font = 'italic 800 ' + fs * 0.6 + 'px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText('BEST ' + Math.max(save.best, curScore()), pad, top + fs * 2.3);
  ctx.textAlign = 'right';
  var kmh = Math.round(speed / MAXS * 260);
  ctx.font = 'italic 900 ' + fs * 1.4 + 'px system-ui,sans-serif'; ctx.fillStyle = nitroOn ? '#7fe4ff' : '#fff'; ctx.fillText(kmh, W - pad, top + fs * 1.6);
  ctx.font = 'italic 800 ' + fs * 0.6 + 'px system-ui,sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText('KM/H', W - pad, top + fs * 3.0);

  }

  if (chain > 1 && chainT > 0) { ctx.font = 'italic 900 ' + fs * 0.8 + 'px system-ui,sans-serif'; ctx.fillStyle = '#ffd23a'; ctx.fillText('COMBO x' + chain, W / 2, top + fs * 3.7); }
}

/* ---- main loop ---- */
var last = 0, fpsT = 0, fpsN = 0;

  var dt = Math.min(0.05, (t - last) / 1000); last = t; if (!(dt > 0)) return;

resize();
glOK = init3D();
if (!glOK) { document.getElementById('menu').insertAdjacentHTML('afterbegin', '<div class="hint" style="color:#ff8a70">This phone cannot show 3D graphics (WebGL is off).</div>'); }
resize();
resetRun('free'); state = 'menu'; speed = 0; renderMenu();
/* test hook for the maker's checks */
window.__moto = { demo: startDemo, start: startRun, get: function () { return { ahead: cars.filter(function (c) { return c.active; }).map(function (c) { return { d: wrapS(c.z - pos), off: c.off }; }).filter(function (c) { return c.d > 0 && c.d < 9000; }), recs: demoRecs, pops: pops.map(function (q) { return q.t; }), px: playerX, state: state, score: curScore(), dist: dist, speed: speed, nitro: nitro, cars: cars.filter(function (c) { return c.active; }).length }; }, crash: crash, keys: keys, sim: function (sec) { for (var t = 0; t < sec * 60 && state !== 'over'; t++) stepSim(1 / 60); mixTheme(THEMES[themeIdx], 1); render(); } };

})();
