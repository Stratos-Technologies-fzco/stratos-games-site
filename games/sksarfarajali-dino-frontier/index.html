<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dino Frontier: Survival &amp; Evolution</title>
<meta name="description" content="Survive the Frontier, discover eggs and evolve your dinosaur along one of three paths.">
<meta name="theme-color" content="#0E1712">
<link rel="icon" href="assets/art/icon-egg.svg" type="image/svg+xml">
<style>
:root{--bg:#0E1712;--card:#16231B;--line:#2C3D31;--gold:#E8B54A;--gold2:#F5D27F;--text:#F3EBD7;--mut:#C9D1C0;--mut2:#B9C2B0;--soft:#D6DCCF;--red:#E5534B;--teal:#4FD1C5;--food:#CFE8B0;--dna:#CDB4F7;
--serif:Cinzel,Georgia,'Times New Roman',serif;--sans:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#060a08;overflow:hidden;color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed}
a{color:var(--gold)}
:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0;overflow:hidden;background:var(--bg);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#cv{position:absolute;inset:0;width:844px;height:390px;display:none;background:#0E1712}
#cv.on{display:block}#cv.blur{filter:blur(3px);transform:scale(1.04)}
#ui{position:absolute;inset:0}
.scr{position:absolute;inset:0;overflow:hidden;color:var(--text);animation:fadein .18s ease-out}
.scr.solid{background:var(--bg)}
.scr.clear{pointer-events:none}.scr.clear .hit{pointer-events:auto}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.rm .scr{animation:none}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fill{position:absolute;inset:0}
.page{box-sizing:border-box;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;align-items:center;gap:12px}
.h2{margin:0;font-family:var(--serif);font-size:22px;flex:1;font-weight:700}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:0;display:flex;align-items:center;justify-content:center;flex:none}
.back.big{width:44px;height:44px;background:rgba(14,23,18,.82)}
.pill{font-size:13px;font-weight:800;padding:7px 12px;border-radius:12px;background:var(--card)}
.btn{display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;font-weight:800;text-decoration:none;color:var(--text);background:none;text-align:center}
.btn.pri{background:var(--gold);color:#1A1408;height:48px;font-size:16px;padding:0 16px}
.btn.sec{border:2px solid var(--gold);background:rgba(14,23,18,.6);height:48px;font-size:16px;padding:0 16px}
.btn.ghost{background:rgba(22,35,27,.9);border:1px solid var(--line);height:44px;font-size:14px;font-weight:700}
.btn.outl{border:2px solid #5A6B5E;background:transparent;height:48px;font-size:15px}
.btn.dark{background:#0E1712;border:1px solid var(--line);height:44px;font-size:15px;font-weight:700}
.btn.danger{border:2px solid var(--red);height:44px;font-size:15px}
.btn[disabled]{opacity:1}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.serif,.h2,h1,h2{font-family:var(--serif);font-variant-numeric:lining-nums}
.muted{color:var(--mut)}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.dialog{position:absolute;inset:0;background:rgba(6,10,8,.72);display:flex;align-items:center;justify-content:center;z-index:20}
.dialog .box{width:430px;padding:20px 22px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
/* HUD */
.hudp{position:absolute;background:rgba(14,23,18,.82)}
.meter{flex:1;height:10px;border-radius:99px;overflow:hidden}
.circle{border-radius:50%;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:absolute;font-size:11px}
.circle.on{border:3px solid var(--teal);background:rgba(14,23,18,.8);color:var(--text)}
.circle.off{border:3px dashed #6B7A70;background:rgba(14,23,18,.6);color:var(--mut2)}
.circle.cd{opacity:.8}
.dp{position:absolute;width:48px;height:48px;padding:0;border-radius:12px;border:2px solid rgba(243,235,215,.5);background:rgba(14,23,18,.62);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:800 9px var(--sans);letter-spacing:.04em;touch-action:none;-webkit-user-select:none}
.dp.on{background:var(--gold);color:#1A1408;border-color:var(--gold2)}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{padding:8px 14px;border-radius:12px;background:rgba(14,23,18,.94);border:1px solid var(--gold);font-size:13px;font-weight:800;animation:fadein .15s}
#toast div.egg{border-color:var(--gold2);color:var(--gold2)}
#rotate{position:fixed;inset:0;background:#060a08;color:var(--text);display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px;font-weight:800;font-size:18px}
#rotate svg{animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
.rm #rotate svg{animation:none}
input[type=range]{accent-color:var(--gold);flex:1;height:28px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);margin:0;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
noscript{color:#fff;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0E1712;z-index:100}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="844" height="390" aria-label="Dino Frontier game view" role="img"></canvas>
  <div id="ui"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="rotate">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#E8B54A" stroke-width="1.6" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
  <div id="rotate-msg">Rotate your phone to landscape to play.</div>
</div>
<noscript>Dino Frontier needs JavaScript to run.</noscript>
<script src="js/en.js?v=20261030p"></script>
<script src="js/core.js?v=20261030p"></script>
<script src="js/save.js?v=20261030p"></script>
<script src="js/audio.js?v=20261030p"></script>
<script src="js/assets.js?v=20261030p"></script>
<script src="js/game.js?v=20261030p"></script>
<script src="js/ui.js?v=20261030p"></script>
<script src="js/main.js?v=20261030p"></script>
</body>
</html>
