<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Dino Frontier: Survival &amp; Evolution</title>
<meta name="description" content="Survive the Frontier, discover eggs and evolve your dinosaur along one of three paths.">
<meta name="theme-color" content="#0E1712">
<link rel="icon" href="assets/art/icon-egg.svg" type="image/svg+xml">
<style>
:root{--bg:#0E1712;--card:#16231B;--line:#2C3D31;--gold:#E8B54A;--gold2:#F5D27F;--text:#F3EBD7;--mut:#C9D1C0;--mut2:#B9C2B0;--soft:#D6DCCF;--red:#E5534B;--teal:#4FD1C5;--food:#CFE8B0;--dna:#CDB4F7;
--serif:Cinzel,Georgia,'Times New Roman',serif;--sans:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#060a08;overflow:hidden;color:var(--text);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;padding:0}
button:disabled{cursor:not-allowed}
a{color:var(--gold)}
:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}
#stage{position:absolute;left:0;top:0;width:844px;height:390px;transform-origin:0 0;overflow:hidden;background:var(--bg);box-shadow:0 10px 40px rgba(0,0,0,.6)}
#cv{position:absolute;inset:0;width:844px;height:390px;display:none;background:#0E1712}
#cv.on{display:block}#cv.blur{filter:blur(3px);transform:scale(1.04)}
#ui{position:absolute;inset:0}
.scr{position:absolute;inset:0;overflow:hidden;color:var(--text);animation:fadein .18s ease-out}
.scr.solid{background:var(--bg)}
.scr.clear{pointer-events:none}.scr.clear .hit{pointer-events:auto}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes glow{0%,100%{box-shadow:0 0 0 rgba(245,210,127,0)}50%{box-shadow:0 0 16px rgba(245,210,127,.7)}}
@keyframes hint{0%,70%{opacity:1}100%{opacity:0}}
.rm .scr{animation:none}
.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fill{position:absolute;inset:0}
.page{box-sizing:border-box;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.hd{display:flex;align-items:center;gap:12px}
.h2{margin:0;font-family:var(--serif);font-size:22px;flex:1;font-weight:700}
.back{width:40px;height:40px;border-radius:12px;background:var(--card);border:0;display:flex;align-items:center;justify-content:center;flex:none}
.back.big{width:44px;height:44px;background:rgba(14,23,18,.82)}
.pill{font-size:13px;font-weight:800;padding:7px 12px;border-radius:12px;background:var(--card)}
.btn{display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;font-weight:800;text-decoration:none;color:var(--text);background:none;text-align:center}
.btn.pri{background:var(--gold);color:#1A1408;height:48px;font-size:16px;padding:0 16px}
.btn.sec{border:2px solid var(--gold);background:rgba(14,23,18,.6);height:48px;font-size:16px;padding:0 16px}
.btn.ghost{background:rgba(22,35,27,.9);border:1px solid var(--line);height:44px;font-size:14px;font-weight:700}
.btn.outl{border:2px solid #5A6B5E;background:transparent;height:48px;font-size:15px}
.btn.dark{background:#0E1712;border:1px solid var(--line);height:44px;font-size:15px;font-weight:700}
.btn.danger{border:2px solid var(--red);height:44px;font-size:15px}
.btn[disabled]{opacity:1}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.serif,.h2,h1,h2{font-family:var(--serif);font-variant-numeric:lining-nums}
.muted{color:var(--mut)}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.dialog{position:absolute;inset:0;background:rgba(6,10,8,.72);display:flex;align-items:center;justify-content:center;z-index:20}
.dialog .box{width:430px;padding:20px 22px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
/* HUD */
.hudp{position:absolute;background:rgba(14,23,18,.82)}
.meter{flex:1;height:10px;border-radius:99px;overflow:hidden}
.circle{border-radius:50%;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:absolute;font-size:11px}
.circle.on{border:3px solid var(--teal);background:rgba(14,23,18,.8);color:var(--text)}
.circle.off{border:3px dashed #6B7A70;background:rgba(14,23,18,.6);color:var(--mut2)}
.circle.cd{opacity:.8}
.dp{position:absolute;width:48px;height:48px;padding:0;border-radius:12px;border:2px solid rgba(243,235,215,.5);background:rgba(14,23,18,.62);color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:800 9px var(--sans);letter-spacing:.04em;touch-action:none;-webkit-user-select:none}
.dp.on{background:var(--gold);color:#1A1408;border-color:var(--gold2)}
#toast{position:absolute;left:50%;top:64px;transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{padding:8px 14px;border-radius:12px;background:rgba(14,23,18,.94);border:1px solid var(--gold);font-size:13px;font-weight:800;animation:fadein .15s}
#toast div.egg{border-color:var(--gold2);color:var(--gold2)}
#rotate{position:fixed;inset:0;background:#060a08;color:var(--text);display:none;z-index:99;align-items:center;justify-content:center;flex-direction:column;gap:18px;text-align:center;padding:24px;font-weight:800;font-size:18px}
#rotate svg{animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
.rm #rotate svg{animation:none}
input[type=range]{accent-color:var(--gold);flex:1;height:28px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold);margin:0;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
noscript{color:#fff;position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0E1712;z-index:100}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="844" height="390" aria-label="Dino Frontier game view" role="img"></canvas>
  <div id="ui"></div>
  <div id="toast" role="status" aria-live="polite"></div>
</div>
<div id="rotate">
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#E8B54A" stroke-width="1.6" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg>
  <div id="rotate-msg">Rotate your phone to landscape to play.</div>
</div>
<noscript>Dino Frontier needs JavaScript to run.</noscript>
<script src="js/en.js?v=20261107c"></script>
<script src="js/core.js?v=20261031s"></script>
<script src="js/save.js?v=20261107c"></script>
<script src="js/audio.js?v=20261107c"></script>
<script src="js/assets.js?v=20261107c"></script>
<script src="js/game.js?v=20261107c"></script>
<script src="js/ui.js?v=20261107c"></script>
<script src="js/main.js?v=20261107c"></script>
<!-- about-panel:start -->
<style>#sx-about-btn{position:fixed;top:8px;right:8px;z-index:2147483000;min-width:44px;height:30px;padding:0 12px;border:1px solid rgba(255,255,255,.55);border-radius:15px;background:rgba(15,20,30,.72);color:#fff;font:600 13px/28px system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;cursor:pointer;opacity:.85;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
#sx-about-btn:hover,#sx-about-btn:focus-visible{opacity:1;outline:2px solid #fff;outline-offset:2px}
#sx-about{position:fixed;inset:0;z-index:2147483001;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(0,0,0,.7)}
#sx-about[hidden]{display:none}
#sx-about .sx-card{box-sizing:border-box;width:min(560px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;background:#fff;color:#14202e;border-radius:14px;padding:18px 20px 20px;font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;text-align:left;user-select:text;-webkit-user-select:text}
#sx-about h2{margin:0 36px 8px 0;font-size:20px;line-height:1.25;color:#0b2238}
#sx-about h3{margin:14px 0 4px;font-size:15px;color:#0b2238}
#sx-about p{margin:0 0 8px}
#sx-about ul{margin:0;padding-left:20px}
#sx-about li{margin:2px 0}
#sx-about .sx-x{position:sticky;top:0;float:right;margin:-6px -8px 0 0;width:36px;height:36px;border:0;border-radius:50%;background:#e8edf3;color:#0b2238;font:700 20px/36px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}</style>
<button id="sx-about-btn" type="button" aria-haspopup="dialog" aria-label="About Dino Frontier">About</button>
<div id="sx-about" role="dialog" aria-modal="true" aria-labelledby="sx-about-t" hidden><div class="sx-card"><button class="sx-x" type="button" aria-label="Close">&times;</button></div></div>
<script type="application/json" id="sx-about-data">{"title":"Dino Frontier","maker":"Sk Sarfaraj Ali","description":"Dino Frontier is a survival game where you raise a dinosaur and help it grow strong. You start in Verdant Valley with a small dino, a few berries to gather and a hidden egg to find. From there you travel through hotter, colder and stranger lands, from the lava of the Emberlands to the energy fields of Genesis Crater.\n\nYou fight raiders by attacking, dodging and dashing. Enemies flash before they strike, so you have a moment to get out of the way. Each land has a boss, and each boss has its own tricks to learn. As you level up, you pick how your dinosaur evolves. Swiftclaw is fast, Ironhide is tough, and Wildspark uses special powers. You can switch later for a few tokens.\n\nBetween trips you upgrade your Sanctuary, fill the Dinosaur Codex and finish daily missions. Missing a day costs nothing. It is for players who enjoy action with a little planning, and who like to watch their creature grow.","controls":["Move: drag on the left side of the screen, or use W A S D.","Attack: tap ATTACK or press Space.","Dash: tap DASH or press Shift.","Ability: tap ABILITY or press E.","Pause: press Esc. On a phone, hold it sideways."],"tips":["Enemies flash before they strike. Dodge on the flash, then hit back.","Berries restore a little health, so gather them between fights.","Dash costs energy, but your normal attack is free."],"story":""}</script>
<script>(function(){
var btn=document.getElementById('sx-about-btn'),ov=document.getElementById('sx-about'),card=ov.querySelector('.sx-card'),x=ov.querySelector('.sx-x');
var d=JSON.parse(document.getElementById('sx-about-data').textContent);
function el(t,txt){var e=document.createElement(t);if(txt)e.textContent=txt;return e;}
function list(h,a){if(!a||!a.length)return;card.appendChild(el('h3',h));var u=el('ul');a.forEach(function(s){u.appendChild(el('li',s));});card.appendChild(u);}
var h=el('h2','About '+d.title);h.id='sx-about-t';card.appendChild(h);
String(d.description||'').split(/\n\s*\n/).forEach(function(p){if(p.trim())card.appendChild(el('p',p.trim()));});
list('Controls',d.controls);list('Tips',d.tips);
if(d.story){card.appendChild(el('h3','From the maker'));String(d.story).split(/\n\s*\n/).forEach(function(p){if(p.trim())card.appendChild(el('p',p.trim()));});}
card.appendChild(el('p','Made by '+d.maker+'.')).style.marginTop='12px';
var last=null;
function open(){last=document.activeElement;ov.hidden=false;card.scrollTop=0;x.focus();}
function close(){ov.hidden=true;if(btn)btn.blur();try{if(last&&last.focus&&last!==btn)last.focus();}catch(e){}}
btn.addEventListener('click',function(e){e.stopPropagation();open();});
['pointerdown','mousedown','touchstart','keydown','keyup'].forEach(function(n){btn.addEventListener(n,function(e){e.stopPropagation();});});
x.addEventListener('click',close);
ov.addEventListener('click',function(e){if(e.target===ov)close();});
['keydown','keyup','keypress'].forEach(function(n){window.addEventListener(n,function(e){if(ov.hidden)return;if(n==='keydown'&&e.key==='Escape')close();if(e.key==='Tab'){return;}e.stopPropagation();},true);});
['pointerdown','pointerup','mousedown','mouseup','touchstart','touchend','wheel'].forEach(function(n){ov.addEventListener(n,function(e){e.stopPropagation();},{passive:true});});
})();</script>
<!-- about-panel:end -->
</body>
</html>
