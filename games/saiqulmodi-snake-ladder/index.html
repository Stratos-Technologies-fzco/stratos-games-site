<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Snake Ladder | Stratos.games</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23231712'/%3E%3Cpath d='M20 50V14M44 50V14M20 22h24M20 32h24M20 42h24' stroke='%23f59e0b' stroke-width='4.5' stroke-linecap='round'/%3E%3Cpath d='M14 44c8-12 28-12 36-24' stroke='%23ef4444' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-deep: #18100c;
      --bg-card: rgba(34, 22, 16, 0.92);
      --border-amber: rgba(245, 158, 11, 0.35);
      --amber: #f59e0b;
      --amber-light: #fde68a;
      --terracotta: #ef4444;
      --emerald: #10b981;
      --cream: #fef3c7;
      --muted: #d6c3b3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100dvh; overflow: hidden;
      background: var(--bg-deep); color: var(--cream);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }

    #hud {
      position: fixed; top: 6px; left: 8px; right: 8px;
      display: flex; justify-content: space-between; align-items: center;
      pointer-events: none; z-index: 10; gap: 5px; flex-wrap: wrap;
    }
    .hud-group { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
    .pill {
      background: var(--bg-card);
      border: 1px solid var(--border-amber);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
      padding: 4px 9px; border-radius: 999px;
      font-size: 11.5px; font-weight: 700; letter-spacing: 0.25px;
      display: flex; align-items: center; gap: 4px;
      color: var(--muted);
    }
    .pill span.val { color: var(--amber-light); font-variant-numeric: tabular-nums; }
    .pill.emerald span.val { color: #6ee7b7; }
    .pill.dice-pill { border-color: #fbbf24; background: rgba(58, 34, 14, 0.95); }
    .pill.dice-pill span.val { color: #ffffff; font-size: 13px; }
    .pill.team { transition: transform 0.2s, box-shadow 0.2s; }
    .pill.team.p0 { border-color: rgba(239, 68, 68, 0.55); }
    .pill.team.p1 { border-color: rgba(59, 130, 246, 0.55); }
    .pill.team.p0 span.val { color: #fca5a5; }
    .pill.team.p1 span.val { color: #93c5fd; }
    .pill.team.turn { transform: scale(1.08); }
    .pill.team.p0.turn { background: rgba(127, 29, 29, 0.95); box-shadow: 0 0 12px rgba(239, 68, 68, 0.75); }
    .pill.team.p1.turn { background: rgba(30, 58, 138, 0.95); box-shadow: 0 0 12px rgba(59, 130, 246, 0.75); }
    .pill.combo {
      border-color: #fbbf24;
      background: rgba(120, 53, 15, 0.9);
      opacity: 0; transform: scale(0.9);
      transition: opacity 0.2s, transform 0.2s;
    }
    .pill.combo.active { opacity: 1; transform: scale(1); }

    .btn-action, .btn-icon {
      pointer-events: auto; cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-amber);
      color: var(--cream); border-radius: 999px;
      padding: 4px 11px; font-size: 11.5px; font-weight: 800;
      transition: transform 0.12s, border-color 0.15s;
    }
    .btn-action {
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      border-color: var(--amber-light);
      color: #18100c;
    }
    .btn-action:hover, .btn-icon:hover { transform: scale(1.05); }

    #dice-badge {
      position: fixed; bottom: 18px; left: 18px;
      background: rgba(34, 22, 16, 0.94);
      border: 2px solid var(--amber);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55);
      border-radius: 14px; padding: 6px 12px;
      display: flex; align-items: center; gap: 8px;
      z-index: 12; pointer-events: none;
    }
    #dice-num {
      font-size: 22px; font-weight: 900; color: #fde68a;
      line-height: 1; font-variant-numeric: tabular-nums;
    }
    #dice-sub {
      font-size: 11px; font-weight: 700; color: #d6c3b3;
      text-align: left; line-height: 1.25; white-space: pre-line; max-width: 150px;
    }

    #toast {
      position: fixed; top: 44px; left: 50%; transform: translateX(-50%) translateY(-6px);
      background: rgba(41, 24, 16, 0.95);
      border: 1px solid var(--amber);
      box-shadow: 0 6px 22px rgba(245, 158, 11, 0.3);
      color: var(--amber-light); font-weight: 800; font-size: 12.5px; letter-spacing: 0.5px;
      padding: 5px 16px; border-radius: 999px;
      opacity: 0; pointer-events: none; z-index: 15;
      transition: opacity 0.22s ease, transform 0.22s ease;
      white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #overlay {
      position: fixed; inset: 0;
      background: radial-gradient(circle at center, rgba(28, 18, 13, 0.84), rgba(14, 9, 6, 0.95));
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 14px; z-index: 20;
    }
    #overlay.hidden { display: none; }
    .card {
      background: rgba(32, 20, 14, 0.95);
      border: 1px solid rgba(245, 158, 11, 0.38);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.6);
      border-radius: 22px; padding: 18px 18px;
      max-width: 420px; width: 100%;
      max-height: calc(100dvh - 20px); overflow-y: auto; scrollbar-width: none;
    }
    .card::-webkit-scrollbar { display: none; }
    .top-badges { display: flex; justify-content: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
    .badge {
      font-size: 10.5px; font-weight: 800; letter-spacing: 1.2px;
      color: var(--amber); text-transform: uppercase;
      border: 1px solid rgba(245, 158, 11, 0.38);
      background: rgba(245, 158, 11, 0.08);
      padding: 3px 10px; border-radius: 999px;
    }
    h1 {
      font-size: clamp(28px, 5.5vw, 40px); font-weight: 900;
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 55%, #ef4444 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 6px; letter-spacing: -0.5px;
    }
    p.sub { color: var(--muted); font-size: 13px; line-height: 1.42; margin-bottom: 10px; }
    .controls-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 6px; margin-bottom: 10px; text-align: left;
    }
    .ctrl-card {
      background: rgba(20, 12, 9, 0.78);
      border: 1px solid rgba(245, 158, 11, 0.18);
      border-radius: 10px; padding: 6px 9px; font-size: 11px; color: var(--muted);
    }
    .ctrl-card strong { display: block; color: var(--amber-light); font-size: 11.5px; margin-bottom: 1px; }

    .lb-box {
      background: rgba(20, 12, 9, 0.78);
      border: 1px solid rgba(245, 158, 11, 0.2);
      border-radius: 12px; padding: 7px 11px; margin-bottom: 12px;
      text-align: left; font-size: 11.5px;
    }
    .lb-title {
      font-weight: 800; color: var(--amber); letter-spacing: 0.7px;
      text-transform: uppercase; font-size: 10px; margin-bottom: 4px;
      display: flex; justify-content: space-between;
    }
    .lb-row {
      display: flex; justify-content: space-between; padding: 2px 0;
      border-bottom: 1px dashed rgba(245, 158, 11, 0.12);
      color: var(--cream); font-variant-numeric: tabular-nums;
    }
    .lb-row:last-child { border-bottom: none; }

    .actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .btn-play {
      cursor: pointer; border: none; border-radius: 999px;
      padding: 11px 22px; font-size: 15px; font-weight: 800; letter-spacing: 0.4px;
      color: #18100c;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
      transition: transform 0.14s;
      flex: 1; min-width: 140px;
    }
    .btn-play:hover { transform: scale(1.03); }
    .btn-secondary {
      cursor: pointer; border-radius: 999px;
      padding: 10px 14px; font-size: 12px; font-weight: 700;
      color: var(--amber-light);
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      transition: transform 0.14s;
    }
    .btn-secondary:hover { transform: scale(1.03); }

    #final-stats {
      margin-bottom: 8px; font-size: 13px; color: var(--cream);
      display: none; gap: 12px; justify-content: center; flex-wrap: wrap;
      background: rgba(245, 158, 11, 0.08);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 10px; padding: 6px 10px;
    }

    .mobile-controls {
      position: fixed; bottom: 16px; right: 16px;
      display: none; gap: 10px; align-items: center;
      z-index: 12; touch-action: manipulation;
    }
    #mobile-dice, #mobile-hop {
      width: 58px; height: 58px; border-radius: 50%;
      background: rgba(245, 158, 11, 0.25);
      border: 2px solid rgba(253, 230, 138, 0.85);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.35);
      color: var(--cream); font-weight: 800; font-size: 11.5px;
      display: flex; align-items: center; justify-content: center;
    }
    #coach {
      position: fixed; left: 50%; top: 80px; transform: translateX(-50%) scale(0.92);
      background: rgba(16, 60, 44, 0.96); border: 2px solid #6ee7b7;
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.55);
      color: #ecfdf5; font-weight: 800; font-size: 17px; letter-spacing: 0.5px;
      padding: 8px 18px; border-radius: 16px; white-space: nowrap;
      max-width: calc(100vw - 24px); overflow: hidden;
      opacity: 0; pointer-events: none; z-index: 14;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    #coach.show { opacity: 1; transform: translateX(-50%) scale(1); }
    #second-chance {
      position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
      display: none; z-index: 16; cursor: pointer; touch-action: manipulation;
      background: linear-gradient(135deg, #6ee7b7, #10b981); color: #052e1f;
      border: 2px solid #ecfdf5; border-radius: 999px;
      padding: 10px 20px; font-size: 18px; font-weight: 900;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.5);
      animation: sl-pulse 1s ease-in-out infinite;
    }
    #second-chance.show { display: block; }
    .goal { font-size: 22px; font-weight: 900; color: #fde68a; margin-bottom: 6px; letter-spacing: 1px; }
    @keyframes sl-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(253, 230, 138, 0.75); }
      50% { box-shadow: 0 0 0 10px rgba(253, 230, 138, 0); }
    }
    .pulse { animation: sl-pulse 1s ease-in-out infinite; }
    @media (pointer: coarse) {
      .mobile-controls { display: flex; }
      .btn-action, .btn-icon { padding: 6px 12px; min-height: 30px; }
    }
    @media (max-width: 520px) {
      #hud { top: 4px; left: 4px; right: 4px; gap: 4px; }
      .hud-group { gap: 4px; }
      .pill { padding: 3px 7px; font-size: 10.5px; }
      .pill.dice-pill span.val { font-size: 12px; }
      .btn-action, .btn-icon { font-size: 10.5px; padding: 5px 9px; }
      #dice-badge { left: 8px; bottom: 10px; padding: 5px 9px; gap: 6px; }
      #dice-num { font-size: 19px; }
      #dice-sub { font-size: 10px; max-width: 118px; }
      .mobile-controls { right: 8px; bottom: 10px; gap: 8px; }
      #mobile-dice, #mobile-hop { width: 54px; height: 54px; }
    }
    @media (max-height: 560px) {
      .card { padding: 10px 14px; }
      h1 { font-size: 24px; margin-bottom: 2px; }
      p.sub { font-size: 11.5px; margin-bottom: 6px; }
      .controls-grid { grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 6px; }
      .ctrl-card { padding: 4px 6px; font-size: 10px; }
      .lb-box { margin-bottom: 6px; padding: 5px 9px; }
      .btn-play { padding: 8px 16px; font-size: 13px; }
      #dice-badge { bottom: 8px; padding: 3px 8px; }
      #dice-num { font-size: 16px; }
      #dice-sub { font-size: 9.5px; }
      .mobile-controls { bottom: 8px; }
      #mobile-dice, #mobile-hop { width: 46px; height: 46px; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="hud-group">
      <div class="pill team p0 turn" id="hud-p0">🔴🐸 <span class="val" id="hud-t0">1</span> ⭐ <span class="val" id="hud-s0">0</span></div>
      <div class="pill team p1" id="hud-p1">🔵🐸 <span class="val" id="hud-t1">1</span> ⭐ <span class="val" id="hud-s1">0</span></div>
      <div class="pill dice-pill">🎲 <span class="val" id="hud-dice">-</span></div>
      <div class="pill">🏆 <span class="val" id="hud-best">0</span></div>
      <div class="pill combo" id="hud-combo">🔗 <span class="val" id="hud-combo-val">x2</span></div>
    </div>
    <div class="hud-group">
      <button class="btn-action" id="btn-roll" title="R / Space">🔴 🎲 R</button>
      <div class="pill" id="flute-pill" style="display:none; border-color:#c084fc">🎶 <span class="val">1</span></div>
      <button class="btn-icon" id="btn-flute" style="display:none" title="Flute">🎶+</button>
      <button class="btn-icon" id="btn-reset" title="Reset: both frogs to 1 on a new board, scores kept">🔄</button>
      <button class="btn-icon" id="btn-home" title="Home (H)">🏠</button>
      <button class="btn-icon" id="btn-mute" title="Toggle Audio & Haptics (M)">🔊</button>
      <button class="btn-icon" id="btn-pause" title="Pause (P)">⏸</button>
    </div>
  </div>

  <div id="dice-badge">
    <div id="dice-num">🎲 -</div>
    <div id="dice-sub">🎲🎲 🐸 +2 … +12</div>
  </div>

  <div id="toast"></div>
  <div id="coach"></div>
  <button id="second-chance" title="Second chance">↩</button>

  <div id="overlay">
    <div class="card">
      <div class="top-badges">
                <span class="badge" id="streak-badge">🔥 1</span>
        <span class="badge" id="day-badge">🗓</span>
      </div>
      <h1 id="ov-title">🐍 🪜 🐸</h1>
      <div class="goal">🔴🐸 🆚 🔵🐸 ➜ 🏁 100 ➜ 200 ➜ ♾️</div>
      <p class="sub" id="ov-sub" style="font-size:20px">🎲 ➜ 🐸 ➜ 🏁 &nbsp; 🪜 ⬆ &nbsp; 🐍 ⬇ &nbsp; ⭐1…6 ➕</p>
      <div id="final-stats"></div>
      <div class="controls-grid" style="text-align:center;font-size:16px">
        <div class="ctrl-card">🐸🎲 = R / ␣</div>
        <div class="ctrl-card">🐍 = ⬅⬆➡⬇ / 👆</div>
        <div class="ctrl-card">🔴🐸🎲 + 🔵🐍</div>
        <div class="ctrl-card">🔵🐸🎲 + 🔴🐍</div>
        <div class="ctrl-card">🪜 = ⬆ &nbsp; 🐍 = ⬇</div>
        <div class="ctrl-card">🐍💥🐸 = ⬇10</div>
        <div class="ctrl-card">🏁 100 = ⭐+1000 ➜ 101</div>
        <div class="ctrl-card">🔄 = 🐸🐸 ➜ 1 &nbsp; ⭐ ✔</div>
      </div>
      <div class="lb-box">
        <div class="lb-title"><span>🏆 5</span><span>⭐ • 🐸</span></div>
        <div id="lb-list"></div>
      </div>
      <div class="actions">
        <button class="btn-play" id="btn-continue" style="display:none; background:linear-gradient(135deg,#6ee7b7,#10b981);">▶</button>
        <button class="btn-play" id="btn-start" title="Play">▶</button>
        <button class="btn-secondary" id="btn-test-av">🔔</button>
      </div>
    </div>
  </div>

  <div class="mobile-controls">
    <button id="mobile-dice" style="font-size:24px">🎲</button>
  </div>
  <canvas id="game"></canvas>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // Traditional board ladders: base tile -> top tile
  const BOARD_LADDERS = {
    4: 18,
    13: 29,
    33: 45,
    42: 58,
    50: 66,
    62: 77,
    74: 91
  };
  const LADDER_BASES = new Set(Object.keys(BOARD_LADDERS).map(Number));
  const LADDER_TOPS = new Set(Object.values(BOARD_LADDERS));

  // Stationary live snakes placed across different board squares: headTile -> tailTile
  const STATIONARY_SNAKES = {
    16: 6,
    47: 26,
    49: 11,
    56: 53,
    64: 19,
    87: 24,
    98: 78
  };
  const SNAKE_HEADS = new Set(Object.keys(STATIONARY_SNAKES).map(Number));
  const SNAKE_RISE = {};          // head tile -> 0..1 while a moved snake rises out of its new holes
  const SNAKE_MOVE_EVERY = 3;     // seconds between moves, one snake at a time
  let snakeMoveTimer = SNAKE_MOVE_EVERY;
  const LADDER_RISE = {};         // base tile -> 0..1 while a moved ladder grows into place
  const LADDER_MOVE_EVERY = 7;    // seconds: now and then one ladder wobbles to a new spot
  let ladderMoveTimer = LADDER_MOVE_EVERY;

  // Daily board: today's date picks the snake and ladder layout, the same for every player
  const TODAY = new Date();
  const DAY_SEED = TODAY.getFullYear() * 10000 + (TODAY.getMonth() + 1) * 100 + TODAY.getDate();
  function seededRng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  // Endless hundreds: every new hundred (101-200, 201-300 …) gets its own snake and ladder layout
  let boardLap = 0;
  let boardSeed = DAY_SEED;   // today's date; 🔄 Reset picks a new random one (saved with the game)
  function makeDailyBoard(lap = 0) {
    const rnd = seededRng(boardSeed + lap * 7919);
    const used = new Set([1, 100]);
    const ladders = {}, snakes = {};
    let guard = 0;
    while (Object.keys(ladders).length < 7 && guard++ < 3000) {
      const base = 2 + Math.floor(rnd() * 88);          // 2..89
      const top = base + 10 + Math.floor(rnd() * 11);  // 10..20 tiles up: short ladders, 1-2 rows
      if (top > 98 || used.has(base) || used.has(top)) continue;
      ladders[base] = top; used.add(base); used.add(top);
    }
    guard = 0;
    while (Object.keys(snakes).length < 7 && guard++ < 3000) {
      const head = 12 + Math.floor(rnd() * 88);          // 12..99
      const tail = head - (8 + Math.floor(rnd() * 38));  // 8..45 tiles down
      if (tail < 2 || used.has(head) || used.has(tail)) continue;
      snakes[head] = tail; used.add(head); used.add(tail);
    }
    if (Object.keys(ladders).length !== 7 || Object.keys(snakes).length !== 7) return; // keep the classic board
    for (const k of Object.keys(BOARD_LADDERS)) delete BOARD_LADDERS[k];
    for (const k of Object.keys(STATIONARY_SNAKES)) delete STATIONARY_SNAKES[k];
    Object.assign(BOARD_LADDERS, ladders);
    Object.assign(STATIONARY_SNAKES, snakes);
    LADDER_BASES.clear(); LADDER_TOPS.clear(); SNAKE_HEADS.clear();
    for (const [b, t] of Object.entries(ladders)) { LADDER_BASES.add(Number(b)); LADDER_TOPS.add(t); }
    for (const h of Object.keys(snakes)) SNAKE_HEADS.add(Number(h));
  }
  makeDailyBoard(0);
  const DICE_FACES = ['⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
  // Two dice, like Ludo / Snakes and Ladders: the frog moves the total of both
  function diceSum(d) { return Array.isArray(d) ? d[0] + d[1] : 0; }
  function diceText(d) { return Array.isArray(d) ? `${DICE_FACES[d[0] - 1]}${DICE_FACES[d[1] - 1]} ${d[0] + d[1]}` : '-'; }

  function trackEvent(name, data = {}) {
    try {
      let S = window.Stratos;
      try { if (!S && window.parent && window.parent !== window) S = window.parent.Stratos; } catch {}
      if (S && typeof S.track === 'function') {
        S.track(name, Object.assign({ game: 'saiqulmodi-snake-ladder' }, data));
      }
    } catch {}
  }

  // Stratos Coins wallet (null when the game runs on its own)
  function SC() { try { const S = window.Stratos || parent.Stratos; return S && S.coins ? S.coins : null; } catch (e) { return null; } }

  // Weak phones: glow effects switch off by themselves if frames get slow
  let lowFx = false;
  let fxFrames = 0, fxTime = 0;
  function FX(v) { return lowFx ? 0 : v; }

  const coachEl = document.getElementById('coach');
  const secondChanceBtn = document.getElementById('second-chance');
  const btnHome = document.getElementById('btn-home');
  const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

  // One-time picture tips (tutorial while playing)
  const TIPS_KEY = 'stratos_snake_ladder_tips_v1';
  let tipsSeen = {};
  try { tipsSeen = JSON.parse(localStorage.getItem(TIPS_KEY) || '{}') || {}; } catch {}
  const coachQueue = [];
  let coachBusy = false;
  function coach(id, text) {
    if (tipsSeen[id]) return;
    tipsSeen[id] = 1;
    try { localStorage.setItem(TIPS_KEY, JSON.stringify(tipsSeen)); } catch {}

  function playTone(freq, duration, type = 'sine', vol = 0.08, slideTo = null) {
    if (muted || !audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.0008, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration);
  }

  // Two frogs, one per team. `player` is the frog whose turn it is; boardTile / score / fluteCharge
  // hold that frog's live values and are copied back into it when the turn passes.
  function makeFrog() {
    return {
      x: 0, y: 0, vx: 0, vy: 0,
      angle: 0, radius: 7,
      hopTimer: 0, hopCooldown: 0,
      anim: null, animQueue: [],

  let turn = 0;

  function frogTiles() { storeTurn(); return frogs.map((f) => f.tile); }
  // Where a frog stands inside a square: red on the left half, blue on the right, so both always show
  function frogSpot(tile, idx = turn) {
    const c = getTileCellRect(tile);

  // Live team snake. Each turn the OTHER team's snake hunts the frog whose turn it is, steered by the other
  // player: 🔴 rolls for the red frog while 🔵 steers the blue snake, then the hands swap after every roll.
  const teamSnakeLen = [22, 22];   // each team's snake grows by 3 for every catch
  function snakeOwner() { return 1 - turn; }
  // equal speed: the snake covers one square in the time a frog takes for one dice step (0.16 s)
  function snakeSpeed() {
    const c = getTileCellRect(1);
    return ((c.w + c.h) * 0.5) / 0.16;
  }
  // Put the opponent's snake on the board behind the frog whose turn it is, tail trailing further back
  function spawnHunterBehind() {
    const c = getTileCellRect(1);
    const behind = Math.max(1, boardTile - 2);
    let hx, hy;
    if (behind < boardTile) {
      const p = getTileCenter(behind);
      hx = p.x; hy = p.y;
    } else {
      hx = player.x - c.w * 1.4; hy = player.y + c.h * 0.6;
    }
    hx = Math.max(BOARD.left + 6, Math.min(BOARD.right - 6, hx));
    hy = Math.max(BOARD.top + 6, Math.min(BOARD.bottom - 6, hy));
    snake.x = hx; snake.y = hy;
    snake.angle = Math.atan2(player.y - hy, player.x - hx);
    snake.segmentSpacing = Math.max(4, Math.min(c.w, c.h) * 0.09);
    snake.segments = [];
    for (let i = 0; i < teamSnakeLen[snakeOwner()]; i++) {
      snake.segments.push({   // the tail trails back from the head but always stays on the board
        x: Math.max(BOARD.left + 4, Math.min(BOARD.right - 4, hx - Math.cos(snake.angle) * i * snake.segmentSpacing)),
        y: Math.max(BOARD.top + 4, Math.min(BOARD.bottom - 4, hy - Math.sin(snake.angle) * i * snake.segmentSpacing))
      });
    }
    pointerActive = false;
    bumpCooldown = 1.2;   // a short head start for the frog at the start of its turn
    spawnBurst(hx, hy, TEAMS[snakeOwner()].light, 12);
  }
  const snake = {
    x: 0, y: 0, angle: 0,
    wanderAngle: 0,
    wanderTimer: 0,
    wavePhase: 0,
    segments: [],
    segmentCount: 22,
    segmentSpacing: 5

  let stars = [];   // ⭐ 1-6 bonus stars: { tile, value, hue }
  let particles = [];
  let floatingPopups = [];

  const keys = {};

  const GAME_KEYS = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
  window.addEventListener('keydown', (e) => {

  function togglePause() {

  function getTileCellRect(tileNum) {
    const { left, top, right, bottom } = BOARD;
    const bw = right - left, bh = bottom - top;
    const cw = bw / 10, ch = bh / 10;
    const idx = Math.max(0, Math.min(99, tileNum - 1));
    const rowFromBottom = Math.floor(idx / 10);
    const colInRow = rowFromBottom % 2 === 0 ? (idx % 10) : (9 - (idx % 10));
    const drawRow = 9 - rowFromBottom;
    return {
      x: left + colInRow * cw,
      y: top + drawRow * ch,
      w: cw,
      h: ch,
      cx: left + (colInRow + 0.5) * cw,
      cy: top + (drawRow + 0.5) * ch
    };
  }

  // Which numbered square (1..100) a point on the board is in; 0 when off the board
  function tileAt(x, y) {
    const { left, top, right, bottom } = BOARD;
    if (x < left || x >= right || y < top || y >= bottom) return 0;
    const col = Math.min(9, Math.floor((x - left) / ((right - left) / 10)));
    const drawRow = Math.min(9, Math.floor((y - top) / ((bottom - top) / 10)));
    const rowFromBottom = 9 - drawRow;
    const colInRow = rowFromBottom % 2 === 0 ? col : 9 - col;
    return rowFromBottom * 10 + colInRow + 1;
  }

  // keep frogs and snake on the board (stars sit on squares, so they follow by themselves) after a resize / phone rotation
  function onBoardResized() {
    if (state === 'MENU') return;
    frogTiles().forEach((tile, i) => {
      const f = frogs[i];
      f.anim = null;
      f.animQueue = [];
      const pos = frogSpot(tile, i);
      f.x = pos.x; f.y = pos.y;
      f.tailHistory = f.tailHistory.map(() => ({ x: pos.x, y: pos.y }));
    });
    const sx = Math.max(BOARD.left + 20, Math.min(BOARD.right - 20, snake.x));
    const sy = Math.max(BOARD.top + 20, Math.min(BOARD.bottom - 20, snake.y));
    const ddx = sx - snake.x, ddy = sy - snake.y;
    snake.x = sx; snake.y = sy;
    for (const seg of snake.segments) { seg.x += ddx; seg.y += ddy; }
  }

  function getTileCenter(tileNum) {
    const rect = getTileCellRect(tileNum);
    return { x: rect.cx, y: rect.cy };
  }

  function checkTileBoardEffect(tileNum) {
    if (BOARD_LADDERS[tileNum]) {
      const destTile = Math.min(100, BOARD_LADDERS[tileNum]);
      boardTile = destTile;
      score += 200;
      const pos = frogSpot(boardTile);
      animateFrogTo(pos.x, pos.y, 0.55);
      sfxLadderBoost();
      spawnBurst(pos.x, pos.y, '#fde68a', 20);
      addPopup(pos.x, pos.y - 12, `🪜 ${boardTile}  +200`, '#fde68a');
      showToast(`${TEAMS[turn].icon}🐸 🪜 ${player.lap * 100 + tileNum} ➜ ${player.lap * 100 + boardTile}  ⭐ +200`);
      coach('ladder', '🪜 = ⬆ ⬆   +200');
      return true;
    }

    // If frog reaches a square where a snake head is placed, slide to the snake's tail end
    if (STATIONARY_SNAKES[tileNum] && fluteCharge > 0) {
      fluteCharge = 0;
      const pos = getTileCenter(tileNum);
      spawnBurst(pos.x, pos.y, '#c084fc', 22);
      addPopup(pos.x, pos.y - 14, '🎶 🐍💤', '#e9d5ff');
      showToast('🎶 🐍💤');
      [783.99, 659.25, 523.25].forEach((n, k) => setTimeout(() => playTone(n, 0.2, 'sine', 0.08), k * 120));
      return true;
    }
    if (STATIONARY_SNAKES[tileNum]) {
      const tailTile = Math.max(1, STATIONARY_SNAKES[tileNum]);
      // Score drops by how far the frog slid: 25 points per tile lost (same value a dice step earns per tile)
      const tilesDown = tileNum - tailTile;
      const penalty = Math.min(score, tilesDown * 25);
      const scoreBefore = score;
      boardTile = tailTile;
      score -= penalty;
      const headPos = frogSpot(tileNum);
      const pos = frogSpot(boardTile);
      // slide along the drawn snake body (same curve the board draws)
      animateFrogTo(pos.x, pos.y, 0.6, {
        x: (headPos.x + pos.x) * 0.5 + Math.sin(timeElapsed * 2.2 + tileNum) * 14,
        y: (headPos.y + pos.y) * 0.5 + Math.cos(timeElapsed * 2.2 + tileNum) * 14
      });
      sfxSnakeSlide();
      spawnBurst(pos.x, pos.y, '#fca5a5', 14);
      addPopup(pos.x, pos.y - 12, `🐍 ⬇${tilesDown}  -${penalty}`, '#fca5a5');
      coach('snakesq', '🐍 = ⬇   −25 × ▦');
      offerSecondChance(tileNum, scoreBefore);
      showToast(`${TEAMS[turn].icon}🐸 🐍 ${player.lap * 100 + tileNum} ➜ ${player.lap * 100 + boardTile}  ⭐ -${penalty}`);
      return true;
    }

    return false;
  }

  function moveRandomLadder() {
    const bases = Object.keys(BOARD_LADDERS).map(Number);
    if (!bases.length) return;
    const oldBase = bases[Math.floor(Math.random() * bases.length)];
    const oldTop = BOARD_LADDERS[oldBase];
    const len = oldTop - oldBase;
    const used = new Set([1, 100, ...frogTiles()]);
    for (const [b, t] of Object.entries(BOARD_LADDERS)) {
      if (Number(b) !== oldBase) { used.add(Number(b)); used.add(t); }
    }
    for (const [h, t] of Object.entries(STATIONARY_SNAKES)) { used.add(Number(h)); used.add(t); }
    for (let tries = 0; tries < 80; tries++) {
      const base = 2 + Math.floor(Math.random() * (98 - len - 1)); // top <= 98
      const top = base + len;
      if (base === oldBase || used.has(base) || used.has(top)) continue;
      delete BOARD_LADDERS[oldBase];
      LADDER_BASES.delete(oldBase);
      LADDER_TOPS.delete(oldTop);
      delete LADDER_RISE[oldBase];
      BOARD_LADDERS[base] = top;
      LADDER_BASES.add(base);
      LADDER_TOPS.add(top);
      LADDER_RISE[base] = 0;
      const bp = getTileCenter(base);
      spawnBurst(bp.x, bp.y, '#fde68a', 10);
      return;
    }
  }


  function moveRandomIdleSnake() {
    const heads = Object.keys(STATIONARY_SNAKES).map(Number);
    if (!heads.length) return;
    const oldHead = heads[Math.floor(Math.random() * heads.length)];
    const drop = oldHead - STATIONARY_SNAKES[oldHead];
    const used = new Set([1, 100, ...frogTiles()]);
    for (const [b, t] of Object.entries(BOARD_LADDERS)) { used.add(Number(b)); used.add(t); }
    for (const [h, t] of Object.entries(STATIONARY_SNAKES)) {
      if (Number(h) !== oldHead) { used.add(Number(h)); used.add(t); }
    }
    for (let tries = 0; tries < 80; tries++) {
      const head = drop + 2 + Math.floor(Math.random() * (99 - drop - 1)); // tail >= 2, head <= 99
      const tail = head - drop;
      if (head === oldHead || used.has(head) || used.has(tail)) continue;
      delete STATIONARY_SNAKES[oldHead];
      SNAKE_HEADS.delete(oldHead);
      delete SNAKE_RISE[oldHead];
      STATIONARY_SNAKES[head] = tail;
      SNAKE_HEADS.add(head);
      SNAKE_RISE[head] = 0;
      const hp = getTileCenter(head), tp = getTileCenter(tail);
      spawnBurst(hp.x, hp.y, '#b07a4a', 8);
      spawnBurst(tp.x, tp.y, '#b07a4a', 6);
      return;
    }
  }

  function rollDice() {
    if (stepQueue > 0 || turnEndPending || player.anim) return;   // one roll per turn; wait for the move to land
    initAudio();
    btnRoll.classList.remove('pulse');
    mobileDice.classList.remove('pulse');
    const d1 = 1 + Math.floor(Math.random() * 6);
    const d2 = 1 + Math.floor(Math.random() * 6);
    const rolled = d1 + d2;
    lastDice = [d1, d2];
    stepQueue = rolled;
    stepTimer = 0.04;
    score += rolled * 25;
    playTone(440 + d1 * 45, 0.12, 'triangle', 0.09, 660 + d1 * 50);
    setTimeout(() => playTone(440 + d2 * 45, 0.12, 'triangle', 0.09, 660 + d2 * 50), 110);
    haptic(15);

    const T = TEAMS[turn];
    diceNumEl.textContent = diceText(lastDice);
    diceSubEl.textContent = `${T.icon} ${d1} + ${d2} = 🐸 +${rolled} ➜`;
    showToast(`${T.icon} ${DICE_FACES[d1 - 1]} ${d1} + ${DICE_FACES[d2 - 1]} ${d2}  ➜  🐸 +${rolled}`);
    updateHud();
  }

  function stepOneTileForward() {
    if (boardTile >= 100) {
      stepQueue = 0;
      return;
    }
    boardTile = Math.min(100, boardTile + 1);
    const pos = frogSpot(boardTile);
    animateFrogTo(pos.x, pos.y, 0.13);
    playTone(500 + boardTile * 4, 0.05, 'sine', 0.05);
    addPopup(pos.x, pos.y - 8, `${player.lap * 100 + boardTile}`, TEAMS[turn].light);
    collectStarAt(boardTile);   // ⭐ landed on or hopped over

    if (stepQueue === 0 || boardTile >= 100) {
      stepQueue = 0;
      if (checkTileBoardEffect(boardTile)) collectStarAt(boardTile);   // a ladder top / snake tail star counts too
      if (boardTile >= 100) {
        score += 1000;
        reachHundred();
      }
      turnEndPending = true;   // the dice passes to the other frog once this move has landed
      saveActiveRun();
    }
    updateHud();
  }

  // Frog moves land on a felt beat: tween position (straight or along a curve), chained in order
  function animateFrogTo(x, y, dur, curve = null, f = player) {
    f.animQueue.push({ tx: x, ty: y, dur, cx: curve ? curve.x : null, cy: curve ? curve.y : null });
    if (!f.anim) startNextFrogAnim(f);
  }
  function startNextFrogAnim(f = player) {
    const n = f.animQueue.shift();
    f.anim = n ? Object.assign({ fx: f.x, fy: f.y, t: 0 }, n) : null;
  }
  function stepFrogAnim(dt, f = player) {
    const a = f.anim;
    if (!a) return;
    a.t += dt;
    const k = Math.min(1, a.t / a.dur);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    if (a.cx !== null) {
      const u = 1 - e;
      f.x = u * u * a.fx + 2 * u * e * a.cx + e * e * a.tx;
      f.y = u * u * a.fy + 2 * u * e * a.cy + e * e * a.ty;
    } else {
      f.x = a.fx + (a.tx - a.fx) * e;
      f.y = a.fy + (a.ty - a.fy) * e;
    }
    f.vx = 0; f.vy = 0;
    if (k >= 1) startNextFrogAnim(f);
  }

  // Second chance (Stratos Coins 'continue'): offered once per climb after a big drop; the player chooses
  let secondChanceUsed = false;
  let secondChanceTimer = null;
  let pendingRevert = null;
  function hideSecondChance() {
    clearTimeout(secondChanceTimer);
    secondChanceBtn.classList.remove('show');
    pendingRevert = null;
  }
  function offerSecondChance(fromTile, scoreBefore) {
    if (secondChanceUsed || fromTile - boardTile < 10 || !SC()) return;
    pendingRevert = { idx: turn, tile: fromTile, score: scoreBefore };
    secondChanceBtn.textContent = `↩ ${TEAMS[turn].icon}🐸 ${player.lap * 100 + fromTile}`;
    secondChanceBtn.classList.add('show');
    trackEvent('reward_offered', { item: 'continue', tile: fromTile });
    clearTimeout(secondChanceTimer);
    secondChanceTimer = setTimeout(hideSecondChance, 5000);
  }
  secondChanceBtn.addEventListener('click', () => {
    if (!pendingRevert || state !== 'PLAYING') return;
    const r = pendingRevert;
    hideSecondChance();
    state = 'OFFER';
    const resume = () => { if (state === 'OFFER') state = 'PLAYING'; };
    const fallback = setTimeout(resume, 30000);
    const done = () => {
      clearTimeout(fallback);
      secondChanceUsed = true;
      // the frog that fell goes back up (it may no longer be its turn)
      storeTurn();
      const f = frogs[r.idx];
      f.tile = r.tile;
      f.score = r.score;
      loadTurn(turn);
      const pos = frogSpot(r.tile, r.idx);
      animateFrogTo(pos.x, pos.y, 0.5, null, f);
      spawnBurst(pos.x, pos.y, '#6ee7b7', 18);
      sfxLadderBoost();
      showToast(`↩ ${TEAMS[r.idx].icon}🐸 ${f.lap * 100 + r.tile}`);
      saveActiveRun();
      trackEvent('reward_taken', { item: 'continue', tile: r.tile });
      resume();
      updateHud();
    };
    const coins = SC();
    try {
      if (coins && typeof coins.offer === 'function') {
        coins.offer('continue', done, { title: '↩ 🐸 ?', what: `↩ ${TEAMS[r.idx].icon}🐸 ${r.tile}`, onCancel: () => { clearTimeout(fallback); resume(); } });
        return;
      }
    } catch {}
    done();
  });

  const flutePill = document.getElementById('flute-pill');
  const btnFlute = document.getElementById('btn-flute');
  function updateFluteHud() {
    const showPill = fluteCharge > 0 ? '' : 'none';
    if (flutePill.style.display !== showPill) flutePill.style.display = showPill;
    const showBtn = (fluteCharge === 0 && state === 'PLAYING' && SC()) ? '' : 'none';
    if (btnFlute.style.display !== showBtn) btnFlute.style.display = showBtn;
  }
  btnFlute.addEventListener('click', () => {
    if (fluteCharge > 0 || state !== 'PLAYING') return;
    state = 'OFFER';
    const resume = () => { if (state === 'OFFER') state = 'PLAYING'; };
    const fallback = setTimeout(resume, 30000);
    trackEvent('reward_offered', { item: 'boost', what: 'flute' });
    const done = () => {
      clearTimeout(fallback);
      fluteCharge = 1;
      spawnBurst(player.x, player.y, '#c084fc', 18);
      showToast('🎶 🐍💤');
      trackEvent('reward_taken', { item: 'boost', what: 'flute' });
      saveActiveRun();
      resume();
      updateHud();
    };
    const coins = SC();
    try {
      if (coins && typeof coins.offer === 'function') {
        coins.offer('boost', done, { title: '🎶 ?', what: '🎶 🐍💤', onCancel: () => { clearTimeout(fallback); resume(); } });
        return;
      }
    } catch {}
    done();
  });

  function runSeconds() { return runStartedAt ? Math.round((Date.now() - runStartedAt) / 1000) : 0; }

  // Home: saves the climb and goes back to the home screen (Continue resumes it)
  function goHome() {
    if (state !== 'PLAYING' && state !== 'PAUSED') return;
    hideSecondChance();
    stepQueue = 0;
    for (const f of frogs) { f.anim = null; f.animQueue = []; }
    saveActiveRun();
    trackEvent('game_over', { level: player.lap + 1, seconds: runSeconds(), score, tile: frogAt(player) });
    state = 'MENU';
    ovTitle.textContent = '🐍 🪜 🐸';
    ovSub.innerHTML = ovSubDefault;
    finalStats.style.display = 'none';
    btnStart.textContent = '🆕 ▶';
    btnPause.textContent = '⏸';
    renderTop5();
    checkSavedRun();
    overlay.classList.remove('hidden');
  }
  btnHome.addEventListener('click', goHome);

  // 🔄 Reset: a fresh game on a new snake and ladder board, both frogs back on square 1, scores kept.
  // First tap arms it (🔄❓ for 2.5 s), the second tap resets, so a stray tap never wipes the board.
  const btnReset = document.getElementById('btn-reset');
  let resetArmed = 0;
  btnReset.addEventListener('click', () => {
    if (state !== 'PLAYING' && state !== 'PAUSED') return;
    if (!resetArmed) {
      btnReset.textContent = '🔄❓';
      resetArmed = setTimeout(() => { resetArmed = 0; btnReset.textContent = '🔄'; }, 2500);
      return;
    }
    clearTimeout(resetArmed); resetArmed = 0; btnReset.textContent = '🔄';
    resetGameKeepScores();
  });
  function resetGameKeepScores() {
    hideSecondChance();
    storeTurn();
    stepQueue = 0;
    turnEndPending = false;
    for (const f of frogs) { f.tile = 1; f.lap = 0; f.anim = null; f.animQueue = []; }
    loadTurn(0);   // red rolls first; scores stay in the frogs
    boardSeed = (Math.random() * 1e9) >>> 0;
    newHundredBoard(0);
    teamSnakeLen[0] = 22; teamSnakeLen[1] = 22;
    chainCount = 0; chainTimer = 0;
    stars = [];
    while (stars.length < STAR_COUNT) spawnStar();
    frogs.forEach((f, i) => {
      const pos = frogSpot(1, i);
      animateFrogTo(pos.x, pos.y, 0.6, { x: (f.x + pos.x) / 2, y: Math.min(f.y, pos.y) - getTileCellRect(1).h * 2 }, f);
      spawnBurst(pos.x, pos.y, TEAMS[i].light, 18);
    });
    spawnHunterBehind();
    paintTurnUi();
    diceSubEl.textContent = `${TEAMS[0].icon}🐸 🎲🎲  ·  ${TEAMS[1].icon}🐍`;
    sfxLadderBoost();
    showToast(`🔄 🔴🐸 1 · 🔵🐸 1   ⭐ ${frogs[0].score} · ${frogs[1].score}`);
    if (state === 'PAUSED') { state = 'PLAYING'; btnPause.textContent = '⏸'; }
    trackEvent('level_start', { level: 1, players: 2, tile: 1, reset: true });
    saveActiveRun();
    updateHud();
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 2100);
  }

  function triggerShake(duration = 0.16, intensity = 3) {
    shakeTimer = duration;
    shakeIntensity = intensity;
  }

  function spawnBurst(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const spd = 50 + Math.random() * 140;
      particles.push({
        x, y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        life: 0.4 + Math.random() * 0.25,
        maxLife: 0.65,
        size: 2 + Math.random() * 2.2,
        color
      });
    }
  }

  function addPopup(x, y, text, color = '#fde68a') {
    floatingPopups.push({ x, y, text, color, life: 0.85, maxLife: 0.85 });
  }

  // ⭐ Bonus stars: colourful stars worth 1 to 6 sit on random squares. A frog that lands on or hops over
  // a star during its dice move scores value x 100 (more stars in one move = 🔗 chain bonus); a new star appears.
  const STAR_COUNT = 8;
  function spawnStar() {
    const busy = new Set([1, 100, ...frogTiles(), ...stars.map((s) => s.tile)]);
    for (let tries = 0; tries < 200; tries++) {
      const tile = 2 + Math.floor(Math.random() * 98);   // 2..99
      if (busy.has(tile)) continue;
      stars.push({ tile, value: 1 + Math.floor(Math.random() * 6), hue: Math.floor(Math.random() * 360), born: timeElapsed });
      return;
    }
  }
  function collectStarAt(tile) {
    const i = stars.findIndex((s) => s.tile === tile);
    if (i < 0) return;
    const s = stars[i];
    stars.splice(i, 1);
    if (chainTimer > 0) chainCount++;
    else chainCount = 1;
    chainTimer = 1.4;
    const mult = 1 + (chainCount - 1) * 0.25;
    const pts = Math.round(s.value * 100 * mult);
    score += pts;
    const pos = getTileCenter(tile);
    const col = `hsl(${s.hue}, 95%, 65%)`;
    sfxGem(s.value);
    spawnBurst(pos.x, pos.y, col, 12 + s.value * 3);
    addPopup(pos.x, pos.y - 14, chainCount >= 2 ? `⭐${s.value} 🔗x${chainCount} +${pts}` : `⭐${s.value} +${pts}`, col);
    if (chainCount >= 3) triggerShake(0.14, 2.5);
    coach('stars', '⭐1 … ⭐6  =  +100 … +600');
    spawnStar();
  }

  function startGame(resumeSaved = false) {
    initAudio();
    const saved = resumeSaved ? checkSavedRun() : null;
    lastDice = saved && Array.isArray(saved.lastDice) ? saved.lastDice : null;
    turnEndPending = false;
    frogs.forEach((f, i) => {
      const s = saved ? saved.frogs[i] : null;
      f.tile = s ? s.tile : 1;
      f.lap = s && s.lap > 0 ? Math.floor(s.lap) : 0;
      f.score = s ? s.score : 0;
      f.flute = s && s.flute ? 1 : 0;
    });
    runId = saved && saved.runId ? saved.runId : Date.now().toString(36);
    // the board belongs to the furthest hundred either frog has reached
    const lapNow = Math.max(frogs[0].lap, frogs[1].lap);
    boardSeed = saved && Number.isFinite(saved.boardSeed) ? saved.boardSeed : DAY_SEED;
    boardLap = lapNow;
    makeDailyBoard(lapNow);
    loadTurn(saved && saved.turn === 1 ? 1 : 0);
    teamSnakeLen[0] = 22; teamSnakeLen[1] = 22;
    snakeMoveTimer = SNAKE_MOVE_EVERY;
    ladderMoveTimer = LADDER_MOVE_EVERY;
    stepQueue = 0;
    stepTimer = 0;
    bumpCooldown = 0;
    chainCount = 0;
    chainTimer = 0;
    shakeTimer = 0;
    timeElapsed = 0;
    particles = [];
    floatingPopups = [];
    // stars: the saved ones come back on Continue, otherwise 8 new ones
    stars = saved && Array.isArray(saved.stars)
      ? saved.stars.filter((s) => s && s.tile > 1 && s.tile < 100 && s.value >= 1 && s.value <= 6)
        .map((s) => ({ tile: s.tile, value: s.value, hue: s.hue || 0, born: -1 }))
      : [];
    while (stars.length < STAR_COUNT) spawnStar();

    layoutBoard();
    frogs.forEach((f, i) => {
      const startPos = frogSpot(f.tile, i);
      f.x = startPos.x;
      f.y = startPos.y;
      f.vx = 0;
      f.vy = 0;
      f.angle = -Math.PI / 2;   // facing up the board
      f.hopTimer = 0;
      f.hopCooldown = 0;
      f.anim = null;
      f.animQueue = [];
      f.tailHistory = [];
      for (let k = 0; k < 20; k++) f.tailHistory.push({ x: f.x, y: f.y + k * 2 });
    });

    // the opponent's live snake starts behind the frog whose turn it is
    spawnHunterBehind();

    paintTurnUi();
    diceNumEl.textContent = lastDice ? diceText(lastDice) : '🎲 -';
    diceSubEl.textContent = `${TEAMS[turn].icon}🐸 🎲🎲  ·  ${TEAMS[1 - turn].icon}🐍`;

    overlay.classList.add('hidden');
    finalStats.style.display = 'none';
    state = 'PLAYING';
    btnPause.textContent = '⏸';
    updateHud();
    secondChanceUsed = false;
    hideSecondChance();
    runStartedAt = Date.now();
    trackEvent('level_start', { level: lapNow + 1, players: 2, tile: frogAt(player), resumed: Boolean(saved) });
    if (!tipsSeen.roll2p) {
      btnRoll.classList.add('pulse');
      mobileDice.classList.add('pulse');
    }
    const me = TEAMS[turn].icon, rival = TEAMS[1 - turn].icon;
    coach('roll2p', isTouch ? `${me}🐸 👉 🎲  =  🎲🎲  +2 … +12` : `${me}🐸  R / ␣ / 🎲  =  🎲🎲  +2 … +12`);
    coach('steer2p', isTouch ? `${rival}🐍 = 👆 ➜ ${me}🐸` : `${rival}🐍 = ⬅ ⬆ ➡ ⬇ / W A S D ➜ ${me}🐸`);
  }

  btnStart.addEventListener('click', () => startGame(false));
  btnContinue.addEventListener('click', () => startGame(true));

  // Endless: a frog on 100 gets +1000, celebrates, and starts the next hundred on square 1 (101, 201 …).
  // The first frog into a new hundred brings a fresh snake and ladder board for both frogs. No game over.
  function reachHundred() {
    const T = TEAMS[turn];
    const top = getTileCenter(100);
    const done = (player.lap + 1) * 100;
    sfxLadderBoost();
    spawnBurst(top.x, top.y, '#fbbf24', 36);
    setTimeout(() => spawnBurst(top.x, top.y, T.light, 30), 350);
    setTimeout(() => spawnBurst(top.x, top.y, '#fde68a', 30), 700);
    triggerShake(0.3, 3);
    addPopup(top.x, top.y + 10, `${T.icon} 🏁 ${done}  +1000`, '#fde68a');
    showToast(`${T.icon}🐸 🏁 ${done} 🎉  ➜  ${done + 1}`);
    coach('hundreds', `🏁 100 ➜ 101 … 200 ➜ 201 … ♾️`);
    player.lap += 1;
    boardTile = 1;
    storeTurn();
    trackEvent('level_complete', { level: player.lap, players: 2, team: turn + 1, seconds: runSeconds(), score, tile: frogAt(player) });
    saveScoreToTop5(score, frogAt(player) - 1, `${runId}-${turn}`);
    renderTop5();
    // the frog hops down from the top square to square 1 of the new hundred
    const start = frogSpot(1);
    const mid = getTileCenter(50);
    animateFrogTo(start.x, start.y, 0.9, { x: mid.x, y: mid.y - getTileCellRect(1).h * 3 });
    if (player.lap > boardLap) newHundredBoard(player.lap);
  }
  // swap in the next hundred's snakes and ladders; they grow in on the board
  function newHundredBoard(lap) {
    boardLap = lap;
    makeDailyBoard(lap);
    for (const k of Object.keys(SNAKE_RISE)) delete SNAKE_RISE[k];
    for (const k of Object.keys(LADDER_RISE)) delete LADDER_RISE[k];
    for (const h of SNAKE_HEADS) SNAKE_RISE[h] = 0;
    for (const b of LADDER_BASES) LADDER_RISE[b] = 0;
    snakeMoveTimer = SNAKE_MOVE_EVERY;
    ladderMoveTimer = LADDER_MOVE_EVERY;
  }

  function updateHud() {
    storeTurn();
    frogs.forEach((f, i) => {
      if (hudTeam[i].tile.textContent !== String(frogAt(f))) hudTeam[i].tile.textContent = frogAt(f);
      if (hudTeam[i].score.textContent !== String(f.score)) hudTeam[i].score.textContent = f.score;
      hudTeam[i].pill.classList.toggle('turn', i === turn);
    });
    updateFluteHud();
    hudDice.textContent = diceText(lastDice);

    if (chainCount >= 2 && chainTimer > 0) {
      hudCombo.classList.add('active');
      hudComboVal.textContent = `x${chainCount}`;
    } else {
      hudCombo.classList.remove('active');
    }
  }

  function updateFx(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.vx *= 0.94; pt.vy *= 0.94;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingPopups.length - 1; i >= 0; i--) {
      const fp = floatingPopups[i];
      fp.y -= 30 * dt;
      fp.life -= dt;
      if (fp.life <= 0) floatingPopups.splice(i, 1);
    }
  }

  function update(dt) {
    if (state === 'GAMEOVER') {
      timeElapsed += dt;
      stepFrogAnim(dt);
      if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);
      updateFx(dt);
      return;
    }
    if (state !== 'PLAYING') return;
    timeElapsed += dt;

    snakeMoveTimer -= dt;
    if (snakeMoveTimer <= 0) {
      snakeMoveTimer = SNAKE_MOVE_EVERY;
      moveRandomIdleSnake();
    }
    ladderMoveTimer -= dt;
    if (ladderMoveTimer <= 0) {
      ladderMoveTimer = LADDER_MOVE_EVERY;
      moveRandomLadder();
    }
    for (const b in LADDER_RISE) {
      LADDER_RISE[b] = Math.min(1, LADDER_RISE[b] + dt / 0.7);
      if (LADDER_RISE[b] >= 1) delete LADDER_RISE[b];
    }
    for (const h in SNAKE_RISE) {
      SNAKE_RISE[h] = Math.min(1, SNAKE_RISE[h] + dt / 0.6);
      if (SNAKE_RISE[h] >= 1) delete SNAKE_RISE[h];
    }

    // weak phone check: average frame over ~3 s of play
    if (!lowFx) {
      fxFrames++; fxTime += dt;
      if (fxFrames >= 180) {
        if (fxTime / fxFrames > 0.028) lowFx = true;
        fxFrames = 0; fxTime = 0;
      }
    }

    // Step through rolled dice tiles visibly one step at a time
    if (stepQueue > 0) {
      stepTimer -= dt;
      if (stepTimer <= 0) {
        stepQueue--;
        stepTimer = 0.16;
        stepOneTileForward();
        if (state !== 'PLAYING') return;
      }
    }

    if (bumpCooldown > 0) bumpCooldown = Math.max(0, bumpCooldown - dt);
    if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - dt);

    if (chainTimer > 0) {
      chainTimer = Math.max(0, chainTimer - dt);
      if (chainTimer === 0) chainCount = 0;
    }

    // Frogs move only with the dice: each one just plays its own hop animation
    for (const f of frogs) {
      const fx = f.x, fy = f.y;
      stepFrogAnim(dt, f);
      if (Math.hypot(f.x - fx, f.y - fy) > 0.3) f.angle = Math.atan2(f.y - fy, f.x - fx);
      f.tailHistory.unshift({ x: f.x, y: f.y });
      while (f.tailHistory.length > 18) f.tailHistory.pop();
    }

    // The move has landed (steps, ladder or snake slide done): the dice passes to the other frog
    if (turnEndPending && stepQueue === 0 && !player.anim) {
      turnEndPending = false;
      switchTurn();
    }

    // Live team snake: the OTHER player steers it (arrow keys / WASD, or drag on the board) to catch the frog
    // whose turn it is. It moves at the frog's own speed: one square per dice step.
    let ix = 0, iy = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) ix -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) ix += 1;
    if (keys['ArrowUp'] || keys['KeyW']) iy -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) iy += 1;
    if (ix === 0 && iy === 0 && pointerActive) {
      const dx = pointerX - snake.x, dy = pointerY - snake.y;
      if (Math.hypot(dx, dy) > 4) { ix = dx; iy = dy; }
    }
    snake.wavePhase += dt * 4.2;
    if (ix !== 0 || iy !== 0) {
      const len = Math.hypot(ix, iy);
      let stepLen = snakeSpeed() * dt;
      if (pointerActive && !keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['ArrowUp'] && !keys['ArrowDown'] &&
          !keys['KeyA'] && !keys['KeyD'] && !keys['KeyW'] && !keys['KeyS']) {
        stepLen = Math.min(stepLen, len);   // a finger target: stop on it, don't overshoot
      }
      snake.angle = Math.atan2(iy, ix);
      const wiggle = Math.sin(snake.wavePhase) * 0.18;
      snake.x += Math.cos(snake.angle + wiggle) * stepLen;
      snake.y += Math.sin(snake.angle + wiggle) * stepLen;
      snake.x = Math.max(BOARD.left + 6, Math.min(BOARD.right - 6, snake.x));
      snake.y = Math.max(BOARD.top + 6, Math.min(BOARD.bottom - 6, snake.y));
    }

    const desiredSegments = teamSnakeLen[snakeOwner()];
    while (snake.segments.length > desiredSegments) snake.segments.pop();
    while (snake.segments.length < desiredSegments) {
      const last = snake.segments[snake.segments.length - 1];
      snake.segments.push({ x: last.x, y: last.y });
    }

    snake.segments[0].x = snake.x;
    snake.segments[0].y = snake.y;
    for (let i = 1; i < snake.segments.length; i++) {
      const prev = snake.segments[i - 1];
      const curr = snake.segments[i];
      const dx = prev.x - curr.x;
      const dy = prev.y - curr.y;
      const d = Math.hypot(dx, dy) || 1;
      if (d > snake.segmentSpacing) {
        curr.x = prev.x - (dx / d) * snake.segmentSpacing;
        curr.y = prev.y - (dy / d) * snake.segmentSpacing;
      }
    }


    // Catch: the opponent's snake head reaches the frog (standing or hopping). The frog drops one row
    // (10 tiles, -25 points per tile), its move stops, the snake grows by 3 and the dice passes on.
    const catchR = Math.max(10, Math.min(getTileCellRect(1).w, getTileCellRect(1).h) * 0.3);
    if (bumpCooldown <= 0 && !turnEndPending && boardTile > 1 &&
        Math.hypot(player.x - snake.x, player.y - snake.y) < catchR) {
      const owner = snakeOwner();
      const fromTile = boardTile;
      const toTile = Math.max(1, boardTile - 10);
      const tilesDown = fromTile - toTile;
      const penalty = Math.min(score, tilesDown * 25);
      const scoreBefore = score;
      stepQueue = 0;
      player.anim = null;
      player.animQueue = [];
      boardTile = toTile;
      score -= penalty;
      bumpCooldown = 2.5;
      sfxSnakeSlide();
      triggerShake(0.18, 3);
      spawnBurst(player.x, player.y, TEAMS[owner].light, 16);
      addPopup(player.x, player.y - 12, `${TEAMS[owner].icon}🐍 ⬇${tilesDown}  -${penalty}`, TEAMS[owner].light);
      const pos = frogSpot(boardTile);
      animateFrogTo(pos.x, pos.y, 0.5);
      teamSnakeLen[owner] = Math.min(46, teamSnakeLen[owner] + 3);
      addPopup(snake.x, snake.y - 14, '🐍 ➕', TEAMS[owner].light);
      showToast(`${TEAMS[owner].icon}🐍💥${TEAMS[turn].icon}🐸 ${player.lap * 100 + fromTile} ➜ ${player.lap * 100 + boardTile}  ⭐ -${penalty}`);
      coach('grow', '🐍💥🐸 = ⬇10   🐍➕');
      saveActiveRun();
      offerSecondChance(fromTile, scoreBefore);
      turnEndPending = true;   // a caught frog's turn is over
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= 0.94;
      pt.vy *= 0.94;
      pt.life -= dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }

    for (let i = floatingPopups.length - 1; i >= 0; i--) {
      const fp = floatingPopups[i];
      fp.y -= 30 * dt;
      fp.life -= dt;
      if (fp.life <= 0) floatingPopups.splice(i, 1);
    }

    updateHud();
  }

  // 3D hole in the board: dark pit with a soil rim; the front lip is drawn last, over the body
  function drawHole(x, y, rx, ry, front) {
    ctx.save();
    if (!front) {
      const g = ctx.createRadialGradient(x, y + ry * 0.3, 0.5, x, y, rx);
      g.addColorStop(0, '#000000');
      g.addColorStop(0.6, '#140a05');
      g.addColorStop(1, '#6b4426');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(110, 72, 44, 0.95)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, Math.PI, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.strokeStyle = '#9a6538';
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(253, 230, 138, 0.35)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.ellipse(x, y + 1.6, rx, ry, 0, 0.25, Math.PI - 0.25);
      ctx.stroke();
    }
    ctx.restore();
  }

  // One end of an idle snake rising out of its hole: round 3D segments, rainbow colours that run along
  // the body, a twisting stripe on every segment, and a head with eyes, fangs and a flicking tongue
  function drawSnakeFromHole(x, y, sz, seed, isHead, rise = 1) {
    const t = timeElapsed;
    const rx = sz * 0.26, ry = sz * 0.1;
    drawHole(x, y, rx, ry, false);

    const n = 11;
    const len = sz * (isHead ? 0.36 : 0.72) * Math.max(0.05, rise);
    const baseR = sz * (isHead ? 0.06 : 0.095);
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const k = i / n; // 0 = inside the hole, 1 = head / tail tip
      const sway = Math.sin(t * 2.6 + seed + k * 3.2) * sz * 0.17 * k;
      pts.push({ x: x + sway, y: y - k * len, k });
    }

    ctx.save();
    // only the part above the hole is visible; the rest of the body is underground
    ctx.beginPath();
    ctx.rect(x - sz * 1.5, y - sz * 2, sz * 3, sz * 2);
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI);
    ctx.clip();

    ctx.globalAlpha = isHead ? 0.45 : 1;   // a faint body under a clearly visible head
    for (let i = 0; i <= n; i++) {
      const p = pts[i];
      const r = isHead ? baseR * (0.85 + 0.25 * p.k) : baseR * (1 - 0.55 * p.k) + 0.9;
      const hue = (seed * 40 + i * 32 + t * 140) % 360;
      const g = ctx.createRadialGradient(p.x - r * 0.35, p.y - r * 0.35, r * 0.1, p.x, p.y, r);
      g.addColorStop(0, `hsl(${hue}, 95%, 80%)`);
      g.addColorStop(0.55, `hsl(${hue}, 88%, 52%)`);
      g.addColorStop(1, `hsl(${(hue + 40) % 360}, 85%, 24%)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fill();

      // twisting stripe: a band that rolls round the segment
      const tw = Math.sin(t * 6 + i * 0.9 + seed);
      ctx.strokeStyle = `hsla(${(hue + 180) % 360}, 95%, 62%, 0.85)`;
      ctx.lineWidth = Math.max(1, r * 0.32);
      ctx.beginPath();
      if (tw >= 0) ctx.ellipse(p.x, p.y, Math.max(0.3, r * tw * 0.9), r * 0.9, 0, -Math.PI / 2, Math.PI / 2);
      else ctx.ellipse(p.x, p.y, Math.max(0.3, -r * tw * 0.9), r * 0.9, 0, Math.PI / 2, Math.PI * 1.5);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    const tip = pts[n];
    if (isHead) {
      const hr = sz * 0.22 * Math.max(0.3, rise);   // big, clear head sitting on its square
      const hue = (seed * 40 + n * 32 + t * 140) % 360;
      ctx.translate(tip.x, tip.y - hr * 0.3);
      ctx.rotate(Math.sin(t * 2.6 + seed + 3.2) * 0.35);
      ctx.shadowBlur = FX(10);
      ctx.shadowColor = `hsl(${hue}, 95%, 60%)`;
      const hg = ctx.createRadialGradient(-hr * 0.3, -hr * 0.4, hr * 0.1, 0, 0, hr * 1.2);
      hg.addColorStop(0, `hsl(${hue}, 95%, 78%)`);
      hg.addColorStop(1, `hsl(${(hue + 50) % 360}, 85%, 30%)`);
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.ellipse(0, 0, hr * 1.2, hr * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = FX(0);
      ctx.strokeStyle = 'rgba(20, 10, 4, 0.85)';   // dark outline so the head reads on every square
      ctx.lineWidth = Math.max(1, hr * 0.1);
      ctx.stroke();

      // small fangs (same small size as before, the head is just bigger)
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(-hr * 0.23, hr * 0.7); ctx.lineTo(-hr * 0.16, hr * 0.7); ctx.lineTo(-hr * 0.195, hr * 0.88);
      ctx.moveTo(hr * 0.16, hr * 0.7); ctx.lineTo(hr * 0.23, hr * 0.7); ctx.lineTo(hr * 0.195, hr * 0.88);
      ctx.fill();

      // eyes with slit pupils
      ctx.fillStyle = '#fef9c3';
      ctx.beginPath();
      ctx.arc(-hr * 0.48, -hr * 0.2, hr * 0.27, 0, Math.PI * 2);
      ctx.arc(hr * 0.48, -hr * 0.2, hr * 0.27, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#111111';
      ctx.beginPath();
      ctx.ellipse(-hr * 0.48, -hr * 0.2, hr * 0.07, hr * 0.2, 0, 0, Math.PI * 2);
      ctx.ellipse(hr * 0.48, -hr * 0.2, hr * 0.07, hr * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();

      // flicking forked tongue
      const flick = Math.sin(t * 9 + seed);
      if (flick > 0) {
        const tl = hr * (0.6 + flick * 0.9);
        ctx.strokeStyle = '#f43f5e';
        ctx.lineWidth = Math.max(1, hr * 0.12);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, hr * 0.8);
        ctx.lineTo(0, hr * 0.8 + tl);
        ctx.lineTo(-hr * 0.22, hr * 0.8 + tl + hr * 0.25);
        ctx.moveTo(0, hr * 0.8 + tl);
        ctx.lineTo(hr * 0.22, hr * 0.8 + tl + hr * 0.25);
        ctx.stroke();
      }
    } else {
      // tail tip: small bright rattle beads
      ctx.shadowBlur = FX(8);
      ctx.shadowColor = '#fde68a';
      ctx.fillStyle = '#fde68a';
      ctx.strokeStyle = '#7c2d12';
      ctx.lineWidth = 0.8;
      for (let b = 0; b < 3; b++) {
        ctx.beginPath();
        ctx.arc(tip.x, tip.y - 2 - b * 3.2, Math.max(1.2, baseR * 0.62 - b * 0.5), 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
      ctx.shadowBlur = FX(0);
    }
    ctx.restore();

    drawHole(x, y, rx, ry, true);
  }

  function drawBoard() {
    ctx.fillStyle = '#18100c';
    ctx.fillRect(0, 0, W, H);

    const { left, top, right, bottom } = BOARD;
    const bw = right - left, bh = bottom - top;
    const cols = 10, rows = 10;
    const cw = bw / cols, ch = bh / rows;
    const cellRef = getTileCellRect(1);
    const tilesNow = state === 'MENU' ? [0, 0] : frogTiles();

    // numbered squares: 1-100, then 101-200 … for the hundred the frog whose turn it is stands in
    ctx.save();
    const lapBase = state === 'MENU' ? 0 : player.lap * 100;
    const fontSize = Math.max(9, Math.min(13, Math.floor(Math.min(cw, ch) * (lapBase >= 900 ? 0.2 : 0.24))));
    ctx.font = `700 ${fontSize}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';

    for (let tileNum = 1; tileNum <= 100; tileNum++) {
      const cell = getTileCellRect(tileNum);
      // a frog's square is tinted in its team colour (the frog whose turn it is wins a shared square)
      const frogHere = tilesNow[turn] === tileNum ? turn : (tilesNow[1 - turn] === tileNum ? 1 - turn : -1);
      const isCurrent = frogHere >= 0;
      const isLadderBase = LADDER_BASES.has(tileNum);
      const isLadderTop = LADDER_TOPS.has(tileNum);
      const isSnakeHead = SNAKE_HEADS.has(tileNum);

      if (isCurrent) {
        ctx.fillStyle = TEAMS[frogHere].tint;
      } else if (isLadderBase) {
        ctx.fillStyle = 'rgba(16, 185, 129, 0.12)';
      } else if (isSnakeHead) {
        ctx.fillStyle = 'rgba(239, 68, 68, 0.13)';
      } else if (isLadderTop) {
        ctx.fillStyle = 'rgba(253, 230, 138, 0.09)';
      } else {
        ctx.fillStyle = (tileNum % 2 === 0) ? 'rgba(245, 158, 11, 0.035)' : 'rgba(255, 255, 255, 0.012)';
      }
      ctx.fillRect(cell.x, cell.y, cell.w, cell.h);

      if (isCurrent) {
        ctx.fillStyle = TEAMS[frogHere].light;
      } else if (isLadderBase) {
        ctx.fillStyle = 'rgba(110, 231, 183, 0.78)';
      } else if (isSnakeHead) {
        ctx.fillStyle = 'rgba(252, 165, 165, 0.85)';
      } else if (isLadderTop || tileNum === 100) {
        ctx.fillStyle = 'rgba(253, 230, 138, 0.65)';
      } else {
        ctx.fillStyle = 'rgba(214, 195, 179, 0.36)';
      }
      ctx.fillText(String(lapBase + tileNum), cell.x + 4, cell.y + 3);
    }
    ctx.restore();

    // Traditional board ladders (base -> top)
    ctx.save();
    for (const [baseStr, topTile] of Object.entries(BOARD_LADDERS)) {
      const baseTile = Number(baseStr);
      const a = getTileCenter(baseTile);
      const bFull = getTileCenter(topTile);
      const lr = LADDER_RISE[baseTile] !== undefined ? LADDER_RISE[baseTile] : 1;
      const wob = lr < 1 ? Math.sin(timeElapsed * 30) * 4 * (1 - lr) : 0;
      const b = { x: a.x + (bFull.x - a.x) * lr + wob, y: a.y + (bFull.y - a.y) * lr };
      const angle = Math.atan2(b.y - a.y, b.x - a.x);
      const perp = angle + Math.PI / 2;
      const halfW = Math.max(3, Math.min(cellRef.w, cellRef.h) * 0.07);   // narrow ladder

      // dark outline under the ladder so it reads on every square
      ctx.lineCap = 'round';
      for (const pass of [1]) {
      // a faint pencil sketch: one hairline, mostly see-through, so the board shows through
      ctx.strokeStyle = 'rgba(245, 193, 108, 0.22)';
      ctx.lineWidth = 1;
      ctx.shadowBlur = 0;
      ctx.shadowColor = '#fbbf24';
      ctx.beginPath();
      ctx.moveTo(a.x + Math.cos(perp) * halfW, a.y + Math.sin(perp) * halfW);
      ctx.lineTo(b.x + Math.cos(perp) * halfW, b.y + Math.sin(perp) * halfW);
      ctx.moveTo(a.x - Math.cos(perp) * halfW, a.y - Math.sin(perp) * halfW);
      ctx.lineTo(b.x - Math.cos(perp) * halfW, b.y - Math.sin(perp) * halfW);

      const dist = Math.hypot(b.x - a.x, b.y - a.y);
      const rungs = Math.max(3, Math.floor(dist / 30));
      for (let r = 1; r < rungs; r++) {
        const t = r / rungs;
        const rx = a.x + (b.x - a.x) * t;
        const ry = a.y + (b.y - a.y) * t;
        ctx.moveTo(rx + Math.cos(perp) * halfW, ry + Math.sin(perp) * halfW);
        ctx.lineTo(rx - Math.cos(perp) * halfW, ry - Math.sin(perp) * halfW);
      }
      ctx.stroke();
      }
      ctx.shadowBlur = 0;
      // green foot ring with an up arrow: step here to climb
      const pulse = 0.35 + Math.sin(timeElapsed * 4 + baseTile) * 0.15;
      ctx.strokeStyle = `rgba(52, 211, 153, ${pulse})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(a.x, a.y, halfW * 2.2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(110, 231, 183, 0.7)';
      ctx.font = `700 ${Math.round(halfW * 2.6)}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⬆', a.x + halfW * 3.4, a.y);
    }
    ctx.restore();

    // Idle snakes in 3D: an enemy of both frogs. Only the head (small fangs) twists out of a hole on the head square
    const snakeSz = Math.max(18, Math.min(cellRef.w, cellRef.h));
    for (const headStr of Object.keys(STATIONARY_SNAKES)) {
      const headTile = Number(headStr);
      const hp = getTileCenter(headTile);

      // Step 2: only the small head shows, on its own square; the body and tail stay hidden underground.
      // Either frog landing here slides down to the tail square.
      const rise = SNAKE_RISE[headTile] !== undefined ? SNAKE_RISE[headTile] : 1;
      drawSnakeFromHole(hp.x, hp.y + snakeSz * 0.2, snakeSz * 0.72, headTile, true, rise);
    }

    ctx.strokeStyle = 'rgba(245, 158, 11, 0.25)';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(left, top, bw, bh);
  }

  // ⭐ Bonus stars: a glowing 5-point star in its own colour with its value (1-6) in the middle;
  // a bigger value draws a bigger star. New stars pop in with a little grow.
  function drawStars() {
    if (state === 'MENU') return;
    const cellNow = getTileCellRect(1);
    const base = Math.max(8, Math.min(cellNow.w, cellNow.h) * 0.26);
    for (const s of stars) {
      const c = getTileCellRect(s.tile);
      const grow = s.born < 0 ? 1 : Math.min(1, (timeElapsed - s.born) / 0.4);
      const R = base * (0.8 + s.value * 0.06) * grow * (1 + Math.sin(timeElapsed * 3 + s.tile) * 0.06);
      if (R < 1) continue;
      const x = c.cx, y = c.cy - c.h * 0.08;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(timeElapsed * 1.5 + s.tile) * 0.15);
      ctx.shadowBlur = FX(14);
      ctx.shadowColor = `hsl(${s.hue}, 95%, 60%)`;
      const g = ctx.createRadialGradient(-R * 0.25, -R * 0.3, R * 0.1, 0, 0, R);
      g.addColorStop(0, `hsl(${s.hue}, 100%, 85%)`);
      g.addColorStop(0.6, `hsl(${s.hue}, 92%, 58%)`);
      g.addColorStop(1, `hsl(${(s.hue + 30) % 360}, 88%, 38%)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const r = k % 2 === 0 ? R : R * 0.47;
        const a = -Math.PI / 2 + (k * Math.PI) / 5;
        if (k === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
      ctx.closePath();
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 1.2;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.75)';
      ctx.stroke();
      ctx.fillStyle = '#1b0f08';
      ctx.font = `900 ${Math.max(8, Math.round(R * 0.82))}px system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(s.value), 0, R * 0.08);
      ctx.restore();
    }
  }

  // live snake colours stay close to its team colour (red team = reds, blue team = blues), with a gentle shimmer
  function getSnakeHue(index) {
    const base = TEAMS[snakeOwner()].hue;
    return Math.round((base + Math.sin(timeElapsed * 2 + index * 0.5) * 18 + 360) % 360);
  }

  function drawSnake() {
    if (!snake.segments.length || state === 'MENU') return;
    const cellNow = getTileCellRect(1);
    const sk = Math.max(1.2, Math.min(2.4, Math.min(cellNow.w, cellNow.h) / 26));   // grows with the squares
    ctx.save();
    for (let i = snake.segments.length - 1; i >= 0; i--) {
      const seg = snake.segments[i];
      const ratio = 1 - i / snake.segments.length;
      const radius = (i === 0 ? 5.5 : Math.max(1.8, 4.2 * ratio)) * sk;

      ctx.beginPath();
      ctx.arc(seg.x, seg.y, radius, 0, Math.PI * 2);
      const hue = getSnakeHue(i);
      const light = i === 0 ? 64 : (i % 3 === 0 ? 54 : 44);
      ctx.fillStyle = `hsl(${hue}, 86%, ${light}%)`;
      ctx.shadowBlur = FX(i < 5 ? 12 : 6);
      ctx.shadowColor = `hsl(${hue}, 90%, 58%)`;
      ctx.fill();
    }

    const head = snake.segments[0];
    ctx.translate(head.x, head.y);
    ctx.rotate(snake.angle);
    ctx.scale(sk, sk);

    const tongueLen = 8 + Math.sin(timeElapsed * 18) * 3;
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(5.5, 0);
    ctx.lineTo(5.5 + tongueLen * 0.7, 0);
    ctx.lineTo(7.5 + tongueLen * 0.7, -1.6);
    ctx.moveTo(5.5 + tongueLen * 0.7, 0);
    ctx.lineTo(7.5 + tongueLen * 0.7, 1.6);
    ctx.stroke();

    ctx.save();
    ctx.shadowBlur = FX(14);
    ctx.shadowColor = '#fef08a';
    ctx.fillStyle = '#fffbeb';
    ctx.beginPath();
    ctx.arc(2.4, -2.4, 1.5, 0, Math.PI * 2);
    ctx.arc(2.4, 2.4, 1.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  // Both frogs, each in its team colour; the frog whose turn it is wears a pulsing ring
  function drawFrogs() {
    if (state === 'MENU') return;
    frogs.forEach((f, i) => { if (i !== turn) drawPlayer(f, i); });
    drawPlayer(frogs[turn], turn);   // the frog to move is drawn on top
  }
  function drawPlayer(player, idx) {
    const isTurn = idx === turn && state === 'PLAYING';
    const hopScale = player.anim ? 1.18 : 1;   // a frog in mid-hop looks a little bigger

    const climberHue = TEAMS[idx].hue;
    const eyeGlowing = true;

    if (isTurn) {
      ctx.save();
      ctx.strokeStyle = TEAMS[idx].light;
      ctx.globalAlpha = 0.55 + Math.sin(timeElapsed * 6) * 0.35;
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      const ringCell = getTileCellRect(1);
      const ringR = Math.max(13, Math.min(ringCell.w, ringCell.h) * 0.36);
      ctx.arc(player.x, player.y, ringR + Math.sin(timeElapsed * 6) * 1.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    ctx.save();
    for (let i = player.tailHistory.length - 1; i >= 1; i--) {
      const pt = player.tailHistory[i];
      const t = 1 - i / player.tailHistory.length;
      const sway = Math.sin(timeElapsed * 12 + i * 0.45) * 4 * (1 - t);
      const r = (1.6 + Math.sin(t * Math.PI) * 3.4) * hopScale;
      const segHue = (climberHue + i * 4) % 360;

      ctx.beginPath();
      ctx.arc(pt.x, pt.y + sway, r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${segHue}, 92%, 58%, 0.42)`;
      ctx.shadowBlur = FX(12);
      ctx.shadowColor = `hsl(${segHue}, 95%, 60%)`;
      ctx.fill();
    }
    ctx.restore();

    ctx.save();
    ctx.translate(player.x, player.y);
    // frogs grow with the square size so both are easy to spot on a phone and a laptop
    const cellNow = getTileCellRect(1);
    const sizeK = Math.max(1.3, Math.min(2.6, Math.min(cellNow.w, cellNow.h) / 26));
    ctx.scale(hopScale * sizeK, hopScale * sizeK);

    if (player.hopTimer > 0) {
      ctx.beginPath();
      ctx.arc(0, 0, 11 + Math.sin(timeElapsed * 12) * 1.5, 0, Math.PI * 2);
      ctx.strokeStyle = '#fde68a';
      ctx.lineWidth = 2;
      ctx.shadowBlur = FX(14);
      ctx.shadowColor = '#f59e0b';
      ctx.stroke();
    }

    ctx.rotate(player.angle);
    ctx.shadowBlur = FX(14);
    ctx.shadowColor = `hsl(${climberHue}, 95%, 56%)`;
    ctx.fillStyle = `hsl(${climberHue}, 92%, 54%)`;
    ctx.beginPath();
    ctx.ellipse(0, 0, 7.5, 5.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fef3c7';
    ctx.beginPath();
    ctx.arc(2.4, -4.2, 1.9, 0, Math.PI * 2);
    ctx.arc(2.4, 4.2, 1.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.shadowBlur = FX(eyeGlowing ? 14 : 8);
    ctx.shadowColor = '#fef08a';
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(4, -2, 1.6, 0, Math.PI * 2);
    ctx.arc(4, 2, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function drawParticlesAndPopups() {
    for (const pt of particles) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const fp of floatingPopups) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, fp.life / fp.maxLife);
      ctx.fillStyle = fp.color;
      ctx.font = '800 13px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(fp.text, fp.x, fp.y);
      ctx.restore();
    }
  }

  function drawPausedBanner() {
    if (state !== 'PAUSED') return;
    ctx.save();
    ctx.fillStyle = 'rgba(24, 16, 12, 0.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fde68a';
    ctx.font = `800 ${W < 520 ? 20 : 26}px system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('⏸', W * 0.5, H * 0.5 - 14);
    ctx.font = `700 ${W < 520 ? 13 : 16}px system-ui, sans-serif`;
    ctx.fillText('P  /  ▶', W * 0.5, H * 0.5 + 16);
    ctx.restore();
  }

  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;

    update(dt);

    ctx.save();
    if (shakeTimer > 0) {
      const sx = (Math.random() - 0.5) * shakeIntensity * 2;
      const sy = (Math.random() - 0.5) * shakeIntensity * 2;
      ctx.translate(sx, sy);
    }
    drawBoard();
    drawStars();
    drawSnake();
    drawFrogs();
    drawParticlesAndPopups();
    ctx.restore();

    drawPausedBanner();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
