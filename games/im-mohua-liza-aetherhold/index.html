<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
@font-face{font-family:"Marcellus SC";font-weight:400;font-display:swap;src:url(fonts/MarcellusSC-400.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-weight:400;font-display:swap;src:url(fonts/AlegreyaSans-400.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-weight:500;font-display:swap;src:url(fonts/AlegreyaSans-500.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-weight:700;font-display:swap;src:url(fonts/AlegreyaSans-700.woff2) format("woff2")}
@font-face{font-family:"Alegreya Sans";font-weight:800;font-display:swap;src:url(fonts/AlegreyaSans-800.woff2) format("woff2")}
[hidden]{display:none!important}body{margin:0}img{max-width:100%}
</style>
<title>Aetherhold</title>
<meta name="claude:viewport-fit-sides" content="cover">
</head>
<body>
<style>
/* Layout: one-screen game. A living sky canvas fills the stage; chrome is carved night-blue panels with gilt edges and clipped corners. */
:root{
  color-scheme:dark;
  --ink:#0e1327; --panel:#19213f; --panel-2:#222c52; --panel-3:#2b376a;
  --line:rgba(232,184,74,.30); --line-2:rgba(232,184,74,.6);
  --gold:#e8b84a; --gold-2:#f7dc8f; --ember:#e2643a; --jade:#4fb39a; --sky:#6fb6e6;
  --text:#f0e7d4; --muted:#a3a6c0; --bad:#e8655a; --good:#7fd38f;
  --display:'Marcellus SC','Palatino Linotype',Georgia,serif;
  --body:'Alegreya Sans','Segoe UI',system-ui,sans-serif;
  --cut:10px;
}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
.ico{display:inline-flex;width:18px;height:18px;flex:none}
.ico svg{width:100%;height:100%}
#app{height:100%;width:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);position:relative;overflow:hidden}
.top>*{min-width:0}.brand,.snd{flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:14px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,#141b36,#0f1530);border-bottom:1px solid var(--line);z-index:5}
.brand{font-family:var(--display);font-size:22px;letter-spacing:.06em;color:var(--gold-2);white-space:nowrap;text-shadow:0 1px 0 #000,0 0 18px rgba(232,184,74,.25)}
.might{display:flex;flex-direction:column;line-height:1.05;padding-left:14px;border-left:1px solid var(--line)}
.might small{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.might b{font-family:var(--display);font-size:17px;color:var(--gold);font-variant-numeric:tabular-nums}
.res{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;min-width:0}
.res::-webkit-scrollbar{display:none}
.chip{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);white-space:nowrap}
.chip .v{font-weight:700;font-variant-numeric:tabular-nums;min-width:3.2ch}
.chip .r{font-size:11px;color:var(--good);font-variant-numeric:tabular-nums}
.chip.pulse{animation:pulse .5s}
@keyframes pulse{50%{background:rgba(232,184,74,.25)}}

.snd{display:flex;gap:6px;flex:none}
.snd button{position:relative;width:36px;height:36px;border:1px solid var(--line);background:rgba(255,255,255,.05);display:grid;place-items:center;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.snd svg{width:19px;height:19px;stroke:var(--gold-2);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.snd button.off svg{stroke:var(--muted);opacity:.6}
.snd button.off::after{content:"";position:absolute;width:24px;height:2px;background:var(--bad);transform:rotate(-45deg)}
main{position:relative;min-height:0;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}
#v-kingdom{overflow:hidden}
#world{display:block;width:100%;height:100%;touch-action:none;cursor:pointer}
.inner{padding-block:18px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1080px;margin:0 auto}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.vh h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;color:var(--gold-2);letter-spacing:.03em;text-wrap:balance}
.vh p{margin:2px 0 0;color:var(--muted);max-width:60ch}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* panels & buttons */
.panel{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;padding:9px 16px;font-weight:800;letter-spacing:.02em;color:#2a1a05;background:linear-gradient(180deg,var(--gold-2),var(--gold) 55%,#c48f22);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:filter .15s,transform .1s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{filter:grayscale(.85) brightness(.7);cursor:not-allowed}
.btn.alt{background:linear-gradient(180deg,#7fe0cc,var(--jade) 60%,#2f8a75);color:#062a22}
.btn.ghost{background:rgba(255,255,255,.06);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.btn.red{background:linear-gradient(180deg,#f39a7a,var(--ember) 60%,#b44322);color:#2b0a02}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.wide{width:100%}
.costs{display:flex;flex-wrap:wrap;gap:4px 10px;font-variant-numeric:tabular-nums;font-size:13px}
.costs span{display:inline-flex;align-items:center;gap:3px}
.costs .short{color:var(--bad)}
.costs .ico{width:15px;height:15px}
.bar{height:8px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.08);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#c48f22,var(--gold-2))}
.bar.xp i{background:linear-gradient(90deg,#3a8fd0,#8fd4ff)}
.muted{color:var(--muted)}

/* kingdom HUD */
.hud{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:2}
.hud>*{pointer-events:auto}
.hud .panel{padding:8px 12px;font-size:13px;display:flex;flex-direction:column;gap:4px;min-width:170px}
.hud .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--jade);display:inline-block}
.dot.busy{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.zoom{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:12px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button{width:38px;height:38px;border:1px solid var(--line);background:rgba(20,27,54,.85);font-size:20px;line-height:1;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
.sheet{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;width:min(390px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;padding:16px;z-index:3;animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:.4}}
.sheet h3,.modal h3{font-family:var(--display);font-weight:400;font-size:22px;margin:0;color:var(--gold-2)}
.sheet .x,.modal .x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:22px;color:var(--muted);padding:4px 8px}
.sheet p{margin:6px 0 10px;color:var(--muted);line-height:1.4}
.stat{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.08);font-variant-numeric:tabular-nums}
.stat b{color:var(--text)}
.stat .up{color:var(--good)}
.blist{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bopt{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:8px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.bopt .bi{width:44px;height:44px;display:grid;place-items:center;background:rgba(0,0,0,.25)}
.bopt .nm{font-weight:700}
.bopt .lk{font-size:12px;color:var(--bad)}
.sec{margin-top:14px}
.sec>.label{display:block;margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

/* heroes */
.team{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.slot{padding:10px;display:flex;align-items:center;gap:10px;min-height:76px}
.slot.empty{justify-content:center;color:var(--muted);font-size:13px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.hcard{position:relative;padding:12px 10px 12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:inherit}
.hcard .panel{position:absolute;inset:0;z-index:-1}
.hcard .nm{font-weight:800;line-height:1.15}
.hcard .cl{font-size:12px;color:var(--muted)}
.hcard .rr{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.hcard.inteam::after{content:"In team";position:absolute;top:8px;left:8px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;background:var(--jade);color:#06231c;padding:2px 6px;font-weight:800}
.hcard.locked{opacity:.45;filter:grayscale(.8)}
.stars{color:var(--gold);letter-spacing:1px;font-size:13px}
.stars .off{color:rgba(255,255,255,.15)}
.lv{font-variant-numeric:tabular-nums;font-size:13px}

/* army */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.tcard{padding:16px;display:flex;flex-direction:column;gap:8px}
.tcard h4{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold-2)}
.tcard .cnt{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums}

/* campaign */
.map{position:relative;margin:0 auto;max-width:560px}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.region{position:absolute;left:0;right:0;border:1px solid var(--line);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.region .rn{position:absolute;top:10px;left:16px;font-family:var(--display);font-size:18px;color:var(--gold-2);text-shadow:0 1px 2px #000}
.region .rs{position:absolute;top:34px;left:16px;font-size:12px;color:rgba(255,255,255,.65)}
.node{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;border:2px solid var(--line-2);background:radial-gradient(circle at 35% 30%,#3a4a82,#1a2347);font-family:var(--display);font-size:19px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .15s}
.node:hover{transform:translate(-50%,-50%) scale(1.08)}
.node.done{background:radial-gradient(circle at 35% 30%,#4fb39a,#1f5a4c);border-color:#9fe8d6}
.node.cur{background:radial-gradient(circle at 35% 30%,#ffe6a0,#c48f22);color:#2a1a05;border-color:#fff3c8;animation:glow 1.6s infinite}
.node.boss{width:68px;height:68px;font-size:12px;border-width:3px}
.node.boss::before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed rgba(232,100,58,.8)}
.node.lock{opacity:.4;cursor:not-allowed}
.node .st{position:absolute;bottom:-17px;font-size:11px;color:var(--gold);letter-spacing:1px;font-family:var(--body);white-space:nowrap}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(247,220,143,.15),0 0 26px rgba(247,220,143,.6)}}

/* quests */
.qlist{display:flex;flex-direction:column;gap:10px;max-width:720px}
.quest{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 16px}
.quest h4{margin:0 0 2px;font-size:16px}
.quest p{margin:0 0 6px;color:var(--muted);font-size:13px}
.quest.ready{border-color:var(--gold)}
.quest.ready h4{color:var(--gold-2)}

/* nav */
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:linear-gradient(0deg,#0b1024,#141b36);border-top:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));z-index:5}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 9px;background:none;border:0;color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.tab.on{color:var(--gold-2)}
.tab.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--gold)}
.badge{position:absolute;top:4px;right:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--ember);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;letter-spacing:0}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,8,20,.72);display:grid;place-items:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.modal{position:relative;width:min(460px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;animation:rise .25s ease-out}
.mhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}

/* summon */
.summon{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.burst{position:relative;width:220px;height:280px;perspective:900px;display:grid;place-items:center}
.burst::before{content:"";position:absolute;inset:-40px;background:radial-gradient(circle,var(--rc) 0,transparent 62%);opacity:0;animation:burst 1.4s .7s forwards}
@keyframes burst{30%{opacity:.9}100%{opacity:.35}}
.card{position:relative;width:180px;height:250px;transform-style:preserve-3d;animation:flip .9s .5s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes flip{to{transform:rotateY(180deg)}}
.card>div{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px solid var(--rc);background:linear-gradient(180deg,#2b376a,#141b36);clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.card .back{font-family:var(--display);font-size:60px;color:var(--gold)}
.card .front{transform:rotateY(180deg);padding:10px}

/* battle */
#battle{position:fixed;inset:0;z-index:40;display:grid;grid-template-rows:auto 1fr auto;background:#0b0f20}
.bhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:#121834}
.bhead h3{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:var(--gold-2)}
.bhead .sp{margin-left:auto;display:flex;gap:6px}
#bcv{width:100%;height:100%;display:block;min-height:0}
.blog{padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:#121834;font-size:13px;min-height:58px;color:var(--muted)}
.blog div:last-child{color:var(--text)}

#toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;z-index:60;pointer-events:none;width:min(420px,calc(100% - 32px))}
.toast{padding:9px 14px;font-size:14px;text-align:center;animation:tin .3s ease-out,tout .4s 2.6s forwards;background:linear-gradient(180deg,#2b376a,#19213f);border:1px solid var(--line-2)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

@media (max-width:640px){
  .brand{font-size:18px}
  .might{display:none}
  .team{grid-template-columns:1fr}
  .tab span{font-size:10px}
  .hud .panel{min-width:0}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>

<div id="app">
  <header class="top">
    <div class="brand">Aetherhold</div>
    <div class="might"><small>Might</small><b id="might">0</b></div>
    <div class="res" id="res"></div>
    <div class="snd">
      <button id="snd-music" data-act="snd:music" aria-label="Music on or off" title="Music"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg></button>
      <button id="snd-sfx" data-act="snd:sfx" aria-label="Sound effects on or off" title="Sound effects"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg></button>
    </div>
  </header>
  <main>
    <section id="v-kingdom" class="view">
      <canvas id="world" aria-label="Your floating kingdom. Tap a plot to build or upgrade."></canvas>
      <div class="hud" id="hud"></div>
      <div class="zoom">
        <button data-act="zoom:1" aria-label="Zoom in">+</button>
        <button data-act="zoom:-1" aria-label="Zoom out">&minus;</button>
        <button data-act="zoom:0" aria-label="Reset view" style="font-size:13px">&#8634;</button>
      </div>
      <div id="sheet" class="sheet panel" hidden></div>
    </section>
    <section id="v-heroes" class="view" hidden><div class="inner" id="heroes"></div></section>
    <section id="v-army" class="view" hidden><div class="inner" id="army"></div></section>
    <section id="v-campaign" class="view" hidden><div class="inner" id="campaign"></div></section>
    <section id="v-quests" class="view" hidden><div class="inner" id="quests"></div></section>
  </main>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-act="tab:kingdom"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V10l3-2v-3h2v2l2-1.5L14 7V5h2v3l3 2v11M10 21v-5h4v5"/></svg><span>Kingdom</span></button>
    <button class="tab" data-act="tab:heroes"><svg viewBox="0 0 24 24"><path d="M12 3l7 2.5v5.5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V5.5z"/><path d="M9 11l2 2 4-4"/></svg><span>Heroes</span></button>
    <button class="tab" data-act="tab:army"><svg viewBox="0 0 24 24"><path d="M5 3l2 0 0 15M7 4l5 3-5 3M14 21l6-6M17 14l3 3M4 21l3-3"/></svg><span>Army</span></button>
    <button class="tab" data-act="tab:campaign"><svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg><span>Campaign</span></button>
    <button class="tab" data-act="tab:quests"><svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 012 2v14a2 2 0 01-2 2H6z"/><path d="M6 3a2 2 0 00-2 2v2h2M9 8h7M9 12h7M9 16h4"/></svg><span>Quests</span><i class="badge" id="qbadge" hidden></i></button>
  </nav>
  <div id="battle" hidden>
    <div class="bhead"><h3 id="btitle"></h3><span class="label" id="bround"></span>
      <div class="sp"><button class="btn ghost sm" data-act="bspeed" id="bspeed">Speed 1x</button><button class="btn ghost sm" data-act="bskip">Skip</button></div></div>
    <canvas id="bcv"></canvas>
    <div class="blog" id="blog"></div>
  </div>
  <div id="modal" class="scrim" hidden></div>
  <div id="toasts"></div>
</div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const now=()=>Date.now();
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=n=>{n=Math.floor(n);if(n>=1e6)return(n/1e6).toFixed(n>=1e7?0:1)+'M';if(n>=1e4)return(n/1e3).toFixed(n>=1e5?0:1)+'K';return n.toLocaleString('en-US')};
const fmtT=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}h ${m}m`:m?`${m}m ${String(x).padStart(2,'0')}s`:`${x}s`};
function hexRGB(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function shade(h,f){const c=hexRGB(h);const t=f<0?0:255,p=Math.abs(f);return`rgb(${c.map(v=>Math.round(v+(t-v)*p)).join(',')})`}
const mixA=(a,b,t)=>a.map((v,i)=>Math.round(v+(b[i]-v)*t));
const rgb=a=>`rgb(${a[0]},${a[1]},${a[2]})`;
function seeded(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}

function addXp(k,x){const h=S.heroes[k];h.xp+=x;let up=0;while(h.lvl<lvlCap()&&h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);h.lvl++;up++}if(h.lvl>=lvlCap())h.xp=Math.min(h.xp,xpNeed(h.lvl));return up}

 const d=c.createDelay();d.delayTime.value=.31;const fb=c.createGain();fb.gain.value=.38;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
 d.connect(lp);lp.connect(fb);fb.connect(d);lp.connect(SND.master);SND.verb=c.createGain();SND.verb.gain.value=.3;SND.verb.connect(d);
 const nb=c.createBuffer(1,c.sampleRate,c.sampleRate),ch=nb.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;SND.noise=nb;

 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+attack);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
 os.connect(g);g.connect(bus);if(verb)g.connect(SND.verb);os.start(t0);os.stop(t0+dur+.05)}

  if(u.kind==='hero'){const im=crestImg(u.key);bx.fillStyle='rgba(0,0,0,.3)';bx.beginPath();bx.ellipse(x,y+r0*1.25,r0,r0*.28,0,0,7);bx.fill();if(im.complete)bx.drawImage(im,x-r0*1.1,y-r0*1.2,r0*2.2,r0*2.47)}
  else if(u.kind==='troop')drawTroop(u,x,y,t);
  else drawFoe(u,x,y,u.boss?r0*1.7:r0,t);
  if(u.flash>0){bx.globalCompositeOperation='lighter';bx.fillStyle=`rgba(255,120,100,${u.flash*.5})`;bx.beginPath();bx.arc(x,y,(u.boss?r0*1.7:r0)*1.1,0,7);bx.fill();bx.globalCompositeOperation='source-over';u.flash=Math.max(0,u.flash-.06)}
  const rr=u.boss?r0*1.7:r0,bw=Math.max(56,rr*2.6),by=y-rr*1.55-(u.kind==='troop'?14:0);
  bx.fillStyle='rgba(0,0,0,.6)';bx.fillRect(x-bw/2-1,by-1,bw+2,7);bx.fillStyle=u.side===0?'#7fd38f':'#e8655a';bx.fillRect(x-bw/2,by,bw*u.hp/u.maxHp,5);
  if(u.shield>0){bx.fillStyle='rgba(159,216,255,.9)';bx.fillRect(x-bw/2,by,Math.min(bw,bw*u.shield/u.maxHp),2)}
  if(u.kind==='hero'){bx.fillStyle='rgba(0,0,0,.6)';bx.fillRect(x-bw/2-1,by+6,bw+2,4);bx.fillStyle=u.energy>=100?'#fff3c8':'#e8b84a';bx.fillRect(x-bw/2,by+7,bw*u.energy/100,2)}
  bx.font='700 12px "Alegreya Sans",sans-serif';bx.textAlign='center';bx.fillStyle='#f0e7d4';bx.fillText(u.kind==='troop'?`${u.name} ×${Math.max(0,u.count)}`:u.name,x,by-5);
  bx.globalAlpha=1;
 }
 for(const p of B.proj){if(p.p<=0||p.p>=1)continue;const sx=p.u.x,sy=p.u.y-10,tx=p.t.x,ty=p.t.y;const x=sx+(tx-sx)*p.p,y=sy+(ty-sy)*p.p-Math.sin(p.p*Math.PI)*40;
  bx.fillStyle=p.col;bx.shadowColor=p.col;bx.shadowBlur=14;bx.beginPath();bx.arc(x,y,p.big?7:4,0,7);bx.fill();bx.shadowBlur=0;bx.globalAlpha=.4;bx.beginPath();bx.arc(x-(tx-sx)*.03,y,p.big?5:3,0,7);bx.fill();bx.globalAlpha=1}
 B.floats=B.floats.filter(f=>(f.life-=f.part?.03:.016)>0);
 for(const f of B.floats){if(f.part){f.x+=f.vx/60;f.y+=f.vy/60;f.vy+=200/60;bx.globalAlpha=f.life;bx.fillStyle=f.col;bx.fillRect(f.x-2,f.y-2,4,4);bx.globalAlpha=1;continue}
  const yy=f.y-(1.3-f.life)*40;bx.globalAlpha=Math.min(1,f.life*2);bx.font=`800 ${f.big?22:16}px "Alegreya Sans",sans-serif`;bx.textAlign='center';bx.lineWidth=4;bx.strokeStyle='rgba(0,0,0,.75)';bx.strokeText(f.text,f.x,yy);bx.fillStyle=f.col;bx.fillText(f.text,f.x,yy);bx.globalAlpha=1}
 bx.restore();
}

/* ---------- loop ---------- */
let lastTick=now();
function tick(){
 const t=now(),dt=Math.min(3600*8,(t-lastTick)/1000);lastTick=t;
 S.plots.forEach(p=>{if(p.build&&t>=p.build.end)finishBuild(p);const r=prodRate(p);if(r)p.buf=Math.min(bufCap(p),p.buf+r*dt)});
 renderActive();
}
let LOW=false,lastF=0;const fts=[];
function frame(t){if(tab==='kingdom'&&!B){if(lastF&&!LOW&&fts.length<120){fts.push(t-lastF);if(fts.length===120){fts.sort((a,b)=>a-b);if(fts[60]>30)LOW=true}}lastF=t;drawWorld(t)}else lastF=0;requestAnimationFrame(frame)}

function boot(data){
 S=(data&&data.S&&data.S.v===1)?data.S:load();
 const away=(now()-(S.last||now()))/1000;lastTick=S.last||now();
 tick();
 if(away>90)toast(`Welcome back. Your realm kept working for ${fmtT(Math.min(away,28800))}.`);
 else if(!S.stats.collected)setTimeout(()=>toast('Tap the bubbles above your buildings to gather resources.'),800);
 setInterval(tick,500);setInterval(save,5000);
 window.addEventListener('beforeunload',save);
 fitWorld();requestAnimationFrame(frame);renderSnd();
}
try{window.claude?.hot?.snapshot?.(()=>({S}))}catch(e){}
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
</script>
