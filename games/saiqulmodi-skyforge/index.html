<style id="deck-one-row">
  /* Control deck (01-Nov-2026, user): ONE slim line of controls along the bottom so the aircraft stays in view;
     each panel is a single line (its title, then its buttons); ◀ ▶ slide to the next panels and back.
     Overrides the older squeezed dock styles. */
  html body #control-deck {
    position: fixed !important; left: 46px !important; right: 46px !important; bottom: 8px !important; top: auto !important;
    transform: none !important; max-width: none !important; width: auto !important; height: auto !important;
    display: flex !important; flex-direction: row !important; flex-wrap: nowrap !important; align-items: stretch !important;
    gap: 8px !important; overflow-x: auto !important; overflow-y: hidden !important; scroll-behavior: smooth;
    scroll-snap-type: x proximity; scrollbar-width: none; padding: 0 !important; margin: 0 !important;
    background: none !important; border: 0 !important; z-index: 10001 !important; pointer-events: auto !important;
  }
  html body #control-deck::-webkit-scrollbar { display: none; }
  html body #control-deck > .panel-box {
    flex: 0 0 auto !important; display: flex !important; flex-direction: row !important; align-items: center !important;
    gap: 6px !important; position: static !important; height: auto !important; max-height: none !important;
    min-height: 0 !important; overflow: visible !important; scroll-snap-align: start;
    padding: 5px 10px !important; margin: 0 !important; background: rgba(15, 23, 42, 0.92) !important;
    border: 1px solid #38bdf8 !important; border-radius: 8px !important;
  }
  html body #control-deck .panel-box b { display: inline-block !important; color: #38bdf8 !important; font-size: 11px !important;
    margin: 0 4px 0 0 !important; white-space: nowrap !important; }
  html body #control-deck .btn-grid { display: flex !important; flex-direction: row !important; gap: 4px !important; margin: 0 !important; }
  html body #control-deck button { font-size: 12px !important; padding: 6px 10px !important; white-space: nowrap !important; }
  html body #control-deck select { min-width: 190px; margin: 0 !important; display: inline-block !important; }
  html body #control-deck #ap-readout { margin: 0 0 0 4px !important; white-space: nowrap; }
  .deck-arrow { position: fixed; z-index: 10002; width: 36px; border: 1px solid #38bdf8; border-radius: 8px;
    background: rgba(15, 23, 42, 0.94) !important; color: #38bdf8; font-size: 20px !important; padding: 0 !important;
    cursor: pointer; pointer-events: auto; }
  .deck-arrow[disabled] { opacity: 0.3; cursor: default; }
  /* 03-Nov-2026 (user): every version shows only the first two tabs at the bottom (aircraft, camera).
     The other panels stay in the page hidden, so their keyboard keys keep working. */
  html body #control-deck > .panel-box:nth-child(n+3) { display: none !important; }

<script>
  // ◀ ▶ beside the control deck: slide one screen of panels; each arrow dims at its end; same height as the deck
  window.addEventListener('DOMContentLoaded', () => {
    const deck = document.getElementById('control-deck');
    if (!deck) return;
    const mk = (side, txt) => { const b = document.createElement('button'); b.className = 'deck-arrow'; b.textContent = txt; b.setAttribute('aria-label', side === 'left' ? 'Previous panels' : 'Next panels'); b.style[side] = '6px'; document.body.appendChild(b); return b; };
    const prev = mk('left', '◀'), next = mk('right', '▶');
    const panels = () => [...deck.children];
    next.onclick = () => {                      // the first panel cut off on the right comes fully into view
      const edge = deck.scrollLeft + deck.clientWidth;
      const p = panels().find((el) => el.offsetLeft + el.offsetWidth > edge + 2);
      if (p) deck.scrollTo({ left: Math.min(p.offsetLeft, deck.scrollWidth - deck.clientWidth) });
    };
    prev.onclick = () => {                      // back by one screen of panels
      const target = deck.scrollLeft - deck.clientWidth;
      const p = panels().find((el) => el.offsetLeft >= target - 2);
      deck.scrollTo({ left: Math.max(0, p ? p.offsetLeft : 0) });
    };
    const place = () => {
      const r = deck.getBoundingClientRect();
      [prev, next].forEach((b) => { b.style.top = r.top + 'px'; b.style.height = r.height + 'px'; });
      prev.disabled = deck.scrollLeft <= 2;
      next.disabled = deck.scrollLeft + deck.clientWidth >= deck.scrollWidth - 2;
    };
    deck.addEventListener('scroll', place);
    window.addEventListener('resize', place);
    setTimeout(place, 300); setInterval(place, 1500);
  });
</script>
<style>
  .deck-pop-btn { border: 1px solid #38bdf8 !important; background: rgba(2,132,199,0.25) !important; color: #e2e8f0 !important; }
  .deck-pop-btn .t { color: #38bdf8; margin-right: 4px; }
  .deck-pop { position: fixed; z-index: 10005; display: none; flex-direction: column; gap: 4px; padding: 6px;
    background: rgba(15,23,42,0.97); border: 1px solid #38bdf8; border-radius: 8px; box-shadow: 0 -6px 20px rgba(0,0,0,.5); }
  .deck-pop.open { display: flex; }
  .deck-pop button { width: 100%; text-align: left; font-size: 12px !important; padding: 7px 12px !important; white-space: nowrap; }
  .deck-pop hr { border: 0; border-top: 1px solid #334155; margin: 2px 0; }
</style>
<script>
  // Bottom row: a group with more than one button becomes one button ("GROUP: current choice") that pops up its
  // list above it. The original buttons move into the list unchanged (their ids, onclick and keys keep working).
  window.addEventListener('DOMContentLoaded', () => {
    const deck = document.getElementById('control-deck');
    if (!deck) return;
    let openPop = null;
    const closeAll = () => { if (openPop) { openPop.classList.remove('open'); openPop = null; } };
    document.addEventListener('pointerdown', (e) => { if (openPop && !openPop.contains(e.target) && !e.target.closest('.deck-pop-btn')) closeAll(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
    deck.querySelectorAll('.panel-box').forEach((panel) => {
      const grids = [...panel.querySelectorAll('.btn-grid')];
      const buttons = grids.flatMap((g) => [...g.querySelectorAll('button')]);
      if (buttons.length < 2) return;
      const title = (panel.querySelector('b') || {}).textContent || 'MENU';
      const pop = document.createElement('nav'); pop.className = 'deck-pop';   // <nav>: the old body > div styles leave it alone
      grids.forEach((g, i) => {
        if (i && g.querySelector('button')) pop.appendChild(document.createElement('hr'));
        [...g.querySelectorAll('button')].forEach((b) => pop.appendChild(b));
        g.remove();
      });
      document.body.appendChild(pop);
      const trig = document.createElement('button'); trig.className = 'deck-pop-btn';
      const label = () => {
        const act = buttons.find((b) => b.classList.contains('active'));
        trig.innerHTML = `<span class="t">${title}</span>${act ? act.textContent : ''} &#9652;`;
      };
      label();
      buttons.forEach((b) => {
        new MutationObserver(label).observe(b, { attributes: true, attributeFilter: ['class'], characterData: true, childList: true, subtree: true });
        b.addEventListener('click', () => { setTimeout(label, 0); closeAll(); });
      });
      trig.onclick = () => {
        if (openPop === pop) return closeAll();
        closeAll();
        pop.classList.add('open'); openPop = pop;
        const r = trig.getBoundingClientRect();
        pop.style.minWidth = r.width + 'px';
        pop.style.bottom = (window.innerHeight - r.top + 6) + 'px';
        pop.style.left = Math.max(6, Math.min(r.left, window.innerWidth - pop.offsetWidth - 6)) + 'px';
      };
      // the group title is inside the button now; the first title of the panel is hidden (others, like DESTINATION, stay)
      const firstB = panel.querySelector('b'); if (firstB) firstB.style.setProperty('display', 'none', 'important');
      panel.insertBefore(trig, firstB ? firstB.nextSibling : panel.firstChild);
    });
    deck.addEventListener('scroll', closeAll);
    window.addEventListener('resize', closeAll);
  });
</script>
