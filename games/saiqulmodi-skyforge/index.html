        <button id="btn-ap" onclick="toggleAP()">AP [Z]</button>
        <button id="btn-alt" onclick="toggleAltHold()">ALT HOLD [X]</button>
        <button id="btn-nav" onclick="toggleNav()">NAV [V]</button>
      </div>
      <div class="btn-grid" style="margin-top: 4px;">
        <button onclick="adjustTargetAlt(-500)">▼ -500 FT</button>
        <button onclick="adjustTargetAlt(500)">▲ +500 FT</button>
      </div>
      <div id="ap-readout" style="margin-top:6px; color:#38bdf8;">STATUS: AP OFF | TGT: NONE</div>
    </div>
  </div>

  <div id="audio-banner" onclick="initAudio()">CLICK TO ACTIVATE PROCEDURAL AUDIO ENGINE</div>
  <canvas id="viewport"></canvas>
  <canvas id="hud-canvas"></canvas>

  <script type="module">
    import * as THREE from 'three';
    import { FleetManager } from './src/aircraft/FleetManager.js';
    import { getFlightProfile, stepRotorcraft } from './src/physics/aero.js';
    import { stepFixedWingAir, groundRollAccel, trimThrottle, trimAlpha, atmosphere, AIR } from './src/physics/flight.js';
    import { GamepadInput } from './src/core/gamepad.js';
    import { initTouchControls, isTouchPlay } from './src/core/touchControls.js';
    import { initPhase6Environment } from './src/environment/phase6/index.js';
    import { initPhase7Weather } from './src/environment/phase7/index.js';
    import { initPhase8Navigation } from './src/environment/phase8/index.js';
    import { initPhase9Combat } from './src/combat/phase9/index.js';
    import { createAirliner } from './src/aircraft/airliner.js';
    import { Wingman, sharedChaseCamera } from './src/multiplayer/wingman.js';
    import { SOUTH_RUNWAY_X } from './src/environment/phase6/voblAirport.js';
    import { NavComputer } from './src/nav/returnRoute.js';
    import { MovingMap } from './src/nav/movingMap.js';
    import { Terrain, SEA_LEVEL_Y } from './src/world/terrain.js';
    import { Airports } from './src/world/airports.js';
    import { createVisuals, addSurfaceDetail } from './src/render/visuals.js';
    import { CrashSequence } from './src/fx/crashSequence.js';
    import { FighterFx } from './src/fx/fighterFx.js';
    // Altitude above sea level in feet (world y = 0 is VOBL at 915 m / 3,002 ft)
    const amslFt = (y) => (y - SEA_LEVEL_Y) * 3.28084;

    // ==========================================
    // 1. PROCEDURAL AUDIO SYNTHESIZER
    // ==========================================
    class ProceduralAudioEngine {
      constructor() {
        this.ctx = null;
        this.initialized = false;
      }

      init() {
        if (this.initialized) return;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();

        this.masterCompressor = this.ctx.createDynamicsCompressor();
        this.masterCompressor.threshold.setValueAtTime(-6, this.ctx.currentTime);
        this.masterCompressor.connect(this.ctx.destination);

        this.propOsc = this.ctx.createOscillator();
        this.propGain = this.ctx.createGain();
        this.propFilter = this.ctx.createBiquadFilter();
        this.propOsc.type = 'sawtooth';
        this.propFilter.type = 'lowpass';
        this.propFilter.frequency.setValueAtTime(350, this.ctx.currentTime);
        this.propOsc.connect(this.propFilter);
        this.propFilter.connect(this.propGain);
        this.propGain.connect(this.masterCompressor);
        this.propGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
        this.propOsc.start();

        this.jetOsc = this.ctx.createOscillator();
        this.jetGain = this.ctx.createGain();
        this.jetOsc.type = 'sine';
        this.jetOsc.frequency.setValueAtTime(600, this.ctx.currentTime);
        this.jetGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
        this.jetOsc.connect(this.jetGain);
        this.jetGain.connect(this.masterCompressor);
        this.jetOsc.start();

        const bufferSize = this.ctx.sampleRate * 2;
        const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

        this.noiseSource = this.ctx.createBufferSource();
        this.noiseSource.buffer = noiseBuffer;
        this.noiseSource.loop = true;

        this.noiseFilter = this.ctx.createBiquadFilter();
        this.noiseFilter.type = 'bandpass';
        this.noiseFilter.frequency.setValueAtTime(400, this.ctx.currentTime);
        this.noiseFilter.Q.setValueAtTime(1.2, this.ctx.currentTime);

        this.noiseGain = this.ctx.createGain();
        this.noiseGain.gain.setValueAtTime(0.04, this.ctx.currentTime);

        this.noiseSource.connect(this.noiseFilter);
        this.noiseFilter.connect(this.noiseGain);
        this.noiseGain.connect(this.masterCompressor);
        this.noiseSource.start();

        this.stallOsc1 = this.ctx.createOscillator();
        this.stallOsc2 = this.ctx.createOscillator();
        this.stallGain = this.ctx.createGain();
        this.stallOsc1.type = 'square';
        this.stallOsc2.type = 'square';
        this.stallOsc1.frequency.setValueAtTime(700, this.ctx.currentTime);
        this.stallOsc2.frequency.setValueAtTime(720, this.ctx.currentTime);
        this.stallGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
        this.stallOsc1.connect(this.stallGain);
        this.stallOsc2.connect(this.stallGain);
        this.stallGain.connect(this.masterCompressor);
        this.stallOsc1.start();
        this.stallOsc2.start();

        this.lastWoW = true;
        this.cannonBuffer = noiseBuffer;
        this.initialized = true;
        const banner = document.getElementById('audio-banner');
        if (banner) banner.style.display = 'none';
      }

      update(type, powerPercent, speedKts, isAfterburner, aoaDeg = 0, onGround = true) {
        if (!this.initialized || this.ctx.state !== 'running') return;

        // Stall Warning Horn buzzer
        const isStall = !onGround && aoaDeg >= 14.0 && speedKts > 30;
        if (this.stallGain) {
          this.stallGain.gain.setTargetAtTime(isStall ? 0.28 : 0.0, this.ctx.currentTime, 0.03);
        }

        // Automatic Touchdown Screech on ground contact
        if (!this.lastWoW && onGround && speedKts > 35) {
          this.playTouchdown();
        }
        this.lastWoW = onGround;
        if (!this.initialized || this.ctx.state !== 'running') return;

        if (type === 'fighter') {
          this.propGain.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.05);
          this.jetGain.gain.setTargetAtTime(0.12 + (powerPercent / 100) * 0.15, this.ctx.currentTime, 0.05);
          const freq = 600 + (powerPercent / 100) * 1900;
          this.jetOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.05);

          const afterburnerBoost = isAfterburner ? 0.35 : 0.05;
          this.noiseGain.gain.setTargetAtTime(0.1 + afterburnerBoost + (speedKts / 1500) * 0.25, this.ctx.currentTime, 0.1);
          this.noiseFilter.frequency.setTargetAtTime(isAfterburner ? 700 : 350, this.ctx.currentTime, 0.1);
        } else if (type === 'trainer') {
          this.propGain.gain.setTargetAtTime(0.15, this.ctx.currentTime, 0.05);
          this.jetGain.gain.setTargetAtTime(0.0, this.ctx.currentTime, 0.05);
          const freq = 45 + (powerPercent / 100) * 80;
          this.propOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.05);
        } else if (type === 'airliner') {
          this.propGain.gain.setTargetAtTime(0.02, this.ctx.currentTime, 0.05);
          this.jetGain.gain.setTargetAtTime(0.08 + (powerPercent / 100) * 0.12, this.ctx.currentTime, 0.05);
          this.jetOsc.frequency.setTargetAtTime(500 + (powerPercent / 100) * 1500, this.ctx.currentTime, 0.05);
        } else if (type === 'heli') {
          this.propGain.gain.setTargetAtTime(0.18, this.ctx.currentTime, 0.05);
          this.jetGain.gain.setTargetAtTime(0.02, this.ctx.currentTime, 0.05);
        }
      }

      playCannon() {
        if (!this.initialized || this.ctx.state !== 'running') return;
        const source = this.ctx.createBufferSource();
        source.buffer = this.cannonBuffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(650, this.ctx.currentTime);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        source.connect(filter);
        filter.connect(gain);
        gain.connect(this.masterCompressor);
        source.start();
        source.stop(this.ctx.currentTime + 0.1);
      }

      // Sonic boom as the aircraft goes through Mach 1: a deep double thump
      playBoom() {
        if (!this.initialized || this.ctx.state !== 'running') return;
        [0, 0.14].forEach((at) => {
          const source = this.ctx.createBufferSource();
          source.buffer = this.cannonBuffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(170, this.ctx.currentTime);
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.0001, this.ctx.currentTime + at);
          gain.gain.exponentialRampToValueAtTime(0.9, this.ctx.currentTime + at + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + at + 0.55);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(this.masterCompressor);
          source.start(this.ctx.currentTime + at);
          source.stop(this.ctx.currentTime + at + 0.6);
        });
      }

      playTouchdown() {
        if (!this.initialized || this.ctx.state !== 'running') return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(500, this.ctx.currentTime + 0.35);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.4);
        osc.connect(gain);
        gain.connect(this.masterCompressor);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
      }
    }

    const audio = new ProceduralAudioEngine();
    window.initAudio = () => audio.init();
    // Sound on / off, in the camera tab (Stratos: a clear mute button)
    window.toggleSound = () => {
      audio.init();
      audio.muted = !audio.muted;
      if (audio.muted) audio.ctx.suspend(); else audio.ctx.resume();
      document.getElementById('btn-sound').classList.toggle('active', !audio.muted);
    };
    window.addEventListener('keydown', () => audio.init(), { once: true });
    window.addEventListener('pointerdown', () => audio.init(), { once: true });

    // ==========================================
    // 2. THREE.JS VIEWPORT & RENDERING PIPELINE
    // ==========================================
    const viewport = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ canvas: viewport, antialias: true, logarithmicDepthBuffer: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true; // pixel ratio, exposure and shadow quality: src/render/visuals.js
    window.skyforgeRenderer = renderer; // console check: skyforgeRenderer.info.memory

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x89c2d9);
    scene.fog = new THREE.FogExp2(0x89c2d9, 0.00003); // clear day: Nandi Hills (~19 km) visible from the field

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 100000);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444f44, 0.75);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaea, 1.8);
    sunLight.position.set(2500, 3500, 1500);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Physical sky, haze, reflections, sun shadows that follow the aircraft, quality tiers (no clouds: clear views)
    const visuals = await createVisuals({ renderer, scene, camera, sunLight, hemiLight });
    window.skyforgeVisuals = visuals;
    window.setGraphics = (tier) => visuals.setQuality(tier);
    window.setTimeOfDay = (name) => visuals.setTime(name);

    // ==========================================
    // 3. TERRAIN, NANDI HILLS & RUNWAYS
    // ==========================================
    // Real South India terrain and coastline (lat 8-19.5 N, lon 74-85 E), streamed around the aircraft.
    // y = 0 is VOBL field elevation (915 m AMSL); sea level is y = -915. The VOBL area is flattened.
    const terrain = await Terrain.load('./assets/terrain/south_india');
    scene.add(terrain.group);
    visuals.attachSea(terrain.sea);

    // South India airports (real runways from OurAirports); each one levels its ground to field elevation
    const airports = await Airports.load('./assets/airports/south_india_airports.json');
    airports.registerFlatZones(terrain);
    scene.add(airports.group);
    let activeEnd = airports.end('VOBL', '09L'); // take-off point, approach target and route home
    terrain.prime(0, 1800);

    // VOBL Runway 09L
    const runway = new THREE.Mesh(
      new THREE.PlaneGeometry(45, 4000),
      addSurfaceDetail(new THREE.MeshStandardMaterial({ color: 0x2b2c2e, roughness: 0.9 }), 'runway')
    );
    runway.rotation.x = -Math.PI / 2;
    runway.position.y = 0.05;
    runway.receiveShadow = true;
    scene.add(runway);

    const lineMat = new THREE.MeshStandardMaterial({ color: 0xf2f2f2, roughness: 0.75 }); // lit paint (follows time of day)
    for (let z = -1900; z < 1900; z += 50) {
      const stripe = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 30), lineMat);
      stripe.rotation.x = -Math.PI / 2;
      stripe.position.set(0, 0.08, z);
      scene.add(stripe);
    }

    // Phase 6: real Bengaluru scenery - Nandi Hills, VOBL terminals / ATC / hangars, runway markings,
    // PAPI, MALSR, NH44 highway grid, Bengaluru city (src/environment/phase6)
    const phase6 = initPhase6Environment(scene, terrain);

    // Phase 7: wind / gusts, monsoon rain (no clouds), wet-runway braking - set by the weather buttons
    const phase7 = initPhase7Weather(scene);
    let wind = null;
    // Phase 8: AI circuit traffic at VOBL (real airliner model) + ILS for the active runway
    const phase8 = initPhase8Navigation(scene, {
      southRunwayX: SOUTH_RUNWAY_X,
      makeAirliner: () => {
        const a = createAirliner();
        visuals.enhanceAircraft(a.mesh);
        return { mesh: a.mesh, groundHeight: a.profile.groundHeight };
      }
    });
    let ilsNow = { inRange: false };
    // Phase 9: fighter weapons range - target drones + ground sites, gun (Space / X-A), missiles (F) on radar lock
    const combat = initPhase9Combat(scene, {
      groundY: (x, z) => terrain.groundY(x, z),
      onDestroyed: (t) => flightMsg(`SPLASH - ${t.id} DESTROYED`, '#f97316', 3500)
    });
    let combatNow = null;
    let missilesLeft = 6;
    const navComputer = new NavComputer(); // route to the destination (default: back to the departure runway)
    navComputer.groundFtAt = (x, z) => amslFt(terrain.groundY(x, z));
    let destEnd = null; // stage 4: chosen destination runway end (null = return to the departure runway)
    const CRUISE_FT = { trainer: 9500, airliner: 25000, fighter: 25000, heli: 5500 };
    const movingMap = new MovingMap();     // north-up map overlay (M = size)
    movingMap.setAirports(airports);
    window.skyforgeMap = movingMap; // console check: skyforgeMap.nearest, skyforgeMap.extras
    navComputer.setRunway(activeEnd);
    movingMap.setHome(activeEnd);

    // Tracers
    const tracers = [];
    const tracerGeo = new THREE.CylinderGeometry(0.12, 0.12, 5.0, 6);
    tracerGeo.rotateX(Math.PI / 2);
    const tracerMat = new THREE.MeshBasicMaterial({ color: 0xfde047 });

    // ==========================================
    // 4. FLEET DEFINITIONS
    // ==========================================
    const fleetContainer = new THREE.Group();
    scene.add(fleetContainer);

    const state = {
      pos: fleetContainer.position,
      vel: new THREE.Vector3(0, 0, 0),
      rot: new THREE.Euler(0, 0, 0, 'YXZ'),
      throttle: 0.0,
      power: 0.0,
      ias: 0,
      mach: 0.0,
      flaps: 0,
      reversers: false,
      isAfterburner: false,
      onGround: true,
      prevOnGround: true,
      apMaster: false,
      altHold: false,
      targetAlt: 5000 // ft AMSL
    };
    window.skyforgeState = state; // console check: position, speed, throttle

    // FleetManager owns the 4 airframes (src/aircraft/*). Camera layers: exterior on LAYER_EXTERIOR
    // (chase only), 3D cockpit on LAYER_COCKPIT (cockpit view only); world and lights stay on layer 0.
    const LAYER_COCKPIT = 1;
    const LAYER_EXTERIOR = 2;
    const fleet = new FleetManager({ parent: fleetContainer, layers: { exterior: LAYER_EXTERIOR, cockpit: LAYER_COCKPIT } });
    let currentAircraft = null;
    let aircraft = null; // active aircraft contract
    let cockpit = null;  // its 3D cockpit
    let profile = null;  // active flight profile (pushed into aero.js by FleetManager)

    const WEB_EDITION = document.querySelector('meta[name="skyforge-edition"]').content === 'web';
    document.body.dataset.edition = WEB_EDITION ? 'web' : 'full';
    window.selectAircraft = (type) => {
      if (type === currentAircraft) return;
      if (WEB_EDITION && type !== 'fighter') return;   // the web edition is the fighter only
      aircraft = fleet.switchTo(type);
      cockpit = fleet.cockpit;
      visuals.enhanceAircraft(aircraft.mesh, cockpit.group);
      profile = getFlightProfile();
      currentAircraft = type;
      navComputer.setCruise(CRUISE_FT[type] || 9500);

      // A different aircraft is always a fresh start on the runway, never a jump in mid-air (user, 03-Nov-2026)
      resetToThreshold();
      updateAPReadout();
    };

    // Heading (rot.y) that points the nose along a world direction
    const yawFor = (dx, dz) => Math.atan2(-dx, -dz);

    // On the ground 200 m past the active runway's threshold, lined up for take-off
    function resetToThreshold() {
      flightEnd(false);
      if (crashFx.active) { crashFx.clear(); flightMsg(`NEW START - ${activeEnd.icao} RWY ${activeEnd.ident}, ready for take-off`, '#4ade80', 4000); }
      if (aircraft) aircraft.mesh.visible = true;
      const e = activeEnd;
      state.pos.set(e.thrX + e.dirX * 200, e.y + profile.groundHeight, e.thrZ + e.dirZ * 200);
      terrain.prime(state.pos.x, state.pos.z);
      state.rot.set(0, yawFor(e.dirX, e.dirZ), 0);
      state.vel.set(0, 0, 0);
      state.altZeroFt = 0;
      state.gStress = 0;
      state.loadG = 1;
      state.stalled = false;
      state.overspeed = false;
      state.structuralFail = false;
      if (cockpit) cockpit.reset();   // full tanks on a fresh start
      state.throttle = 0;
      state.power = 0;
      state.ias = 0;
      state.mach = 0.0;
      state.onGround = true;
      state.apMaster = false;
      state.altHold = false;
      state.navMode = false;
      landing.airTime = 0;
      landing.rotateCued = false;
      landing.crashResetAt = 0;
      landing.rollout = false;
      landing.depMs = 0;
      missilesLeft = 6;
      landing.depIcao = activeEnd.icao;
      updateAPReadout();
    }

    // ==========================================
    // TAKE-OFF & LANDING
    // ==========================================
    const landing = { airTime: 0, rotateCued: false, crashResetAt: 0, rollout: false };
    const crashFx = new CrashSequence(scene);   // eject + parachute, fire, debris, crash camera
    window.skyforgeCrash = crashFx; // console check: skyforgeCrash.t
    const GLIDE_RAD = 3 * Math.PI / 180;

    const flightMsgEl = document.createElement('div');
    flightMsgEl.id = 'flight-msg';
    flightMsgEl.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:10002;padding:8px 18px;' +
      'font:bold 15px monospace;background:rgba(6,12,18,0.88);border:1px solid currentColor;display:none;text-align:center;';
    document.body.appendChild(flightMsgEl);
    function flightMsg(text, color = '#00ffcc', ms = 5000) {
      flightMsgEl.textContent = text;
      flightMsgEl.style.color = color;
      flightMsgEl.style.display = 'block';
      clearTimeout(flightMsgEl._t);
      flightMsgEl._t = setTimeout(() => { flightMsgEl.style.display = 'none'; }, ms);
    }

    // ---- Track guidance: green on track, yellow drifting, red badly off; warnings flash red with a beep ----
    const cueEl = document.createElement('div');
    cueEl.id = 'track-cue';
    cueEl.style.cssText = 'position:fixed;top:128px;left:50%;transform:translateX(-50%);z-index:10002;display:none;' +
      'padding:6px 16px 7px;border:2px solid;border-radius:8px;font:bold 17px monospace;text-align:center;min-width:300px;' +
      'background:rgba(6,12,18,0.82);pointer-events:none;text-shadow:0 1px 2px #000;white-space:nowrap;';
    document.body.appendChild(cueEl);
    const cueStyle = document.createElement('style');
    cueStyle.textContent = '@keyframes cueFlash{0%,100%{opacity:1}50%{opacity:.35}} #track-cue.warn{animation:cueFlash .5s infinite}' +
      ' #track-cue small{display:block;font:12px monospace;opacity:.85;margin-top:2px}';
    document.head.appendChild(cueStyle);
    const CUE = { green: '#4ade80', yellow: '#facc15', red: '#ef4444' };
    let cueBeepAt = 0, cueKey = '';
    function cueBeep() {
      if (audio.muted) return;
      try {
        const ac = cueBeep.ac || (cueBeep.ac = new (window.AudioContext || window.webkitAudioContext)());
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'square'; o.frequency.value = 940; g.gain.value = 0.06;
        o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + 0.18);
      } catch (e) { /* audio blocked until the first click */ }
    }
    // nav: route guidance (or null); returns nothing, draws the banner
    function updateTrackCue(nav, headingDeg, terrainY) {
      if (state.onGround || crashFx.active || twoPlayer) { cueEl.style.display = 'none'; return; }
      const altFt = amslFt(state.pos.y), aglFt = altFt - amslFt(terrainY);
      const lvl = (a) => (a === 'red' ? 2 : a === 'yellow' ? 1 : 0);
      // warnings first (they override the route advice)
      const ahead = new THREE.Vector3(-Math.sin(state.rot.y), 0, -Math.cos(state.rot.y)).multiplyScalar(Math.max(600, Math.hypot(state.vel.x, state.vel.z) * 12));
      const groundAheadFt = amslFt(terrain.groundY(state.pos.x + ahead.x, state.pos.z + ahead.z));
      const bankDeg = Math.abs(state.rot.z) * 180 / Math.PI;
      const nearRunway = movingMap.nearest && movingMap.nearest.distKm < 4;   // on final: low and slow is normal
      let warn = null;
      if (aglFt < 400 && state.vel.y < -6 && !nearRunway) warn = ['TERRAIN - PULL UP', 'sinking fast close to the ground: nose up, full power'];
      else if (groundAheadFt > altFt - 300 && !nearRunway) warn = ['TERRAIN AHEAD - CLIMB', `ground ahead ${Math.round(groundAheadFt).toLocaleString('en-IN')} FT: climb now`];
      else if (!profile.rotorcraft && state.ias < profile.stallKt * 1.08 && aglFt > 50) warn = ['STALL - NOSE DOWN + POWER', `${Math.round(state.ias)} KT, stall ${profile.stallKt} KT`];
      else if (bankDeg > 60) warn = ['BANK ANGLE - ROLL LEVEL', `${Math.round(bankDeg)} DEG bank`];
      if (warn) {
        cueEl.className = 'warn';
        cueEl.style.color = CUE.red; cueEl.style.borderColor = CUE.red;
        cueEl.innerHTML = `&#9888; ${warn[0]}<small>${warn[1]}</small>`;
        cueEl.style.display = 'block';
        const now = performance.now();
        if (now > cueBeepAt) { cueBeep(); cueBeepAt = now + 900; }
        return;
      }
      cueEl.className = '';
      // where to steer: the route's next waypoint, or the nearest runway when there is no route
      let turn, target, detail;
      if (nav && !nav.complete) {
        turn = nav.turn; target = nav.targetAltFt;
        detail = `${nav.name} ${nav.distNm.toFixed(1)} NM  ${Math.floor(nav.etaSec / 60)}:${String(Math.round(nav.etaSec % 60)).padStart(2, '0')}  to ${nav.destination}`;
      } else if (movingMap.nearest) {
        const nr = movingMap.nearest;
        turn = ((nr.bearing - headingDeg + 540) % 360) - 180; target = null;
        detail = `nearest runway ${nr.icao} ${nr.ident} ${nr.distKm.toFixed(1)} KM`;
      } else { cueEl.style.display = 'none'; return; }
      const a = Math.abs(turn);
      const hdg = a < 5 ? ['green', 'ON TRACK'] : a < 25
        ? ['yellow', `${turn < 0 ? '&#9664; TURN LEFT' : 'TURN RIGHT &#9654;'} ${Math.round(a)}&deg;`]
        : ['red', `${turn < 0 ? '&#9664;&#9664; TURN LEFT NOW' : 'TURN RIGHT NOW &#9654;&#9654;'} ${Math.round(a)}&deg;`];
      let alt = null;
      if (target !== null) {
        const d = target - altFt, ad = Math.abs(d);
        alt = ad < 300 ? ['green', `ALT ${Math.round(altFt).toLocaleString('en-IN')} OK`] : ad < 1000
          ? ['yellow', `${d > 0 ? '&#9650; CLIMB' : '&#9660; DESCEND'} ${Math.round(ad / 100) * 100} FT`]
          : ['red', `${d > 0 ? '&#9650;&#9650; CLIMB NOW' : '&#9660;&#9660; DESCEND NOW'} TO ${target.toLocaleString('en-IN')}`];
      }
      const worst = alt && lvl(alt[0]) > lvl(hdg[0]) ? alt[0] : hdg[0];
      const part = (x) => `<span style="color:${CUE[x[0]]}">${x[1]}</span>`;
      const html = `${part(hdg)}${alt ? ' &nbsp;|&nbsp; ' + part(alt) : ''}<small style="color:#cbd5e1">${detail}</small>`;
      if (html !== cueKey) { cueEl.innerHTML = html; cueKey = html; }
      cueEl.style.borderColor = CUE[worst];
      cueEl.style.display = 'block';
    }

    // ---- Stratos analytics: one game = one flight, from leaving the ground to landing (level_complete) or crash
    // (game_over), with the seconds flown. Only the shared Stratos script; does nothing outside stratos.games. ----
    function track(name, details) {
      try { const S = window.Stratos || (window.parent !== window ? window.parent.Stratos : null); if (S) S.track(name, details); } catch (e) { /* never break the game */ }
    }
    let flightStartedAt = 0;
    function flightStart() {
      if (flightStartedAt) return;
      flightStartedAt = Date.now();
      track('level_start', { level: currentAircraft, airport: activeEnd.icao });
    }
    function flightEnd(landed, extra = {}) {
      if (!flightStartedAt) return;
      const seconds = Math.round((Date.now() - flightStartedAt) / 1000);
      flightStartedAt = 0;
      track(landed ? 'level_complete' : 'game_over', Object.assign({ level: currentAircraft, seconds }, extra));
    }

    // A reason to come back: stars for every landing (smooth = 3), a running total, and a daily streak. No words.
    const starsEl = document.createElement('nav');
    starsEl.id = 'landing-stars';
    starsEl.style.cssText = 'position:fixed;top:26%;left:50%;transform:translateX(-50%) scale(0.6);z-index:10003;pointer-events:none;opacity:0;' +
      'transition:opacity .25s ease, transform .35s cubic-bezier(.2,1.6,.4,1);text-align:center;font:bold 22px monospace;color:#fff;text-shadow:0 2px 8px #000;white-space:nowrap;';
    document.body.appendChild(starsEl);
    function awardLanding(stars) {
      // One award per landing: a bounce on the same runway does not count twice
      if (performance.now() - (starsEl._at || -1e9) < 30000) return;
      starsEl._at = performance.now();
      let save = { total: 0, streak: 0, day: '' };
      try { save = Object.assign(save, JSON.parse(localStorage.getItem('skyforge.stars') || '{}')); } catch (e) { /* storage blocked */ }
      const today = new Date().toDateString();
      const yesterday = new Date(Date.now() - 864e5).toDateString();
      if (save.day !== today) save.streak = save.day === yesterday ? save.streak + 1 : 1;
      save.day = today;
      save.total += stars;
      try { localStorage.setItem('skyforge.stars', JSON.stringify(save)); } catch (e) { /* storage blocked */ }
      starsEl.innerHTML = `<div style="font-size:54px;color:#fde047;letter-spacing:6px;">${'&#9733;'.repeat(stars)}<span style="opacity:.25">${'&#9733;'.repeat(3 - stars)}</span></div>&#9733; ${save.total} &nbsp; &#128293; ${save.streak}`;
      starsEl.style.opacity = '1';
      starsEl.style.transform = 'translateX(-50%) scale(1)';
      clearTimeout(starsEl._t);
      starsEl._t = setTimeout(() => { starsEl.style.opacity = '0'; starsEl.style.transform = 'translateX(-50%) scale(0.6)'; }, 3500);
    }

    function crash(reason) {
      if (landing.crashResetAt) return;
      flightMsg(`CRASH: ${reason} - PILOT EJECTED. New start at ${activeEnd.icao} RWY ${activeEnd.ident} in 10 s`, '#ef4444', 6000);
      landing.crashResetAt = performance.now() + 1e9;   // the new start comes when the crash scene ends
      flightEnd(false);
      // the airframe's main paint colour, for the debris
      let paint = 0x8896a8;
      aircraft.mesh.traverse((o) => { if (paint === 0x8896a8 && o.isMesh && o.material && o.material.color) paint = o.material.color.getHex(); });
      crashFx.start(state.pos, velBefore, terrain.groundY(state.pos.x, state.pos.z), paint);
      aircraft.mesh.visible = false;
      // The wreck is on the ground, so the aircraft's numbers are too, wherever the crash began (0 ft, 0 kt, level)
      state.pos.y = terrain.groundY(state.pos.x, state.pos.z) + profile.groundHeight;
      state.altZeroFt = 0;
      state.rot.x = 0;
      state.rot.z = 0;
      state.onGround = true;
      state.prevOnGround = true;
      state.vel.set(0, 0, 0);
      state.throttle = 0;
      state.power = 0;
    }

    // Rates a touchdown: sink rate, attitude, and whether the wheels are on a runway
    function onTouchdown(sinkMs) {
      if (landing.airTime < 1.5) { landing.airTime = 0; return; } // just a skip at lift-off
      landing.airTime = 0;
      landing.rollout = !profile.rotorcraft;
      const fpm = Math.round(sinkMs * 196.85);
      const rollDeg = Math.abs(landing.cRoll ?? state.rot.z) * 180 / Math.PI;
      const pitchAtContact = landing.cPitch ?? state.rot.x;
      landing.cPitch = landing.cRoll = undefined;
      const headingNowDeg = ((90 - state.rot.y * 180 / Math.PI) % 360 + 360) % 360;
      const rwy = airports.runwayAt(state.pos.x, state.pos.z, headingNowDeg); // any airport's runway
      const onHigherGround = terrain.groundY(state.pos.x, state.pos.z) > 30; // hillside, not a field
      if (profile.rotorcraft) {
        if (fpm > 800) crash(`HARD LANDING ${fpm} FPM`);
        else if (state.ias > 40) crash(onHigherGround ? 'TERRAIN IMPACT' : `GROUND CONTACT AT ${Math.round(state.ias)} KT`);
        else { flightMsg(`LANDED - ${fpm} FPM${rwy ? ` on ${rwy.icao} RWY ${rwy.ident}` : ''}`, '#4ade80'); flightEnd(true, { fpm }); }
        return;
      }
      if (fpm > 900) return crash(`HARD LANDING ${fpm} FPM`);
      if (rollDeg > 15) return crash(`WINGTIP STRIKE (${Math.round(rollDeg)} DEG BANK)`);
      if (pitchAtContact < -0.09) return crash('NOSE-FIRST TOUCHDOWN');
      if (profile.approachKt && state.ias > profile.approachKt * 1.5) return crash(`TOUCHDOWN FAR TOO FAST (${Math.round(state.ias)} KT)`);
      if (!rwy && state.ias > 40) return crash(onHigherGround ? 'TERRAIN IMPACT' : 'OFF-RUNWAY TOUCHDOWN');
      const grade = fpm < 240 ? 'SMOOTH' : fpm < 600 ? 'NORMAL' : 'FIRM';
      awardLanding(grade === 'SMOOTH' ? 3 : grade === 'NORMAL' ? 2 : 1);
      const arrived = destEnd && rwy.icao === destEnd.icao && rwy.icao !== landing.depIcao;
      const trip = arrived && landing.depMs ? ` - ARRIVED from ${landing.depIcao}, flight time ${Math.round((performance.now() - landing.depMs) / 60000)} min` : '';
      flightMsg(`${grade} LANDING - ${fpm} FPM, ${rwy.icao} RWY ${rwy.ident}, ${rwy.distPast} M past threshold${trip}. Brakes: B / L3`, '#4ade80', 9000);
      flightEnd(true, { fpm, airport: rwy.icao });
    }

    // Puts the aircraft on a 3 degree final to the active runway (fixed-wing 8 km out, helicopter 1.5 km)
    window.startApproach = () => {
      const e = activeEnd;
      const v = profile.approachKt / 1.94384;
      const dist = profile.rotorcraft ? 1500 : 8000;
      const aimX = e.thrX + e.dirX * 400, aimZ = e.thrZ + e.dirZ * 400; // aiming point / PAPI abeam
      state.pos.set(aimX - e.dirX * dist, e.y + profile.groundHeight + dist * Math.tan(GLIDE_RAD), aimZ - e.dirZ * dist);
      terrain.prime(state.pos.x, state.pos.z);
      state.vel.set(e.dirX * v * Math.cos(GLIDE_RAD), -v * Math.sin(GLIDE_RAD), e.dirZ * v * Math.cos(GLIDE_RAD));
      state.onGround = false;
      state.apMaster = false;
      state.altHold = false;
      state.holdGamma = -GLIDE_RAD;
      state.rollRate = 0;
      landing.airTime = 10;
      landing.crashResetAt = 0;
      if (profile.rotorcraft) {
        state.rot.set(0, yawFor(e.dirX, e.dirZ), 0);
        state.throttle = 0.66; // slightly below hover collective: gentle descent
        state.power = 66;
      } else {
        // Trim for the 3 degree path: lift = weight at this speed, thrust = drag minus the glide's help
        const hM = amslFt(state.pos.y) * 0.3048;
        state.rot.set(trimAlpha(profile, v, hM) - GLIDE_RAD, yawFor(e.dirX, e.dirZ), 0);
        state.throttle = trimThrottle(currentAircraft, profile, v, -GLIDE_RAD, hM);
        state.power = state.throttle * 100;
      }
      updateAPReadout();
      flightMsg(`FINAL APPROACH ${e.icao} RWY ${e.ident} at ${profile.approachKt} KT - follow the PAPI: 2 white + 2 red = on glide path`, '#38bdf8', 7000);
    };

    // Airport picker: the chosen runway end becomes the take-off point, approach target and route home
    window.selectRunway = (value) => {
      const [icao, ident] = value.split(' ');
      const e = airports.end(icao, ident);
      if (!e) return;
      activeEnd = e;
      if (!destEnd) { navComputer.setRunway(e); movingMap.setHome(e); }
    };

    // Nearest runway (always on the map): route straight to it
    window.landNearest = () => {
      const n = movingMap.nearest;
      if (!n) return;
      const dst = document.getElementById('dst-select');
      if (dst) dst.value = `${n.icao} ${n.ident}`;
      window.selectDestination(`${n.icao} ${n.ident}`);
    };

    // Stage 4: destination airport (route = TOC -> en-route points -> TOD -> arrival fixes -> runway)
    window.selectDestination = (value) => {
      if (value === 'RETURN') {
        destEnd = null;
        navComputer.setRunway(activeEnd);
        movingMap.setHome(activeEnd);
        flightMsg(`ROUTE: back to ${activeEnd.icao} RWY ${activeEnd.ident}`, '#e879f9', 4000);
        return;
      }
      const [icao, ident] = value.split(' ');
      const e = airports.end(icao, ident);
      if (!e) return;
      destEnd = e;
      navComputer.setRunway(e);
      movingMap.setHome(e);
      if (!state.onGround) navComputer.replan(state.pos.x, state.pos.z, amslFt(state.pos.y));
      const nm = Math.round(Math.hypot(e.thrX - state.pos.x, e.thrZ - state.pos.z) / 1852);
      flightMsg(`ROUTE: ${activeEnd.icao} -> ${e.icao} ${e.airportName} RWY ${e.ident}, ${nm} NM. Take off, then NAV [V] follows the route`, '#e879f9', 7000);
    };
    window.startAtRunway = () => { resetToThreshold(); flightMsg(`${activeEnd.icao} ${activeEnd.airportName} - RWY ${activeEnd.ident}, ${activeEnd.elevFt} FT`, '#38bdf8', 4000); };
    (function fillAirportPicker() {
      const sel = document.getElementById('apt-select');
      if (!sel) return;
      airports.ends()
        .sort((a, b) => (a.icao + a.ident).localeCompare(b.icao + b.ident))
        .forEach((e) => {
          const opt = document.createElement('option');
          opt.value = `${e.icao} ${e.ident}`;
          opt.textContent = `${e.icao} ${e.airportName} - RWY ${e.ident}`;
          if (e === activeEnd || (e.icao === activeEnd.icao && e.ident === activeEnd.ident)) opt.selected = true;
          sel.appendChild(opt);
        });
      const dst = document.getElementById('dst-select');
      if (!dst) return;
      dst.innerHTML = '<option value="RETURN">Return to departure runway</option>';
      airports.ends()
        .sort((a, b) => (a.icao + a.ident).localeCompare(b.icao + b.ident))
        .forEach((e) => {
          const opt = document.createElement('option');
          opt.value = `${e.icao} ${e.ident}`;
          opt.textContent = `${e.icao} ${e.airportName} - RWY ${e.ident}`;
          dst.appendChild(opt);
        });
    })();

    // Highlight the active fleet button
    window.addEventListener('aircraftchanged', (e) => {
      ['trainer', 'airliner', 'fighter', 'heli'].forEach(id => {
        const btn = document.getElementById(`btn-${id}`);
        if (btn) btn.classList.toggle('active', id === e.detail.id);
      });
    });

    selectAircraft('fighter'); // the fighter is always the starting aircraft (user, 03-Nov-2026)

    // ==========================================
    // 5. CONTROLS & AUTOPILOT
    // ==========================================
    // Weather presets: haze density/colour, sun strength and sky turbidity (src/render/visuals.js)
    window.setWeather = (preset) => {
      visuals.setWeather(preset);
      const rwyHdg = (Math.atan2(-activeEnd.dirZ, -activeEnd.dirX) * 180 / Math.PI + 360) % 360;
      const w = phase7.setPreset(preset, rwyHdg);
      flightMsg(`WIND ${String(Math.round(w.from)).padStart(3, '0')}/${w.kts} KT G${w.kts + w.gust}${w.rain ? ' | RAIN' : ''}${w.wet ? ' | WET RUNWAY' : ''}`, '#38bdf8', 4000);
    };

    window.toggleAP = () => {
      if (state.onGround) return;
      state.apMaster = !state.apMaster;
      if (state.apMaster && !state.altHold) toggleAltHold();
      updateAPReadout();
    };

    window.toggleAltHold = () => {
      if (state.onGround) return;
      state.altHold = !state.altHold;
      if (state.altHold) {
        state.targetAlt = Math.max(500, Math.round(amslFt(state.pos.y) / 100) * 100);
      }
      updateAPReadout();
    };

    // NAV: autopilot follows the route (bank towards the next waypoint, altitude hold at its altitude)
    window.toggleNav = () => {
      if (state.onGround || profile.rotorcraft) { flightMsg('NAV: airborne fixed-wing only', '#facc15', 2500); return; }
      state.navMode = !state.navMode;
      if (state.navMode) { state.apMaster = true; state.altHold = true; }
      updateAPReadout();
    };

    window.adjustTargetAlt = (deltaFt) => {
      state.targetAlt = Math.max(500, state.targetAlt + deltaFt);
      updateAPReadout();
    };

    function updateAPReadout() {
      const btnAp = document.getElementById('btn-ap');
      const btnAlt = document.getElementById('btn-alt');
      if (btnAp) btnAp.classList.toggle('active', state.apMaster);
      if (btnAlt) btnAlt.classList.toggle('active', state.altHold);
      const btnNav = document.getElementById('btn-nav');
      if (btnNav) btnNav.classList.toggle('active', !!state.navMode);
      const tgtStr = state.altHold ? `${state.targetAlt} FT` : 'OFF';
      document.getElementById('ap-readout').innerText = `STATUS: ${state.apMaster ? 'AP ON' : 'AP OFF'}${state.navMode ? ' + NAV' : ''} | TGT: ${tgtStr}`;
    }

    const keys = {};
    const tmpFwd = new THREE.Vector3();
    let lastNav = null; // last route guidance (NAV mode steers by it)
    let cameraMode = 'cockpit'; // 'cockpit' or 'chase'
    let headYaw = 0;   // Pilot glance horizontal
    let headPitch = 0; // Pilot glance vertical

    window.toggleCameraView = () => {
      if (twoPlayer && cameraMode === 'chase') { flightMsg('2 PLAYERS: shared outside view (cockpit view is one-player)', '#fbbf24', 2500); return; }
      cameraMode = cameraMode === 'chase' ? 'cockpit' : 'chase';
      document.body.dataset.cam = cameraMode;   // the phone tab shows the matching icon
      const btn = document.getElementById('btn-cam');
      if (btn) btn.innerText = cameraMode === 'cockpit' ? 'VIEW: COCKPIT [C]' : 'VIEW: CHASE [C]';
    };

    window.lookCockpit = (dir) => {
      if (dir === 'left') { headYaw = Math.PI / 2; headPitch = 0; }
      else if (dir === 'right') { headYaw = -Math.PI / 2; headPitch = 0; }
      else if (dir === 'left45') { headYaw = Math.PI / 4; headPitch = 0.05; }
      else if (dir === 'right45') { headYaw = -Math.PI / 4; headPitch = 0.05; }
      else if (dir === 'down') { headYaw = 0; headPitch = -0.45; }
      else if (dir === 'up') { headYaw = 0; headPitch = 0.75; }
      else { headYaw = 0; headPitch = 0; }
    };

    window.addEventListener('mousedown', (e) => {
      if (e.button === 2) {
        document.body.requestPointerLock?.();
      }
    });
    window.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement && cameraMode === 'cockpit') {
        headYaw -= e.movementX * 0.003;
        headPitch = Math.max(-0.8, Math.min(1.2, headPitch - e.movementY * 0.003));
      }
    });
    window.addEventListener('mouseup', (e) => {
      if (e.button === 2 && document.pointerLockElement) {
        document.exitPointerLock();
      }
    });
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyC') {
        window.toggleCameraView();
      }
      if (cameraMode === 'cockpit') {
        if (e.code === 'Digit1' || e.code === 'Numpad1') window.lookCockpit('left45');
        if (e.code === 'Digit2' || e.code === 'Numpad2') window.lookCockpit('down');
        if (e.code === 'Digit3' || e.code === 'Numpad3') window.lookCockpit('right45');
        if (e.code === 'Digit4' || e.code === 'Numpad4') window.lookCockpit('left');
        if (e.code === 'Digit5' || e.code === 'Numpad5') window.lookCockpit('center');
        if (e.code === 'Digit6' || e.code === 'Numpad6') window.lookCockpit('right');
        if (e.code === 'Digit8' || e.code === 'Numpad8') window.lookCockpit('up');
      }
      keys[e.code] = true;
      if (e.code === 'KeyZ') toggleAP();
      if (e.code === 'KeyV') toggleNav();
      if (e.code === 'KeyX') toggleAltHold();
      if (e.code === 'BracketLeft') adjustTargetAlt(-500);
      if (e.code === 'BracketRight') adjustTargetAlt(500);
      if (e.code === 'Space' && currentAircraft === 'fighter') fireTracer();
      if (e.code === 'KeyF') fireMissile();
      if (e.code === 'KeyJ') window.landNearest();
      if (e.code === 'KeyP') window.toggleTwoPlayer();
      if (e.code === 'KeyR' && aircraft.toggleRamp) aircraft.toggleRamp(state.ias); // cargo ramp, below 150 kt
      if (e.code === 'KeyL') window.startApproach(); // 3 degree final to the active runway
      if (e.code === 'KeyM') movingMap.toggleSize();
      if (e.code === 'KeyN' && !state.onGround) navComputer.replan(state.pos.x, state.pos.z, amslFt(state.pos.y));
    });
    window.addEventListener('keyup', (e) => { keys[e.code] = false; });

    // ==========================================
    // GAME CONTROLLER (right stick = pitch/roll, left stick = throttle/rudder; see src/core/gamepad.js)
    // ==========================================
    const gamepad = new GamepadInput();
    // Two players on one screen: player 2 flies with the second controller; one camera frames both aircraft
    const gamepad2 = new GamepadInput(1);
    const wingman = new Wingman({ scene, terrain, combat, visuals, amslFt, message: (t, c, ms) => flightMsg(t, c, ms) });
    let twoPlayer = false;
    window.toggleTwoPlayer = () => {
      twoPlayer = !twoPlayer;
      gamepad.slot = twoPlayer ? 0 : null; // P1 = first controller, P2 = second
      wingman.enable(twoPlayer, state);
      if (twoPlayer && cameraMode === 'cockpit') window.toggleCameraView();
      const btn = document.getElementById('btn-2p');
      if (btn) btn.classList.toggle('active', twoPlayer);
      const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter((g) => g && g.connected).length : 0;
      flightMsg(twoPlayer ? `2 PLAYERS ON - P2 uses controller 2${pads < 2 ? ` (connect a second pad: ${pads} found)` : ''}. P2: D-pad < > aircraft, X gun, \u25A1 missile, Options = rejoin P1` : '2 PLAYERS OFF', '#fbbf24', 6000);
    };
    const FLEET_ORDER = ['trainer', 'airliner', 'fighter', 'heli'];
    let lastGunShotMs = 0;

    const padNote = document.createElement('div');
    padNote.id = 'pad-note';
    padNote.style.cssText = 'position:fixed;bottom:96px;right:12px;z-index:10002;padding:6px 12px;font:bold 12px monospace;' +
      'color:#00ffcc;background:rgba(6,12,18,0.88);border:1px solid rgba(0,255,170,0.4);display:none;';
    document.body.appendChild(padNote);
    window.addEventListener('gamepadstatus', (e) => {
      padNote.textContent = e.detail.connected ? `GAMEPAD CONNECTED: ${e.detail.id.slice(0, 40)}` : 'GAMEPAD DISCONNECTED';
      padNote.style.display = 'block';
      clearTimeout(padNote._t);
      padNote._t = setTimeout(() => { padNote.style.display = 'none'; }, 4000);
    });

    function handlePadActions(pad) {
      for (const action of pad.actions) {
        audio.init();
        if (action === 'view') window.toggleCameraView();
        else if (action === 'autopilot') toggleAP();
        else if (action === 'altHold') toggleAltHold();
        else if (action === 'altUp') adjustTargetAlt(500);
        else if (action === 'altDown') adjustTargetAlt(-500);
        else if (action === 'resetHead') window.lookCockpit('center');
        else if (action === 'approach') window.startApproach();
        else if (action === 'map') movingMap.toggleSize();
        else if (action === 'ramp' && aircraft.toggleRamp) aircraft.toggleRamp(state.ias);
        else if (action === 'prevAircraft' || action === 'nextAircraft') {
          const step = action === 'nextAircraft' ? 1 : FLEET_ORDER.length - 1;
          selectAircraft(FLEET_ORDER[(FLEET_ORDER.indexOf(currentAircraft) + step) % FLEET_ORDER.length]);
        }
      }
      // Cross / A held: gun, 10 rounds per second (fighter only, like Space)
      const now = performance.now();
      if (pad.fire && currentAircraft === 'fighter' && now - lastGunShotMs > 100) {
        lastGunShotMs = now;
        fireTracer();
      }
    }

    // Gun: 20 mm rounds from the phase 9 weapons system (gravity drop, hit detection on the range targets)
    function fireTracer() {
      const fwd = new THREE.Vector3(0, 0, -1).applyEuler(state.rot);
      combat.weapons.fireCannon(state.pos.clone().addScaledVector(fwd, 8), state.vel, fwd);
      audio.playCannon();
    }

    // Missile: needs a radar lock (target inside the 30 degree cone, 15 km); 6 per sortie, reloaded on reset
    function fireMissile() {
      if (currentAircraft !== 'fighter') return;
      const lock = combatNow && combatNow.lockedTarget;
      if (!lock) { flightMsg('NO LOCK - point the nose at a target (30 deg cone, 15 km)', '#facc15', 2500); return; }
      if (missilesLeft <= 0) { flightMsg('WINCHESTER - no missiles left (reset at the runway to reload)', '#facc15', 3000); return; }
      missilesLeft--;
      const fwd = new THREE.Vector3(0, 0, -1).applyEuler(state.rot);
      const rail = state.pos.clone().addScaledVector(fwd, 4).add(new THREE.Vector3(missilesLeft % 2 ? 2.5 : -2.5, -0.6, 0).applyEuler(state.rot));
      combat.weapons.launchMissile(rail, state.vel, fwd, lock);
      flightMsg(`FOX 2 - ${lock.id} | ${missilesLeft} LEFT`, '#f97316', 2500);
    }

    // ==========================================
    // 6. AVIONICS HUD WITH MACH & STAGE 2 AB
    // ==========================================
    const hudCanvas = document.getElementById('hud-canvas');
    const ctx = hudCanvas.getContext('2d');

    function resize() {
      renderer.setSize(window.innerWidth, window.innerHeight);
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      hudCanvas.width = window.innerWidth;
      hudCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    initTouchControls(movingMap); // phones and tablets only: on-screen flight buttons, clean screen
    const touchPlay = isTouchPlay();

    // Altitude shown to the pilot: height above the ground under the aircraft, 0 on the ground (user, 03-Nov-2026).
    // Navigation and the autopilot keep working in height above sea level.
    function heightAboveGroundFt() {
      return Math.max(0, (state.pos.y - terrain.groundY(state.pos.x, state.pos.z) - profile.groundHeight) * 3.28084 - (state.altZeroFt || 0));
    }
    window.skyforgeHeightFt = heightAboveGroundFt; // console check
    window.skyforgeCockpit = () => cockpit;        // console check: fuelKg

    // The pilot's own view under g: the edges darken, then everything goes black
    const gVision = document.createElement('nav');
    gVision.id = 'g-vision';
    gVision.style.cssText = 'position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 50%, transparent 15%, #000 72%);';
    document.body.appendChild(gVision);
    function drawGVision() {
      const stress = crashFx.active ? 0 : Math.min(1, state.gStress || 0);
      gVision.style.opacity = stress;
      gVision.style.backgroundColor = stress >= 1 ? '#000' : 'transparent';
    }

    // Before take-off: no power while the altitude does not read 0 (user, 03-Nov-2026). Tap the alert to set it to zero.
    const zeroAlert = document.createElement('button');
    zeroAlert.id = 'zero-alert';
    zeroAlert.type = 'button';
    zeroAlert.innerHTML = '&#9888; SET ALTITUDE 0';
    zeroAlert.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:10006;display:none;height:auto !important;' +
      'padding:10px 18px !important;font:bold 16px monospace !important;color:#fff;background:#dc2626 !important;border:2px solid #fff;border-radius:8px !important;cursor:pointer;';
    zeroAlert.onclick = () => { state.altZeroFt = (state.altZeroFt || 0) + heightAboveGroundFt(); };
    document.body.appendChild(zeroAlert);
    function altitudeInterlock() {
      const blocked = state.onGround && state.ias < 5 && !crashFx.active && heightAboveGroundFt() > 3;
      if (blocked) { state.throttle = 0; state.power = 0; }
      zeroAlert.style.setProperty('display', blocked ? 'block' : 'none');
    }

    function drawAvionics() {
      ctx.clearRect(0, 0, hudCanvas.width, hudCanvas.height);
      if (cameraMode === 'cockpit') return; // cockpit view uses the collimated HUD on the combiner glass
      const cx = 120;
      const cy = hudCanvas.height - 120;

      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.fillRect(cx - 95, cy - 85, 190, 170);
      ctx.strokeStyle = state.isAfterburner ? '#f59e0b' : '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(cx - 95, cy - 85, 190, 170);

      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 16px monospace';
      ctx.fillText(`${Math.round(state.ias)} KT`, cx - 80, cy - 55);

      ctx.fillStyle = '#38bdf8';
      ctx.textAlign = 'right';
      ctx.fillText(`${Math.round(heightAboveGroundFt())} FT`, cx + 80, cy - 55);

      ctx.textAlign = 'left';
      ctx.fillStyle = state.isAfterburner ? '#f59e0b' : '#f8fafc';
      ctx.font = 'bold 12px monospace';
      ctx.fillText(state.isAfterburner ? 'PWR: STAGE 2 AB' : `PWR: ${Math.round(state.power)}%`, cx - 80, cy + 32);

      ctx.fillStyle = state.mach >= 1.0 ? '#ef4444' : '#38bdf8';
      ctx.fillText(`M: ${state.mach.toFixed(2)} MACH`, cx - 80, cy + 50);

      ctx.fillStyle = '#f8fafc';
      ctx.font = '11px monospace';
      ctx.fillText(`PITCH: ${(state.rot.x * 180 / Math.PI).toFixed(1)}°`, cx - 80, cy + 68);
    }

    // ==========================================
    // 7. SUPERSONIC AERODYNAMICS LOOP
    // ==========================================
    // Real time per frame: flight runs at true speed on a slow phone or a 120 Hz screen alike
    let dt = 1 / 60;
    let lastFrameMs = 0;
    let lastMach = 0;
    const fighterFx = new FighterFx(fleetContainer, scene, LAYER_EXTERIOR);
    const chaseUp = new THREE.Vector3(0, 1, 0);
    const blendUp = new THREE.Vector3();
    const upTurn = new THREE.Quaternion();
    const upStep = new THREE.Quaternion();
    window.skyforgeCamera = camera;   // console check

    // Cockpit camera / HUD helpers
    let gLoad = 1.0;
    const velBefore = new THREE.Vector3();
    const fwdDir = new THREE.Vector3(); // horizontal nose direction
    const tmpVec = new THREE.Vector3();
    const tmpUp = new THREE.Vector3();
    const bodyVel = new THREE.Vector3();
    const bodyQuat = new THREE.Quaternion();
    const headQuat = new THREE.Quaternion();
    const headEuler = new THREE.Euler(0, 0, 0, 'YXZ');
    const eyeLocal = new THREE.Vector3();
    const headShake = { x: 0, y: 0 };
    const chaseOffsetSmooth = new THREE.Vector3(); // chase camera offset (world axes), eased for rotation only

    function animate() {
      requestAnimationFrame(animate);
      const frameNow = performance.now();
      dt = lastFrameMs ? Math.max(1 / 240, Math.min(1 / 20, (frameNow - lastFrameMs) / 1000)) : 1 / 60;
      lastFrameMs = frameNow;
      velBefore.copy(state.vel);

      if (keys['ShiftLeft'] || keys['ShiftRight']) state.throttle = Math.min(1.0, state.throttle + 0.4 * dt);
      if (keys['ControlLeft'] || keys['ControlRight']) state.throttle = Math.max(0.0, state.throttle - 0.4 * dt);

      const pad = gamepad.poll();
      if (pad) {
        handlePadActions(pad);
        state.throttle = Math.max(0.0, Math.min(1.0, state.throttle + pad.throttleRate * 0.4 * dt));
      }
      altitudeInterlock();
      // Engine follows the throttle at its own speed; it stops when the tanks run dry
      const engineOut = !profile.rotorcraft && cockpit.fuelKg <= 0;
      state.engineOut = engineOut;
      if (engineOut) state.throttle = 0;

      const spool = (AIR[currentAircraft] && AIR[currentAircraft].spool) || 3.5;
      state.power += (state.throttle * 100 - state.power) * Math.min(1, spool * dt);
      state.isAfterburner = (profile.afterburnerThrust !== undefined && state.throttle > 0.70);

      let pIn = (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0);
      let rIn = (keys['KeyA'] ? -1 : 0) + (keys['KeyD'] ? 1 : 0);
      let yIn = (keys['KeyQ'] ? 1 : 0) - (keys['KeyE'] ? 1 : 0);
      if (pad) {
        // Analog sticks add to the keyboard; clamp to full deflection
        pIn = Math.max(-1, Math.min(1, pIn + pad.pitch));
        rIn = Math.max(-1, Math.min(1, rIn + pad.roll));
        yIn = Math.max(-1, Math.min(1, yIn + pad.yaw));
      }
      // Touch stick on phones (analog)
      const touchStick = window.skyforgeTouchStick;
      if (touchStick) {
        pIn = Math.max(-1, Math.min(1, pIn + touchStick.pitch));
        rIn = Math.max(-1, Math.min(1, rIn + touchStick.roll));
      }
      // Pilot blacked out by sustained g: no control until the blood returns
      if (state.gStress >= 1) { pIn = 0; rIn = 0; yIn = 0; }

      if (state.navMode && (!state.apMaster || state.onGround || profile.rotorcraft || !lastNav || lastNav.complete)) {
        state.navMode = false;
        updateAPReadout();
      }
      if (state.navMode) {
        // Bank up to 25 deg towards the next waypoint; hold its altitude
        const wantBank = Math.max(-25, Math.min(25, lastNav.turn * 1.2));
        const bankNow = -state.rot.z * 180 / Math.PI;
        rIn = Math.max(-1, Math.min(1, rIn + (wantBank - bankNow) * 0.05));
        if (state.targetAlt !== lastNav.targetAltFt) { state.targetAlt = lastNav.targetAltFt; updateAPReadout(); }
      }
      if (state.apMaster && !state.onGround && !profile.rotorcraft) {
        if (state.altHold) {
          const altFt = amslFt(state.pos.y);
          const altErr = state.targetAlt - altFt;
          pIn = Math.max(-0.6, Math.min(0.6, altErr * 0.002));
        }
      }

      // Nose direction in the horizontal plane (heading); airspeed = velocity along it
      fwdDir.set(-Math.sin(state.rot.y), 0, -Math.cos(state.rot.y));
      const forwardSpeed = Math.max(0, state.vel.x * fwdDir.x + state.vel.z * fwdDir.z);
      const heightM = amslFt(state.pos.y) * 0.3048;
      const air = atmosphere(heightM);
      const trueSpeed = state.onGround ? forwardSpeed : state.vel.length(); // in the air: true 3D speed
      state.ias = trueSpeed * Math.sqrt(air.sigma) * 1.94384;               // what the airspeed indicator reads
      state.mach = trueSpeed / air.soundMs;

      const braking = !!(keys['KeyB'] || (pad && pad.brake));
      const terrainY = terrain.groundY(state.pos.x, state.pos.z); // real ground under the aircraft (0 at VOBL)

      if (profile.rotorcraft) {
        // Rotorcraft branch (aero.js): collective = lift, cyclic = disc tilt, pedals = yaw
        state.prevOnGround = state.onGround;
        stepRotorcraft(state, { pitch: pIn, roll: rIn, yaw: yIn }, profile, dt, terrainY);
      } else if (state.pos.y > terrainY + profile.groundHeight) {
        // Fixed-wing in the air: real rolling, pitching, banked turns and speed (src/physics/flight.js)
        state.prevOnGround = state.onGround;
        state.onGround = false;
        stepFixedWingAir(state, {
          pitch: pIn, roll: rIn, yaw: yIn,
          autoAltFt: state.apMaster && state.altHold ? state.targetAlt - amslFt(state.pos.y) : null,
          wingsLevel: state.apMaster && !state.navMode,
          gentleRoll: !!state.navMode,
          hM: heightM
        }, profile, currentAircraft, dt);
        // Human limit: holding more g than the pilot tolerates narrows the view, then blacks it out
        const tolerance = AIR[currentAircraft].gTolerance;
        state.gStress = Math.max(0, Math.min(1.2, (state.gStress || 0) + (state.loadG > tolerance ? (state.loadG - tolerance) * 0.2 : -0.35) * dt));
        // Warning horn past the never-exceed speed; well past it the airframe breaks up
        if (state.overspeed && performance.now() > cueBeepAt) { cueBeep(); cueBeepAt = performance.now() + 450; }
        if (state.structuralFail && !landing.crashResetAt) crash('STRUCTURE FAILED - OVERSPEED');
      } else {
        // Fixed-wing on the ground: per-aircraft numbers come from the active profile
        state.rollRate = 0;
        state.holdGamma = null;
        state.stick = 0;
        const vr = profile.vr;
        const pitchRate = Math.min(profile.maxPitchRate, 0.35);   // rotation for take-off is a slow, steady raise of the nose
        const rollRate = profile.maxRollRate;

        const cEff = Math.max(0.35, Math.min(1.2, forwardSpeed / 25));
        // Attitude holds like a real aircraft when the stick is let go (user, 01-Nov-2026); only the
        // autopilot (AP / ALT HOLD / NAV) brings the wings and nose back to level
        const levelK = state.apMaster ? 1 : 0;
        // On the wheels the controls need airflow: nothing moves at a standstill, the nose can only be raised near
        // take-off speed and settles back on its wheel otherwise, and the wings stay level on the gear
        const groundAuthority = Math.min(1, (forwardSpeed / (vr / 1.94384)) ** 2);
        state.rot.x += (pIn * pitchRate * groundAuthority - state.rot.x * 0.08 * levelK) * dt;
        if (pIn <= 0) state.rot.x -= state.rot.x * (1 - groundAuthority) * 1.5 * dt;

        state.prevOnGround = state.onGround;
        const groundHeight = terrainY + profile.groundHeight;
        const wheelsDown = state.pos.y <= groundHeight;

        // Lift from angle of attack and speed: L = g (v / Vs)^2 (CL / CLmax); stall above stallAoA
        const gamma = Math.atan2(state.vel.y, Math.max(1, forwardSpeed)); // flight path angle
        const alpha = state.rot.x - gamma;
        const clMax = profile.cl0 + profile.clAlpha * profile.stallAoA;
        let cl = alpha > profile.stallAoA ? clMax * 0.55 : profile.cl0 + profile.clAlpha * alpha;
        cl = Math.max(-clMax, cl);
        const vs = profile.stallKt / 1.94384;
        const liftAccel = 9.81 * (forwardSpeed / vs) ** 2 * (cl / clMax);
        const inducedDrag = Math.abs(liftAccel * cl) * 0.05;
        state.aoa = alpha;

        // Rudder yaws the nose; in the air the horizontal share of the lift turns the aircraft
        // (turn rate = L sin(bank) / v), so pulling back in a bank tightens the turn. Turn lift capped at -3..6 g.
        const turnLift = Math.max(-3 * 9.81, Math.min(6 * 9.81, liftAccel));
        const turnRate = wheelsDown ? 0 : turnLift * Math.sin(-state.rot.z) / Math.max(25, forwardSpeed);
        // Nose-wheel steering, as on any aircraft: a tight turn (18 m radius) at taxi speed, gentle at speed so the
        // tyres hold (0.25 g sideways at most); the rudder keeps a little authority on the take-off roll
        const steering = forwardSpeed < 0.1 ? 0 : Math.max(Math.min(forwardSpeed / 18, 2.45 / forwardSpeed), forwardSpeed > 30 ? 0.05 : 0);
        state.rot.y += (yIn * steering - turnRate) * dt;

        // Velocity follows the nose: sideways slip dies out (quickly on the tyres, slower in the air)
        fwdDir.set(-Math.sin(state.rot.y), 0, -Math.cos(state.rot.y));
        const along = state.vel.x * fwdDir.x + state.vel.z * fwdDir.z;
        const slipKeep = Math.exp(-(wheelsDown ? 12 : 2.5) * dt);
        state.vel.x = fwdDir.x * along + (state.vel.x - fwdDir.x * along) * slipKeep;
        state.vel.z = fwdDir.z * along + (state.vel.z - fwdDir.z * along) * slipKeep;

        if (wheelsDown) {
          // attitude at the moment of contact (the nose / wings are levelled just below)
          if (!state.prevOnGround) { landing.cPitch = state.rot.x; landing.cRoll = state.rot.z; }
          state.pos.y = groundHeight;
          state.onGround = true;
          // Tail-scrape and wheels-level limits are reached smoothly, never snapped
          const settle = 1 - Math.exp(-6 * dt);
          if (state.rot.x > 0.22) state.rot.x += (0.22 - state.rot.x) * settle;
          if (state.rot.x < 0.0) state.rot.x += (0.0 - state.rot.x) * settle;
          state.rot.z *= Math.exp(-8 * dt);

          // Ground roll: rolling resistance at idle, wheel brakes (B / L3) for the landing rollout
          // With the power off it coasts down on tyre drag; on the landing roll the ground spoilers add more
          const groundDecel = (state.throttle < 0.05 ? (landing.rollout ? 1.2 : 0.3) : 0) + (braking ? 5.0 * phase7.brakeFactor(state.ias) : 0);
          const rollSpeed = Math.hypot(state.vel.x, state.vel.z);
          if (groundDecel > 0 && rollSpeed > 0) {
            const k = Math.max(0, rollSpeed - groundDecel * dt) / rollSpeed;
            state.vel.x *= k;
            state.vel.z *= k;
          }
          if (state.throttle >= 0.05) {
            // Engine against air drag and rolling resistance, each aircraft's own (src/physics/flight.js)
            const rollingNow = Math.max(0, state.vel.x * fwdDir.x + state.vel.z * fwdDir.z);   // after the brakes above
            const rollAccel = groundRollAccel(state, currentAircraft, profile, rollingNow, heightM);
            const nextSpeed = Math.max(0, rollingNow + rollAccel * dt);
            state.vel.x = fwdDir.x * nextSpeed;
            state.vel.z = fwdDir.z * nextSpeed;
          }

          // Landing rollout: nose wheel comes down and the aircraft stays down unless the pilot
          // adds > 50 % power (touch-and-go). Ends once slowed to taxi speed.
          if (landing.rollout) {
            state.rot.x = Math.max(0, state.rot.x - 0.12 * dt);
            if (state.ias < 30) landing.rollout = false;
          }
          const liftOffAllowed = !landing.rollout || state.throttle > 0.5;

          // Lift-off once rotated past Vr and the wing lifts more than the weight
          if (liftOffAllowed && state.ias > vr && state.rot.x > 0.05 && liftAccel > 9.81) {
            landing.rollout = false;
            state.onGround = false;
            state.vel.y = 0.5;
            if (!landing.depMs) { landing.depMs = performance.now(); landing.depIcao = activeEnd.icao; }
            flightMsg('AIRBORNE - positive climb', '#4ade80', 2500);
          } else {
            state.vel.y = 0;
            if (state.ias > vr && !landing.rotateCued && state.throttle >= 0.05) {
              landing.rotateCued = true;
              flightMsg(`VR ${vr} KT - ROTATE: pull back (S / right stick)`, '#facc15', 3000);
            }
          }

          if (!state.prevOnGround) {
            if (state.ias > 40) audio.playTouchdown();
            onTouchdown(-velBefore.y);
          }
        }
      }

      const gLimit = terrainY + profile.groundHeight;
      if (state.pos.y < gLimit) {
        state.pos.y = gLimit;
        state.vel.y = 0;
        state.onGround = true;
      }
      if (profile.rotorcraft && !state.prevOnGround && state.onGround) onTouchdown(-velBefore.y);

      state.pos.add(state.vel.clone().multiplyScalar(dt));
      // Phase 7: the air mass moves the aircraft (drift) and gusts bump it (turbulence)
      wind = phase7.update(performance.now() / 1000, dt, state.pos, Math.max(0, state.pos.y - terrainY));
      if (!state.onGround) {
        state.pos.addScaledVector(wind.vector, dt);
        state.rot.x += (Math.random() - 0.5) * wind.turbulence * dt * 2;
        state.rot.z += (Math.random() - 0.5) * wind.turbulence * dt * 3;
      }

      // Take-off / landing bookkeeping, Nandi Hills terrain, crash reset
      if (!state.onGround) landing.airTime += dt;
      else if (state.ias < 5) landing.rotateCued = false;
      if (landing.crashResetAt) {
        state.vel.set(0, 0, 0);
        state.throttle = 0;
        if (performance.now() > landing.crashResetAt) resetToThreshold();
      }
      phase6.update(performance.now(), state.pos);
      terrain.update(state.pos.x, state.pos.z);
      airports.update(state.pos, performance.now());

      // Return-to-land route + moving map
      const headingNow = ((90 - state.rot.y * 180 / Math.PI) % 360 + 360) % 360;
      const navData = navComputer.update(state, headingNow, amslFt(state.pos.y));
      lastNav = navData;
      const p8 = phase8.update(dt, state.pos, destEnd || activeEnd);
      ilsNow = p8.ils;
      tmpFwd.set(0, 0, -1).applyEuler(state.rot);
      combatNow = combat.update(dt, state.pos, tmpFwd);
      // on the ground: runway left ahead, or how far the take-off runway is
      let groundLine = null;
      if (state.onGround) {
        const onRw = airports.runwayAt(state.pos.x, state.pos.z, headingNow);
        const rwEnd = onRw && airports.end(onRw.icao, onRw.ident);
        if (rwEnd) groundLine = `ON RWY ${onRw.ident}: ${Math.max(0, Math.round(rwEnd.lengthM - onRw.distPast)).toLocaleString('en-IN')} M LEFT OF ${Math.round(rwEnd.lengthM).toLocaleString('en-IN')} M`;
        else groundLine = `T/O RWY ${activeEnd.ident} ${activeEnd.icao}: ${(Math.hypot(activeEnd.thrX - state.pos.x, activeEnd.thrZ - state.pos.z) / 1000).toFixed(1)} KM (${Math.round(activeEnd.lengthM).toLocaleString('en-IN')} M LONG)`;
      }
      movingMap.extras = { wind, ils: ilsNow, traffic: p8.traffic, targets: combatNow.targets, lock: currentAircraft === 'fighter' ? combatNow.lockedTarget : null,
        active: activeEnd, ground: groundLine, groundFt: amslFt(terrain.groundY(state.pos.x, state.pos.z)) };
      movingMap.draw(state, navData, headingNow, performance.now());
      updateTrackCue(navData, headingNow, terrain.groundY(state.pos.x, state.pos.z));

      fleetContainer.position.copy(state.pos);
      fleetContainer.rotation.copy(state.rot);

      for (let i = tracers.length - 1; i >= 0; i--) {
        const t = tracers[i];
        t.position.add(t.velocity.clone().multiplyScalar(dt));
        if (t.position.distanceTo(state.pos) > 3000) {
          scene.remove(t);
          tracers.splice(i, 1);
        }
      }

      // G-load: specific force along the airframe's up axis, smoothed (display + head shake only)
      bodyQuat.setFromEuler(state.rot);
      tmpUp.set(0, 1, 0).applyQuaternion(bodyQuat);
      tmpVec.copy(state.vel).sub(velBefore).divideScalar(dt);
      tmpVec.y += 9.81;
      const rawG = Math.max(-3, Math.min(10, tmpVec.dot(tmpUp) / 9.81));
      gLoad += (rawG - gLoad) * Math.min(1, dt / 0.3);

      // Airframe animation: control surfaces, propeller / rotors, afterburner, cargo ramp
      aircraft.update(dt, {
        input: { pitch: pIn, roll: rIn, yaw: yIn },
        throttle: state.throttle,
        power: state.power,
        isAfterburner: state.isAfterburner,
        iasKt: state.ias,
        gearDown: state.onGround || heightAboveGroundFt() < 300
      });
      fighterFx.update(dt, state, currentAircraft === 'fighter');
      if (state.mach >= 1 && lastMach < 1 && !state.onGround) audio.playBoom();
      lastMach = state.mach;

      bodyVel.copy(state.vel).applyQuaternion(headQuat.copy(bodyQuat).invert());
      const fwdSpeed = -bodyVel.z;
      cockpit.update({
        dt,
        iasKt: state.ias,
        altFt: heightAboveGroundFt(),
        mach: state.mach,
        gLoad,
        pitch: state.rot.x,
        roll: state.rot.z,
        headingDeg: ((90 - state.rot.y * 180 / Math.PI) % 360 + 360) % 360,
        vsiFpm: state.vel.y * 196.85,
        power: state.power,
        throttle: state.throttle,
        isAfterburner: state.isAfterburner,
        onGround: state.onGround,
        fpmValid: state.vel.length() > 5 && fwdSpeed > 1,
        fpmAz: Math.atan2(bodyVel.x, Math.max(1, fwdSpeed)),
        fpmEl: Math.atan2(bodyVel.y, Math.max(1, fwdSpeed)),
        nav: navData
      }, { pitch: pIn, roll: rIn, yaw: yIn }, performance.now(), cameraMode === 'cockpit');

      if (cameraMode === 'cockpit') {
        camera.layers.set(0);
        if (!touchPlay) camera.layers.enable(LAYER_COCKPIT); // phones: clear view of the runway, no cockpit panels

        // Head shake from G-load above 1.5 G and transonic Mach buffet; head pushed down under positive G
        const buffet = Math.max(0, 1 - Math.abs(state.mach - 1.0) / 0.2) * (state.mach > 0.85 ? 1 : 0);
        const shakeAmp = Math.max(0, gLoad - 1.5) * 0.0012 + buffet * 0.004;
        headShake.x += ((Math.random() * 2 - 1) * shakeAmp - headShake.x) * 0.5;
        headShake.y += ((Math.random() * 2 - 1) * shakeAmp - headShake.y) * 0.5;
        const sag = Math.min(0.06, Math.max(0, gLoad - 1) * 0.008);

        eyeLocal.copy(cockpit.cockpitOffset);
        eyeLocal.x += headShake.x;
        eyeLocal.y += headShake.y - sag;
        camera.position.copy(state.pos).add(eyeLocal.applyQuaternion(bodyQuat));

        // Camera rotates with the airframe; glance keys / mouse-look turn the head inside it
        headEuler.set(headPitch + headShake.y * 2, headYaw + headShake.x * 2, 0, 'YXZ');
        camera.quaternion.copy(bodyQuat).multiply(headQuat.setFromEuler(headEuler));
      } else {
        camera.layers.set(0);
        camera.layers.enable(LAYER_EXTERIOR);
        const camOffset = tmpVec.copy(aircraft.chaseOffset);
        if (isFighterCam()) camOffset.z += Math.max(0, Math.min(18.0, (state.mach - 0.5) * 8.0));
        camOffset.applyQuaternion(bodyQuat);
        // The camera rides with the aircraft (no position lag), so the aircraft stays at the centre of the screen
        // and the ground, traffic and targets pass at their true relative speed. Only the viewing angle eases
        // after a manoeuvre; it snaps after a jump (new airport, approach start, reset).
        if (chaseOffsetSmooth.lengthSq() === 0 || camera.position.distanceTo(state.pos) > 1000) chaseOffsetSmooth.copy(camOffset);
        else chaseOffsetSmooth.lerp(camOffset, 1 - Math.exp(-6 * dt));
        camera.position.copy(state.pos).add(chaseOffsetSmooth);
        // Level flight keeps the horizon level. Near the vertical or inverted the camera goes with the airframe's own
        // up, eased, so it follows through loops and rolls without flipping at the top.
        const pitchShare = THREE.MathUtils.smoothstep(Math.abs(state.rot.x), 0.8, 1.25);
        const invertShare = THREE.MathUtils.smoothstep(-Math.cos(state.rot.z), -0.45, 0.25);
        const share = Math.max(pitchShare, invertShare);
        blendUp.set(0, 1 - share, 0).addScaledVector(tmpUp, share);
        if (blendUp.lengthSq() > 1e-4) {
          // Turn the camera's up towards it at a limited rate (never faster than 2 rad/s), whichever way it has to go
          upTurn.setFromUnitVectors(chaseUp, blendUp.normalize());
          upStep.identity().rotateTowards(upTurn, 2 * dt);
          chaseUp.applyQuaternion(upStep).normalize();
        }
        camera.up.copy(chaseUp);
        camera.lookAt(state.pos.clone().add(new THREE.Vector3(0, 1.0, -4.0).applyEuler(state.rot)));
        camera.up.set(0, 1, 0);
      }

      if (twoPlayer) {
        wingman.update(dt, gamepad2.poll(), state);
        camera.layers.set(0);
        camera.layers.enable(LAYER_EXTERIOR);
        sharedChaseCamera(camera, state, wingman.state, aircraft.chaseOffset.length(), dt);
      }
      const curAoA = (state.aoa || 0) * (180 / Math.PI);
      audio.update(currentAircraft, state.power, state.ias, state.isAfterburner, curAoA, state.onGround);
      if (!state.onGround && !crashFx.active) flightStart();
      if (crashFx.active) {
        const playing = crashFx.update(dt);
        camera.layers.set(0);
        crashFx.applyCamera(camera);
        if (!playing) resetToThreshold();
      }
      visuals.update(state.pos);
      visuals.render();
      drawAvionics();
      drawCombatAndIls();
      drawGVision();
    }

    // Radar lock box + ILS needles, drawn over the HUD canvas in both views
    const projV = new THREE.Vector3();
    function drawCombatAndIls() {
      const W = hudCanvas.width, H = hudCanvas.height;
      if (twoPlayer) {
        const sep = state.pos.distanceTo(wingman.state.pos);
        [[state.pos, 'P1', '#4ade80'], [wingman.state.pos, 'P2', '#fbbf24']].forEach(([pos, tag, col]) => {
          projV.copy(pos).project(camera);
          let x = (projV.x * 0.5 + 0.5) * W, y = (-projV.y * 0.5 + 0.5) * H - 26;
          const off = projV.z > 1 || x < 20 || x > W - 20 || y < 20 || y > H - 110;
          if (projV.z > 1) { x = W - x; y = H - y; }
          x = Math.max(24, Math.min(W - 24, x)); y = Math.max(24, Math.min(H - 120, y));
          ctx.fillStyle = col; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
          ctx.fillText(off ? `${tag} \u25B6` : tag, x, y);
          ctx.beginPath(); ctx.moveTo(x - 5, y + 4); ctx.lineTo(x + 5, y + 4); ctx.lineTo(x, y + 11); ctx.closePath(); ctx.fill();
        });
        ctx.fillStyle = sep > 6000 ? '#f87171' : '#e2e8f0'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
        ctx.fillText(`P1-P2 ${sep < 1852 ? Math.round(sep) + ' M' : (sep / 1852).toFixed(1) + ' NM'}${sep > 6000 ? ' - STAY TOGETHER' : ''}`, W / 2, 22);
        ctx.textAlign = 'left';
      }
      const lock = currentAircraft === 'fighter' && combatNow ? combatNow.lockedTarget : null;
      if (lock) {
        projV.copy(lock.position).project(camera);
        if (projV.z < 1) {
          const x = (projV.x * 0.5 + 0.5) * W, y = (-projV.y * 0.5 + 0.5) * H;
          ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2;
          ctx.strokeRect(x - 16, y - 16, 32, 32);
          ctx.fillStyle = '#f97316'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'left';
          ctx.fillText(`${lock.id} ${(lock.position.distanceTo(state.pos) / 1000).toFixed(1)} KM [F]`, x + 20, y - 6);
        }
      }
      if (ilsNow && ilsNow.inRange) {
        // Cross-pointer: vertical needle = localizer, horizontal = glide slope (centre = on the beam)
        const r = 46, cx = W - r - 24, cy = H - r - 150;
        ctx.fillStyle = 'rgba(6,12,18,0.7)'; ctx.fillRect(cx - r - 8, cy - r - 18, 2 * r + 16, 2 * r + 26);
        ctx.strokeStyle = 'rgba(226,232,240,0.6)'; ctx.lineWidth = 1;
        for (let k = -2; k <= 2; k++) {
          if (!k) continue;
          ctx.beginPath(); ctx.arc(cx + k * r / 2, cy, 2, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(cx, cy + k * r / 2, 2, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.strokeStyle = '#e879f9'; ctx.lineWidth = 3;
        const lx = cx + ilsNow.locDeviation * r, gy = cy - ilsNow.gsDeviation * r;
        ctx.beginPath(); ctx.moveTo(lx, cy - r); ctx.lineTo(lx, cy + r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - r, gy); ctx.lineTo(cx + r, gy); ctx.stroke();
        ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
        ctx.fillText(`${ilsNow.ident}  ${ilsNow.dmeNm.toFixed(1)} NM`, cx, cy - r - 6);
        ctx.textAlign = 'left';
      }
    }

    function isFighterCam() {
      return currentAircraft === 'fighter';
    }

    animate();
  </script>
</body>
</html>
