    // ==========================================
    // 7. SUPERSONIC AERODYNAMICS LOOP
    // ==========================================
    // Real time per frame: flight runs at true speed on a slow phone or a 120 Hz screen alike
    let dt = 1 / 60;
    let lastFrameMs = 0;
    let lastMach = 0;
    const fighterFx = new FighterFx(fleetContainer, scene, LAYER_EXTERIOR);
    pathMini = new PathMini();                 // small 3D flight-path picture, top left; click = full screen for 5 s
    flightPathFx = new FlightPathFx(scene);   // wing-tip ribbons, future path, ghost rings, contrails
    window.skyforgeManeuver = (n) => startManeuver(n);   // console check
    window.skyforgeManeuverState = () => ({ msg: mnvMsg, flying: mnv.flying, scoring: mnvScore.on });   // console check
    const chaseUp = new THREE.Vector3(0, 1, 0);
    const blendUp = new THREE.Vector3();
    const upTurn = new THREE.Quaternion();
    const upStep = new THREE.Quaternion();
    window.skyforgeCamera = camera;   // console check

    // Cockpit camera / HUD helpers
    let gLoad = 1.0;
    const FIGHTER_FUEL_KG = 8200;   // full internal fuel (src/aircraft/cockpitInterior.js COCKPIT_SPECS.fighter)
    const velBefore = new THREE.Vector3();
    const fwdDir = new THREE.Vector3(); // horizontal nose direction
    const tmpVec = new THREE.Vector3();
    const tmpUp = new THREE.Vector3();
    const bodyVel = new THREE.Vector3();
    const bodyQuat = new THREE.Quaternion();
    const headQuat = new THREE.Quaternion();
    const headEuler = new THREE.Euler(0, 0, 0, 'YXZ');
    const eyeLocal = new THREE.Vector3();
    const headShake = { x: 0, y: 0 };
    const chaseOffsetSmooth = new THREE.Vector3(); // chase camera offset (world axes), eased for rotation only

    const fps = { n: 0, at: 0 };        // window.skyforgeFps: frames a second (console check)
    function animate() {
      requestAnimationFrame(animate);
      const frameNow = performance.now();
      dt = lastFrameMs ? Math.max(1 / 240, Math.min(1 / 20, (frameNow - lastFrameMs) / 1000)) : 1 / 60;
      lastFrameMs = frameNow;
      fps.n++; if (frameNow - fps.at > 1000) { window.skyforgeFps = Math.round(fps.n * 1000 / (frameNow - fps.at)); fps.n = 0; fps.at = frameNow; }
      if (replay.active) { stepReplay(dt); return; }   // phase 6: the game waits while the replay plays
      velBefore.copy(state.vel);

      if (keys['ShiftLeft'] || keys['ShiftRight']) state.throttle = Math.min(1.0, state.throttle + 0.4 * dt);
      if (keys['ControlLeft'] || keys['ControlRight']) state.throttle = Math.max(0.0, state.throttle - 0.4 * dt);

      const pad = gamepad.poll();
      if (pad) {
        handlePadActions(pad);
        state.throttle = Math.max(0.0, Math.min(1.0, state.throttle + pad.throttleRate * 0.4 * dt));
      }
      altitudeInterlock();
      // Engine follows the throttle at its own speed; it stops when the tanks run dry
      const engineOut = !profile.rotorcraft && cockpit.fuelKg <= 0;
      state.engineOut = engineOut;
      if (engineOut) state.throttle = 0;

      const spool = (AIR[currentAircraft] && AIR[currentAircraft].spool) || 3.5;
      state.power += (state.throttle * 100 - state.power) * Math.min(1, spool * dt);
      state.isAfterburner = (profile.afterburnerThrust !== undefined && state.throttle > 0.70);
      // phase 5: a damaged engine gives 60 % at most and no afterburner
      if (currentAircraft === 'fighter' && damage.engineHit) { state.power = Math.min(state.power, damage.powerMax * 100); state.isAfterburner = false; }

      let pIn = (keys['KeyS'] ? 1 : 0) - (keys['KeyW'] ? 1 : 0);
      let rIn = (keys['KeyA'] ? -1 : 0) + (keys['KeyD'] ? 1 : 0);
      let yIn = (keys['KeyQ'] ? 1 : 0) - (keys['KeyE'] ? 1 : 0);
      if (pad) {
        // Analog sticks add to the keyboard; clamp to full deflection
        pIn = Math.max(-1, Math.min(1, pIn + pad.pitch));
        rIn = Math.max(-1, Math.min(1, rIn + pad.roll));
        yIn = Math.max(-1, Math.min(1, yIn + pad.yaw));
      }
      // Touch stick on phones (analog)
      const touchStick = window.skyforgeTouchStick;
      if (touchStick) {
        pIn = Math.max(-1, Math.min(1, pIn + touchStick.pitch));
        rIn = Math.max(-1, Math.min(1, rIn + touchStick.roll));
      }
      // phase 5: battle damage stiffens the controls
      if (currentAircraft === 'fighter' && damage.stick < 1) { pIn *= damage.stick; rIn *= damage.stick; yIn *= damage.stick; }
      // Pilot blacked out by sustained g: no control until the blood returns
      if (state.gStress >= 1) { pIn = 0; rIn = 0; yIn = 0; }

      // Aerobatics autopilot: moving the stick or rudder hands the aircraft back (the ghost and the score stay)
      if (mnv.active && currentAircraft === 'fighter') {
        if (Math.abs(pIn) > 0.3 || Math.abs(rIn) > 0.3 || Math.abs(yIn) > 0.3 || state.onGround) {
          mnv.stop();
          if (mnvMsg && mnvScore.on) mnvMsg.text = `${mnvMsg.text.split('  ')[0]}  MANUAL`;
        } else {
          const u = mnv.update(state, dt);
          if (u) {
            pIn = u.pitch; rIn = u.roll; yIn = u.yaw;
            if (u.throttle !== undefined) state.throttle = u.throttle;
          }
          if (!mnv.active && mnv.finished) { mnv.finished = false; maneuverResult(mnvScore.finish(state.pos, state.vel)); }
        }
      }

      // Return-to-base autopilot: moving the stick or rudder hands the aircraft back
      if (rtb.active && currentAircraft === 'fighter') {
        if (Math.abs(pIn) > 0.3 || Math.abs(rIn) > 0.3 || Math.abs(yIn) > 0.3) {
          rtb.stop(); updateRtbButton();
          mnvMsg = { text: 'RTB  MANUAL', until: performance.now() + 2500 };
        } else {
          const u = rtb.update(state, dt, state.onGround);
          if (u) {
            pIn = u.pitch; rIn = u.roll; yIn = u.yaw;
            state.throttle = u.throttle;
            if (mnvMsg) mnvMsg.text = `${rtb.label}  ${rtbEnd.icao} ${rtbEnd.ident}`;
          }
          if (!rtb.active) { updateRtbButton(); mnvMsg = { text: `${rtbEnd.icao} ${rtbEnd.ident}  STOPPED`, until: performance.now() + 4000 }; }
        }
      }

      if (state.navMode && (!state.apMaster || state.onGround || profile.rotorcraft || !lastNav || lastNav.complete)) {
        state.navMode = false;
        updateAPReadout();
      }
      if (state.navMode) {
        // Bank up to 25 deg towards the next waypoint; hold its altitude
        const wantBank = Math.max(-25, Math.min(25, lastNav.turn * 1.2));
        const bankNow = -state.rot.z * 180 / Math.PI;
        rIn = Math.max(-1, Math.min(1, rIn + (wantBank - bankNow) * 0.05));
        if (state.targetAlt !== lastNav.targetAltFt) { state.targetAlt = lastNav.targetAltFt; updateAPReadout(); }
      }
      if (state.apMaster && !state.onGround && !profile.rotorcraft) {
        if (state.altHold) {
          const altFt = amslFt(state.pos.y);
          const altErr = state.targetAlt - altFt;
          pIn = Math.max(-0.6, Math.min(0.6, altErr * 0.002));
        }
      }

      // Nose direction in the horizontal plane (heading); airspeed = velocity along it
      fwdDir.set(-Math.sin(state.rot.y), 0, -Math.cos(state.rot.y));
      const forwardSpeed = Math.max(0, state.vel.x * fwdDir.x + state.vel.z * fwdDir.z);
      const heightM = amslFt(state.pos.y) * 0.3048;
      const air = atmosphere(heightM);
      const trueSpeed = state.onGround ? forwardSpeed : state.vel.length(); // in the air: true 3D speed
      state.ias = trueSpeed * Math.sqrt(air.sigma) * 1.94384;               // what the airspeed indicator reads
      state.mach = trueSpeed / air.soundMs;

      const braking = !!(keys['KeyB'] || (pad && pad.brake) || (rtb.active && rtb.brakes));
      const terrainY = terrain.groundY(state.pos.x, state.pos.z); // real ground under the aircraft (0 at VOBL)

      if (profile.rotorcraft) {
        // Rotorcraft branch (aero.js): collective = lift, cyclic = disc tilt, pedals = yaw
        state.prevOnGround = state.onGround;
        stepRotorcraft(state, { pitch: pIn, roll: rIn, yaw: yIn }, profile, dt, terrainY);
      } else if (state.pos.y > terrainY + profile.groundHeight) {
        // Fixed-wing in the air: real rolling, pitching, banked turns and speed (src/physics/flight.js)
        state.prevOnGround = state.onGround;
        state.onGround = false;
        stepFixedWingAir(state, {
          pitch: pIn, roll: rIn, yaw: yIn,
          autoAltFt: state.apMaster && state.altHold ? state.targetAlt - amslFt(state.pos.y) : null,
          wingsLevel: state.apMaster && !state.navMode,
          gentleRoll: !!state.navMode,
          hM: heightM,
          // fighter: weight falls as the fuel burns (profile mass = full tanks); the limiter switch
          massKg: currentAircraft === 'fighter' ? fighterMassKg() : undefined,
          limiterOff: currentAircraft === 'fighter' && state.limiterOff,
          // stores under the wings: weight (in fighterMassKg), drag, slower roll with bombs; less of each as they are fired
          dragAdd: currentAircraft === 'fighter' ? weapons.loadout.dragAdd() : 0,
          rollScale: currentAircraft === 'fighter' ? weapons.loadout.rollScale() : 1
        }, profile, currentAircraft, dt);
        // Human limit: holding more g than the pilot tolerates narrows the view, then blacks it out.
        // The fighter's pilot has the time-based model (src/physics/pilotG.js), stepped below every frame.
        if (currentAircraft !== 'fighter') {
          const tolerance = AIR[currentAircraft].gTolerance;
          state.gStress = Math.max(0, Math.min(1.2, (state.gStress || 0) + (state.loadG > tolerance ? (state.loadG - tolerance) * 0.2 : -0.35) * dt));
        }
        // Warning horn past the never-exceed speed; well past it the airframe breaks up
        if (state.overspeed && performance.now() > cueBeepAt) { cueBeep(); cueBeepAt = performance.now() + 450; }
        if (state.structuralFail && !landing.crashResetAt) crash('STRUCTURE FAILED - OVERSPEED');
      } else {
        // Fixed-wing on the ground: per-aircraft numbers come from the active profile
        state.rollRate = 0;
        state.holdGamma = null;
        state.stick = 0;
        const vr = profile.vr;
        const pitchRate = Math.min(profile.maxPitchRate, 0.35);   // rotation for take-off is a slow, steady raise of the nose
        const rollRate = profile.maxRollRate;

        const cEff = Math.max(0.35, Math.min(1.2, forwardSpeed / 25));
        // Attitude holds like a real aircraft when the stick is let go (user, 01-Nov-2026); only the
        // autopilot (AP / ALT HOLD / NAV) brings the wings and nose back to level
        const levelK = state.apMaster ? 1 : 0;
        // On the wheels the controls need airflow: nothing moves at a standstill, the nose can only be raised near
        // take-off speed and settles back on its wheel otherwise, and the wings stay level on the gear
        const groundAuthority = Math.min(1, (forwardSpeed / (vr / 1.94384)) ** 2);
        state.rot.x += (pIn * pitchRate * groundAuthority - state.rot.x * 0.08 * levelK) * dt;
        if (pIn <= 0) state.rot.x -= state.rot.x * (1 - groundAuthority) * 1.5 * dt;

        state.prevOnGround = state.onGround;
        const groundHeight = terrainY + profile.groundHeight;
        const wheelsDown = state.pos.y <= groundHeight;

        // Lift from angle of attack and speed: L = g (v / Vs)^2 (CL / CLmax); stall above stallAoA
        const gamma = Math.atan2(state.vel.y, Math.max(1, forwardSpeed)); // flight path angle
        const alpha = state.rot.x - gamma;
        const clMax = profile.cl0 + profile.clAlpha * profile.stallAoA;
        let cl = alpha > profile.stallAoA ? clMax * 0.55 : profile.cl0 + profile.clAlpha * alpha;
        cl = Math.max(-clMax, cl);
        const vs = profile.stallKt / 1.94384;
        const liftAccel = 9.81 * (forwardSpeed / vs) ** 2 * (cl / clMax);
        const inducedDrag = Math.abs(liftAccel * cl) * 0.05;
        state.aoa = alpha;

        // Rudder yaws the nose; in the air the horizontal share of the lift turns the aircraft
        // (turn rate = L sin(bank) / v), so pulling back in a bank tightens the turn. Turn lift capped at -3..6 g.
        const turnLift = Math.max(-3 * 9.81, Math.min(6 * 9.81, liftAccel));
        const turnRate = wheelsDown ? 0 : turnLift * Math.sin(-state.rot.z) / Math.max(25, forwardSpeed);
        // Nose-wheel steering, as on any aircraft: a tight turn (18 m radius) at taxi speed, gentle at speed so the
        // tyres hold (0.25 g sideways at most); the rudder keeps a little authority on the take-off roll
        const steering = forwardSpeed < 0.1 ? 0 : Math.max(Math.min(forwardSpeed / 18, 2.45 / forwardSpeed), forwardSpeed > 30 ? 0.05 : 0);
        state.rot.y += (yIn * steering - turnRate) * dt;

        // Velocity follows the nose: sideways slip dies out (quickly on the tyres, slower in the air)
        fwdDir.set(-Math.sin(state.rot.y), 0, -Math.cos(state.rot.y));
        const along = state.vel.x * fwdDir.x + state.vel.z * fwdDir.z;
        const slipKeep = Math.exp(-(wheelsDown ? 12 : 2.5) * dt);
        state.vel.x = fwdDir.x * along + (state.vel.x - fwdDir.x * along) * slipKeep;
        state.vel.z = fwdDir.z * along + (state.vel.z - fwdDir.z * along) * slipKeep;

        if (wheelsDown) {
          // attitude at the moment of contact (the nose / wings are levelled just below)
          if (!state.prevOnGround) { landing.cPitch = state.rot.x; landing.cRoll = state.rot.z; }
          state.pos.y = groundHeight;
          state.onGround = true;
          // Tail-scrape and wheels-level limits are reached smoothly, never snapped
          const settle = 1 - Math.exp(-6 * dt);
          if (state.rot.x > 0.22) state.rot.x += (0.22 - state.rot.x) * settle;
          if (state.rot.x < 0.0) state.rot.x += (0.0 - state.rot.x) * settle;
          state.rot.z *= Math.exp(-8 * dt);

          // Ground roll: rolling resistance at idle, wheel brakes (B / L3) for the landing rollout
          // With the power off it coasts down on tyre drag; on the landing roll the ground spoilers add more
          const groundDecel = (state.throttle < 0.05 ? (landing.rollout ? 1.2 : 0.3) : 0) + (braking ? 5.0 * phase7.brakeFactor(state.ias) : 0);
          const rollSpeed = Math.hypot(state.vel.x, state.vel.z);
          if (groundDecel > 0 && rollSpeed > 0) {
            const k = Math.max(0, rollSpeed - groundDecel * dt) / rollSpeed;
            state.vel.x *= k;
            state.vel.z *= k;
          }
          if (state.throttle >= 0.05) {
            // Engine against air drag and rolling resistance, each aircraft's own (src/physics/flight.js)
            const rollingNow = Math.max(0, state.vel.x * fwdDir.x + state.vel.z * fwdDir.z);   // after the brakes above
            const rollAccel = groundRollAccel(state, currentAircraft, profile, rollingNow, heightM);
            const nextSpeed = Math.max(0, rollingNow + rollAccel * dt);
            state.vel.x = fwdDir.x * nextSpeed;
            state.vel.z = fwdDir.z * nextSpeed;
          }

          // Landing rollout: nose wheel comes down and the aircraft stays down unless the pilot
          // adds > 50 % power (touch-and-go). Ends once slowed to taxi speed.
          if (landing.rollout) {
            state.rot.x = Math.max(0, state.rot.x - 0.12 * dt);
            if (state.ias < 30) landing.rollout = false;
          }
          const liftOffAllowed = !landing.rollout || state.throttle > 0.5;

          // Lift-off once rotated past Vr and the wing lifts more than the weight
          if (liftOffAllowed && state.ias > vr && state.rot.x > 0.05 && liftAccel > 9.81) {
            landing.rollout = false;
            state.onGround = false;
            state.vel.y = 0.5;
            if (!landing.depMs) { landing.depMs = performance.now(); landing.depIcao = activeEnd.icao; }
            flightMsg('AIRBORNE - positive climb', '#4ade80', 2500);
          } else {
            state.vel.y = 0;
            if (state.ias > vr && !landing.rotateCued && state.throttle >= 0.05) {
              landing.rotateCued = true;
              flightMsg(`VR ${vr} KT - ROTATE: pull back (S / right stick)`, '#facc15', 3000);
            }
          }

          if (!state.prevOnGround) {
            if (state.ias > 40) audio.playTouchdown();
            onTouchdown(-velBefore.y);
          }
        }
      }

      const gLimit = terrainY + profile.groundHeight;
      if (state.pos.y < gLimit) {
        state.pos.y = gLimit;
        state.vel.y = 0;
        state.onGround = true;
      }
      if (profile.rotorcraft && !state.prevOnGround && state.onGround) onTouchdown(-velBefore.y);

      state.pos.add(state.vel.clone().multiplyScalar(dt));
      // Phase 7: the air mass moves the aircraft (drift) and gusts bump it (turbulence)
      wind = phase7.update(performance.now() / 1000, dt, state.pos, Math.max(0, state.pos.y - terrainY));
      if (!state.onGround) {
        state.pos.addScaledVector(wind.vector, dt);
        state.rot.x += (Math.random() - 0.5) * wind.turbulence * dt * 2;
        state.rot.z += (Math.random() - 0.5) * wind.turbulence * dt * 3;
      }

      // Take-off / landing bookkeeping, Nandi Hills terrain, crash reset
      if (!state.onGround) landing.airTime += dt;
      else if (state.ias < 5) landing.rotateCued = false;
      if (landing.crashResetAt) {
        state.vel.set(0, 0, 0);
        state.throttle = 0;
        if (performance.now() > landing.crashResetAt) resetToThreshold();
      }
      phase6.update(performance.now(), state.pos);
      terrain.update(state.pos.x, state.pos.z);
      airports.update(state.pos, performance.now());

      // Return-to-land route + moving map
      const headingNow = ((90 - state.rot.y * 180 / Math.PI) % 360 + 360) % 360;
      const navData = navComputer.update(state, headingNow, amslFt(state.pos.y));
      lastNav = navData;
      const p8 = phase8.update(dt, state.pos, destEnd || activeEnd);
      ilsNow = p8.ils;
      tmpFwd.set(0, 0, -1).applyEuler(state.rot);
      combatNow = combat.update(dt, state.pos, tmpFwd);
      // Phase 4: radar, IR seeker, gun trigger, CCIP, then every round / missile / bomb / decoy in flight
      if (currentAircraft === 'fighter') {
        radar.update(dt, state, combat.targets.targets);
        if (radar.events.includes('lost')) { weaponMsg('LOCK LOST'); audio.beep(520, 0.25); }
        if (touchPlay && !radar.lock) {   // phones: lock what is ahead (30 deg, 15 km), as before
          const c = radar.contacts.find((k) => k.off < 30 && k.range < 15000);
          if (c) { radar.lock = c.t; radar.unseen = 0; }
        }
        if (keys['KeyT'] && tDownAt && !tUnlocked && performance.now() - tDownAt > 600) { tUnlocked = true; unlockTarget(); }
        weapons.updateSeeker(state, radar.lock, combat.targets.targets);
        const trigger = !!(keys['Space'] || padTrigger || performance.now() < gunBurstUntil) && !crashFx.active;
        if (trigger) autoArmTouch();
        weapons.gun(dt, state, trigger);
        if (weapons.firing && performance.now() - lastGunShotMs > 70) { lastGunShotMs = performance.now(); audio.playCannon(); }
        if ((weapons.sel === 'BOMB' || (touchPlay && weapons.loadout.count('BOMB'))) && (weapons.arm || touchPlay) && !state.onGround) weapons.ccip(state, ccipNow); else ccipNow.valid = false;
        audio.setTone(weapons.seeker.state === 'track' ? 'ir' : weapons.seeker.state === 'search' ? 'growl' : 'off');
        if (aircraft.setStores) aircraft.setStores(weapons.loadout);
      } else if (radar.lock || weapons.seeker.state !== 'off') { radar.drop(); weapons.seeker.state = 'off'; audio.setTone('off'); }
      threats.update(dt, state);
      for (const e of weapons.update(dt, state, radar.lock)) handleWeaponEvent(e);
      if (currentAircraft === 'fighter') {
        // RWR tones: missile = fast high beeps, lock = steady beeps, a new radar looking at us = a double chirp
        const rw = threats.rwr, now = performance.now();
        const lvl = rw.some((r) => r.level === 'launch') ? 3 : rw.some((r) => r.level === 'lock') ? 2 : 0;
        if (lvl && now > rwrTone.next) { audio.beep(lvl === 3 ? 1650 : 1000, lvl === 3 ? 0.06 : 0.12); rwrTone.next = now + (lvl === 3 ? 110 : 280); }
        for (const r of rw) { const k = r.kind + r.level; if (r.level === 'track' && !rwrTone.seen.has(k)) { audio.beep(700, 0.06); audio.beep(900, 0.06, 0.09); } }
        rwrTone.seen = new Set(rw.map((r) => r.kind + r.level));
        // damage: smoke, then fire trailing the aircraft; lost at 0 %
        if (damage.smoke && !crashFx.active && !state.onGround) {
          smokeAcc += dt;
          while (smokeAcc > 0.04) {
            smokeAcc -= 0.04;
            tmpVec.set(0, 0.2, 5).applyEuler(state.rot).add(state.pos);
            ordFx.smoke.emit(tmpVec, null, 1.5, damage.fire ? 9 : 6, 4, 0.16, 0.15, 0.15, damage.fire ? 0.75 : 0.5, 0.3, 1.5);
            if (damage.fire) ordFx.fire.emit(tmpVec, null, 2.2, 1, 0.25, 1.0, 0.5, 0.15, 0.95, 0);
          }
        }
        if (damage.dead && !crashFx.active && !landing.crashResetAt) crash('SHOT DOWN');
      }
      ordFx.update(dt, renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360)));
      // on the ground: runway left ahead, or how far the take-off runway is
      let groundLine = null;
      if (state.onGround) {
        const onRw = airports.runwayAt(state.pos.x, state.pos.z, headingNow);
        const rwEnd = onRw && airports.end(onRw.icao, onRw.ident);
        if (rwEnd) groundLine = `ON RWY ${onRw.ident}: ${Math.max(0, Math.round(rwEnd.lengthM - onRw.distPast)).toLocaleString('en-IN')} M LEFT OF ${Math.round(rwEnd.lengthM).toLocaleString('en-IN')} M`;
        else groundLine = `T/O RWY ${activeEnd.ident} ${activeEnd.icao}: ${(Math.hypot(activeEnd.thrX - state.pos.x, activeEnd.thrZ - state.pos.z) / 1000).toFixed(1)} KM (${Math.round(activeEnd.lengthM).toLocaleString('en-IN')} M LONG)`;
      }
      movingMap.extras = { wind, ils: ilsNow, traffic: p8.traffic, targets: combatNow.targets, lock: currentAircraft === 'fighter' ? radar.lock : null,
        active: activeEnd, ground: groundLine, groundFt: amslFt(terrain.groundY(state.pos.x, state.pos.z)) };
      // during the return-to-base the map shows the nearest runway (where RTB is going), not the route planner's legs
      movingMap.draw(state, rtb.active ? null : navData, headingNow, performance.now());
      updateTrackCue(navData, headingNow, terrain.groundY(state.pos.x, state.pos.z));

      fleetContainer.position.copy(state.pos);
      fleetContainer.rotation.copy(state.rot);

      for (let i = tracers.length - 1; i >= 0; i--) {
        const t = tracers[i];
        t.position.add(t.velocity.clone().multiplyScalar(dt));
        if (t.position.distanceTo(state.pos) > 3000) {
          scene.remove(t);
          tracers.splice(i, 1);
        }
      }

      // G-load: specific force along the airframe's up axis, smoothed (display + head shake only)
      bodyQuat.setFromEuler(state.rot);
      tmpUp.set(0, 1, 0).applyQuaternion(bodyQuat);
      tmpVec.copy(state.vel).sub(velBefore).divideScalar(dt);
      tmpVec.y += 9.81;
      const rawG = Math.max(-3, Math.min(10, tmpVec.dot(tmpUp) / 9.81));
      gLoad += (rawG - gLoad) * Math.min(1, dt / 0.3);
      if (currentAircraft === 'fighter') {
        pilotVis = stepPilotG(pilotG, state.onGround || crashFx.active ? 1 : state.loadG, dt);
        state.gStress = pilotVis.controlsLost ? 1 : Math.min(0.99, pilotG.stress);
        const strain = state.onGround || pilotVis.gloc ? 0 : Math.max(0, Math.min(1, (state.loadG - 5.5) / 3.5));
        audio.setStrain(strain);
      } else {
        audio.setStrain(0);
      }

      // Airframe animation: control surfaces, propeller / rotors, afterburner, cargo ramp
      aircraft.update(dt, {
        input: { pitch: pIn, roll: rIn, yaw: yIn },
        throttle: state.throttle,
        power: state.power,
        isAfterburner: state.isAfterburner,
        iasKt: state.ias,
        gearDown: state.onGround || heightAboveGroundFt() < 300 || (rtb.active && rtb.gearDown)
      });
      state.hAmslM = heightM;
      fighterFx.update(dt, state, currentAircraft === 'fighter');
      if (state.mach >= 1 && lastMach < 1 && !state.onGround) audio.playBoom();
      lastMach = state.mach;

      bodyVel.copy(state.vel).applyQuaternion(headQuat.copy(bodyQuat).invert());
      const fwdSpeed = -bodyVel.z;
      cockpit.update({
        dt,
        iasKt: state.ias,
        altFt: heightAboveGroundFt(),
        mach: state.mach,
        gLoad,
        pitch: state.rot.x,
        roll: state.rot.z,
        headingDeg: ((90 - state.rot.y * 180 / Math.PI) % 360 + 360) % 360,
        vsiFpm: state.vel.y * 196.85,
        power: state.power,
        throttle: state.throttle,
        isAfterburner: state.isAfterburner,
        onGround: state.onGround,
        fpmValid: state.vel.length() > 5 && fwdSpeed > 1,
        fpmAz: Math.atan2(bodyVel.x, Math.max(1, fwdSpeed)),
        fpmEl: Math.atan2(bodyVel.y, Math.max(1, fwdSpeed)),
        nav: navData,
        radarPic: currentAircraft === 'fighter' ? radarPic() : null,
        sms: currentAircraft === 'fighter' ? smsData() : null,
        ...fighterHudData()
      }, { pitch: pIn, roll: rIn, yaw: yIn }, performance.now(), cameraMode === 'cockpit');

      if (cameraMode === 'cockpit') {
        camera.layers.set(0);
        if (!touchPlay) camera.layers.enable(LAYER_COCKPIT); // phones: clear view of the runway, no cockpit panels

        // Head shake from G-load above 1.5 G and transonic Mach buffet; head pushed down under positive G
        const buffet = Math.max(0, 1 - Math.abs(state.mach - 1.0) / 0.2) * (state.mach > 0.85 ? 1 : 0);
        const shakeAmp = Math.max(0, gLoad - 1.5) * 0.0012 + buffet * 0.004 + (weapons.firing ? 0.0025 : 0);
        headShake.x += ((Math.random() * 2 - 1) * shakeAmp - headShake.x) * 0.5;
        headShake.y += ((Math.random() * 2 - 1) * shakeAmp - headShake.y) * 0.5;
        const sag = Math.min(0.06, Math.max(0, gLoad - 1) * 0.008);

        eyeLocal.copy(cockpit.cockpitOffset);
        eyeLocal.x += headShake.x;
        eyeLocal.y += headShake.y - sag;
        camera.position.copy(state.pos).add(eyeLocal.applyQuaternion(bodyQuat));

        // Camera rotates with the airframe; glance keys / mouse-look turn the head inside it
        headEuler.set(headPitch + headShake.y * 2, headYaw + headShake.x * 2, 0, 'YXZ');
        camera.quaternion.copy(bodyQuat).multiply(headQuat.setFromEuler(headEuler));
      } else {
        camera.layers.set(0);
        camera.layers.enable(LAYER_EXTERIOR);
        const camOffset = tmpVec.copy(aircraft.chaseOffset);
        if (isFighterCam()) camOffset.z += Math.max(0, Math.min(18.0, (state.mach - 0.5) * 8.0));
        camOffset.applyQuaternion(bodyQuat);
        // The camera rides with the aircraft (no position lag), so the aircraft stays at the centre of the screen
        // and the ground, traffic and targets pass at their true relative speed. Only the viewing angle eases
        // after a manoeuvre; it snaps after a jump (new airport, approach start, reset).
        if (chaseOffsetSmooth.lengthSq() === 0 || camera.position.distanceTo(state.pos) > 1000) chaseOffsetSmooth.copy(camOffset);
        else chaseOffsetSmooth.lerp(camOffset, 1 - Math.exp(-6 * dt));
        camera.position.copy(state.pos).add(chaseOffsetSmooth);
        // Level flight keeps the horizon level. Near the vertical or inverted the camera goes with the airframe's own
        // up, eased, so it follows through loops and rolls without flipping at the top.
        const pitchShare = THREE.MathUtils.smoothstep(Math.abs(state.rot.x), 0.8, 1.25);
        const invertShare = THREE.MathUtils.smoothstep(-Math.cos(state.rot.z), -0.45, 0.25);
        const share = Math.max(pitchShare, invertShare);
        blendUp.set(0, 1 - share, 0).addScaledVector(tmpUp, share);
        if (blendUp.lengthSq() > 1e-4) {
          // Turn the camera's up towards it at a limited rate (never faster than 2 rad/s), whichever way it has to go
          upTurn.setFromUnitVectors(chaseUp, blendUp.normalize());
          upStep.identity().rotateTowards(upTurn, 2 * dt);
          chaseUp.applyQuaternion(upStep).normalize();
        }
        camera.up.copy(chaseUp);
        camera.lookAt(state.pos.clone().add(new THREE.Vector3(0, 1.0, -4.0).applyEuler(state.rot)));
        camera.up.set(0, 1, 0);
      }

      extCamShowing = !twoPlayer && !crashFx.active && extCam ? applyExtCam() : false;
      if (twoPlayer) {
        wingman.update(dt, gamepad2.poll(), state);
        camera.layers.set(0);
        camera.layers.enable(LAYER_EXTERIOR);
        sharedChaseCamera(camera, state, wingman.state, aircraft.chaseOffset.length(), dt);
      }
      const curAoA = (state.aoa || 0) * (180 / Math.PI);
      audio.update(currentAircraft, state.power, state.ias, state.isAfterburner, curAoA, state.onGround);
      if (!state.onGround && !crashFx.active) flightStart();
      if (crashFx.active) {
        const playing = crashFx.update(dt);
        camera.layers.set(0);
        crashFx.applyCamera(camera);
        if (!playing) resetToThreshold();
      }
      if (currentAircraft === 'fighter' && mnvScore.on) maneuverResult(mnvScore.update(state.pos, state.vel, dt));
      if (ghostClearAt && performance.now() > ghostClearAt) { ghostClearAt = 0; flightPathFx.setGhost(null); }
      flightPathFx.update(dt, state, currentAircraft === 'fighter' && !crashFx.active, heightM, camera.position, mnvScore.on ? mnvScore.i : -1);
      pathMini.record(dt, state.pos, state.mach, state.loadG || 1, !state.onGround && !crashFx.active);
      pathMini.draw(performance.now(), dt, { pos: state.pos, vel: state.vel, groundY: terrain.groundY(state.pos.x, state.pos.z),
        ghost: flightPathFx.ghost || null, runway: rtb.active ? rtbEnd : null });
      drawRadarMfd();
      recordFlight(dt);
      visuals.update(state.pos);
      visuals.render();
      drawAvionics();
      drawCombatAndIls();
      drawGVision();
    }

    // Radar lock box + ILS needles, drawn over the HUD canvas in both views
    const projV = new THREE.Vector3();
    function drawCombatAndIls() {
      const W = hudCanvas.width, H = hudCanvas.height;
      if (twoPlayer) {
        const sep = state.pos.distanceTo(wingman.state.pos);
        [[state.pos, 'P1', '#4ade80'], [wingman.state.pos, 'P2', '#fbbf24']].forEach(([pos, tag, col]) => {
          projV.copy(pos).project(camera);
          let x = (projV.x * 0.5 + 0.5) * W, y = (-projV.y * 0.5 + 0.5) * H - 26;
          const off = projV.z > 1 || x < 20 || x > W - 20 || y < 20 || y > H - 110;
          if (projV.z > 1) { x = W - x; y = H - y; }
          x = Math.max(24, Math.min(W - 24, x)); y = Math.max(24, Math.min(H - 120, y));
          ctx.fillStyle = col; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
          ctx.fillText(off ? `${tag} \u25B6` : tag, x, y);
          ctx.beginPath(); ctx.moveTo(x - 5, y + 4); ctx.lineTo(x + 5, y + 4); ctx.lineTo(x, y + 11); ctx.closePath(); ctx.fill();
        });
        ctx.fillStyle = sep > 6000 ? '#f87171' : '#e2e8f0'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
        ctx.fillText(`P1-P2 ${sep < 1852 ? Math.round(sep) + ' M' : (sep / 1852).toFixed(1) + ' NM'}${sep > 6000 ? ' - STAY TOGETHER' : ''}`, W / 2, 22);
        ctx.textAlign = 'left';
      }
      // (the radar lock box is drawn by the HUD itself since phase 4: src/hud/weaponsHud.js)
      if (ilsNow && ilsNow.inRange) {
        // Cross-pointer: vertical needle = localizer, horizontal = glide slope (centre = on the beam)
        // just under the moving map (the 3D view is shorter on a computer since the control bar sits below it)
        const mapRect = movingMap.canvas.getBoundingClientRect();
        const r = 46, cx = W - r - 24, cy = Math.min(H - r - 12, mapRect.bottom + r + 30);
        ctx.fillStyle = 'rgba(6,12,18,0.7)'; ctx.fillRect(cx - r - 8, cy - r - 18, 2 * r + 16, 2 * r + 26);
        ctx.strokeStyle = 'rgba(226,232,240,0.6)'; ctx.lineWidth = 1;
        for (let k = -2; k <= 2; k++) {
          if (!k) continue;
          ctx.beginPath(); ctx.arc(cx + k * r / 2, cy, 2, 0, Math.PI * 2); ctx.stroke();
          ctx.beginPath(); ctx.arc(cx, cy + k * r / 2, 2, 0, Math.PI * 2); ctx.stroke();
        }
        ctx.strokeStyle = '#e879f9'; ctx.lineWidth = 3;
        const lx = cx + ilsNow.locDeviation * r, gy = cy - ilsNow.gsDeviation * r;
        ctx.beginPath(); ctx.moveTo(lx, cy - r); ctx.lineTo(lx, cy + r); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(cx - r, gy); ctx.lineTo(cx + r, gy); ctx.stroke();
        ctx.fillStyle = '#e2e8f0'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
        ctx.fillText(`${ilsNow.ident}  ${ilsNow.dmeNm.toFixed(1)} NM`, cx, cy - r - 6);
        ctx.textAlign = 'left';
      }
    }

    function isFighterCam() {
      return currentAircraft === 'fighter';
    }

    visuals.precompile();   // every shader built now, while loading, not mid-flight (src/render/visuals.js)
    animate();
  </script>
<script>
  // Missions (16-Nov-2026): real routes from short to long. Picking one sets the start runway and the route; landing
  // at the destination gives 1-3 stars by landing quality (smooth = 3), kept per mission; the next mission opens once
  // this one has a star. A reason to come back: a route to finish and stars to improve.
  (function missions() {
    const CITY = { VOBL: 'Bengaluru', VOMY: 'Mysuru', VOPN: 'Puttaparthi', VOMM: 'Chennai', VOPC: 'Puducherry', VOCI: 'Kochi', VOTV: 'Thiruvananthapuram', VOMD: 'Madurai', VOTR: 'Tiruchirappalli', VOHS: 'Hyderabad', VOBZ: 'Vijayawada', VOML: 'Mangaluru', VOKN: 'Kannur' };
    const M = [['VOBL', 'VOMY'], ['VOBL', 'VOPN'], ['VOBL', 'VOMM'], ['VOMM', 'VOPC'], ['VOCI', 'VOTV'], ['VOMD', 'VOTR'], ['VOHS', 'VOBZ'], ['VOML', 'VOKN']];
    const KEY = 'skyforge.missions';
    let best = [];
    try { best = JSON.parse(localStorage.getItem(KEY) || '[]') || []; } catch (e) { best = []; }
    let active = null;
    // A 🎯 icon at the top left (not in the bottom bar: that bar shows only its first two tabs, user 03-Nov) opens
    // the mission list next to it, never in the centre of the screen.
    const css = document.createElement('style');
    css.textContent = '#mission-btn{position:fixed;left:10px;top:calc(96px + env(safe-area-inset-top,0px));z-index:10003;width:40px;height:40px;border-radius:10px;'
      + 'border:1px solid #38bdf8;background:rgba(15,23,42,.92);font-size:20px;line-height:1;cursor:pointer;padding:0}'
      + '#mission-pop{position:fixed;left:10px;top:calc(142px + env(safe-area-inset-top,0px));z-index:10004;display:none;flex-direction:column;gap:4px;padding:6px;'
      + 'max-height:calc(100vh - 200px);overflow:auto;background:rgba(15,23,42,.96);border:1px solid #38bdf8;border-radius:10px;width:min(320px,calc(100vw - 20px));box-sizing:border-box}'
      + '#mission-pop.open{display:flex}#mission-pop button{text-align:left;font:12px monospace;padding:7px 10px;background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:6px;cursor:pointer}'
      + '#mission-pop button.active{border-color:#fde047}#mission-now{font:11px monospace;color:#fde047;padding:2px 4px}';
    document.head.appendChild(css);
    const btn = document.createElement('button'); btn.id = 'mission-btn'; btn.type = 'button'; btn.textContent = '🎯'; btn.setAttribute('aria-label', 'Missions');
    const pop = document.createElement('nav'); pop.id = 'mission-pop';
    pop.innerHTML = '<div id="mission-now"></div><div id="mission-list" style="display:flex;flex-direction:column;gap:4px"></div>';
    document.body.append(btn, pop);
    btn.onclick = () => pop.classList.toggle('open');
    document.addEventListener('pointerdown', (e) => { if (!pop.contains(e.target) && e.target !== btn) pop.classList.remove('open'); });
    const list = document.getElementById('mission-list'), now = document.getElementById('mission-now');
    const stars = (n) => '★'.repeat(n || 0) + '☆'.repeat(3 - (n || 0));
    // the buttons are made once: the bottom bar moves them into its pop-up list, so later we only update them
    list.innerHTML = M.map((m, i) => '<button data-m="' + i + '"></button>').join('');
    list.querySelectorAll('[data-m]').forEach((b) => { b.onclick = () => start(Number(b.dataset.m)); });
    function render() {
      document.querySelectorAll('[data-m]').forEach((b) => {
        const i = Number(b.dataset.m), m = M[i], open = i === 0 || (best[i - 1] || 0) > 0;
        b.textContent = (i + 1) + '. ' + CITY[m[0]] + ' > ' + CITY[m[1]] + ' ' + stars(best[i]);
        b.disabled = !open;
        b.style.opacity = open ? '' : '0.45';
        b.classList.toggle('active', i === active);
      });
    }
    function optionFor(sel, icao) {
      const s = document.getElementById(sel);
      const o = s && Array.from(s.options).find((x) => x.value.split(' ')[0] === icao);
      if (o) s.value = o.value;
      return o ? o.value : null;
    }
    function start(i) {
      const [dep, dst] = M[i];
      const a = optionFor('apt-select', dep), b = optionFor('dst-select', dst);
      if (!a || !b || !window.selectRunway || !window.selectDestination) return;
      window.selectRunway(a);
      window.startAtRunway();
      window.selectDestination(b);
      active = i;
      now.textContent = 'MISSION ' + (i + 1) + ': take off at ' + CITY[dep] + ', land at ' + CITY[dst] + '. Smooth landing = 3 stars.';
      render();
      pop.classList.remove('open');
    }
    window.addEventListener('skyforge-landed', (e) => {
      const d = e.detail || {};
      if (active === null || !d.arrived || d.dep !== M[active][0] || d.dest !== M[active][1]) return;
      const i = active;
      const better = (d.stars || 0) > (best[i] || 0);
      if (better) { best[i] = d.stars; try { localStorage.setItem(KEY, JSON.stringify(best)); } catch (x) { /* storage blocked */ } }
      active = null;
      now.textContent = 'MISSION ' + (i + 1) + ' DONE ' + stars(d.stars) + (better ? ' (new best)' : '') + (i + 1 < M.length ? '. Mission ' + (i + 2) + ' is open.' : '. All missions flown!');
      render();
      pop.classList.add('open');   // show the result beside the icon
    });
    now.textContent = 'Pick a route: fly it and land smoothly for 3 stars.';
    render();
  })();
</script>
<script>
  // FPS counter, only with ?fps=1 in the address: current FPS, 5 s average, lowest (slowest single frame in the 5 s).
  // Small box at the top centre, clicks pass through it; it only reads frame times, nothing in the game changes.
  (function fpsCounter() {
    if (new URLSearchParams(location.search).get('fps') !== '1') return;
    const box = document.createElement('div');
    box.id = 'sf-fps';
    box.style.cssText = 'position:fixed;top:calc(4px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:10010;'
      + 'pointer-events:none;padding:2px 8px;border-radius:4px;background:rgba(0,0,0,.6);color:#a3e635;font:bold 11px monospace;white-space:nowrap;'
      + 'width:max-content;max-width:calc(96vw - 16px);box-sizing:border-box;';   // stays on screen on a narrow phone
    const line = document.createElement('div');   // the counter
    const log = document.createElement('div');    // stall log: last 5 frames over 200 ms
    log.style.cssText = 'font:10px monospace;color:#fca5a5;text-align:left;white-space:normal;';   // long lines wrap on a phone
    box.append(line, log);
    document.body.appendChild(box);
    const WINDOW_MS = 5000;
    let frames = [];          // [time, frame length ms] for the last 5 s
    let last = 0, shownAt = 0;

    // Stall log (27-Nov-2026): reads values the game already exposes, changes nothing.
    // Counts are compared with two frames back, so the work of the slow frame is caught whatever order the frames run in.
    const STALL_MS = 200, STALL_LINES = 5;
    const stalls = [];
    let before = [null, null];
    function counts() {
      const r = window.skyforgeRenderer;
      if (!r || !r.info) return null;
      return { sh: r.info.programs ? r.info.programs.length : 0, geo: r.info.memory.geometries, tex: r.info.memory.textures };
    }
    const delta = (a, b, k) => (a && b ? (a[k] - b[k] >= 0 ? '+' : '') + (a[k] - b[k]) : '?');

    // Timing hooks (27-Nov-2026): wrap terrain.update, airports.update and renderer.render to add up the time they
    // take since the last counter tick (the slow frame), and count terrain tiles / airports built and removed.
    // Each wrapper calls the original with the same arguments and returns its result; nothing else changes.
    const acc = { terr: 0, apt: 0, render: 0, tBuilt: 0, tGone: 0, aBuilt: 0, aGone: 0 };
    let hooked = false;
    // JS heap: Chrome only (else '?'); performance.memory is a snapshot, so it is read fresh every frame
    const mem = !!performance.memory;
    const heapUsed = () => performance.memory.usedJSHeapSize;
    let heapPrev = mem ? heapUsed() : 0;
    function timed(obj, name, key) {
      const orig = obj[name];
      obj[name] = function () {
        const t0 = performance.now();
        const r = orig.apply(this, arguments);
        acc[key] += performance.now() - t0;
        return r;
      };
    }
    function counted(obj, name, key) {
      const orig = obj[name];
      obj[name] = function () { acc[key]++; return orig.apply(this, arguments); };
    }
    function hook() {
      const T = window.skyforgeTerrain, A = window.skyforgeAirports, R = window.skyforgeRenderer;
      if (!T || !A || !R) return;
      hooked = true;
      counted(T, 'buildChunk', 'tBuilt');
      const tUpdate = T.update;
      T.update = function () {   // timed, plus tiles removed in this call (tiles before + built - tiles after)
        const t0 = performance.now(), n0 = T.chunks.size, b0 = acc.tBuilt;
        const r = tUpdate.apply(this, arguments);
        acc.terr += performance.now() - t0;
        acc.tGone += Math.max(0, n0 + (acc.tBuilt - b0) - T.chunks.size);
        return r;
      };
      counted(A, 'buildAirport', 'aBuilt');
      counted(A, 'dispose', 'aGone');
      timed(A, 'update', 'apt');
      timed(R, 'render', 'render');
    }
    function work(ms, heapMB) {
      if (!hooked) return '';
      const f = (v) => Math.round(v);
      const rest = Math.max(0, ms - acc.terr - acc.apt - acc.render);
      return '  terr ' + f(acc.terr) + ' ms (tiles +' + acc.tBuilt + '/-' + acc.tGone + ')  apt ' + f(acc.apt) + ' ms (+' + acc.aBuilt + '/-' + acc.aGone + ')'
        + '  render ' + f(acc.render) + ' ms  rest ' + f(rest) + ' ms  heap ' + (heapMB === null ? '?' : (heapMB >= 0 ? '+' : '') + heapMB.toFixed(1) + ' MB');
    }

    function logStall(ms, c, old, heapMB) {
      let px = '?', ft = '?', kt = '?', doing = '';
      try {
        if (window.skyforgeRenderer) px = window.skyforgeRenderer.getPixelRatio().toFixed(2);
        if (window.skyforgeHeightFt) ft = Math.round(window.skyforgeHeightFt()).toLocaleString('en-GB');
        if (window.skyforgeState) kt = Math.round(window.skyforgeState.ias);
        const m = window.skyforgeManeuverState && window.skyforgeManeuverState();
        if (m && m.flying) doing += '  MNV';
        const rtbBtn = document.getElementById('btn-rtb');
        if (rtbBtn && rtbBtn.classList.contains('active')) doing += '  RTB';
      } catch (e) { /* a value not ready yet: keep '?' */ }
      const text = new Date().toLocaleTimeString('en-GB') + '  ' + Math.round(ms) + ' ms (' + (1000 / ms).toFixed(0) + ' FPS)'
        + '  shaders ' + delta(c, old, 'sh') + '  geo ' + delta(c, old, 'geo') + '  tex ' + delta(c, old, 'tex')
        + '  px ' + px + '  ' + ft + ' ft  ' + kt + ' kt' + doing + work(ms, heapMB);
      console.info('[stall] ' + text);
      stalls.push(text);
      if (stalls.length > STALL_LINES) stalls.shift();
      log.textContent = '';
      for (const s of stalls) { const d = document.createElement('div'); d.textContent = s; log.appendChild(d); }
    }

    function tick(now) {
      requestAnimationFrame(tick);
      const ms = last ? now - last : 0;
      if (last) frames.push([now, ms]);
      last = now;
      const c = counts();
      const heapNow = mem ? heapUsed() : 0;
      if (ms > STALL_MS) logStall(ms, c, before[0], mem ? (heapNow - heapPrev) / 1048576 : null);
      before = [before[1], c];
      heapPrev = heapNow;
      acc.terr = acc.apt = acc.render = acc.tBuilt = acc.tGone = acc.aBuilt = acc.aGone = 0;
      if (!hooked) hook();
      while (frames.length && now - frames[0][0] > WINDOW_MS) frames.shift();
      if (now - shownAt < 250 || frames.length < 2) return;   // refresh the text 4 times a second
      shownAt = now;
      let sum = 0, worst = 0, recentSum = 0, recentN = 0;
      for (const [t, ms] of frames) {
        sum += ms; if (ms > worst) worst = ms;
        if (now - t <= 1000) { recentSum += ms; recentN++; }
      }
      const cur = recentN ? 1000 * recentN / recentSum : 0;
      const avg = 1000 * frames.length / sum;
      line.textContent = 'FPS ' + cur.toFixed(0) + ' | 5s avg ' + avg.toFixed(0) + ' | low ' + (1000 / worst).toFixed(0);
      line.style.color = avg >= 50 ? '#a3e635' : avg >= 30 ? '#fde047' : '#f87171';
    }
    // a hidden tab pauses the frames; start a fresh window when it comes back
    document.addEventListener('visibilitychange', () => { frames = []; last = 0; });
    requestAnimationFrame(tick);
  })();
</script>
